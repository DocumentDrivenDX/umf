[package]
name = "umf-rust-spike-python"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "_umf_rust_spike"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.23.5", features = ["extension-module"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision"] }
umf-rust-spike-core = { path = "../../../crates/rust-spike-core" }

[build-dependencies]
pyo3-build-config = "=0.23.5"
