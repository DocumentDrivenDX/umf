[package]
name = "umf-rust-spike-node"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=2.16.17", default-features = false, features = ["napi8"] }
napi-derive = "=2.16.13"
umf-rust-spike-core = { path = "../../../crates/rust-spike-core" }

[build-dependencies]
napi-build = "=2.1.3"
