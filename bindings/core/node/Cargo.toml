[package]
name = "umf-core-node"
version = "0.10.12"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=2.16.17", default-features = false, features = ["napi8"] }
napi-derive = "=2.16.13"
umf-core = { path = "../../../crates/umf-core" }
umf-core-wire = { path = "../../../crates/umf-core-wire" }

[features]
default = []
native-postgresql = ["umf-core/native-postgresql", "umf-core-wire/native-postgresql"]

[build-dependencies]
napi-build = "=2.1.3"
