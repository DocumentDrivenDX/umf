[package]
name = "umf-core-python"
version = "0.10.9"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "_rust_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.23.5", features = ["extension-module", "abi3-py311"] }
num-bigint = "=0.4.8"
umf-core = { path = "../../../crates/umf-core" }
umf-core-wire = { path = "../../../crates/umf-core-wire" }

[features]
default = []
native-postgresql = ["umf-core/native-postgresql", "umf-core-wire/native-postgresql"]

[build-dependencies]
pyo3-build-config = "=0.23.5"
