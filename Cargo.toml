[workspace]
resolver = "2"
# The default local test command selects UMF's native libraries and CLI.
# Foreign-host bindings and vendored upstream suites have separate entry points.
default-members = [
  "crates/umf-core", "crates/umf-core-wire", "crates/umf-tagged-wire",
  "crates/umf-codegen", "crates/umf-metamodel", "crates/umf-metamodel-cli",
  "crates/umf-cli", "crates/umf-graphql",
]
exclude = [
  "crates/umf-core/vendor/saphyr-parser",
  "crates/umf-core/vendor/oxttl",
  "crates/umf-core/vendor/oxrdf",
  "crates/umf-core/vendor/hashbrown-0.12.3",
  "crates/umf-core/vendor/hashbrown-0.13.2",
  "crates/umf-core/vendor/json-ld-core-0.21.4",
  "crates/umf-core/vendor/json-ld-syntax-0.21.4",
  "crates/umf-core/vendor/json-syntax-0.12.5",
  "crates/umf-core/vendor/xsd-types-0.9.6",
  "crates/umf-graphql/vendor/apollo-compiler",
  "crates/umf-graphql/vendor/serde_json_bytes",
]
members = [
  "crates/umf-core",
  "crates/umf-core-wire",
  "crates/umf-tagged-wire",
  "crates/umf-metamodel-cli",
  "crates/umf-codegen",
  "bindings/core/python",
  "bindings/core/node",
  "bindings/core/wasm",
  "bindings/pack-tools/wasm",
  "crates/umf-metamodel",
  "crates/umf-cli",
  "crates/umf-graphql",
]

[profile.test]
# Keep a stable optimized test profile while retaining debug and overflow checks.
opt-level = 1
debug-assertions = true
overflow-checks = true

# Portable JSON-LD dependencies: these source-preserving upstream copies select
# deterministic hash builders and gate optional wall-clock convenience APIs.
[patch.crates-io]
hashbrown-012 = { package = "hashbrown", path = "crates/umf-core/vendor/hashbrown-0.12.3" }
hashbrown-013 = { package = "hashbrown", path = "crates/umf-core/vendor/hashbrown-0.13.2" }
json-ld-core = { path = "crates/umf-core/vendor/json-ld-core-0.21.4" }
json-ld-syntax = { path = "crates/umf-core/vendor/json-ld-syntax-0.21.4" }
json-syntax = { path = "crates/umf-core/vendor/json-syntax-0.12.5" }
xsd-types = { path = "crates/umf-core/vendor/xsd-types-0.9.6" }
