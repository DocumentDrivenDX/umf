[package]
name = "umf-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "umf"
path = "src/main.rs"

[dependencies]
umf-core = { path = "../umf-core", default-features = false, features = ["full-core"] }
umf-metamodel = { path = "../umf-metamodel" }
umf-core-wire = { path = "../umf-core-wire", default-features = false }
sha2 = "=0.10.8"
serde_json = "=1.0.140"

[dependencies.umf-codegen]
path = "../umf-codegen"
optional = true

[features]
default = ["codegen", "embedded-adapters"]
codegen = ["dep:umf-codegen", "umf-core-wire/codegen"]
embedded-adapters = ["umf-core/embedded-adapters", "umf-core-wire/embedded-adapters"]
# Enables a disposable child-process probe for allocator tests. Never enable in published binaries.
allocator-test = ["codegen"]

[dev-dependencies]
serde_json = "=1.0.140"
