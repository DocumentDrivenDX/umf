[package]
name = "umf-metamodel"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "umf_metamodel"
path = "src/lib.rs"

[features]
default = []
compiler-bootstrap = ["umf-core/metamodel-compiler"]

[dependencies]
umf-core = { path = "../umf-core", default-features = false }
sha2 = "=0.10.8"
regress = { version = "=0.12.0", features = ["utf16"] }
url = "=2.5.7"
