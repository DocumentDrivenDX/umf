[package]
name = "umf-rust-spike-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "umf_rust_spike_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision"] }
sha2 = "=0.10.8"
jsonschema = { version = "=0.29.1", default-features = false }
