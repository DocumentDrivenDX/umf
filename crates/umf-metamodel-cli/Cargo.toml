[package]
name = "umf-metamodel-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "umf-metamodel"
path = "src/main.rs"

[dependencies]
sha2 = "=0.10.8"
umf-core = { path = "../umf-core", default-features = false, features = ["metamodel-compiler"] }
umf-metamodel = { path = "../umf-metamodel", default-features = false, features = ["compiler-bootstrap"] }
umf-tagged-wire = { path = "../umf-tagged-wire" }
