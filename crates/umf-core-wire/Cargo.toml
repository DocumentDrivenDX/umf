[package]
name = "umf-core-wire"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
umf-core = { path = "../umf-core", default-features = false, features = ["full-core"] }
umf-tagged-wire = { path = "../umf-tagged-wire" }
umf-codegen = { path = "../umf-codegen", optional = true }

[features]
default = ["codegen", "embedded-adapters"]
codegen = ["dep:umf-codegen"]
embedded-adapters = ["umf-core/embedded-adapters"]
