[package]
name = "umf-core-wire"
version = "0.10.11"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
umf-core = { path = "../umf-core", default-features = false, features = ["full-core"] }
umf-tagged-wire = { path = "../umf-tagged-wire" }
umf-codegen = { path = "../umf-codegen", optional = true }
umf-graphql = { path = "../umf-graphql", optional = true }

[dev-dependencies]
sha2 = "=0.10.9"

[features]
default = ["codegen", "embedded-adapters"]
codegen = ["dep:umf-codegen"]
embedded-adapters = ["umf-core/embedded-adapters", "dep:umf-graphql"]
native-postgresql = ["embedded-adapters", "umf-core/native-postgresql"]

[[test]]
name = "postgresql_native_binding"
path = "tests/postgresql_native_binding.rs"
required-features = ["native-postgresql"]
