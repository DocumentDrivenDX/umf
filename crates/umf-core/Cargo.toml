[package]
name = "umf-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "umf_core"
path = "src/lib.rs"

[features]
default = ["embedded-adapters", "full-core"]
embedded-adapters = ["dep:oxttl", "dep:oxrdf"]
full-core = []
# A source-only compiler build can opt into just the core semantic modules
# required by umf-metamodel. Normal users retain the historical full module
# graph, including when default features are disabled.
metamodel-compiler = []
parquet-test-hooks = []

[dependencies]
num-bigint = "=0.4.8"
num-traits = "=0.2.19"
ryu-js = "=1.0.3"
regress = { version = "=0.12.0", features = ["utf16"] }
saphyr-parser = { path = "vendor/saphyr-parser" }
url = "=2.5.7"
base64 = "=0.22.1"
sha2 = "=0.10.8"
subtle = "=2.6.1"
serde_json = "=1.0.140"

oxttl = { version = "=0.2.5", path = "vendor/oxttl", default-features = false, optional = true }
oxrdf = { version = "=0.3.5", default-features = false, optional = true }

[dev-dependencies]
jsonschema = { version = "=0.29.1", default-features = false }
