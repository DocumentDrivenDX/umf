              except Exception: retention=not_retained("RETENTION_VALIDATION_FAILED")
              fail("generation_step_failed",retention); raise SystemExit(1)
          if tool_observation is None or tool_observation.get("status")!="VERSION_GUARDS_PASS":
              fail("tool_observation_invalid"); raise SystemExit(1)
          try:
              if success_output.is_symlink() or not success_output.is_dir(): raise ValueError("success output directory missing")
              allowed={"generated-source.tar.gz","outputs.json","receipt.json"}
              children=list(success_output.iterdir())
              if {path.name for path in children}!=allowed or any(path.is_symlink() or not path.is_file() for path in children): raise ValueError("success output family is incomplete or unsafe")
              records=command_records; logs=evidence/"logs"
              if records.is_symlink() or not records.is_file() or logs.is_symlink() or not logs.is_dir(): raise ValueError("command evidence is incomplete or unsafe")
              record_size=records.stat().st_size
              log_paths=sorted(logs.iterdir()); log_size=0
              for path in log_paths:
                  if path.is_symlink() or not path.is_file(): raise ValueError("command log family contains a non-regular file")
                  log_size+=path.stat().st_size
              if log_size>log_limit or record_size>65536: raise ValueError("command evidence exceeds its reserved cap")
              source_sizes={path.name:path.stat().st_size for path in children}
              total=sum(source_sizes.values())+record_size+log_size
              if total>max_bytes: raise ValueError("complete artifact family exceeds 16 MiB")
              if source_sizes["outputs.json"]>65536 or source_sizes["receipt.json"]>65536: raise ValueError("artifact metadata exceeds its reserved cap")
              receipt_path=success_output/"receipt.json"; manifest_path=success_output/"outputs.json"; archive=success_output/"generated-source.tar.gz"
              receipt=json.loads(receipt_path.read_text()); manifest=json.loads(manifest_path.read_text())
              if receipt.get("sourceCommit")!=os.environ["SOURCE_COMMIT"] or receipt.get("runId")!=os.environ["RUN_ID"] or receipt.get("runAttempt")!=os.environ["RUN_ATTEMPT"] or receipt.get("ref")!=os.environ["SOURCE_REF"] or receipt.get("event")!=os.environ["EVENT_NAME"]: raise ValueError("generation receipt identity mismatch")
              if receipt.get("tools")!=tool_observation: raise ValueError("generation receipt tool identity mismatch")
              phase=receipt.get("phase"); statuses={"regex-artifacts":"PASS_REGEX_GENERATION_ARTIFACTS_ONLY","metamodel-artifacts":"PASS_METAMODEL_GENERATION_ARTIFACTS_ONLY","dependent-artifacts":"PASS_DEPENDENT_GENERATION_ARTIFACTS_ONLY"}
              if phase not in statuses or receipt.get("status")!=statuses[phase] or receipt.get("outputManifestSha256")!=hashlib.sha256(manifest_path.read_bytes()).hexdigest(): raise ValueError("generation receipt or manifest mismatch")
              if phase=="regex-artifacts" and (cpython_installation is None or cpython_installation.get("status")!="FRESH_EXTRACTION_COMPLETE" or receipt.get("cpPython",{}).get("runtime",{}).get("installation")!=cpython_installation): raise ValueError("CPython installation fact is absent from verified runtime evidence")
              if manifest.get("sourceCommit")!=receipt["sourceCommit"] or manifest.get("phase")!=phase or type(manifest.get("outputs")) is not list or receipt.get("outputCount")!=len(manifest["outputs"]): raise ValueError("output manifest identity or roster mismatch")
              with archive.open("rb") as stream: archive_sha=hashlib.file_digest(stream,"sha256").hexdigest()
              if receipt.get("archiveSha256")!=archive_sha or receipt.get("archiveBytes")!=source_sizes["generated-source.tar.gz"]: raise ValueError("compressed archive identity mismatch")
              shutil.copyfile(archive,upload/archive.name); shutil.copyfile(manifest_path,upload/manifest_path.name); shutil.copyfile(receipt_path,upload/receipt_path.name)
              shutil.copyfile(records,upload/"command-records.jsonl"); shutil.copytree(logs,upload/"logs")
              uploaded=[path for path in upload.rglob("*") if path.is_file()]
              if any(path.is_symlink() for path in upload.rglob("*")) or sum(path.stat().st_size for path in uploaded)>max_bytes: raise ValueError("copied artifact family exceeds 16 MiB")
              if sum(path.stat().st_size for path in (upload/"logs").iterdir())>log_limit: raise ValueError("copied command logs exceed 1 MiB")
