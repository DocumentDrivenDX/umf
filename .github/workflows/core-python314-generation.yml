              summary_keys=("name","stage","argv","rawExit","captureExit","monotonicStartMs","monotonicEndMs","monotonicDurationMs","startedAtUtc","endedAtUtc","limitSeconds","logBytes","logSha256","truncated")
              if last_command!={key:row[key] for key in summary_keys}: return not_retained("COMMAND_RECEIPT_MISMATCH")
              logs=evidence/"logs"; selected=logs/(name+".log")
              if logs.is_symlink() or not logs.is_dir() or logs.resolve(strict=True)!=evidence.resolve(strict=True)/"logs" or selected.is_symlink() or not selected.is_file(): return not_retained("LOG_PATH_INVALID")
              log_size=selected.stat().st_size
              if log_size!=row["logBytes"] or log_size>log_limit: return not_retained("LOG_SIZE_MISMATCH")
              command_doc={"profile":"umf.core-python314-failed-command/1","sourceCommit":os.environ["SOURCE_COMMIT"],"runId":os.environ["RUN_ID"],"runAttempt":os.environ["RUN_ATTEMPT"],"ref":os.environ["SOURCE_REF"],"event":os.environ["EVENT_NAME"],"command":row}
              command_bytes=(json.dumps(command_doc,indent=2,sort_keys=True)+"\n").encode()
              retention={"status":"RETAINED","reasonCode":None,"commandName":name,"commandRecordFile":"failed-command.json","commandRecordBytes":len(command_bytes),"commandRecordSha256":hashlib.sha256(command_bytes).hexdigest(),"logFile":"logs/"+name+".log","logBytes":log_size,"logSha256":row["logSha256"],"truncated":row["truncated"]}
              receipt_bytes=(json.dumps(failed_payload("generation_step_failed",retention),indent=2,sort_keys=True)+"\n").encode()
              if log_size>log_limit or len(receipt_bytes)+len(command_bytes)+log_size>max_bytes: return not_retained("PROSPECTIVE_FAMILY_TOO_LARGE")
              if file_sha256(selected)!=row["logSha256"]: return not_retained("LOG_HASH_MISMATCH")
              try:
                  shutil.rmtree(upload,ignore_errors=True); upload.mkdir(parents=True)
                  log_dir=upload/"logs"; log_dir.mkdir()
                  shutil.copyfile(selected,log_dir/(name+".log"))
                  command_copy=upload/"failed-command.json"; command_copy.write_bytes(command_bytes)
                  copied_log=log_dir/(name+".log")
                  if copied_log.is_symlink() or not copied_log.is_file() or copied_log.stat().st_size!=log_size or file_sha256(copied_log)!=row["logSha256"]: return not_retained("COPY_VERIFICATION_FAILED")
                  receipt_copy=upload/"receipt.json"; receipt_copy.write_bytes(receipt_bytes)
                  entries=list(upload.rglob("*")); expected_roster={"receipt.json","failed-command.json","logs","logs/"+name+".log"}
                  if command_copy.is_symlink() or command_copy.stat().st_size!=len(command_bytes) or file_sha256(command_copy)!=retention["commandRecordSha256"] or receipt_copy.is_symlink() or receipt_copy.stat().st_size!=len(receipt_bytes) or file_sha256(receipt_copy)!=hashlib.sha256(receipt_bytes).hexdigest() or any(path.is_symlink() or not (path.is_file() or path.is_dir()) for path in entries) or {path.relative_to(upload).as_posix() for path in entries}!=expected_roster or sum(path.stat().st_size for path in entries if path.is_file())>max_bytes or copied_log.stat().st_size>log_limit: return not_retained("COPY_VERIFICATION_FAILED")
              except (OSError,ValueError): return not_retained("COPY_VERIFICATION_FAILED")
              return retention
          if tool_observation_error is not None:
              fail("tool_observation_invalid"); raise SystemExit(1)
