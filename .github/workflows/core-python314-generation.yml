                  "regenerate-action-plan-identity":["bash","-euo","pipefail","-c","bun scripts/actions-plan-identity.ts && bun scripts/actions-plan-identity.ts --check"],
                  "regenerate-codegen-and-check":["bash","-euo","pipefail","-c","bun scripts/build-codegen.ts && bun scripts/build-codegen.ts --check"],
                  "check-rust-boundaries":["bun","run","check:rust-boundaries"],
              }
              if name not in fixed_argv or row.get("stage")!=name or row.get("argv")!=fixed_argv[name]: return not_retained("COMMAND_ARGUMENTS_NOT_RECOGNIZED")
              expected_keys={"name","stage","argv","rawExit","captureExit","monotonicStartMs","monotonicEndMs","monotonicDurationMs","startedAtUtc","endedAtUtc","limitSeconds","logBytes","logSha256","truncated"}
              if set(row)!=expected_keys or type(row.get("rawExit")) is not int or not 0<=row["rawExit"]<=255 or type(row.get("captureExit")) is not int or row["captureExit"] not in {0,74,75} or type(row.get("truncated")) is not bool or row["truncated"]!=(row["captureExit"]==75) or (row["rawExit"]==0 and row["captureExit"]==0 and not row["truncated"]): return not_retained("COMMAND_RECORD_INVALID")
