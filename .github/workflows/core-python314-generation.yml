# SPDX-License-Identifier: MIT OR Apache-2.0
name: Core Python 3.14 generated-source qualification

on:
  push:
    branches:
      - codex/core-python314-generation

permissions:
  contents: read

jobs:
  generate:
    name: Bounded Python 3.14 and dependent source generation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Seed fresh failure evidence and original monotonic deadline
        if: always()
        timeout-minutes: 1
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/core-python314-generation
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/logs" "$RUNNER_TEMP/core-python314-upload"
          START_MS="$(awk '{printf "%d", $1 * 1000}' /proc/uptime)"
          printf '%s\n' "$START_MS" > "$EVIDENCE_DIR/monotonic-start-ms"
          printf '%s\n' "$((START_MS + 1800000))" > "$EVIDENCE_DIR/monotonic-deadline-ms"
          cat > "$EVIDENCE_DIR/receipt.json" <<JSON
          {
            "profile": "umf.core-python314-generation/1",
            "status": "FAIL_OR_UNKNOWN",
            "reason": "Generation did not reach the passing finalizer.",
            "sourceCommit": "$GITHUB_SHA",
            "runId": "$GITHUB_RUN_ID",
            "runAttempt": "$GITHUB_RUN_ATTEMPT",
            "ref": "$GITHUB_REF",
            "workflow": "$GITHUB_WORKFLOW",
            "scope": "Hosted artifact-only generation; no installed-wheel, release, or support claim.",
            "aggregateDeadlineSeconds": 1800,
            "childMaximumSeconds": 180,
            "timeoutKillGraceSeconds": 10,
            "cleanupReserveSeconds": 60,
            "aggregateLogLimitBytes": 1048576,
            "aggregateArtifactLimitBytes": 16777216,
            "failureOnlyReceiptOnLimitOrMismatch": true,
            "qualificationClaim": false
          }
          JSON
          cp "$EVIDENCE_DIR/receipt.json" "$RUNNER_TEMP/core-python314-upload/receipt.json"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        timeout-minutes: 2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        timeout-minutes: 2
        with:
          python-version: '3.12.15'

      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 2
        with:
          toolchain: 1.90.0

      - name: Run the original-deadline-bounded generation and checks
        id: generate
        timeout-minutes: 30
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/core-python314-generation
          UPLOAD_DIR: ${{ runner.temp }}/core-python314-upload
          WORK_OUTPUT_DIR: ${{ runner.temp }}/core-python314-success
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          EVIDENCE="$EVIDENCE_DIR"
          DEADLINE_MS="$(cat "$EVIDENCE/monotonic-deadline-ms")"
          : > "$EVIDENCE/command-records.jsonl"
          cat > "$RUNNER_TEMP/core-python314-work.sh" <<'WORK'
          set -euo pipefail
          EVIDENCE="$EVIDENCE_DIR"
          DEADLINE_MS="$(cat "$EVIDENCE/monotonic-deadline-ms")"

          run_bounded() {
            local name="$1" maximum="$2" now_ms remaining limit status capture_status log started_ms ended_ms started_utc ended_utc prior_log_bytes available_log_bytes
            local -a pipeline_status
            shift 2
            now_ms="$(awk '{printf "%d", $1 * 1000}' /proc/uptime)"
            remaining="$(((DEADLINE_MS - now_ms - 72000) / 1000))"
            if (( remaining <= 0 )); then echo "Original deadline exhausted before $name" >&2; return 124; fi
            limit="$maximum"
            if (( remaining < limit )); then limit="$remaining"; fi
            log="$EVIDENCE/logs/$name.log"
            prior_log_bytes="$(find "$EVIDENCE/logs" -type f -name '*.log' -exec wc -c {} + | awk 'END {print $1+0}')"
            available_log_bytes=$((1048576 - prior_log_bytes))
            if (( available_log_bytes < 0 )); then available_log_bytes=0; fi
            started_ms="$now_ms"
            started_utc="$(date -u +'%Y-%m-%dT%H:%M:%S.%NZ')"
            : > "$log"
            set +e
            timeout --signal=TERM --kill-after=10s "${limit}s" "$@" 2>&1 | python -I -c '
          import sys
          path, cap = sys.argv[1], int(sys.argv[2])
          marker = b"\n[LOG TRUNCATED: output exceeded aggregate capture cap]\n"
          stored = 0; truncated = False; failed = False
          try: output = open(path, "wb", buffering=0)
          except OSError: output = None; failed = True
          while True:
              chunk = sys.stdin.buffer.read(65536)
              if not chunk: break
              if output is None: continue
              available = max(0, cap - stored)
              piece = chunk[:available]
              if piece:
                  try: output.write(piece); stored += len(piece)
                  except OSError:
                      failed = True
                      try: output.close()
                      except OSError: pass
                      output = None
              if len(chunk) > available: truncated = True
          if output is not None:
              try:
                  if truncated:
                      marker = marker[:cap]; output.seek(max(0, cap - len(marker))); output.truncate(); output.write(marker)
                  output.close()
              except OSError: failed = True
          sys.exit(74 if failed else 75 if truncated else 0)
          ' "$log" "$available_log_bytes"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            status="${pipeline_status[0]}"
            capture_status="${pipeline_status[1]}"
            ended_ms="$(awk '{printf "%d", $1 * 1000}' /proc/uptime)"
            ended_utc="$(date -u +'%Y-%m-%dT%H:%M:%S.%NZ')"
            python -I - "$EVIDENCE/command-records.jsonl" "$log" "$name" "$status" "$capture_status" "$started_ms" "$ended_ms" "$started_utc" "$ended_utc" "$limit" "$@" <<'PY'
          import hashlib, json, pathlib, sys
          records, log_path, name, raw_exit, capture_exit, started_ms, ended_ms, started_utc, ended_utc, limit_seconds, *argv = sys.argv[1:]
          payload = pathlib.Path(log_path).read_bytes()
          record = {"name": name, "stage": name, "argv": argv, "rawExit": int(raw_exit),
                    "captureExit": int(capture_exit), "monotonicStartMs": int(started_ms),
                    "monotonicEndMs": int(ended_ms), "monotonicDurationMs": int(ended_ms)-int(started_ms),
                    "startedAtUtc": started_utc, "endedAtUtc": ended_utc,
                    "limitSeconds": int(limit_seconds), "logBytes": len(payload),
                    "logSha256": hashlib.sha256(payload).hexdigest(), "truncated": int(capture_exit) == 75}
          with pathlib.Path(records).open("a", encoding="utf-8") as stream: stream.write(json.dumps(record, sort_keys=True) + "\n")
          PY
            if (( status != 0 || capture_status != 0 )); then
              echo "Command $name failed: raw exit $status, capture exit $capture_status" >&2
              return 1
            fi
          }

          run_bounded fetch-pinned-main-preimage 60 python -I - "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_EVENT_NAME" "$EVIDENCE" <<'PY'
          import json, pathlib, subprocess, sys
          from urllib.parse import urlsplit
          checkout, ref, event, evidence = sys.argv[1:]
          pinned = "d5022e37840329d351bcd6c27fe7d7aad4758544"
          diagnostic = pathlib.Path(evidence) / "preflight-diagnostic.json"
          def fail(code, component, status):
              payload = {"profile":"umf.core-python314-preflight-diagnostic/1","reasonCode":code,"component":component,"pinnedCommit":pinned,"actualStatus":int(status)}
              diagnostic.write_text(json.dumps(payload,sort_keys=True,separators=(",",":"))+"\n")
              print("SOURCE_PREFLIGHT_FAILURE="+code+" component="+component+" status="+str(int(status)),file=sys.stderr)
              raise SystemExit(1)
          if event != "push" or ref != "refs/heads/codex/core-python314-generation": fail("SOURCE_EVENT_REF_MISMATCH","generation-ref",1)
          result=subprocess.run(["git","rev-parse","HEAD"],capture_output=True,text=True)
          if result.returncode or result.stdout.strip()!=checkout: fail("SOURCE_HEAD_MISMATCH","generation-head",result.returncode or 1)
          result=subprocess.run(["git","status","--porcelain"],capture_output=True,text=True)
          if result.returncode or result.stdout: fail("SOURCE_WORKTREE_NOT_CLEAN","generation-worktree",result.returncode or 1)
          remote=subprocess.run(["git","remote","get-url","origin"],capture_output=True,text=True)
          parsed=urlsplit(remote.stdout.strip())
          remote_path=parsed.path.rstrip("/")
          if remote_path.endswith(".git"): remote_path=remote_path[:-4]
          if remote.returncode or parsed.scheme!="https" or parsed.hostname!="github.com" or remote_path!="/DocumentDrivenDX/umf" or parsed.username or parsed.password or parsed.query or parsed.fragment:
              fail("SOURCE_REPOSITORY_MISMATCH","origin-repository",remote.returncode or 1)
          try: lock=json.loads(pathlib.Path("qualification-inputs/core-python314-generation.json").read_text())
          except (OSError,UnicodeDecodeError,json.JSONDecodeError): fail("SOURCE_LOCK_UNAVAILABLE","generation-lock",1)
          if not isinstance(lock,dict): fail("SOURCE_LOCK_UNAVAILABLE","generation-lock",1)
          if lock.get("sourceCommit")!=pinned: fail("SOURCE_LOCK_COMMIT_MISMATCH","generation-lock",1)
          fetched=subprocess.run(["git","fetch","--no-tags","--no-recurse-submodules","--depth=1","origin",pinned],capture_output=True)
          if fetched.returncode: fail("PREIMAGE_COMMIT_FETCH_FAILED","main-preimage-commit",fetched.returncode)
          fetched_head=subprocess.run(["git","rev-parse","FETCH_HEAD^{commit}"],capture_output=True,text=True)
          if fetched_head.returncode or fetched_head.stdout.strip()!=pinned: fail("PREIMAGE_FETCH_HEAD_MISMATCH","main-preimage-commit",fetched_head.returncode or 1)
          object_check=subprocess.run(["git","cat-file","-e",pinned+"^{commit}"],capture_output=True)
          if object_check.returncode: fail("PREIMAGE_COMMIT_UNAVAILABLE","main-preimage-commit",object_check.returncode)
          result=subprocess.run(["git","status","--porcelain"],capture_output=True,text=True)
          if result.returncode or result.stdout: fail("SOURCE_WORKTREE_CHANGED_DURING_FETCH","generation-worktree",result.returncode or 1)
          PY

          run_bounded source-preflight 180 python -I - "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_EVENT_NAME" "$EVIDENCE" <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess, sys
          commit, ref, event, evidence = sys.argv[1:]
          pinned = "d5022e37840329d351bcd6c27fe7d7aad4758544"
          diagnostic = pathlib.Path(evidence) / "preflight-diagnostic.json"
          component = "generation-lock"
          def fail(code, label, status=1):
              payload = {"profile":"umf.core-python314-preflight-diagnostic/1","reasonCode":code,"component":label,"pinnedCommit":pinned,"actualStatus":int(status)}
              diagnostic.write_text(json.dumps(payload,sort_keys=True,separators=(",",":"))+"\n")
              print("SOURCE_PREFLIGHT_FAILURE="+code+" component="+label+" status="+str(int(status)),file=sys.stderr)
              raise SystemExit(1)
          if event != "push" or ref != "refs/heads/codex/core-python314-generation": fail("SOURCE_EVENT_REF_MISMATCH","generation-ref")
          head=subprocess.run(["git", "rev-parse", "HEAD"],text=True,capture_output=True)
          if head.returncode or head.stdout.strip()!=commit: fail("SOURCE_HEAD_MISMATCH","generation-head",head.returncode or 1)
          status=subprocess.run(["git", "status", "--porcelain"],text=True,capture_output=True)
          if status.returncode or status.stdout: fail("SOURCE_WORKTREE_NOT_CLEAN","generation-worktree",status.returncode or 1)
          try: lock=json.loads(pathlib.Path("qualification-inputs/core-python314-generation.json").read_text())
          except (OSError,UnicodeDecodeError,json.JSONDecodeError): fail("SOURCE_LOCK_UNAVAILABLE","generation-lock")
          if not isinstance(lock,dict): fail("SOURCE_LOCK_UNAVAILABLE","generation-lock")
          if lock.get("sourceCommit")!=pinned: fail("SOURCE_LOCK_COMMIT_MISMATCH","generation-lock")
          phase=lock.get("phase")
          if phase not in {"regex-artifacts","metamodel-artifacts","dependent-artifacts"}: fail("SOURCE_PHASE_MISMATCH","generation-phase")
          for name, expected in lock["inputs"].items():
              component=name
              path=pathlib.Path(name)
              try: actual=hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() and not path.is_symlink() else None
              except OSError: actual=None
              if actual is None: fail("SOURCE_INPUT_UNAVAILABLE",name)
              if actual!=expected: fail("SOURCE_INPUT_SHA_MISMATCH",name,0)
          for name, expected in lock["mainPreimages"].items():
              component=name
              result=subprocess.run(["git","show",pinned+":"+name],capture_output=True)
              if result.returncode: fail("PREIMAGE_BLOB_UNAVAILABLE",name,result.returncode)
              if hashlib.sha256(result.stdout).hexdigest()!=expected: fail("PREIMAGE_SHA_MISMATCH",name,0)
          regex_paths={"crates/umf-core/src/python_re_tables.rs","crates/umf-core/src/python_re_names.dat","crates/umf-core/tests/fixtures/cpython-re/outcomes-3.14.tsv","crates/umf-core/tests/fixtures/cpython-re/independent-boundaries.json","crates/umf-core/tests/fixtures/cpython-re/independent-outcomes.tsv","crates/umf-core/tests/fixtures/cpython-re/independent-hex-boundaries.json","crates/umf-core/tests/fixtures/cpython-re/independent-hex-outcomes.tsv","crates/umf-core/tests/fixtures/cpython-re/independent-info-boundaries.json","crates/umf-core/tests/fixtures/cpython-re/independent-info-outcomes.tsv"}
          metamodel_paths={"spec/core/schema.json","spec/core/semantic-type-reference.schema.json","spec/core/extension-package.schema.json","spec/metamodel/package.json","spec/metamodel/generated/core-constraints.json","spec/metamodel/generated/domain-policy.json","spec/metamodel/generated/python-shapes.json","python/umf_access/src/umf_access/generated_core.py","src/generated/core-model.ts","src/generated/core-validators.ts","spec/metamodel/generated/manifest.json"}
          def require_adoption(outputs, adoption, expected_paths, status, label):
              if not isinstance(outputs,dict) or set(outputs)!=expected_paths or not isinstance(adoption,dict) or adoption.get("status")!=status: raise SystemExit(label+" lacks reviewed artifact adoption custody")
              for name, expected in outputs.items():
                  path=pathlib.Path(name)
                  if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest()!=expected: raise SystemExit(label+" bytes do not match current source: "+name)
              for name in ("sourceCommit","runId","runAttempt","artifactSha256","receiptSha256"):
                  if not isinstance(adoption.get(name),str) or not adoption[name]: raise SystemExit("incomplete "+label+" provenance: "+name)
          if phase=="regex-artifacts":
              if lock.get("adoptedRegexOutputs") is not None or lock.get("adoption") is not None: fail("SOURCE_ADOPTION_STATE_MISMATCH","regex-adoption")
              if lock.get("adoptedMetamodelOutputs") is not None or lock.get("metamodelAdoption") is not None: fail("SOURCE_ADOPTION_STATE_MISMATCH","metamodel-adoption")
              for name, expected in lock["regexPreimages"].items():
                  component=name
                  path=pathlib.Path(name)
                  try: actual=hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() and not path.is_symlink() else None
                  except OSError: actual=None
                  if actual is None: fail("REGEX_PREIMAGE_UNAVAILABLE",name)
                  if actual!=expected: fail("REGEX_PREIMAGE_SHA_MISMATCH",name,0)
                  result=subprocess.run(["git","show",pinned+":"+name],capture_output=True)
                  if result.returncode: fail("PREIMAGE_BLOB_UNAVAILABLE",name,result.returncode)
                  if hashlib.sha256(result.stdout).hexdigest()!=expected: fail("PREIMAGE_SHA_MISMATCH",name,0)
          else:
              require_adoption(lock.get("adoptedRegexOutputs"),lock.get("adoption"),regex_paths,"PASS_REGEX_GENERATION_ARTIFACTS_ONLY","regex generation")
              if phase=="metamodel-artifacts":
                  if lock.get("adoptedMetamodelOutputs") is not None or lock.get("metamodelAdoption") is not None: raise SystemExit("metamodel phase cannot consume metamodel adoption claims")
              else:
                  require_adoption(lock.get("adoptedMetamodelOutputs"),lock.get("metamodelAdoption"),metamodel_paths,"PASS_METAMODEL_GENERATION_ARTIFACTS_ONLY","metamodel generation")
          if lock["cpython"]["archiveSha256"]!="fa74abc70a55c10f6631967784878704eef81bbde9b8ec27469534f6ba997cb3": raise SystemExit("CPython acquisition lock mismatch")
          expected_cpython={"implementation":"CPython","version":"3.14.8","unicodeVersion":"16.0.0","releaseTag":"3.14.8-36806082737","releaseId":400609475,"releaseApiSha256":"d7d8d41851a6a6489a9fc5b6b51e601e708cca26f1b0fe1791751371dc7cf0a0","assetApiUrl":"https://api.github.com/repos/actions/python-versions/releases/assets/602296995","assetApiSha256":"bd1ade7f0c55dc6f8ac8ecc3af88d6d66646e8c09841dede5b0d73922ede7d00","downloadUrl":"https://github.com/actions/python-versions/releases/download/3.14.8-36806082737/python-3.14.8-linux-24.04-x64.tar.gz","archiveName":"python-3.14.8-linux-24.04-x64.tar.gz","archiveBytes":110382248,"archiveSha256":"fa74abc70a55c10f6631967784878704eef81bbde9b8ec27469534f6ba997cb3","executableMember":"./bin/python3.14","executableBytes":17752,"executableSha256":"a5230d8adbd26c2185d77fb003597c4ee9c44c2369fc179122ff7c3a3a58ae59","installationPrefix":"/opt/hostedtoolcache/Python/3.14.8/x64","libpythonRelativePath":"lib/libpython3.14.so.1.0","stdlibRelativePath":"lib/python3.14","extensionModulesRelativePath":"lib/python3.14/lib-dynload"}
          if lock["cpython"]!=expected_cpython: raise SystemExit("CPython acquisition identity differs from frozen primary metadata")
          if pathlib.Path("python/pyproject.toml").read_text().find('version = "0.10.3"')<0: raise SystemExit("distribution version is not 0.10.3")
          tool_names=("bun","python","cargo","rustc","curl","timeout")
          tool_codes={"TOOL_EXECUTABLE_UNAVAILABLE","TOOL_IDENTITY_FAILED","TOOL_IDENTITY_TOO_LARGE","TOOL_VERSION_COMMAND_FAILED","TOOL_VERSION_COMMAND_TIMED_OUT","TOOL_VERSION_OUTPUT_INVALID","TOOL_VERSION_OUTPUT_TOO_LARGE","TOOL_VERSION_MISMATCH","RUSTUP_EXECUTABLE_UNAVAILABLE","RUSTUP_IDENTITY_FAILED","RUSTUP_SELECTION_FAILED","RUSTUP_SELECTION_AMBIGUOUS","RUST_PAYLOAD_UNAVAILABLE","RUST_PAYLOAD_IDENTITY_FAILED","RUST_PAYLOAD_VERSION_FAILED","RUST_PAYLOAD_VERSION_TIMED_OUT","RUST_PAYLOAD_VERSION_MISMATCH","TOOL_OBSERVATION_TOO_LARGE"}
          def tool_record(): return {"status":"pending","code":None,"invocationPath":None,"resolvedPath":None,"resolvedBinarySha256":None,"returnStatus":None,"versionText":None,"versionBytes":None}
          def status_code(value): return int(value) if int(value)>=0 else min(255,128-int(value))
          tools_doc={"profile":"umf.core-python314-tool-observations/1","status":"IN_PROGRESS","tools":{name:tool_record() for name in tool_names},"rustSelection":{"status":"pending","code":None,"rustupInvocationPath":None,"rustupResolvedPath":None,"rustupBinarySha256":None,"cargoPayloadPath":None,"cargoPayloadSha256":None,"cargoPayloadVersion":None,"rustcPayloadPath":None,"rustcPayloadSha256":None,"rustcPayloadVersion":None}}
          tools_path=pathlib.Path(os.environ["EVIDENCE_DIR"],"tools.json")
          def write_tools():
              encoded=(json.dumps(tools_doc,indent=2,sort_keys=True)+"\n").encode()
              if len(encoded)>8192: fail("TOOL_OBSERVATION_TOO_LARGE","tool-summary",0)
              tools_path.write_bytes(encoded)
          def tool_failure(code, component, status):
              name=component.removeprefix("tool-")
              tools_doc["status"]="FAILED"
              if name in tools_doc["tools"]:
                  tools_doc["tools"][name]["status"]="failed"; tools_doc["tools"][name]["code"]=code; tools_doc["tools"][name]["returnStatus"]=status_code(status)
              if component.startswith("rustup") or component.startswith("rust-payload"):
                  tools_doc["rustSelection"]["status"]="failed"; tools_doc["rustSelection"]["code"]=code
              write_tools(); fail(code,component,status)
          write_tools()
          for name in tool_names:
              component="tool-"+name
              found=shutil.which(name)
              if found is None: tool_failure("TOOL_EXECUTABLE_UNAVAILABLE",component,127)
              invocation=os.path.abspath(found)
              if len(invocation)>512: tool_failure("TOOL_IDENTITY_TOO_LARGE",component,1)
              record=tools_doc["tools"][name]; record["invocationPath"]=invocation
              try:
                  resolved=pathlib.Path(invocation).resolve(strict=True)
                  if not resolved.is_file(): tool_failure("TOOL_IDENTITY_FAILED",component,1)
                  resolved_path=str(resolved)
                  if len(resolved_path)>512: tool_failure("TOOL_IDENTITY_TOO_LARGE",component,1)
                  with resolved.open("rb") as stream: binary_sha=hashlib.file_digest(stream,"sha256").hexdigest()
              except OSError: tool_failure("TOOL_IDENTITY_FAILED",component,1)
              record.update({"resolvedPath":resolved_path,"resolvedBinarySha256":binary_sha})
              try: result=subprocess.run([invocation,"--version"],check=False,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=10)
              except subprocess.TimeoutExpired: tool_failure("TOOL_VERSION_COMMAND_TIMED_OUT",component,124)
              except OSError: tool_failure("TOOL_VERSION_COMMAND_FAILED",component,126)
              record["returnStatus"]=status_code(result.returncode); record["versionBytes"]=len(result.stdout)
              if result.returncode!=0: tool_failure("TOOL_VERSION_COMMAND_FAILED",component,status_code(result.returncode))
              if len(result.stdout)>1024: tool_failure("TOOL_VERSION_OUTPUT_TOO_LARGE",component,result.returncode)
              try: version=result.stdout.decode("utf-8").strip()
              except UnicodeDecodeError: tool_failure("TOOL_VERSION_OUTPUT_INVALID",component,result.returncode)
              record["versionText"]=version
              record["status"]="observed"; write_tools()
          rustup_found=shutil.which("rustup")
          if rustup_found is None: tool_failure("RUSTUP_EXECUTABLE_UNAVAILABLE","rustup",127)
          rustup_invocation=os.path.abspath(rustup_found); selection=tools_doc["rustSelection"]
          if len(rustup_invocation)>512: tool_failure("RUSTUP_IDENTITY_FAILED","rustup",1)
          try:
              rustup_resolved=pathlib.Path(rustup_invocation).resolve(strict=True)
              if not rustup_resolved.is_file(): tool_failure("RUSTUP_IDENTITY_FAILED","rustup",1)
              rustup_resolved_path=str(rustup_resolved)
              if len(rustup_resolved_path)>512: tool_failure("RUSTUP_IDENTITY_FAILED","rustup",1)
              with rustup_resolved.open("rb") as stream: rustup_sha=hashlib.file_digest(stream,"sha256").hexdigest()
          except OSError: tool_failure("RUSTUP_IDENTITY_FAILED","rustup",1)
          selection.update({"rustupInvocationPath":rustup_invocation,"rustupResolvedPath":rustup_resolved_path,"rustupBinarySha256":rustup_sha})
          for name in ("cargo","rustc"):
              component="rustup-"+name
              try: selected=subprocess.run([rustup_invocation,"which",name],check=False,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=10)
              except subprocess.TimeoutExpired: tool_failure("RUSTUP_SELECTION_FAILED",component,124)
              except OSError: tool_failure("RUSTUP_SELECTION_FAILED",component,126)
              if selected.returncode!=0: tool_failure("RUSTUP_SELECTION_FAILED",component,status_code(selected.returncode))
              if len(selected.stdout)>1024: tool_failure("RUSTUP_SELECTION_AMBIGUOUS",component,selected.returncode)
              try: selected_text=selected.stdout.decode("utf-8")
              except UnicodeDecodeError: tool_failure("RUSTUP_SELECTION_AMBIGUOUS",component,selected.returncode)
              lines=selected_text.splitlines()
              if len(lines)!=1 or not lines[0].startswith("/") or lines[0].strip()!=lines[0]: tool_failure("RUSTUP_SELECTION_AMBIGUOUS",component,selected.returncode)
