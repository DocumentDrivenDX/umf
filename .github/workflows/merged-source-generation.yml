# SPDX-License-Identifier: MIT OR Apache-2.0
name: Generate current source artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: umf-merged-source-generation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Initialize current source artifact staging
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/umf-current-source-artifacts"
          test ! -e "$ARTIFACT_DIR"
          mkdir -p "$ARTIFACT_DIR"
          printf 'ARTIFACT_DIR=%s\n' "$ARTIFACT_DIR" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # immutable checkout action
        timeout-minutes: 2
        with:
          persist-credentials: false
          fetch-depth: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # immutable Bun setup action
        timeout-minutes: 2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # immutable setup-python action
        timeout-minutes: 2
        with:
          python-version: '3.11.17'

      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 3
        with:
          toolchain: 1.90.0
          components: rustfmt
          targets: wasm32-unknown-unknown

      - name: Verify pinned toolchain
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = DocumentDrivenDX/umf
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test "$(bun --version)" = 1.4.3
          test "$(python --version)" = 'Python 3.11.17'
          test "$(rustc --version)" = 'rustc 1.90.0 (1159e78c4 2025-09-14)'

      - name: Install locked JavaScript build inputs
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts

      - name: Fetch locked Rust build inputs
        timeout-minutes: 10
        run: cargo fetch --locked

      - name: Generate and check current source artifacts
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/metamodel/build.ts
          bun scripts/actions-plan-identity.ts
          bun scripts/actions-plan-identity.ts --check
          python3 scripts/check-rust-boundaries.py

      - name: Verify and stage generated output files
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PYTHON'
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path.cwd()
          destination = pathlib.Path(os.environ['ARTIFACT_DIR'])
          manifest_path = 'spec/metamodel/generated/manifest.json'
          manifest = json.loads((root / manifest_path).read_text())
          outputs = manifest['outputs']
          if not isinstance(outputs, dict) or not outputs:
              raise SystemExit('Generated output manifest is empty')
          paths = set(outputs) | {manifest_path, 'src/extensions/actions/plan-identity.ts'}
          for relative in sorted(paths):
              path = pathlib.PurePosixPath(relative)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit('Invalid generated output path: ' + relative)
              source = root / relative
              if source.is_symlink() or not source.is_file():
                  raise SystemExit('Generated output is not a regular file: ' + relative)
              data = source.read_bytes()
              if relative in outputs:
                  row = outputs[relative]
                  if row['bytes'] != len(data) or row['sha256'] != hashlib.sha256(data).hexdigest():
                      raise SystemExit('Generated output differs from its current manifest: ' + relative)
              target = destination / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          PYTHON

      - name: Upload current generated outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # immutable upload-artifact action
        timeout-minutes: 1
        with:
          name: umf-merged-source-generated-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_DIR }}/**
          if-no-files-found: error
          retention-days: 14
