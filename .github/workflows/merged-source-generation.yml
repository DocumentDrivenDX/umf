          ORIGINAL_CONTROLLER_PATHS={'.github/workflows/merged-source-generation.yml','scripts/metamodel/build.ts','scripts/metamodel/rust.ts','scripts/metamodel/source-closure.ts','tools/tests/test_codegen_resource_literals.py','tools/generate_codegen_resource_literals.py','scripts/sync-python-resources.py','scripts/rust-migration/r4/sync_codegen_resources.py','scripts/actions-plan-identity.ts','tools/generate_schema_metas_utf16.py','tools/generate_operation_schema_utf16.py','scripts/check-release-versions.py','scripts/check-rust-boundaries.py'}
          def validate_original_binding(request,run,jobs,artifacts):
              expected={'run_id':ORIGINAL_RUN_ID,'run_attempt':ORIGINAL_ATTEMPT,'artifact_id':str(ORIGINAL_ARTIFACT_ID),'artifact_digest':'sha256:'+ORIGINAL_ZIP_SHA,'source_sha':ORIGINAL_SOURCE}
              if request!=expected: raise ValueError('original continuation binding inputs mismatch')
              if str(run.get('id'))!=ORIGINAL_RUN_ID or run.get('run_attempt')!=1 or run.get('workflow_id')!=396700537 or run.get('event')!='workflow_dispatch' or run.get('head_sha')!=ORIGINAL_SOURCE or run.get('head_branch')!='codex/truss-constructor-recovery' or run.get('status')!='completed' or run.get('conclusion')!='failure' or run.get('actor',{}).get('login')!='easel': raise ValueError('original run/attempt/workflow/event/source/phase mismatch')
