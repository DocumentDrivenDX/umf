mpilerSha256,sourceAttestation:{sources:a.sources,binarySha256:a.binarySha256},executable:{path:exe,bytes:bytes.length,sha256:a.binarySha256},compilerArtifact:{path:rel,bytes:staged.length,sha256:sha(staged)},portableOutputs:outputs},null,2)+'\\n');"
          python -I "$RUNNER_TEMP/merged_source_generation.py" attest "$ARTIFACT_DIR/stages/SR.roster.json" "$ARTIFACT_DIR/stages/SR.oracle.json" "$ARTIFACT_DIR/final-attestation.json" "$ARTIFACT_DIR/successor-source-inputs.json" "$ARTIFACT_DIR" "$ARTIFACT_DIR/successor-source-inputs.json" "$RUNNER_TEMP/umf-original-g0.members/source-inputs.json"
          python -I "$RUNNER_TEMP/merged_source_generation.py" package "$ARTIFACT_DIR" "$ARTIFACT_DIR/output-receipt.json" "$ARTIFACT_DIR/final-source.patch" "$RUNNER_TEMP/umf-original-g0.members/source-inputs.json"
          python -I "$RUNNER_TEMP/merged_source_generation.py" continue-join "$ARTIFACT_DIR"
      - name: Retain failure evidence
        if: failure() || cancelled()
        shell: bash
        run: |
          set +e
          git status --porcelain=v1 > "$ARTIFACT_DIR/failure-status.txt"
          python -I "$RUNNER_TEMP/merged_source_generation.py" failure "$ARTIFACT_DIR"
      - name: Upload source generation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # immutable upload-artifact action
        timeout-minutes: 2
        with:
          name: umf-merged-source-generated-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14
