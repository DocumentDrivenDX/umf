              if str(wr.get('id'))!=ORIGINAL_RUN_ID or wr.get('head_sha')!=ORIGINAL_SOURCE or wr.get('head_branch')!='codex/truss-constructor-recovery': raise ValueError('artifact run/source binding mismatch')
              return a
          def archive_members(raw,metadata):
              import io,stat,zipfile
              from pathlib import PurePosixPath
              digest=hashlib.sha256(raw).hexdigest()
              if len(raw)!=ORIGINAL_ZIP_BYTES or digest!=ORIGINAL_ZIP_SHA or metadata.get('size_in_bytes')!=len(raw) or metadata.get('digest')!='sha256:'+digest: raise ValueError('original ZIP size/SHA mismatch')
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  infos=z.infolist(); names=[i.filename for i in infos]
