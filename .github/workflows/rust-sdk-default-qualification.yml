# SPDX-License-Identifier: MIT OR Apache-2.0
name: Rust SDK default archive qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  default-archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cohort: linux-x86_64
            runner: ubuntu-24.04
            expected_os: linux
            expected_arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      UMF_RUST_DEFAULT_BUILD_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - name: Prefetch locked Rust dependencies for offline snapshot builds
        run: cargo fetch --locked
      - run: cargo install wasm-bindgen-cli --locked --version 0.2.100
      - name: Assert and record host/toolchain cohort
        env:
          EXPECTED_OS: ${{ matrix.expected_os }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          node -e 'if(process.platform!==process.env.EXPECTED_OS||process.arch!==process.env.EXPECTED_ARCH)throw new Error(`runner mismatch: ${process.platform}-${process.arch}`)'
          node --version
          bun --version
          rustc --version
          cargo --version
          wasm-bindgen --version
      - name: Build native and browser SDK assets from a private source snapshot
        run: bun scripts/package-sdk-rust-default.ts
      - name: Generate local WASM declarations for repository typecheck
        run: |
          cargo build --release --locked --manifest-path bindings/core/wasm/Cargo.toml --target wasm32-unknown-unknown
          mkdir -p bindings/core/wasm/pkg
          wasm-bindgen --target web --out-dir bindings/core/wasm/pkg --out-name umf_core_wasm target/wasm32-unknown-unknown/release/umf_core_wasm.wasm
      - name: Typecheck with generated WASM bindings present
        run: bun run typecheck
      - name: Require fixed-point source and private qualification status
        run: >-
          bun -e 'const m=JSON.parse(await Bun.file("dist/rust-default-manifest.json").text());
          if(m.sourceClosure.transform.status!=="fixed-point"||m.sourceClosure.transform.generatedInputs.length!==0)
          throw new Error("SDK source snapshot is not a fixed point");
          if(m.releaseStatus!=="private-r7-default-route-qualification-not-publishable")
          throw new Error("SDK artifact is not marked private/nonpublishable");'
      - name: Verify and package the canonical SDK archive
        run: bun scripts/package-sdk.ts
      - name: Run archive manifest and tamper tests
        run: python3 scripts/test-sdk-package.py
      - run: bunx playwright install --with-deps chromium
      - name: Replay installed SDK in Node, Bun, and Chromium
        run: bun scripts/test-sdk-rust-default.ts .cache/sdk-distribution/umf-sdk.tgz
      - name: Extract the verified Linux archive for Cardinality receipts
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {tarMembers} from './scripts/rust-migration/r8/default-route-retirement-evidence.mjs';
          const archive = fs.readFileSync('.cache/sdk-distribution/umf-sdk.tgz');
          const sha = createHash('sha256').update(archive).digest('hex');
          tarMembers(archive);
          const manifest = JSON.parse(fs.readFileSync('dist/rust-default-manifest.json', 'utf8'));
          if (!manifest.sourceClosure || manifest.sourceClosure.sha256 !== manifest.sourceClosure.capturedLiveSha256 || manifest.sourceClosure.transform?.status !== 'fixed-point' || manifest.sourceClosure.transform.generatedInputs.length !== 0) throw new Error('Linux archive source closure is not a fixed point');
          fs.mkdirSync('.cache/sdk-distribution/cardinality-package', {recursive: true});
          fs.writeFileSync('.cache/sdk-distribution/cardinality-capture-inputs.json', JSON.stringify({archiveSha256: sha, sourceClosureSha256: manifest.sourceClosure.sha256}));
          NODE
          tar -xzf .cache/sdk-distribution/umf-sdk.tgz --strip-components=1 -C .cache/sdk-distribution/cardinality-package
      - name: Capture Cardinality default and reference receipts on Node, Bun, and Chromium
        run: |
          ARCHIVE=.cache/sdk-distribution/umf-sdk.tgz
          PACKAGE=.cache/sdk-distribution/cardinality-package
          OUT=.cache/sdk-distribution/cardinality-capture
          ARCHIVE_SHA=$(node -p 'JSON.parse(require("fs").readFileSync(".cache/sdk-distribution/cardinality-capture-inputs.json")).archiveSha256')
          SOURCE_CLOSURE_SHA=$(node -p 'JSON.parse(require("fs").readFileSync(".cache/sdk-distribution/cardinality-capture-inputs.json")).sourceClosureSha256')
          node scripts/rust-migration/r8/core-cardinality-case-capture.mjs node "$PACKAGE" "$ARCHIVE" "$ARCHIVE_SHA" linux-x86_64 "$SOURCE_CLOSURE_SHA" "$OUT"
          bun scripts/rust-migration/r8/core-cardinality-case-capture.mjs bun "$PACKAGE" "$ARCHIVE" "$ARCHIVE_SHA" linux-x86_64 "$SOURCE_CLOSURE_SHA" "$OUT"
          node scripts/rust-migration/r8/core-cardinality-case-capture.mjs chromium "$PACKAGE" "$ARCHIVE" "$ARCHIVE_SHA" linux-x86_64 "$SOURCE_CLOSURE_SHA" "$OUT"
      - name: Capture exact default and reference operation receipts
        run: >-
          node scripts/rust-migration/r8/capture-default-route-cohort.mjs
          .cache/sdk-distribution/umf-sdk.tgz
          .cache/sdk-distribution/retirement-cohort
      - name: Preserve qualified archive and installed replay receipt
        uses: actions/upload-artifact@v4
        with:
          name: umf-rust-sdk-default-${{ matrix.cohort }}
          path: |
            .cache/sdk-distribution/umf-sdk.tgz
            .cache/sdk-distribution/manifest.json
            .cache/sdk-distribution/installed-test-receipt.json
            .cache/sdk-distribution/security-and-or-installed-receipt.json
            .cache/sdk-distribution/retirement-cohort/archive-source-cohort.json
            .cache/sdk-distribution/retirement-cohort/archive-members.json
            .cache/sdk-distribution/retirement-cohort/archive-package.json
            .cache/sdk-distribution/retirement-cohort/cohort.json
            .cache/sdk-distribution/retirement-cohort/receipts/
            .cache/sdk-distribution/cardinality-capture/
          include-hidden-files: true
          if-no-files-found: error

  linux-route-evidence:
    needs: default-archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
      - run: bun install --frozen-lockfile
      - name: Require current gap ledger before preserving Linux evidence
        run: node scripts/rust-migration/r8/gap-ledger.mjs --check
      - name: Retrieve exact Linux x64 archive cohort
        uses: actions/download-artifact@v4
        with:
          name: umf-rust-sdk-default-linux-x86_64
          path: .cache/sdk-distribution/retirement-matrix/linux-x86_64
      - name: Require passing Linux archive qualification evidence
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = '.cache/sdk-distribution/retirement-matrix/linux-x86_64';
          const capture = `${path}/retirement-cohort`;
          const regular = file => {
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.isSymbolicLink()) throw new Error(`Invalid Linux qualification file: ${file}`);
            return fs.readFileSync(file);
          };
          const sha = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          const receipt = JSON.parse(regular(`${capture}/cohort.json`));
          if (receipt.format !== 'umf.r8.default-route-retirement-cohort/1' || receipt.status !== 'pass' || receipt.cohortId !== 'linux-x86_64' || receipt.platform?.os !== 'linux' || receipt.platform?.arch !== 'x86_64' || receipt.platform?.nodeArch !== 'x64' || receipt.platform?.nativeTarget !== 'x86_64-unknown-linux-gnu') {
            throw new Error('Linux SDK archive qualification did not pass');
          }
          for (const [file, expected] of [
            [`${path}/umf-sdk.tgz`, receipt.archiveSha256],
            [`${capture}/archive-source-cohort.json`, receipt.liveSourceManifestSha256],
            [`${capture}/archive-members.json`, receipt.memberManifestSha256],
            [`${capture}/archive-package.json`, receipt.packageManifestSha256],
          ]) {
            if (!/^[0-9a-f]{64}$/.test(expected) || sha(regular(file)) !== expected) {
              throw new Error(`Linux qualification evidence hash mismatch: ${file}`);
            }
          }
          const source = JSON.parse(regular(`${capture}/archive-source-cohort.json`));
          if (source.sourceClosure?.sha256 !== receipt.sourceClosureSha256 || source.sourceClosure?.capturedLiveSha256 !== receipt.sourceClosureSha256 || source.sourceClosure?.transform?.status !== 'fixed-point' || source.sourceClosure?.fileCount !== receipt.sourceInputCount) throw new Error('Linux source closure differs');
          const inputs = source.sourceClosure?.inputs;
          if (!inputs || Object.keys(inputs).length !== receipt.sourceInputCount) throw new Error('Linux source input set differs');
          for (const [file, expected] of Object.entries(inputs)) {
            if (file.startsWith('/') || file.split('/').includes('..') || !/^[0-9a-f]{64}$/.test(expected) || sha(regular(file)) !== expected) {
              throw new Error(`Linux source input differs: ${file}`);
            }
          }
          const members = JSON.parse(regular(`${capture}/archive-members.json`));
          if (members.status !== 'pass' || members.archiveSha256 !== receipt.archiveSha256 || members.archiveMemberCount !== receipt.archiveMemberCount || members.verifiedMemberCount !== receipt.archiveMemberCount) throw new Error('Linux archive member receipt differs');
          const names = ['inspectCoreRelationships', 'lookupCoreRelationship', 'declareCoreRelationship', 'verifyCoreRelationshipOperation', 'inspectCoreScalarType', 'inspectCoreRecordMembers', 'inspectCoreReferenceLinks', 'validateCsvBooleanLexical', 'verifyCsvBooleanLexical'];
          if (Object.keys(receipt.receipts ?? {}).length !== names.length) throw new Error('Linux operation receipt set differs');
          for (const name of names) {
            for (const runtime of ['node', 'bun', 'chromium']) {
              const expected = receipt.receipts?.[name]?.[runtime];
              const file = `${capture}/receipts/${name}-${runtime}.json`;
              if (!/^[0-9a-f]{64}$/.test(expected) || sha(regular(file)) !== expected) throw new Error(`Linux ${name}/${runtime} receipt differs`);
              const item = JSON.parse(regular(file));
              if (item.status !== 'pass' || item.cohortId !== 'linux-x86_64' || item.archiveSha256 !== receipt.archiveSha256 || item.sourceClosureSha256 !== receipt.sourceClosureSha256) throw new Error(`Linux ${name}/${runtime} content differs`);
            }
          }
          NODE
      - name: Preserve Linux archive qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: umf-rust-sdk-default-linux-qualification
          path: .cache/sdk-distribution/retirement-matrix/
          include-hidden-files: true
          if-no-files-found: error
