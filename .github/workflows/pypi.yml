name: Publish UMF Python to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - run: python -m pip install build twine
      - run: python -m build python
      - run: python -m twine check python/dist/*
      - name: Verify the exact wheel payload against current sources
        run: >-
          python tools/verify_python_artifacts.py
          --wheel python/dist/*.whl
          --repository .
          --expected-platform auto
      - name: Test the built wheel in an isolated installation
        run: |
          python -m venv /tmp/umf-core-release
          /tmp/umf-core-release/bin/python -m pip install pytest python/dist/*.whl
          /tmp/umf-core-release/bin/python -I -c 'import importlib.metadata, pathlib, sysconfig, tomllib, umf; assert pathlib.Path(umf.__file__).is_relative_to(sysconfig.get_path("platlib")); assert importlib.metadata.version("umf-core") == tomllib.loads(pathlib.Path("python/pyproject.toml").read_text())["project"]["version"]; assert umf.__version__ == importlib.metadata.version("umf-core"); print(umf.__file__)'
          /tmp/umf-core-release/bin/python -I -c 'from importlib.resources import files; import json, subprocess; binary=files("umf").joinpath("_bin/umf"); data=json.loads(subprocess.check_output([str(binary), "codegen", "--capabilities"], env={"PATH": ""})); assert data["protocol"] == "umf.codegen-cli/1"; assert data["resourceManifestSha256"]'
          /tmp/umf-core-release/bin/python -I -m pytest python/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: python/dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
