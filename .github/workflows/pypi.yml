name: Publish UMF Python to PyPI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine pytest ./python
      - run: python -m pytest python/tests -q
      - run: python -m build python
      - run: python -m twine check python/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: python/dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
