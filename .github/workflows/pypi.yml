name: PyPI publisher (disabled pending coordinated R8 release)

on:
  workflow_dispatch:

permissions:
  contents: read

# This legacy single-package publisher bypassed the required six-cohort
# umf-core/umf-codegen qualification. Publication must be reintroduced only as
# a reviewed job consuming an aggregate receipt from the same workflow run.
jobs:
  blocked:
    runs-on: ubuntu-24.04
    steps:
      - name: Fail closed until coordinated publication is reviewed
        run: |
          echo "PyPI publication is disabled pending the same-run R8 aggregate gate."
          exit 1
