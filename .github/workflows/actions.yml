name: Command execution

on:
  push:
    branches-ignore:
      - codex/core-0102-inventory-generation
      - codex/core-0102-public-download-qualification
    tags:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  commands:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test command declarations
        run: bun scripts/run-tests.ts ./tests/actions/*.test.ts
      - name: Test actual PostgreSQL command execution
        run: |
          set -o pipefail
          bun run test:actions 2>&1 | tee command-execution.log
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - name: Fetch locked native compiler dependencies
        run: cargo fetch --locked
      - name: Build bundled SDK
        run: bun run test:sdk
      - name: Test command API in Chromium
        run: bun scripts/actions-browser.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: command-execution-evidence
          include-hidden-files: true
          path: |
            command-execution.log
            fixtures/actions/browser.json
            .cache/sdk-distribution/umf-sdk.tgz
            .cache/sdk-distribution/manifest.json
