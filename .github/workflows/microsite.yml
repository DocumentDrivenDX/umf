name: Publish microsite

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/microsite.yml'
      - 'docs/helix/05-deploy/microsite/**'
      - 'src/**'
      - 'spec/**'
      - 'patches/**'
      - 'package.json'
      - 'bun.lock'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/microsite.yml'
      - 'docs/helix/05-deploy/microsite/**'
      - 'src/**'
      - 'spec/**'
      - 'patches/**'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microsite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build browser playground
        run: bun build docs/helix/05-deploy/microsite/demo.ts --target browser --minify --outfile docs/helix/05-deploy/microsite/dist/demo.js
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/helix/05-deploy/microsite/dist

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
