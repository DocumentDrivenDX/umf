name: Publish microsite

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/microsite.yml'
      - 'docs/helix/05-deploy/microsite/**'
      - 'docs/helix/05-deploy/schema-browser/**'
      - 'scripts/schema-browser-package-browser.ts'
      - 'scripts/schema-browser-embedding-browser.ts'
      - 'scripts/schema-browser-reproducibility.ts'
      - 'src/**'
      - 'spec/**'
      - 'scripts/artifact-collections-browser.ts'
      - 'scripts/build-medical-subpacks.ts'
      - 'scripts/domain-pack-family.ts'
      - 'scripts/export-domain-family.ts'
      - 'scripts/export-domain-pack.ts'
      - 'scripts/loaders/**'
      - 'scripts/build-domain-pack-loaders.ts'
      - 'scripts/build-domain-pack-releases.ts'
      - 'docs/helix/05-deploy/domain-pack-loaders.md'
      - 'docs/helix/05-deploy/document-preservation.md'
      - 'docs/helix/05-deploy/document-research.md'
      - 'docs/helix/04-build/evidence/supreme-court-*'
      - 'docs/helix/04-build/evidence/public-company-live-qualification.*'
      - 'scripts/build-document-research-release.py'
      - 'scripts/domain-packs/supreme-court-*.py'
      - 'scripts/domain-packs/qualify-sec-acquisition.py'
      - 'scripts/qualification/**'
      - 'scripts/domain-packs/ontology.ts'
      - 'tests/domain-packs/**'
      - 'patches/**'
      - 'package.json'
      - 'bun.lock'
      - '.innsigle/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/microsite.yml'
      - 'docs/helix/05-deploy/microsite/**'
      - 'docs/helix/05-deploy/schema-browser/**'
      - 'scripts/schema-browser-package-browser.ts'
      - 'scripts/schema-browser-embedding-browser.ts'
      - 'scripts/schema-browser-reproducibility.ts'
      - 'src/**'
      - 'spec/**'
      - 'scripts/artifact-collections-browser.ts'
      - 'scripts/build-medical-subpacks.ts'
      - 'scripts/domain-pack-family.ts'
      - 'scripts/export-domain-family.ts'
      - 'scripts/export-domain-pack.ts'
      - 'scripts/loaders/**'
      - 'scripts/build-domain-pack-loaders.ts'
      - 'scripts/build-domain-pack-releases.ts'
      - 'docs/helix/05-deploy/domain-pack-loaders.md'
      - 'docs/helix/05-deploy/document-preservation.md'
      - 'docs/helix/05-deploy/document-research.md'
      - 'docs/helix/04-build/evidence/supreme-court-*'
      - 'docs/helix/04-build/evidence/public-company-live-qualification.*'
      - 'scripts/build-document-research-release.py'
      - 'scripts/domain-packs/supreme-court-*.py'
      - 'scripts/domain-packs/qualify-sec-acquisition.py'
      - 'scripts/qualification/**'
      - 'scripts/domain-packs/ontology.ts'
      - 'tests/domain-packs/**'
      - 'patches/**'
      - 'package.json'
      - 'bun.lock'
      - '.innsigle/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microsite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify reproducible schema-browser producer
        run: bun scripts/schema-browser-reproducibility.ts
      - name: Verify medical family artifacts
        run: |
          bun scripts/build-medical-subpacks.ts --check
          bun test tests/domain-packs
      - name: Verify and package loader companions
        run: bun scripts/build-domain-pack-loaders.ts --check --site
      - name: Publish individual document research tools and evidence
        run: python3 scripts/build-document-research-release.py
      - name: Build browser playground
        run: bun build docs/helix/05-deploy/microsite/demo.ts --target browser --minify --outfile docs/helix/05-deploy/microsite/dist/demo.js
      - name: Build schema explorer and domain-pack catalog
        run: bun docs/helix/05-deploy/microsite/build-explorer.ts
      - name: Install pinned released schema browser assets
        run: bun docs/helix/05-deploy/schema-browser/publish-site.ts
      - name: Install browser qualification runtime
        run: bun x playwright install --with-deps chromium
      - name: Qualify reusable browser package
        run: bun scripts/schema-browser-package-browser.ts
      - name: Qualify strict-CSP schema browser embedding
        run: bun scripts/schema-browser-embedding-browser.ts
      - name: Qualify artifact collection browser
        run: bun scripts/artifact-collections-browser.ts
      - name: Verify tools-only distribution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          archives = list(Path('docs/helix/05-deploy/microsite/dist').rglob('*.zip'))
          if archives:
              raise SystemExit('Generated ZIPs must remain consumer-local: ' + str(archives))
          PY
      - name: Get Innsigle verifier
        uses: actions/checkout@v4
        with:
          repository: DocumentDrivenDX/innsigle
          ref: 4185eb56beb7b52beaa4a00c2fc897f93d44b939
          path: .tools/innsigle
      - name: Verify page signatures
        run: node .tools/innsigle/src/cli.mjs verify --all
      - name: Include public keys and attestations
        run: node .tools/innsigle/src/cli.mjs publish docs/helix/05-deploy/microsite/dist
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/helix/05-deploy/microsite/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
