name: Publish microsite

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/microsite.yml'
      - 'docs/helix/05-deploy/microsite/**'
      - 'docs/helix/04-build/guides/actions/**'
      - 'docs/helix/02-design/contracts/**'
      - 'docs/helix/04-build/evidence/actions-documentation*'
      - 'docs/helix/04-build/evidence/actions-certification*'
      - 'fixtures/actions/**'
      - 'scripts/actions-docs/**'
      - 'src/**'
      - 'native/tablespec/relationship-runtime/domain-base-types.json'
      - 'native/tablespec/sources/src/tablespec/schemas/umf.schema.json'
      - 'spec/**'
      - 'scripts/build-medical-subpacks.ts'
      - 'scripts/domain-pack-family.ts'
      - 'scripts/export-domain-family.ts'
      - 'scripts/export-domain-pack.ts'
      - 'scripts/domain-packs/ontology.ts'
      - 'tests/domain-packs/**'
      - 'patches/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.innsigle/**'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/microsite.yml'
      - 'docs/helix/05-deploy/microsite/**'
      - 'docs/helix/04-build/guides/actions/**'
      - 'docs/helix/02-design/contracts/**'
      - 'docs/helix/04-build/evidence/actions-documentation*'
      - 'docs/helix/04-build/evidence/actions-certification*'
      - 'fixtures/actions/**'
      - 'scripts/actions-docs/**'
      - 'src/**'
      - 'native/tablespec/relationship-runtime/domain-base-types.json'
      - 'native/tablespec/sources/src/tablespec/schemas/umf.schema.json'
      - 'spec/**'
      - 'scripts/build-medical-subpacks.ts'
      - 'scripts/domain-pack-family.ts'
      - 'scripts/export-domain-family.ts'
      - 'scripts/export-domain-pack.ts'
      - 'scripts/domain-packs/ontology.ts'
      - 'tests/domain-packs/**'
      - 'patches/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.innsigle/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microsite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify medical family artifacts
        run: |
          bun scripts/build-medical-subpacks.ts --check
          bun test tests/domain-packs
      - name: Build browser playground
        run: bun build docs/helix/05-deploy/microsite/demo.ts --target browser --minify --outfile docs/helix/05-deploy/microsite/dist/demo.js
      - name: Build schema explorer and domain-pack catalog
        run: bun docs/helix/05-deploy/microsite/build-explorer.ts
      - name: Check action guide generation and examples
        run: |
          bun run test:docs:build
          bun run test:docs:examples
          bun run test:docs:browser
      - name: Get Innsigle verifier
        uses: actions/checkout@v4
        with:
          repository: DocumentDrivenDX/innsigle
          ref: 4185eb56beb7b52beaa4a00c2fc897f93d44b939
          path: .tools/innsigle
      - name: Verify page signatures
        run: node .tools/innsigle/src/cli.mjs verify --all
      - name: Include public keys and attestations
        run: node .tools/innsigle/src/cli.mjs publish docs/helix/05-deploy/microsite/dist
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/helix/05-deploy/microsite/dist

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
