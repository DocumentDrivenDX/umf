name: Publish microsite

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microsite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Remove retired pre-0.10 local-mutation demo artifacts
        run: |
          rm -rf docs/helix/05-deploy/microsite/dist/action-compiler docs/helix/05-deploy/microsite/dist/truss-browser
          rm -f docs/helix/05-deploy/microsite/dist/action-compiler.html docs/helix/05-deploy/microsite/dist/action-compiler.js docs/helix/05-deploy/microsite/dist/truss-catalog-worker.js
      - name: Reject orphan public page claims before building
        run: bun scripts/generated-page-seals.ts --inventory
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      - name: Fetch locked native compiler dependencies
        run: cargo fetch --locked
      - name: Verify generated metamodel authority and retirement boundaries
        run: |
          bun run check:metamodel
          bun run check:core-authority
          bun test tests/metamodel
      - name: Select immutable schema browser producer runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Check out immutable schema browser producer source
        uses: actions/checkout@v4
        with:
          ref: c4ad0e8a83816e5ea4003dab09e781ab92c91dcb
          path: .tools/schema-browser-producer
      - name: Install immutable producer dependencies
        working-directory: .tools/schema-browser-producer
        run: bun install --frozen-lockfile
      - name: Install pinned WASM binding generator
        run: cargo install wasm-bindgen-cli --locked --version 0.2.100
      - name: Verify candidate reproducibility and immutable released producer
        run: bun scripts/schema-browser-reproducibility.ts --producer-source .tools/schema-browser-producer
      - name: Restore action build runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Verify medical family artifacts
        run: |
          bun scripts/build-medical-subpacks.ts --check
          bun test tests/domain-packs
      - name: Select immutable loader companion runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify and package loader companions
        run: bun scripts/build-domain-pack-loaders.ts --check --site
      - name: Restore action qualification runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Publish individual document research tools and evidence
        run: python3 scripts/build-document-research-release.py
      - name: Build browser playground
        run: bun build docs/helix/05-deploy/microsite/demo.ts --target browser --minify --outfile docs/helix/05-deploy/microsite/dist/demo.js
      - name: Build schema explorer and domain-pack catalog
        run: bun docs/helix/05-deploy/microsite/build-explorer.ts
      - name: Install pinned released schema browser assets
        run: bun docs/helix/05-deploy/schema-browser/publish-site.ts
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Build pinned optional Protobuf compiler
        run: bun scripts/build-protobuf.ts
      - name: Build generated reference and fixed browser tools
        run: bun run build:reference
      - name: Check generated reference and module boundaries
        run: |
          bun run check:reference-boundaries
          bun run test:reference
      - name: Install browser qualification runtime
        run: bun x playwright install --with-deps chromium
      - name: Qualify generated validators in strict-CSP Chromium
        run: bun scripts/metamodel-browser.ts
      - name: Qualify reference completeness and desktop/mobile presentation
        run: bun run test:reference:browser
      - name: Qualify reusable browser package
        run: bun scripts/schema-browser-package-browser.ts
      - name: Qualify strict-CSP schema browser embedding
        run: bun scripts/schema-browser-embedding-browser.ts
      - name: Qualify artifact collection browser
        run: bun scripts/artifact-collections-browser.ts
      - name: Build action guides from the actual checkout
        run: bun run build:docs
      - name: Check action guide generation and examples
        run: |
          bun run test:docs:build
          bun run test:docs:examples
          bun run test:docs:browser
      - name: Verify tools-only distribution
        run: |
          bun scripts/check-core-authority.ts --distribution docs/helix/05-deploy/microsite/dist
          python3 - <<'PY'
          from pathlib import Path
          archives = list(Path('docs/helix/05-deploy/microsite/dist').rglob('*.zip'))
          if archives:
              raise SystemExit('Generated ZIPs must remain consumer-local: ' + str(archives))
          PY
      - name: Get Innsigle verifier
        uses: actions/checkout@v4
        with:
          repository: DocumentDrivenDX/innsigle
          ref: 4185eb56beb7b52beaa4a00c2fc897f93d44b939
          path: .tools/innsigle
      - name: Retain generated reference and visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: generated-reference
          path: |
            docs/helix/05-deploy/microsite/dist/reference
            docs/helix/04-build/evidence/generated-reference
      - name: Retain exact generated guides
        uses: actions/upload-artifact@v4
        with:
          name: generated-action-guides
          path: docs/helix/05-deploy/microsite/dist/actions
      - name: Test automated site signing policy
        run: bun test tests/generated-page-seals.test.ts
      - name: Check complete site signing inventory
        run: bun scripts/generated-page-seals.ts --inventory
      - name: Seal all site pages with the build key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          INNSIGLE_BUILD_KEY: ${{ secrets.INNSIGLE_BUILD_KEY }}
        run: bun scripts/generated-page-seals.ts --seal
      - name: Verify page signatures and signer roles
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          bun scripts/generated-page-seals.ts --check
          node .tools/innsigle/src/cli.mjs verify --all
      - name: Include public keys and attestations
        run: node .tools/innsigle/src/cli.mjs publish docs/helix/05-deploy/microsite/dist
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/helix/05-deploy/microsite/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
