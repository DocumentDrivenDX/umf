name: Private C7 installed constructor observation only
on:
  workflow_dispatch:
    inputs:
      admitted:
        type: boolean
        default: false
        description: Sol-reviewed exact Q and original C7 materials; never qualification
      controller_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: private-inspector-retained-feasibility
  cancel-in-progress: false
jobs:
  observation:
    if: github.event_name == 'workflow_dispatch' && inputs.admitted == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_CONTROLLER: ${{ inputs.controller_sha }}
      ORIGINAL_OWNER: 345f3f75ca85eac242d2c09dd1035de0e2d43223
      INSPECTOR_INPUT_PROFILE: installed-canonical/1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
          architecture: x64
      - name: Authenticate original C7 producer and all three immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = DocumentDrivenDX/umf
          test "$GITHUB_REPOSITORY_ID" = 1382276802
          test "$GITHUB_REPOSITORY_OWNER_ID" = 273466046
          test "$GITHUB_REF_TYPE" = branch
          test "$EXPECTED_CONTROLLER" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER"
          out="$RUNNER_TEMP/c7-installed-observation"
          owner="$RUNNER_TEMP/c7-installed-runtime"
          test ! -e "$out"
          test ! -e "$owner"
          mkdir "$out"
          printf 'OBS_OUT=%s\nOWNER_CHECKOUT=%s\n' "$out" "$owner" >> "$GITHUB_ENV"
          git worktree add --detach "$owner" "$ORIGINAL_OWNER"
          python -I -B tools/intake_inspector_installed_observation.py intake \
            --controller "$GITHUB_WORKSPACE" --owner "$owner" --out "$out" \
            --controller-sha "$EXPECTED_CONTROLLER" --observer-run "$GITHUB_RUN_ID" --observer-attempt "$GITHUB_RUN_ATTEMPT"
          printf 'RETAINED_WHEEL=%s\n' "$(python -I -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["wheelPath"])' "$out/intake.json")" >> "$GITHUB_ENV"
      - name: Fresh normal resolver install without bytecode or dependency suppression
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$OBS_OUT/consumer"
          env -u GH_TOKEN -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            "$OBS_OUT/consumer/bin/python" -m pip --isolated install --no-cache-dir --no-compile \
            --index-url https://pypi.org/simple --report "$OBS_OUT/install-report.json" \
            --constraint "$OBS_OUT/dependency-constraints.txt" "$RETAINED_WHEEL" 'pytest==8.4.2' 'pydantic==2.14.2' \
            2>&1 | tee "$OBS_OUT/install.log"
          "$OBS_OUT/consumer/bin/python" -m pip --isolated check | tee "$OBS_OUT/pip-check.log"
          "$OBS_OUT/consumer/bin/python" -m pip --isolated freeze --all > "$OBS_OUT/freeze.txt"
      - name: Exactly one unchanged1M installed constructor with fresh pre and finally post identity
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            "$OBS_OUT/consumer/bin/python" -I -B tools/probe_inspector_installed_constructor_observation.py \
            --controller "$GITHUB_WORKSPACE" --owner "$OWNER_CHECKOUT" --wheel "$RETAINED_WHEEL" --out "$OBS_OUT" \
            --controller-sha "$EXPECTED_CONTROLLER" --observer-run "$GITHUB_RUN_ID" --observer-attempt "$GITHUB_RUN_ATTEMPT" \
            2>&1 | tee "$OBS_OUT/observation.log"
      - name: Seal bounded original and partial observation receipts
        if: always()
        id: retention
        shell: bash
        run: |
          set -euo pipefail
          python -I -B tools/intake_inspector_installed_observation.py seal --controller "$GITHUB_WORKSPACE" \
            --owner "$RUNNER_TEMP/c7-installed-runtime" --out "$RUNNER_TEMP/c7-installed-observation" \
            --controller-sha "$EXPECTED_CONTROLLER" --observer-run "$GITHUB_RUN_ID" --observer-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain only bounded new observation outputs without relabelling original archives
        if: always() && steps.retention.outputs.bounded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: private-c7-installed-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c7-installed-observation/*.json
            ${{ runner.temp }}/c7-installed-observation/*.log
            ${{ runner.temp }}/c7-installed-observation/*.txt
            ${{ runner.temp }}/c7-installed-observation/materials/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Dispose only the new consumer and detached C7 runtime checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -I -B tools/intake_inspector_installed_observation.py cleanup --controller "$GITHUB_WORKSPACE" \
            --owner "$RUNNER_TEMP/c7-installed-runtime" --out "$RUNNER_TEMP/c7-installed-observation" \
            --controller-sha "$EXPECTED_CONTROLLER" --observer-run "$GITHUB_RUN_ID" --observer-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain owned cleanup observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-c7-installed-observation-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c7-installed-observation/cleanup.json
          if-no-files-found: error
          retention-days: 90
