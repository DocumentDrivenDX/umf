name: Private C8/C1 installed constructor observation only
on:
  workflow_dispatch:
    inputs:
      admitted:
        type: boolean
        default: false
        description: Sol-reviewed exact Q and original C8 materials; never qualification
      controller_sha:
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: private-inspector-retained-feasibility
  cancel-in-progress: false
jobs:
  observation:
    if: github.event_name == 'workflow_dispatch' && inputs.admitted == true && github.ref != 'refs/heads/codex/c1-8m-retained-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_CONTROLLER: ${{ inputs.controller_sha }}
      ORIGINAL_OWNER: ${{ github.ref == 'refs/heads/codex/c1-01011-cost-observation' && '7d17f1c50ff79006b1e1a8f5138c5d552c7fc94f' || '67b6dbae9d969f8c7e5eb955e97a312be5f45787' }}
      CANDIDATE_01011: ${{ github.ref == 'refs/heads/codex/c1-01011-cost-observation' }}
      INSPECTOR_INPUT_PROFILE: installed-canonical/1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
          architecture: x64
      - name: Authenticate original C8 producer and all three immutable artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = DocumentDrivenDX/umf
          test "$GITHUB_REPOSITORY_ID" = 1382276802
          test "$GITHUB_REPOSITORY_OWNER_ID" = 273466046
          test "$GITHUB_REF_TYPE" = branch
          test "$EXPECTED_CONTROLLER" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER"
          if [[ "$CANDIDATE_01011" == true ]]; then route=c1-cost-observation; owner_name=c1-cost-owner; else route=c8-installed-observation; owner_name=c8-installed-runtime; fi
          out="$RUNNER_TEMP/$route"
          owner="$RUNNER_TEMP/$owner_name"
          test ! -e "$out"
          test ! -e "$owner"
          mkdir "$out"
          printf 'OBS_OUT=%s\nOWNER_CHECKOUT=%s\n' "$out" "$owner" >> "$GITHUB_ENV"
          git worktree add --detach "$owner" "$ORIGINAL_OWNER"
          if [[ "$CANDIDATE_01011" == true ]]; then intake=tools/intake_inspector_c1_cost_observation.py; else intake=tools/intake_inspector_installed_observation.py; fi
          python -I -B "$intake" intake \
            --controller "$GITHUB_WORKSPACE" --owner "$owner" --out "$out" \
            --controller-sha "$EXPECTED_CONTROLLER" --observer-run "$GITHUB_RUN_ID" --observer-attempt "$GITHUB_RUN_ATTEMPT"
          printf 'OBS_ROUTE=%s\nOWNER_CHECKOUT=%s\n' "$route" "$owner" >> "$GITHUB_ENV"
          printf 'RETAINED_WHEEL=%s\n' "$(python -I -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["wheelPath"])' "$out/intake.json")" >> "$GITHUB_ENV"
      - name: Fresh normal resolver install without bytecode or dependency suppression
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$OBS_OUT/consumer"
          env -u GH_TOKEN -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            "$OBS_OUT/consumer/bin/python" -m pip --isolated install --no-cache-dir --no-compile \
            --index-url https://pypi.org/simple --report "$OBS_OUT/install-report.json" \
            --constraint "$OBS_OUT/dependency-constraints.txt" "$RETAINED_WHEEL" 'pytest==8.4.2' 'pydantic==2.14.2' \
            2>&1 | tee "$OBS_OUT/install.log"
          "$OBS_OUT/consumer/bin/python" -m pip --isolated check | tee "$OBS_OUT/pip-check.log"
          "$OBS_OUT/consumer/bin/python" -m pip --isolated freeze --all > "$OBS_OUT/freeze.txt"
      - name: Exactly one unchanged1M installed constructor with fresh pre and finally post identity
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CANDIDATE_01011" == true ]]; then probe=tools/probe_inspector_c1_cost_observation.py; else probe=tools/probe_inspector_installed_constructor_observation.py; fi
          env -u GH_TOKEN -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            "$OBS_OUT/consumer/bin/python" -I -B "$probe" \
            --controller "$GITHUB_WORKSPACE" --owner "$OWNER_CHECKOUT" --wheel "$RETAINED_WHEEL" --out "$OBS_OUT" \
            --controller-sha "$EXPECTED_CONTROLLER" --observer-run "$GITHUB_RUN_ID" --observer-attempt "$GITHUB_RUN_ATTEMPT" \
            2>&1 | tee "$OBS_OUT/observation.log"
      - name: Seal bounded original and partial observation receipts
        if: always()
        id: retention
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CANDIDATE_01011" == true ]]; then intake=tools/intake_inspector_c1_cost_observation.py; owner_name=c1-cost-owner; out_name=c1-cost-observation; else intake=tools/intake_inspector_installed_observation.py; owner_name=c8-installed-runtime; out_name=c8-installed-observation; fi
          python -I -B "$intake" seal --controller "$GITHUB_WORKSPACE" \
            --owner "$RUNNER_TEMP/$owner_name" --out "$RUNNER_TEMP/$out_name" \
            --controller-sha "$EXPECTED_CONTROLLER" --observer-run "$GITHUB_RUN_ID" --observer-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain only bounded new observation outputs without relabelling original archives
        if: always() && steps.retention.outputs.bounded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: private-${{ github.ref == 'refs/heads/codex/c1-01011-cost-observation' && 'c1-cost-observation' || 'c8-installed-observation' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ github.ref == 'refs/heads/codex/c1-01011-cost-observation' && 'c1-cost-observation' || 'c8-installed-observation' }}/*.json
            ${{ runner.temp }}/${{ github.ref == 'refs/heads/codex/c1-01011-cost-observation' && 'c1-cost-observation' || 'c8-installed-observation' }}/*.log
            ${{ runner.temp }}/${{ github.ref == 'refs/heads/codex/c1-01011-cost-observation' && 'c1-cost-observation' || 'c8-installed-observation' }}/*.txt
            ${{ runner.temp }}/${{ github.ref == 'refs/heads/codex/c1-01011-cost-observation' && 'c1-cost-observation' || 'c8-installed-observation' }}/materials/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Dispose only the new consumer and detached C8 runtime checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CANDIDATE_01011" == true ]]; then intake=tools/intake_inspector_c1_cost_observation.py; owner_name=c1-cost-owner; out_name=c1-cost-observation; else intake=tools/intake_inspector_installed_observation.py; owner_name=c8-installed-runtime; out_name=c8-installed-observation; fi
          python -I -B "$intake" cleanup --controller "$GITHUB_WORKSPACE" \
            --owner "$RUNNER_TEMP/$owner_name" --out "$RUNNER_TEMP/$out_name" \
            --controller-sha "$EXPECTED_CONTROLLER" --observer-run "$GITHUB_RUN_ID" --observer-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain owned cleanup observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-${{ github.ref == 'refs/heads/codex/c1-01011-cost-observation' && 'c1-cost-observation' || 'c8-installed-observation' }}-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ github.ref == 'refs/heads/codex/c1-01011-cost-observation' && 'c1-cost-observation' || 'c8-installed-observation' }}/cleanup.json
          if-no-files-found: error
          retention-days: 90
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.admitted == true && github.ref == 'refs/heads/codex/c1-8m-retained-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_CONTROLLER: ${{ inputs.controller_sha }}
      ORIGINAL_OWNER: 2f0fb762c6b0dc51acfe4893c445648d074abadc
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
          architecture: x64
      - name: Authenticate retained run materials and exact C1 wheel without building
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = DocumentDrivenDX/umf
          test "$GITHUB_REF" = refs/heads/codex/c1-8m-retained-diagnostic
          test "$EXPECTED_CONTROLLER" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER"
          out="$RUNNER_TEMP/c1-8m-diagnostic"
          owner="$RUNNER_TEMP/c1-8m-owner"
          test ! -e "$out" && test ! -e "$owner"
          mkdir "$out"
          printf 'OBS_OUT=%s\nOWNER_CHECKOUT=%s\n' "$out" "$owner" >> "$GITHUB_ENV"
          git worktree add --detach "$owner" "$ORIGINAL_OWNER"
          python -I -B tools/intake_inspector_c1_8m_diagnostic.py intake \
            --controller "$GITHUB_WORKSPACE" --owner "$owner" --out "$out" \
            --controller-sha "$EXPECTED_CONTROLLER" --observer-run "$GITHUB_RUN_ID" --observer-attempt "$GITHUB_RUN_ATTEMPT"
          printf 'RETAINED_WHEEL=%s\n' "$(python -I -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["wheelPath"])' "$out/intake.json")" >> "$GITHUB_ENV"
      - name: Fresh normal resolver install of the exact retained wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$OBS_OUT/consumer"
          env -u GH_TOKEN -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            "$OBS_OUT/consumer/bin/python" -m pip --isolated install --no-cache-dir --no-compile \
            --index-url https://pypi.org/simple --report "$OBS_OUT/install-report.json" \
            --constraint "$OBS_OUT/dependency-constraints.txt" "$RETAINED_WHEEL" 'pytest==8.4.2' 'pydantic==2.14.2' \
            2>&1 | tee "$OBS_OUT/install.log"
          "$OBS_OUT/consumer/bin/python" -m pip --isolated check | tee "$OBS_OUT/pip-check.log"
          "$OBS_OUT/consumer/bin/python" -m pip --isolated freeze --all > "$OBS_OUT/freeze.txt"
      - name: One cold 8M installed constructor with independent callback totals and byte identity
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          env -u GH_TOKEN -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            "$OBS_OUT/consumer/bin/python" -I -B tools/probe_inspector_c1_8m_diagnostic.py \
            --controller "$GITHUB_WORKSPACE" --owner "$OWNER_CHECKOUT" --wheel "$RETAINED_WHEEL" --out "$OBS_OUT" \
            --controller-sha "$EXPECTED_CONTROLLER" --observer-run "$GITHUB_RUN_ID" --observer-attempt "$GITHUB_RUN_ATTEMPT" \
            2>&1 | tee "$OBS_OUT/observation.log"
      - name: Seal bounded diagnostic receipts
        if: always()
        id: retention
        shell: bash
        run: |
          set -euo pipefail
          python -I -B tools/intake_inspector_c1_8m_diagnostic.py seal --controller "$GITHUB_WORKSPACE" \
            --owner "$OWNER_CHECKOUT" --out "$OBS_OUT" --controller-sha "$EXPECTED_CONTROLLER" \
            --observer-run "$GITHUB_RUN_ID" --observer-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain bounded diagnostic receipts
        if: always() && steps.retention.outputs.bounded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: private-c1-8m-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/c1-8m-diagnostic/*.json
            ${{ runner.temp }}/c1-8m-diagnostic/*.log
            ${{ runner.temp }}/c1-8m-diagnostic/*.txt
            ${{ runner.temp }}/c1-8m-diagnostic/materials/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Dispose only this consumer and exact-source worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -I -B tools/intake_inspector_c1_8m_diagnostic.py cleanup --controller "$GITHUB_WORKSPACE" \
            --owner "$OWNER_CHECKOUT" --out "$OBS_OUT" --controller-sha "$EXPECTED_CONTROLLER" \
            --observer-run "$GITHUB_RUN_ID" --observer-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Retain owned cleanup receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-c1-8m-diagnostic-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c1-8m-diagnostic/cleanup.json
          if-no-files-found: error
          retention-days: 90
