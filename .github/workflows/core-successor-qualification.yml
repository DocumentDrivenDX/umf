          "run": "set -euo pipefail\nif [ -d \"$RUNNER_TEMP/successor-proof\" ]; then\n  \"$PY\" -I -B authority/tools/qualify_core_successor.py cleanup --root authority --output \"$RUNNER_TEMP/successor-proof\"\nfi"
        },
        {
          "name": "Retain cleanup outcome separately",
          "if": "always()",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "core-successor-macos-cleanup-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/successor-proof/cleanup.json",
            "if-no-files-found": "warn",
            "retention-days": 90
          }
        }
      ]
    }
  },
  "run-name": "core-successor:${{ inputs.admission_id }}:${{ inputs.platform }}"
}
