{
  "name": "Closed Core successor candidate qualification",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "admitted": {
          "type": "boolean",
          "default": false,
          "description": "Explicit reviewed protocol-2 component admission; empty registry refuses; no coupled/release qualification"
        },
        "admission_id": {
          "type": "string",
          "required": true
        },
        "controller_sha": {
          "type": "string",
          "required": true
        },
        "platform": {
          "type": "choice",
          "required": true,
          "options": [
            "none",
            "linux-x86_64",
            "macos-arm64"
          ],
          "default": "none"
        },
        "operation": {
          "type": "choice",
          "options": [
            "run",
            "aggregate"
          ],
          "default": "run",
          "description": "Registered component production or distinct material-readiness aggregate; neither publishes"
        }
      }
    }
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "core-successor-${{ inputs.admission_id }}-${{ inputs.platform }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "linux": {
      "if": "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.admitted == true && inputs.platform == 'linux-x86_64'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 90,
      "env": {
        "CARGO_BUILD_JOBS": "1",
        "NUM_JOBS": "1",
        "CMAKE_BUILD_PARALLEL_LEVEL": "1",
        "PYTHONDONTWRITEBYTECODE": "1",
        "SUCCESSOR_ADMITTED": "${{ inputs.admitted }}",
        "SUCCESSOR_ID": "${{ inputs.admission_id }}",
        "SUCCESSOR_PLATFORM": "linux-x86_64",
        "SUCCESSOR_JOB_NAME": "linux",
        "GH_TOKEN": "${{ github.token }}",
        "SUCCESSOR_OPERATION": "${{ inputs.operation }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "${{ github.workflow_sha }}",
            "path": "authority",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "${{ inputs.controller_sha }}",
            "path": "controller",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11.17"
          }
        },
        {
          "name": "Select controller Python without touching credentials",
          "shell": "bash",
          "run": "set -euo pipefail\necho \"PY=$(command -v python)\" >> \"$GITHUB_ENV\""
        },
        {
          "name": "Authenticate main registry before producer setup",
          "id": "binding",
          "shell": "bash",
          "run": "set -euo pipefail\n\"$PY\" -I -B authority/tools/qualify_core_successor.py authorize --root authority --controller controller --id \"$SUCCESSOR_ID\" --platform \"$SUCCESSOR_PLATFORM\" --output \"$RUNNER_TEMP/successor-proof\""
        },
        {
          "uses": "astral-sh/setup-uv@v6",
          "with": {
            "version": "0.13.3"
          },
          "if": "inputs.operation == 'run'"
        },
        {
          "uses": "actions/checkout@v6",
          "with": {
            "ref": "${{ steps.binding.outputs.source }}",
            "path": "source",
            "persist-credentials": false
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@stable",
          "with": {
            "toolchain": "1.90.0",
            "targets": "wasm32-unknown-unknown"
          },
          "if": "inputs.operation == 'run'"
        },
        {
          "uses": "oven-sh/setup-bun@v2",
          "with": {
            "bun-version": "1.4.3"
          },
          "if": "inputs.operation == 'run'"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "26.12.0"
          },
          "if": "inputs.operation == 'run'"
        },
        {
          "name": "Execute only the registered candidate recipe",
          "shell": "bash",
          "run": "set -euo pipefail\n\"$PY\" -I -B authority/tools/qualify_core_successor.py \"$SUCCESSOR_OPERATION\" --root authority --controller controller --source source --id \"$SUCCESSOR_ID\" --platform \"$SUCCESSOR_PLATFORM\" --output \"$RUNNER_TEMP/successor-proof\"",
          "env": {
            "SUCCESSOR_OPERATION": "${{ inputs.operation }}"
          }
        },
        {
          "name": "Seal final byte-bounded evidence including receipts",
          "id": "retention",
          "if": "always()",
          "shell": "bash",
          "run": "set -euo pipefail\n\"$PY\" -I -B authority/tools/qualify_core_successor.py seal --root authority --output \"$RUNNER_TEMP/successor-proof\""
        },
        {
          "name": "Retain sanitized failures and original component custody",
          "if": "always() && steps.retention.outputs.bounded == 'true'",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "core-successor-linux-${{ github.run_id }}-${{ github.run_attempt }}${{ steps.retention.outputs.multipart == 'true' && '-proof' || '' }}",
            "path": "${{ runner.temp }}/successor-proof/retained/",
            "if-no-files-found": "warn",
            "retention-days": 90,
            "compression-level": "${{ fromJSON(steps.retention.outputs.multipart == 'true' && '0' || '6') }}"
          }
        },
        {
          "name": "Retain sanitized failures and original component custody / part-000",
          "if": "always() && steps.retention.outputs.bounded == 'true' && steps.retention.outputs.multipart == 'true' && steps.retention.outputs.part_000 == 'true'",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "core-successor-linux-${{ github.run_id }}-${{ github.run_attempt }}-part-000",
            "path": "${{ runner.temp }}/successor-proof/multipart-payloads/000/payload.bin",
            "if-no-files-found": "error",
            "compression-level": 0,
            "retention-days": 90
          }
        },
        {
          "name": "Retain sanitized failures and original component custody / part-001",
