# SPDX-License-Identifier: MIT OR Apache-2.0
name: G02 and G03 selected native qualification

on:
  push:
    branches:
      - codex/migration-g02-g03-native-qualification

permissions:
  contents: read

jobs:
  selected-native:
    name: Bounded UMF and Weft PostgreSQL 18.6 qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Start the original monotonic deadline and fresh failure receipt
        if: always()
        timeout-minutes: 1
        env:
          QUALIFICATION_DIR: ${{ runner.temp }}/umf-g02-g03-native-qualification
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          mkdir -p "$QUALIFICATION_DIR/logs" "$QUALIFICATION_DIR/reports"
          START_MS="$(awk '{printf "%d", $1 * 1000}' /proc/uptime)"
          DEADLINE_MS="$((START_MS + 1800000))"
          printf '%s\n' "$START_MS" > "$QUALIFICATION_DIR/monotonic-start-ms"
          printf '%s\n' "$DEADLINE_MS" > "$QUALIFICATION_DIR/monotonic-deadline-ms"
          cat > "$QUALIFICATION_DIR/receipt.json" <<EOF
          {
            "profile": "umf.g02-g03-selected-native-qualification/1",
            "status": "FAIL_OR_UNKNOWN",
            "reason": "The workflow did not reach its passing finalizer.",
            "sourceCommit": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "ref": "${GITHUB_REF}",
            "workflow": "${GITHUB_WORKFLOW}",
            "selectedScopeOnly": true,
            "fullG03Campaign": "OPEN"
          }
          EOF

      - uses: actions/checkout@v4
        timeout-minutes: 2

      - uses: oven-sh/setup-bun@v2
        timeout-minutes: 2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-python@v5
        timeout-minutes: 2
        with:
          python-version: '3.11'

      - name: Check source freeze and run the bounded selected cohort
        env:
          QUALIFICATION_DIR: ${{ runner.temp }}/umf-g02-g03-native-qualification
          QUALIFICATION_STAGE_DIR: ${{ runner.temp }}/umf-g02-g03-native-qualification-upload
          PG_DSN: host=127.0.0.1 port=5432 dbname=postgres user=postgres application_name=umf_g02_g03_native_gate connect_timeout=5 options='-c statement_timeout=120000 -c lock_timeout=5000'
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          START_MS="$(cat "$QUALIFICATION_DIR/monotonic-start-ms")"
          DEADLINE_MS="$(cat "$QUALIFICATION_DIR/monotonic-deadline-ms")"
          NOW_MS="$(awk '{printf "%d", $1 * 1000}' /proc/uptime)"
          REMAINING_SECONDS="$(((DEADLINE_MS - NOW_MS - 60000) / 1000))"
          if (( REMAINING_SECONDS <= 0 )); then
            echo "Original 30-minute budget exhausted before qualification work." >&2
            exit 124
          fi
          timeout --signal=TERM --kill-after=10s "${REMAINING_SECONDS}s" bash -euo pipefail <<'BOUNDED_NATIVE_WORK'
          EVIDENCE="$QUALIFICATION_DIR"
          WORK="$RUNNER_TEMP/umf-g02-g03-native-work"
          mkdir -p "$WORK" "$WORK/mini-racer" "$WORK/builder-wheels" "$WORK/installed" "$EVIDENCE/logs" "$EVIDENCE/reports"

          run_bounded() {
            local name="$1" maximum="$2" now_ms deadline_ms remaining limit status capture_status log started_ms ended_ms log_bytes_before remaining_log_bytes
            local -a pipeline_status
            shift 2
            now_ms="$(awk '{printf "%d", $1 * 1000}' /proc/uptime)"
            deadline_ms="$(cat "$EVIDENCE/monotonic-deadline-ms")"
            remaining=$(((deadline_ms - now_ms - 60000) / 1000))
            if (( remaining <= 0 )); then
              echo "Aggregate work deadline exhausted before $name" >&2
              log="$EVIDENCE/logs/$name.log"
              printf '%s\n' "Original aggregate work deadline exhausted before $name" >"$log"
              ended_ms="$(awk '{printf "%d", $1 * 1000}' /proc/uptime)"
              python -I - "$EVIDENCE/command-records.jsonl" "$log" "$name" "$name" 124 0 "$((ended_ms - now_ms))" "$@" <<'PY'
          import hashlib, json, pathlib, sys
          records, log_path, name, stage, raw_exit, capture_exit, duration, *argv = sys.argv[1:]
          payload = pathlib.Path(log_path).read_bytes()
          record = {"name": name, "stage": stage, "argv": argv,
                    "rawExit": int(raw_exit), "monotonicDurationMs": int(duration),
                    "logBytes": len(payload), "logSha256": hashlib.sha256(payload).hexdigest(),
                    "captureExit": int(capture_exit), "truncated": False,
                    "truncationMarker": None}
          with pathlib.Path(records).open("a", encoding="utf-8") as stream:
              stream.write(json.dumps(record, sort_keys=True) + "\n")
          PY
              return 124
            fi
            limit="$maximum"
            if (( remaining < limit )); then limit="$remaining"; fi
            log="$EVIDENCE/logs/$name.log"
            log_bytes_before="$(find "$EVIDENCE/logs" -type f -name '*.log' -exec wc -c {} + | awk 'END {print $1+0}')"
            remaining_log_bytes=$((1048576 - log_bytes_before))
            if (( remaining_log_bytes < 0 )); then remaining_log_bytes=0; fi
            started_ms="$now_ms"
            : >"$log"
            set +e
            # Drain the full child stream while persisting no more than the
            # aggregate log budget remaining; never impose file limits on the child.
            timeout --signal=TERM --kill-after=10s "${limit}s" "$@" 2>&1 | python -I -c '
          import sys
          path, cap = sys.argv[1], int(sys.argv[2])
          marker = b"\n[LOG TRUNCATED: output exceeded aggregate capture cap]\n"
          failed = False
          truncated = False
          stored = 0
          try:
              output = open(path, "wb", buffering=0)
          except OSError:
              output = None
              failed = True
          while True:
              chunk = sys.stdin.buffer.read(65536)
              if not chunk:
                  break
              if output is None:
                  continue
              available = max(0, cap - stored)
              piece = chunk[:available]
              if piece:
                  try:
                      output.write(piece)
                      stored += len(piece)
                  except OSError:
                      failed = True
                      try:
                          output.close()
                      except OSError:
                          pass
                      output = None
              if len(chunk) > available:
                  truncated = True
          if output is not None:
              try:
                  if truncated:
                      marker_bytes = marker[:cap]
                      output.seek(max(0, cap - len(marker_bytes)))
                      output.truncate()
                      output.write(marker_bytes)
                  output.close()
              except OSError:
                  failed = True
          sys.exit(74 if failed else 75 if truncated else 0)
          ' "$log" "$remaining_log_bytes"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            status="${pipeline_status[0]}"
            capture_status="${pipeline_status[1]}"
            ended_ms="$(awk '{printf "%d", $1 * 1000}' /proc/uptime)"
            if (( status != 0 || capture_status != 0 )); then
              head -c 4096 "$log" >&2 || true
              echo "Command $name failed with command status $status, capture status $capture_status (limit ${limit}s)" >&2
            fi
            python -I - "$EVIDENCE/command-records.jsonl" "$log" "$name" "$name" "$status" "$capture_status" "$((ended_ms - started_ms))" "$@" <<'PY'
          import hashlib, json, pathlib, sys
          records, log_path, name, stage, raw_exit, capture_exit, duration, *argv = sys.argv[1:]
          payload = pathlib.Path(log_path).read_bytes()
          truncated = int(capture_exit) == 75
          record = {"name": name, "stage": stage, "argv": argv,
                    "rawExit": int(raw_exit), "monotonicDurationMs": int(duration),
                    "logBytes": len(payload), "logSha256": hashlib.sha256(payload).hexdigest(),
                    "captureExit": int(capture_exit), "truncated": truncated,
                    "truncationMarker": "LOG TRUNCATED: output exceeded aggregate capture cap" if truncated else None}
          with pathlib.Path(records).open("a", encoding="utf-8") as stream:
              stream.write(json.dumps(record, sort_keys=True) + "\n")
          PY
            local log_bytes
            log_bytes="$(find "$EVIDENCE/logs" -type f -name '*.log' -exec wc -c {} + | awk 'END {print $1+0}')"
            if (( log_bytes > 1048576 )); then
              echo "Captured command logs exceed the 1 MiB limit" >&2
              return 1
            fi
            if (( status != 0 )); then return "$status"; fi
            if (( capture_status != 0 )); then return 1; fi
          }

          run_bounded toolchain-identity 180 python -I - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          tools = {}
          for name in ("bun", "python", "git", "timeout"):
              path = shutil.which(name)
              resolved = pathlib.Path(path).resolve(strict=True)
              version = subprocess.run([path, "--version"], check=True, text=True,
                                       stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=10).stdout.strip()
              with resolved.open("rb") as binary:
                  binary_sha256 = hashlib.file_digest(binary, "sha256").hexdigest()
              tools[name] = {"path": str(resolved), "version": version,
                             "binarySha256": binary_sha256}
          print(json.dumps(tools, sort_keys=True))
          pathlib.Path(os.environ["QUALIFICATION_DIR"], "toolchain.json").write_text(
              json.dumps(tools, indent=2, sort_keys=True) + "\n")
          PY

          run_bounded source-pins 180 python -I - <<'PY'
          import hashlib, json, pathlib, subprocess

          manifest_path = pathlib.Path("docs/helix/04-build/evidence/mig-g02-g03/native-qualification-source-pins.json")
          pins = json.loads(manifest_path.read_text())
          expected_commit = __import__("os").environ["GITHUB_SHA"]
          actual_commit = subprocess.run(["git", "rev-parse", "HEAD"], check=True, text=True,
                                         capture_output=True).stdout.strip()
          assert actual_commit == expected_commit, (actual_commit, expected_commit)
          for name, entry in pins["sourcePins"].items():
              path = pathlib.Path(name)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == entry["sha256"], (name, digest, entry["sha256"])
          print(json.dumps({"sourceCommit": actual_commit, "sourcePins": len(pins["sourcePins"])}))
          PY
          run_bounded bun-install 180 bun install --frozen-lockfile --ignore-scripts
          run_bounded builder-wheel-download 180 python -m pip download --disable-pip-version-check \
            --no-deps --only-binary=:all: --require-hashes \
            --dest "$WORK/builder-wheels" \
            -r docs/helix/04-build/evidence/mig-g02-g03/build-tools-requirements.txt
          run_bounded builder-venv 180 python -m venv "$WORK/builder"
          run_bounded builder-install 180 "$WORK/builder/bin/python" -m pip --isolated install \
            --disable-pip-version-check --no-cache-dir --no-index --only-binary=:all: --no-deps \
            --find-links "$WORK/builder-wheels" --require-hashes \
            -r docs/helix/04-build/evidence/mig-g02-g03/build-tools-requirements.txt
          run_bounded mini-racer-download 180 python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: --dest "$WORK/mini-racer" mini-racer==0.14.1
          run_bounded mini-racer-verify 180 python -I tests/codegen/verify_mini_racer_wheel.py \
            --wheelhouse "$WORK/mini-racer" \
            --pins docs/helix/04-build/evidence/praxis-embedder/mini-racer-wheel-pins.json \
            --expected-platform linux-x86_64-glibc-2.27+
          run_bounded codegen-refresh 180 bun scripts/build-codegen.ts
          run_bounded codegen-refresh-hash-check 180 bun scripts/build-codegen.ts --check
          run_bounded codegen-refresh-output-hashes 180 python -I - <<'PY'
          import hashlib, json, os, pathlib

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          root = pathlib.Path.cwd()
          assets = root / "python/umf_codegen/src/umf_codegen/_assets"
          release_path = root / "python/umf_codegen/src/umf_codegen/_release.py"
          manifest_path = assets / "manifest.json"
          generator_manifest = json.loads(manifest_path.read_text())
          expected_inputs = ("scripts/build-codegen.ts", "scripts/codegen/gzip.ts")
          for name in expected_inputs:
              assert generator_manifest["inputs"][name] == sha(root / name), name
          generated = {name: digest for name, digest in generator_manifest["files"].items()}
          for name, digest in generated.items():
              assert sha(assets / name) == digest, name
          manifest_sha = sha(manifest_path)
          release_text = release_path.read_text()
          assert "MANIFEST_SHA256 = " + json.dumps(manifest_sha) in release_text
          pins = json.loads(pathlib.Path("docs/helix/04-build/evidence/mig-g02-g03/native-qualification-source-pins.json").read_text())
          output_prefixes = ("python/umf_codegen/src/umf_codegen/_release.py",
                             "python/umf_codegen/src/umf_codegen/_assets/")
          reviewed_prebuild = {name: item["sha256"] for name, item in pins["sourcePins"].items()
                               if name.startswith(output_prefixes)}
          report = {
              "profile": "umf.g02-g03-codegen-refresh/1",
              "status": "BUILT_THEN_HASH_CHECKED",
              "buildScriptSha256": sha(root / "scripts/build-codegen.ts"),
              "generatorManifestSha256": manifest_sha,
              "releaseModuleSha256": sha(release_path),
              "reviewedPrebuildOutputPins": reviewed_prebuild,
              "postBuildAssetHashes": generated,
              "postBuildInputHashes": generator_manifest["inputs"],
          }
          pathlib.Path(os.environ["QUALIFICATION_DIR"], "reports", "codegen-generated-outputs.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps({"status": report["status"], "generatedAssets": len(generated),
                            "generatorManifestSha256": manifest_sha}, sort_keys=True))
          PY
          run_bounded cohort-build 480 "$WORK/builder/bin/python" tests/codegen/acquire_offline_cohort.py \
            --output-dir "$WORK/cohort" \
            --source-commit "$GITHUB_SHA" \
            --expected-os ubuntu-24.04 \
            --expected-architecture x86_64 \
            --expected-python 3.11 \
            --weft-wheel-url "https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.55/umf_weft-0.4.55-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" \
            --weft-wheel-filename 'umf_weft-0.4.55-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl' \
            --weft-wheel-sha256 "b34ca17fa37412afa7b8e8bd86aac8ee67a3c895a9b253221e1d582b39073a85" \
            --mini-racer-wheel "$WORK/mini-racer"/*.whl
          run_bounded current-codegen-corpus 180 bun scripts/codegen-corpus.ts /tmp/g02-g03-current-codegen-corpus.json
          run_bounded offline-cohort-probe 180 python -I tests/codegen/offline_mirror_probe.py \
            --wheelhouse "$WORK/cohort/wheelhouse" \
            --lock "$WORK/cohort/cohort.lock.json" \
            --mirror "$WORK/cohort/mirror" \
            --generator-corpus /tmp/g02-g03-current-codegen-corpus.json \
            --report "$EVIDENCE/reports/offline-cohort.json"
          run_bounded cohort-install 180 python -m venv "$WORK/installed"
          run_bounded locked-install 180 "$WORK/installed/bin/python" -I -m pip --isolated install \
            --disable-pip-version-check --no-cache-dir --no-index --only-binary=:all: \
            --find-links "$WORK/cohort/wheelhouse" --require-hashes \
            -r "$WORK/cohort/mirror/requirements.lock"
          run_bounded locked-check 180 "$WORK/installed/bin/python" -I -m pip --isolated check
          run_bounded postgres-version 180 "$WORK/installed/bin/python" -I - <<'PY'
          import psycopg
          with psycopg.connect("host=127.0.0.1 port=5432 dbname=postgres user=postgres connect_timeout=5 options='-c statement_timeout=120000 -c lock_timeout=5000'", autocommit=True) as connection:
              version, number = connection.execute("select current_setting('server_version'), current_setting('server_version_num')").fetchone()
          assert number == "180006", (version, number)
          print({"postgresqlServerVersion": version, "postgresqlServerVersionNum": number})
          PY
          run_bounded g02-fixture 180 bun tests/lifecycle/g02-temporal-native-fixture.ts /tmp/g02-g03-temporal-fixture.json
          run_bounded g03-fixture 180 bun tests/lifecycle/g03-defaults-native-fixture.ts /tmp/g02-g03-defaults-fixture.json
          run_bounded fixture-guards 180 python -I - <<'PY'
          import hashlib, json, pathlib
          pins = json.loads(pathlib.Path("docs/helix/04-build/evidence/mig-g02-g03/native-qualification-source-pins.json").read_text())
          temporal = pathlib.Path("/tmp/g02-g03-temporal-fixture.json")
          defaults = pathlib.Path("/tmp/g02-g03-defaults-fixture.json")
          temporal_fixture = json.loads(temporal.read_text())
          defaults_fixture = json.loads(defaults.read_text())
          assert temporal_fixture["version"] == pins["generatedInputPins"]["g02TemporalFixture"]["version"]
          assert [case["id"] for case in temporal_fixture["cases"]] == pins["generatedInputPins"]["g02TemporalFixture"]["caseIds"]
          temporal_sha = hashlib.sha256(temporal.read_bytes()).hexdigest()
          assert temporal_sha == pins["generatedInputPins"]["g02TemporalFixture"]["reviewedArtifactSha256"], temporal_sha
          assert defaults_fixture["version"] == pins["generatedInputPins"]["g03DefaultsFixture"]["version"]
          assert defaults_fixture["status"] == pins["generatedInputPins"]["g03DefaultsFixture"]["statusMustRemain"]
          for case_id, expected in pins["generatedInputPins"]["g03DefaultsFixture"]["caseStatusMustRemain"].items():
              assert defaults_fixture["caseStatus"][case_id] == expected, case_id
          print({"g02TemporalFixtureSha256": temporal_sha,
                 "g03DefaultsCaseIds": list(defaults_fixture["caseStatus"])})
          PY

          run_bounded g02-temporal-native 180 "$WORK/installed/bin/python" -I tests/lifecycle/g02-temporal-native.py \
            --dsn "$PG_DSN" --fixture /tmp/g02-g03-temporal-fixture.json \
            --report "$EVIDENCE/reports/g02-temporal-native.json"

          for scenario in transitions empty required admission-refusal semantics rollback \
            commit-observation finalize-observation finalize-before-publication unknown-no-commit \
            writer-barrier; do
            run_bounded "g03-$scenario" 180 "$WORK/installed/bin/python" tests/lifecycle/g03-defaults-native.py \
              --dsn "$PG_DSN" --fixture /tmp/g02-g03-defaults-fixture.json \
              --scenario "$scenario" --report "$EVIDENCE/reports/g03-$scenario.json"
          done
          for domain in date text decimal uuid-selected currentTimestamp; do
            run_bounded "g03-domain-$domain" 180 "$WORK/installed/bin/python" tests/lifecycle/g03-defaults-native.py \
              --dsn "$PG_DSN" --fixture /tmp/g02-g03-defaults-fixture.json \
              --scenario "domain-$domain" --report "$EVIDENCE/reports/g03-domain-$domain.json"
          done
          run_bounded g03-tampering 180 "$WORK/installed/bin/python" tests/lifecycle/g03-defaults-native.py \
            --dsn "$PG_DSN" --fixture /tmp/g02-g03-defaults-fixture.json \
            --scenario tampering --report "$EVIDENCE/reports/g03-tampering.json"

          cp "$WORK/cohort/cohort.lock.json" "$EVIDENCE/cohort.lock.json"
          cp "$WORK/cohort/mirror/manifest.json" "$EVIDENCE/cohort-mirror-manifest.json"
          cp /tmp/g02-g03-temporal-fixture.json "$EVIDENCE/g02-temporal-fixture.json"
          cp /tmp/g02-g03-defaults-fixture.json "$EVIDENCE/g03-defaults-fixture.json"
          run_bounded finalize-receipt 180 python -I - <<'PY'
          import hashlib, json, os, pathlib

          evidence = pathlib.Path(os.environ["QUALIFICATION_DIR"])
          pins = json.loads(pathlib.Path("docs/helix/04-build/evidence/mig-g02-g03/native-qualification-source-pins.json").read_text())
          reports = evidence / "reports"
          source_commit = os.environ["GITHUB_SHA"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          ref = os.environ["GITHUB_REF"]
          workflow = os.environ["GITHUB_WORKFLOW"]
          assert source_commit and run_id and run_attempt and ref and workflow

          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          temporal_path = evidence / "g02-temporal-fixture.json"
          defaults_path = evidence / "g03-defaults-fixture.json"
          temporal_fixture = json.loads(temporal_path.read_text())
          defaults_fixture = json.loads(defaults_path.read_text())
          expected_g02_ids = pins["generatedInputPins"]["g02TemporalFixture"]["caseIds"]
          assert temporal_fixture["version"] == pins["generatedInputPins"]["g02TemporalFixture"]["version"]
          assert [case["id"] for case in temporal_fixture["cases"]] == expected_g02_ids
          assert sha(temporal_path) == pins["generatedInputPins"]["g02TemporalFixture"]["reviewedArtifactSha256"]
          assert defaults_fixture["version"] == pins["generatedInputPins"]["g03DefaultsFixture"]["version"]
          assert defaults_fixture["status"] == pins["generatedInputPins"]["g03DefaultsFixture"]["statusMustRemain"]
          for case_id, expected in pins["generatedInputPins"]["g03DefaultsFixture"]["caseStatusMustRemain"].items():
              assert defaults_fixture["caseStatus"][case_id] == expected, case_id

          g02 = json.loads((reports / "g02-temporal-native.json").read_text())
          expected_g02_passes = ("PASS_AND_CLEANED", "PASS_EXPECTED_ROLLBACK_AND_CLEANED")
          assert g02["status"] == "PASS_G02_TEMPORAL_FIVE_CASES"
          assert g02["serverVersionNum"] == "180006" and g02["cases"] == 5 and g02["checks"]
          assert g02["caseIds"] == expected_g02_ids
          assert g02["maxWorkers"] == pins["target"]["executionConcurrency"]["g02TemporalMaximumWorkers"] == 2
          assert g02["cleanupUnknown"] is False
          assert g02["sharedRolesCleanup"] == "VERIFIED"
          assert g02["peakOverlappingCodegenVmHardMemoryBytes"] == pins["target"]["executionConcurrency"]["peakOverlappingCodegenVmHardMemoryBytes"]
          assert g02["githubRunnerEnvironmentCapUnchanged"] is True
          assert len(g02["caseResults"]) == 5
          assert [case["caseId"] for case in g02["caseResults"]] == expected_g02_ids
          assert all(case["status"] in expected_g02_passes and case["databaseCleanup"] == "VERIFIED"
                     for case in g02["caseResults"])
          assert g02["runnerSha256"] == pins["sourcePins"]["tests/lifecycle/g02-temporal-native.py"]["sha256"]
          assert g02["fixtureSha256"] == sha(temporal_path)

          lock_path = evidence / "cohort.lock.json"
          mirror_path = evidence / "cohort-mirror-manifest.json"
          offline_path = reports / "offline-cohort.json"
          cohort = json.loads(lock_path.read_text())
          mirror = json.loads(mirror_path.read_text())
          offline = json.loads(offline_path.read_text())
          lock_sha = sha(lock_path)
          mirror_sha = sha(mirror_path)
          assert cohort["status"] == "locked" and cohort["profile"] == "umf.embedder-wheel-lock/1"
          assert mirror["profile"] == "local-wheel-mirror/2" and mirror["networkUsed"] is False
          assert mirror["lockSha256"] == lock_sha
          assert offline["profile"] == "umf-offline-mirror-installed/1" and offline["status"] == "passed"
          assert offline["lockSha256"] == lock_sha and offline["mirrorManifestSha256"] == mirror_sha
          packages = {package["distribution"]: package for package in cohort["packages"]}
          for distribution in ("umf-access", "umf-codegen"):
              assert packages[distribution]["source"]["commit"] == source_commit
          weft_pin = pins["dependencyPins"]["weft"]
          assert packages["umf-weft"]["version"] == weft_pin["version"]
          assert packages["umf-weft"]["source"]["sha256"] == weft_pin["sha256"]
          core_pin = pins["dependencyPins"]["core"]
          assert packages["umf-core"]["version"] == core_pin["version"]
          assert packages["umf-core"]["source"]["sha256"] == core_pin["sha256"]
          core_wheels = [wheel for wheel in cohort["wheels"] if wheel["distribution"] == "umf-core"]
          assert len(core_wheels) == 1 and core_wheels[0]["filename"] == core_pin["wheel"]
          runtime_distributions = ("umf-access", "umf-codegen", "umf-weft", "umf-core")
          runtime_versions = {name: packages[name]["version"] for name in runtime_distributions}
          assert g02["packages"] == runtime_versions

          scenarios = pins["selectedNativeScope"]["g03ScenarioArguments"]
          expected_scenarios = ["transitions", "empty", "required", "admission-refusal", "semantics",
                                "rollback", "commit-observation", "finalize-observation",
                                "finalize-before-publication", "unknown-no-commit", "writer-barrier",
                                "domains", "tampering"]
          assert scenarios == expected_scenarios
          domain_scenarios = pins["selectedNativeScope"]["g03DomainSubscenarioArguments"]
          assert domain_scenarios == ["domain-date", "domain-text", "domain-decimal", "domain-uuid-selected",
                                      "domain-currentTimestamp"]
          partial = "PARTIAL_SUBCASE_PASS_FULL_CASE_OPEN"
          case_ids_by_scenario = {
              "transitions": ("G03-N01", "G03-N14"),
              "empty": ("G03-N02", "G03-N14"),
              "required": ("G03-N03", "G03-N14"),
              "admission-refusal": ("G03-N04",),
              "semantics": ("G03-N05", "G03-N14"),
              "rollback": ("G03-N06", "G03-N14"),
              "commit-observation": ("G03-N07", "G03-N14"),
              "finalize-observation": ("G03-N07", "G03-N14"),
              "finalize-before-publication": ("G03-N07", "G03-N14"),
              "unknown-no-commit": ("G03-N08", "G03-N14"),
              "writer-barrier": ("G03-N09", "G03-N14"),
              "domains": ("G03-N10", "G03-N11", "G03-N14"),
              "tampering": ("G03-N13", "G03-N14"),
          }
          statuses = {}
          native_target_identity = None
          for scenario in scenarios:
              if scenario == "domains":
                  item = {"scenario": "domains", "status": "PASS_SELECTED_NATIVE_SUBCASES_FULL_CASE_OPEN",
                          "runnerSha256": pins["sourcePins"]["tests/lifecycle/g03-defaults-native.py"]["sha256"],
                          "fixtureSha256": sha(defaults_path), "packages": runtime_versions}
              else:
                  item = json.loads((reports / f"g03-{scenario}.json").read_text())
              assert item["scenario"] == scenario
              assert item["runnerSha256"] == pins["sourcePins"]["tests/lifecycle/g03-defaults-native.py"]["sha256"]
              assert item["fixtureSha256"] == sha(defaults_path)
              assert item["packages"] == runtime_versions
              expected_case_status = dict(defaults_fixture["caseStatus"])
              if scenario == "admission-refusal":
                  assert item["status"] == "PASS_SOURCE_REFUSAL_AND_NATIVE_NO_EFFECTS"
                  result = item["result"]
                  assert result["scenario"] == scenario and result["status"] == item["status"]
                  assert result["nativeEffects"] == "none; compilation refusal only"
                  assert result["targetBefore"] == result["targetAfter"]
                  target = result["targetBefore"]["target"]
                  observer = result["targetBefore"]["observer"]
                  admission_target_identity = (target["database"], target["serverVersion"],
                                               observer["sessionUser"], observer["currentUser"],
                                               target["serverPort"], target["postmasterStart"],
                                               target["systemIdentifier"])
                  if native_target_identity is None:
                      native_target_identity = admission_target_identity
                  else:
                      assert admission_target_identity == native_target_identity
                  assert "PostgreSQL 18.6" in target["serverVersion"]
                  expected_case_status["G03-N04"] = item["status"]
              elif scenario == "domains":
                  expected_controls = None
                  domain_database_names = []
                  domain_schema_names = []
                  domain_role_names = []
                  for domain_scenario in domain_scenarios:
                      domain_name = domain_scenario.removeprefix("domain-")
                      domain_item = json.loads((reports / f"g03-{domain_scenario}.json").read_text())
                      assert domain_item["scenario"] == domain_scenario
                      assert domain_item["runnerSha256"] == pins["sourcePins"]["tests/lifecycle/g03-defaults-native.py"]["sha256"]
                      assert domain_item["fixtureSha256"] == sha(defaults_path)
                      assert domain_item["packages"] == runtime_versions
                      assert domain_item["status"] == "PASS_SELECTED_NATIVE_SUBCASE_FULL_CASE_OPEN"
                      controls = domain_item["compileOnlyRefusals"]
                      expected_control_ids = [control["id"] for control in defaults_fixture["compileOnlyControls"]]
                      assert [control["id"] for control in controls] == expected_control_ids
                      assert all(control["status"] == "blocked" for control in controls)
                      if expected_controls is None:
                          expected_controls = controls
                      else:
                          assert controls == expected_controls
                      cases = domain_item["domainResults"]
                      case_scenario = "domain-uuid" if domain_scenario == "domain-uuid-selected" else domain_scenario
                      assert len(cases) == 1 and cases[0]["scenario"] == case_scenario
                      case = cases[0]
                      assert case["status"] == "PASS_SELECTED_NATIVE_SUBCASE_FULL_CASE_OPEN"
                      assert len(case["roleNames"]) == 5 and len(set(case["roleNames"])) == 5
                      domain_database_names.append(case["database"])
                      domain_schema_names.append(case["schema"])
                      domain_role_names.extend(case["roleNames"])
                      assert case["cleanup"]["status"] == "PASS"
                      verification = case["cleanupVerification"]
                      assert verification["ownedDatabaseAbsent"] is True
                      assert verification["ownedRolesAbsent"] is True
                      assert verification["targetIdentityUnchanged"] is True
                      assert verification["schemaAndTableAbsentByOwnedDatabaseRemoval"] is True
                      assert "PostgreSQL 18.6" in case["targetIdentity"]["serverVersion"]
                      assert case["targetIdentity"]["currentUser"] == case["targetIdentity"]["sessionUser"]
                      case_target_identity = case["targetIdentity"]
                      identity_tuple = (case_target_identity["maintenanceDatabase"],
                                        case_target_identity["serverVersion"],
                                        case_target_identity["sessionUser"],
                                        case_target_identity["currentUser"],
                                        case_target_identity["serverPort"],
                                        case_target_identity["postmasterStart"],
                                        case_target_identity["systemIdentifier"])
                      if native_target_identity is None:
                          native_target_identity = identity_tuple
                      else:
                          assert identity_tuple == native_target_identity
                      case_id = "G03-N10" if domain_name in ("date", "text", "decimal") else "G03-N11"
                      expected_domain_case_status = dict(defaults_fixture["caseStatus"])
                      expected_domain_case_status.update({case_id: partial, "G03-N14": partial})
                      assert domain_item["caseStatus"] == expected_domain_case_status, domain_scenario
                  assert len(set(domain_database_names)) == len(domain_scenarios)
                  assert len(set(domain_schema_names)) == len(domain_scenarios)
                  assert len(set(domain_role_names)) == len(domain_scenarios) * 5
                  item = {"status": "PASS_SELECTED_NATIVE_SUBCASES_FULL_CASE_OPEN"}
                  expected_case_status.update({"G03-N10": partial, "G03-N11": partial, "G03-N14": partial})
              else:
                  if scenario == "semantics":
                      assert item["status"] == "PASS_SELECTED_NATIVE_SUBCASES_FULL_CASE_OPEN"
                      cases = item["semanticResults"]
                      expected_subscenarios = ("semantic-null", "semantic-decimal")
                  else:
                      case = item["result"]
                      cases = [case]
                      expected_subscenarios = (scenario,)
                      if scenario == "unknown-no-commit":
                          assert item["status"] == "PASS_EXPECTED_FENCED_SUBCASE_FULL_CASE_OPEN"
                      else:
                          assert item["status"] == "PASS_SELECTED_NATIVE_SUBCASE_FULL_CASE_OPEN"
                  assert tuple(case["scenario"] for case in cases) == expected_subscenarios
                  for case in cases:
                      assert case["status"] == ("PASS_EXPECTED_FENCED_SUBCASE_FULL_CASE_OPEN"
                                                 if case["scenario"] == "unknown-no-commit"
                                                 else "PASS_SELECTED_NATIVE_SUBCASE_FULL_CASE_OPEN")
                      assert case["cleanup"]["status"] == "PASS"
                      verification = case["cleanupVerification"]
                      assert verification["ownedDatabaseAbsent"] is True
                      assert verification["ownedRolesAbsent"] is True
                      assert verification["targetIdentityUnchanged"] is True
                      assert verification["schemaAndTableAbsentByOwnedDatabaseRemoval"] is True
                      assert "PostgreSQL 18.6" in case["targetIdentity"]["serverVersion"]
                      assert case["targetIdentity"]["currentUser"] == case["targetIdentity"]["sessionUser"]
                      case_target_identity = case["targetIdentity"]
                      identity_tuple = (case_target_identity["maintenanceDatabase"],
                                        case_target_identity["serverVersion"],
                                        case_target_identity["sessionUser"],
                                        case_target_identity["currentUser"],
                                        case_target_identity["serverPort"],
                                        case_target_identity["postmasterStart"],
                                        case_target_identity["systemIdentifier"])
                      if native_target_identity is None:
                          native_target_identity = identity_tuple
                      else:
                          assert identity_tuple == native_target_identity
                      if scenario == "tampering":
                          assert case["tamperingRefusals"] == [
                              "wrong-approval", "wrong-head", "wrong-file", "wrong-source",
                              "wrong-default-target", "wrong-default-value", "wrong-phase", "wrong-marker"]
                  if scenario == "semantics":
                      expected_case_status.update({"G03-N05": partial, "G03-N14": partial})
                  else:
                      for case_id in case_ids_by_scenario[scenario]:
                          expected_case_status[case_id] = partial
              if scenario != "domains":
                  assert item["caseStatus"] == expected_case_status, scenario
              statuses[scenario] = item["status"]

          artifact_files = [path for path in evidence.rglob("*") if path.is_file()]
          total_bytes = sum(path.stat().st_size for path in artifact_files)
          log_bytes = sum(path.stat().st_size for path in (evidence / "logs").glob("*.log"))
          assert total_bytes <= pins["evidenceLimits"]["capturedRunArtifactsMaximumBytes"], total_bytes
          assert log_bytes <= pins["evidenceLimits"]["capturedCommandLogsMaximumBytes"], log_bytes
          workflow_path = pathlib.Path(".github/workflows/g02-g03-native-qualification.yml")
          manifest_path = pathlib.Path("docs/helix/04-build/evidence/mig-g02-g03/native-qualification-source-pins.json")
          outputs = {
              "profile": "umf.g02-g03-selected-native-qualification/1",
              "status": "PASS_SELECTED_NATIVE_SUBCASES_FULL_CASE_OPEN",
              "qualificationPhase": "final-stable-five-G02-thirteen-selected-G03/1",
              "sourceCommit": source_commit,
              "runId": run_id,
              "runAttempt": run_attempt,
              "ref": ref,
              "workflow": workflow,
              "workflowSha256": sha(workflow_path),
              "manifestSha256": sha(manifest_path),
              "postgresqlServerVersionNum": g02["serverVersionNum"],
              "g02Temporal": {"cases": g02["cases"], "checks": len(g02["checks"]),
                              "maxWorkers": g02["maxWorkers"], "sharedRolesCleanup": g02["sharedRolesCleanup"],
                              "fixtureSha256": g02["fixtureSha256"], "runnerSha256": g02["runnerSha256"]},
              "g03SelectedScenarios": statuses,
              "g03SelectedCaseIds": pins["selectedNativeScope"]["g03CaseIds"],
              "g03N12": "UNQUALIFIED pending compatible Weft .2 cohort",
              "g03N14AndFullCampaign": "OPEN; campaign selector was not invoked",
              "cohortLockSha256": lock_sha,
              "cohortMirrorManifestSha256": mirror_sha,
              "sourcePins": pins["sourcePins"],
              "reportHashes": {path.name: sha(path) for path in sorted(reports.glob("*.json"))},
              "generatedCodegenOutputs": json.loads((reports / "codegen-generated-outputs.json").read_text()),
              "capturedCommandLogBytes": log_bytes,
              "capturedArtifactBytes": total_bytes,
              "limits": pins["target"]["dsnBounds"],
              "nativeQualification": "all five G02 cases and all thirteen selected G03 scenarios passed at this source and cohort; G03-N12 remains unqualified and G03-N14/full campaign remains open"
          }
          (evidence / "run-manifest.json").write_text(json.dumps(outputs, indent=2, sort_keys=True) + "\n")
          (evidence / "receipt.json").write_text(json.dumps({
              "profile": outputs["profile"], "status": outputs["status"],
              "qualificationPhase": outputs["qualificationPhase"],
              "sourceCommit": outputs["sourceCommit"],
              "runId": outputs["runId"], "runAttempt": outputs["runAttempt"],
              "ref": outputs["ref"], "workflow": outputs["workflow"],
              "workflowSha256": outputs["workflowSha256"],
              "manifestSha256": outputs["manifestSha256"],
              "selectedG02CaseCount": g02["cases"],
              "selectedG03ScenarioCount": len(statuses),
              "cohortLockSha256": lock_sha,
              "g03N12": outputs["g03N12"],
              "g03N14AndFullCampaign": outputs["g03N14AndFullCampaign"],
              "finalCombinedGate": "OPEN; this result covers selected subcases only, not full G03 or campaign"
          }, indent=2, sort_keys=True) + "\n")
          PY
          BOUNDED_NATIVE_WORK

      - name: Stage bounded evidence or a failure-only receipt
        if: always()
        timeout-minutes: 1
        env:
          QUALIFICATION_DIR: ${{ runner.temp }}/umf-g02-g03-native-qualification
          QUALIFICATION_STAGE_DIR: ${{ runner.temp }}/umf-g02-g03-native-qualification-upload
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          rm -rf "$QUALIFICATION_STAGE_DIR"
          rm -rf "${QUALIFICATION_STAGE_DIR}.candidate"
          python -I - "$QUALIFICATION_DIR" "$QUALIFICATION_STAGE_DIR" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REF" "$GITHUB_WORKFLOW" <<'PY'
          import hashlib, json, pathlib, shutil, sys
          root, stage = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          candidate = stage.with_name(stage.name + ".candidate")
          candidate.mkdir(parents=True)
          source, run_id, attempt, ref, workflow = sys.argv[3:]
          files = [path for path in root.rglob("*") if path.is_file()]
          total = sum(path.stat().st_size for path in files)
          logs = sum(path.stat().st_size for path in (root / "logs").glob("*.log"))
          receipt = root / "receipt.json"
          toolchain_path = root / "toolchain.json"
          failed = (not receipt.is_file() or not toolchain_path.is_file() or
                    logs > 1048576 or total > 16777216)
          common = {"profile": "umf.g02-g03-selected-native-qualification/1",
                    "sourceCommit": source, "runId": run_id, "runAttempt": attempt,
                    "ref": ref, "workflow": workflow, "selectedScopeOnly": True,
                    "fullG03Campaign": "OPEN", "capturedLogsBytes": logs,
                    "capturedArtifactBytes": total,
                    "limits": {"logs": 1048576, "artifacts": 16777216}}
          workflow_path = pathlib.Path(".github/workflows/g02-g03-native-qualification.yml")
          manifest_path = pathlib.Path("docs/helix/04-build/evidence/mig-g02-g03/native-qualification-source-pins.json")
          common["workflowSha256"] = hashlib.sha256(workflow_path.read_bytes()).hexdigest() if workflow_path.is_file() else None
          common["manifestSha256"] = hashlib.sha256(manifest_path.read_bytes()).hexdigest() if manifest_path.is_file() else None
          if failed:
              common["toolchain"] = json.loads(toolchain_path.read_text()) if toolchain_path.is_file() else None
              common.update({"status": "FAIL_OR_UNKNOWN",
                             "reason": "Evidence receipt missing or bounded artifact limits exceeded; raw evidence withheld."})
              (candidate / "receipt.json").write_text(json.dumps(common, indent=2, sort_keys=True) + "\n")
              candidate.rename(stage)
              raise SystemExit(1)
          common["toolchain"] = json.loads(toolchain_path.read_text())
          original_receipt = json.loads(receipt.read_text())
          original_receipt.update(common)
          (candidate / "receipt.json").write_text(json.dumps(original_receipt, indent=2, sort_keys=True) + "\n")
          expected = {}
          for path in files:
              relative = path.relative_to(root)
              if relative.as_posix() == "receipt.json":
                  continue
              destination = candidate / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, destination)
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              copied = hashlib.sha256(destination.read_bytes()).hexdigest()
              if copied != digest:
                  raise SystemExit("Evidence copy hash mismatch: " + relative.as_posix())
              expected[relative.as_posix()] = digest
          (candidate / "copy-hashes.json").write_text(json.dumps(expected, indent=2, sort_keys=True) + "\n")
          staged_total = sum(path.stat().st_size for path in candidate.rglob("*") if path.is_file())
          if staged_total > 16777216:
              shutil.rmtree(candidate)
              candidate.mkdir(parents=True)
              failure = {**common, "status": "FAIL_OR_UNKNOWN",
                         "reason": "Staged evidence would exceed 16 MiB; raw evidence withheld.",
                         "stagedArtifactBytes": staged_total}
              (candidate / "receipt.json").write_text(json.dumps(failure, indent=2, sort_keys=True) + "\n")
              candidate.rename(stage)
              raise SystemExit(1)
          print(json.dumps({"capturedLogsBytes": logs, "capturedArtifactBytes": total,
                            "stagedArtifactBytes": staged_total,
                            "workflowSha256": common["workflowSha256"],
                            "manifestSha256": common["manifestSha256"]}, sort_keys=True))
          candidate.rename(stage)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 1
        with:
          name: g02-g03-native-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/umf-g02-g03-native-qualification-upload/
          if-no-files-found: error
          retention-days: 14
