# SPDX-License-Identifier: MIT OR Apache-2.0
name: Typed access boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: bun run test:access-boundaries
      - run: bun run check:access-boundaries

  portable-adoption:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - run: bun install --frozen-lockfile
      - name: Run isolated portable adoption checks
        env:
          UMF_UNIFIED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: bun test tests/access-adoption.test.ts

  table-declarations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun scripts/check-table-lifecycle-boundaries.ts
      - run: bun scripts/check-table-deployment-boundaries.ts
      - run: >-
          bun test tests/table-authoring/row-scope.test.ts tests/binding/tables.test.ts tests/binding/table-operations.test.ts tests/binding/table-temporal.test.ts tests/binding/table-domains.test.ts tests/binding/table-deployment.test.ts tests/binding/table-migration.test.ts
          tests/compilation/table-lifecycle-boundaries.test.ts tests/compilation/table-deployment-boundaries.test.ts
          tests/lifecycle/g02-derived-fill.test.ts tests/lifecycle/g02-temporal-native-fixture.test.ts
      - run: bunx playwright install --with-deps chromium
      - name: Actual browser metadata parity and preservation
        env:
          UMF_TABLE_BROWSER_EVIDENCE: /tmp/umf-table-browser.json
        run: bun scripts/table-lifecycle-browser.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-declaration-browser
          path: /tmp/umf-table-browser.json

  p1-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pydantic: ['2.13.5', '2.14.1']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bun install --frozen-lockfile
      - run: python -m pip install build==1.3.0
      - run: python -m build --wheel --outdir /tmp/umf-p1-wheels python/umf_access
      - name: Install the built wheel with the platform Pydantic version
        env:
          PYDANTIC_VERSION: ${{ matrix.pydantic }}
        run: python -m pip install /tmp/umf-p1-wheels/*.whl "pydantic==$PYDANTIC_VERSION"
      - name: Replay generated models and installed runtime checks
        env:
          PYDANTIC_VERSION: ${{ matrix.pydantic }}
        run: >-
          bun scripts/praxis-p1-compatibility.ts
          --python "$(command -v python)"
          --pydantic "$PYDANTIC_VERSION"
          --wheel /tmp/umf-p1-wheels/*.whl
          --report /tmp/umf-p1-compatibility.json
      - name: Check installed session scheduling and lease fault handling
        run: python -I -m unittest discover -s python/umf_access/tests -p 'test_*session*.py' -v
      - name: Check installed table read values
        run: python -I -m unittest discover -s python/umf_access/tests -p 'test_table_read_values.py' -v
      - name: Check installed table outcomes
        run: python -I -m unittest discover -s python/umf_access/tests -p 'test_table_outcomes.py' -v
      - name: Check installed native binding
        run: python -I -m unittest discover -s python/umf_access/tests -p 'test_native_binding.py' -v
      - name: Check portable sync and async clients
        run: >-
          bun test tests/access-native-table.test.ts tests/access-native-domains.test.ts tests/access-unified.test.ts tests/access-unified-sync.test.ts
          tests/access-unified-generation.test.ts tests/compilation/access-generator.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-compatibility-pydantic-${{ matrix.pydantic }}
          path: /tmp/umf-p1-compatibility.json


  native-client-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolate Rust toolchain from the runner image
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/umf-rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt
      - run: bun install --frozen-lockfile
      - run: python -m venv /tmp/native-client-checkers
      - run: /tmp/native-client-checkers/bin/pip install mypy==2.4.0 pyright==1.1.414 ty==0.0.88
      - name: Produce clients with the shared Rust engine
        run: |
          cargo build --locked --release -p umf-codegen --example r3_replay
          python scripts/rust-migration/r3/native-replay.py --binary target/release/examples/r3_replay --fixture docs/helix/04-build/evidence/rust-migration/r3/baseline/operations.json --report /tmp/r3-native-types-replay.json
          python scripts/rust-migration/r3/extract-native-clients.py --actual /tmp/r3-native-types-replay.actual.json --output /tmp/r3-native-generated > /tmp/r3-native-types-files.json
      - run: python scripts/verify-native-client-types.py --environment /tmp/native-client-checkers --work-dir /tmp/native-client-types --generated-dir /tmp/r3-native-generated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-client-types
          path: |
            /tmp/native-client-types/*-*.log
            /tmp/r3-native-types-*.json

  g02-native-postgresql:
    name: G02 native PostgreSQL (Python 3.11)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bun install --frozen-lockfile
      - name: Check checked-in embedded generator assets without rebuilding them
        run: bun scripts/build-codegen.ts --check
      - name: Install pinned Python package builders
        run: python -m pip install --disable-pip-version-check build==1.3.0 hatchling==1.27.0
      - name: Build current-source compiler corpus
        run: bun scripts/codegen-corpus.ts /tmp/g02-codegen-corpus.json
      - name: Acquire and verify the platform mini-racer wheel
        run: |
          python -m pip download --no-deps --only-binary=:all: --dest /tmp/g02-mini-racer-wheelhouse mini-racer==0.14.1
          python -I tests/codegen/verify_mini_racer_wheel.py \
            --wheelhouse /tmp/g02-mini-racer-wheelhouse \
            --pins docs/helix/04-build/evidence/praxis-embedder/mini-racer-wheel-pins.json \
            --expected-platform linux-x86_64-glibc-2.27+
      - name: Acquire current UMF wheels and the immutable released core and Weft wheels
        run: |
          python tests/codegen/acquire_offline_cohort.py \
            --output-dir /tmp/umf-g02-cohort \
            --source-commit '${{ github.sha }}' \
            --expected-os ubuntu-24.04 \
            --expected-architecture x86_64 \
            --expected-python 3.11 \
            --core-wheel-url 'https://github.com/DocumentDrivenDX/umf/releases/download/umf-v0.5.6/umf_core-0.10.1-cp311-abi3-linux_x86_64.whl' \
            --core-wheel-filename 'umf_core-0.10.1-cp311-abi3-linux_x86_64.whl' \
            --core-wheel-sha256 '3512e56730d1dab59d803b20301aea3ac8f6896b0dab452f767f4c3575b9ff4c' \
            --core-version '0.10.1' \
            --core-release-tag 'umf-v0.5.6' \
            --core-source-commit '259bf1ed91466ff7e9782d7517c14f2112282026' \
            --core-repository-url 'https://github.com/DocumentDrivenDX/umf' \
            --core-sdist-url 'https://github.com/DocumentDrivenDX/umf/releases/download/umf-v0.5.6/umf_core-0.10.1.tar.gz' \
            --core-sdist-sha256 'f0bc596a38de03d861212dd30d9d1d2844af215c4572dea7d7186e1f8cda0bb5' \
            --weft-wheel-url "https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.53/weft_sql-0.4.53-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" \
            --weft-wheel-filename 'weft_sql-0.4.53-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl' \
            --weft-wheel-sha256 "db01c4cf6357d674f1591609a2b9c83a9322ad8f8937c345e5950cc1582b83d2" \
            --mini-racer-wheel /tmp/g02-mini-racer-wheelhouse/*.whl
      - name: Qualify the hash-locked declared wheel mirror with missing, tampered and network-denial controls
        run: >-
          python -I tests/codegen/offline_mirror_probe.py
          --wheelhouse /tmp/umf-g02-cohort/wheelhouse
          --lock /tmp/umf-g02-cohort/cohort.lock.json
          --mirror /tmp/umf-g02-cohort/mirror
          --generator-corpus /tmp/g02-codegen-corpus.json
          --report /tmp/g02-offline-mirror.json
      - name: Install the exact locked cohort offline into an isolated environment
        run: |
          python -m venv /tmp/g02-native-installed
          /tmp/g02-native-installed/bin/python -I -m pip --isolated install \
            --disable-pip-version-check --no-cache-dir --no-index --only-binary=:all: \
            --find-links /tmp/umf-g02-cohort/wheelhouse --require-hashes \
            -r /tmp/umf-g02-cohort/mirror/requirements.lock
          /tmp/g02-native-installed/bin/python -I -m pip --isolated check
          /tmp/g02-native-installed/bin/python -I -c \
            "from importlib.metadata import version; from umf import current_core_version; assert version('weft-sql')=='0.4.53'; assert version('umf-access')=='0.1.0.dev8'; assert version('umf-codegen')=='0.1.0a5'; assert version('umf-core')=='0.10.1'; assert current_core_version()=='0.10.0'"
          /tmp/g02-native-installed/bin/python -I - <<'PY'
          import psycopg
          with psycopg.connect('host=127.0.0.1 port=5432 dbname=postgres user=postgres') as connection:
              version, version_num=connection.execute("select current_setting('server_version'), current_setting('server_version_num')").fetchone()
          assert version_num=='180006', {'serverVersion':version, 'serverVersionNum':version_num}
          print({'postgresqlServerVersion':version, 'postgresqlServerVersionNum':version_num})
          PY
      - name: Generate and validate the exact native fixture corpus sizes
        run: |
          bun tests/lifecycle/g02-derived-fill-native-fixture.ts /tmp/g02-base-fixture.json
          bun tests/lifecycle/g02-null-semantics-native-fixture.ts /tmp/g02-null-fixture.json
          bun tests/lifecycle/g02-no-default-native-fixture.ts /tmp/g02-no-default-fixture.json
          bun tests/lifecycle/g02-temporal-native-fixture.ts /tmp/g02-temporal-fixture.json
          python - <<'PY'
          import json
          base=json.load(open('/tmp/g02-base-fixture.json'))
          nulls=json.load(open('/tmp/g02-null-fixture.json'))
          no_default=json.load(open('/tmp/g02-no-default-fixture.json'))
          temporal=json.load(open('/tmp/g02-temporal-fixture.json'))
          assert len(base['cases'])==2, len(base['cases'])
          assert len(nulls['cases'])==18, len(nulls['cases'])
          assert temporal['version']=='umf.g02-temporal-native-fixture/1'
          assert len(temporal['cases'])==5, len(temporal['cases'])
          assert temporal['provenance']['domain']=='SD-007 Person optional birthday example'
          for case in temporal['cases']:
            old=json.loads(case['initialSource']['utf8'])['modules'][0]['extensions']['umf.tables']['commands']
            new=json.loads(case['source']['utf8'])['modules'][0]['extensions']['umf.tables']['commands']
            assert len(old)==1 and old==new[:1] and old[0]['id']=='create_person'
            assert len(new)==2 and new[1]['version']=='umf.table-operation/0.2'
          assert no_default['version']=='umf.praxis.g02-no-default-native-fixture/1'
          assert json.loads(no_default['initialSource']['utf8'])['modules'][0]['extensions']['umf.tables']['commands']==[]
          assert [command['id'] for command in json.loads(no_default['source']['utf8'])['modules'][0]['extensions']['umf.tables']['commands']]==['derive_total']
          assert 'default' not in next(column for column in json.loads(no_default['source']['utf8'])['modules'][0]['extensions']['umf.tables']['tables'][0]['columns'] if column['name']=='total')
          PY
      - name: Run the base two-case PostgreSQL 18.6 qualification
        run: >-
          /tmp/g02-native-installed/bin/python -I tests/lifecycle/derived-fill-native.py
          --dsn 'host=127.0.0.1 port=5432 dbname=postgres user=postgres'
          --fixture /tmp/g02-base-fixture.json
          --report /tmp/g02-base-native.json
      - name: Run all 18 intrinsic-NULL and conditional PostgreSQL cases
        run: >-
          /tmp/g02-native-installed/bin/python -I tests/lifecycle/derived-fill-native.py
          --dsn 'host=127.0.0.1 port=5432 dbname=postgres user=postgres'
          --fixture /tmp/g02-null-fixture.json
          --report /tmp/g02-null-native.json
      - name: Qualify appended required target with no declared future default
        run: >-
          /tmp/g02-native-installed/bin/python -I tests/lifecycle/g02-no-default-native.py
          --dsn 'host=127.0.0.1 port=5432 dbname=postgres user=postgres'
          --fixture /tmp/g02-no-default-fixture.json
          --report /tmp/g02-no-default-native.json
      - name: Qualify native date, instant, UUID and boolean G02 carriers
        run: >-
          /tmp/g02-native-installed/bin/python -I tests/lifecycle/g02-temporal-native.py
          --dsn 'host=127.0.0.1 port=5432 dbname=postgres user=postgres'
          --fixture /tmp/g02-temporal-fixture.json
          --report /tmp/g02-temporal-native.json
      - name: Bind three recovery fault scenarios to the complete immutable inputs
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root=pathlib.Path('/tmp/umf-g02-cohort')
          wheels={p.name:{'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in sorted((root/'wheelhouse').glob('*.whl'))}
          locked=json.loads((root/'cohort.lock.json').read_text())['wheels']
          assert set(wheels)=={item['filename'] for item in locked}, (len(wheels),len(locked))
          manifest={
            'candidate':'G02-native-${{ github.sha }}',
            'sourceCommit':'${{ github.sha }}',
            'weftReleasePin':{'version':'0.4.53','url':'https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.53/weft_sql-0.4.53-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl','sha256':'db01c4cf6357d674f1591609a2b9c83a9322ad8f8937c345e5950cc1582b83d2'},
            'cohortLockSha256':hashlib.sha256((root/'cohort.lock.json').read_bytes()).hexdigest(),
            'embeddedGeneratorManifestSha256':hashlib.sha256(pathlib.Path('python/umf_codegen/src/umf_codegen/_assets/manifest.json').read_bytes()).hexdigest(),
            'embeddedGeneratorInputHashes':json.loads(pathlib.Path('python/umf_codegen/src/umf_codegen/_assets/manifest.json').read_text())['inputs'],
            'codegenCorpusSha256':hashlib.sha256(pathlib.Path('/tmp/g02-codegen-corpus.json').read_bytes()).hexdigest(),
            'fixtureHashes':{name:hashlib.sha256(pathlib.Path('/tmp/'+name).read_bytes()).hexdigest() for name in ('g02-base-fixture.json','g02-null-fixture.json','g02-no-default-fixture.json','g02-temporal-fixture.json')},
            'nativeRunnerHashes':{name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in ('tests/lifecycle/derived-fill-native.py','tests/lifecycle/g02-faults-native.py','tests/lifecycle/g02-derived-fill-native-fixture.ts','tests/lifecycle/g02-null-semantics-native-fixture.ts','tests/lifecycle/g02-no-default-native.py','tests/lifecycle/g02-no-default-native-fixture.ts','tests/lifecycle/g02-temporal-native.py','tests/lifecycle/g02-temporal-native-fixture.ts')},
            'artifacts':wheels,
          }
          pathlib.Path('/tmp/g02-candidate-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          for scenario in fenced-resume backfill-commit-lost existing-target-commit-lost; do
            /tmp/g02-native-installed/bin/python -I tests/lifecycle/g02-faults-native.py \
              --dsn 'host=127.0.0.1 port=5432 dbname=postgres user=postgres' \
              --fixture /tmp/g02-base-fixture.json \
              --manifest /tmp/g02-candidate-manifest.json \
              --scenario "$scenario" --report "/tmp/g02-${scenario}.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g02-native-postgresql-${{ github.sha }}
          path: |
            /tmp/g02-*.json
            /tmp/umf-g02-cohort/cohort.lock.json
            /tmp/umf-g02-cohort/cohort-template.json
            /tmp/umf-g02-cohort/mirror/manifest.json
            /tmp/umf-g02-cohort/wheelhouse/*.whl
            /tmp/umf-g02-cohort/release-inputs/*


  python-codegen:
    name: python-codegen (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cell-id: linux-x86_64-py311
            architecture: x86_64
            mini-racer-platform: linux-x86_64-glibc-2.27+
            core-wheel-filename: umf_core-0.10.1-cp311-abi3-linux_x86_64.whl
            core-wheel-url: https://github.com/DocumentDrivenDX/umf/releases/download/umf-v0.5.6/umf_core-0.10.1-cp311-abi3-linux_x86_64.whl
            core-wheel-sha256: 3512e56730d1dab59d803b20301aea3ac8f6896b0dab452f767f4c3575b9ff4c
            weft-wheel-filename: weft_sql-0.4.53-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
            weft-wheel-url: https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.53/weft_sql-0.4.53-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
            weft-wheel-sha256: db01c4cf6357d674f1591609a2b9c83a9322ad8f8937c345e5950cc1582b83d2
            python-version: '3.11'
          - os: ubuntu-24.04
            cell-id: linux-x86_64-py314
            architecture: x86_64
            mini-racer-platform: linux-x86_64-glibc-2.27+
            core-wheel-filename: umf_core-0.10.1-cp311-abi3-linux_x86_64.whl
            core-wheel-url: https://github.com/DocumentDrivenDX/umf/releases/download/umf-v0.5.6/umf_core-0.10.1-cp311-abi3-linux_x86_64.whl
            core-wheel-sha256: 3512e56730d1dab59d803b20301aea3ac8f6896b0dab452f767f4c3575b9ff4c
            weft-wheel-filename: weft_sql-0.4.53-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
            weft-wheel-url: https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.53/weft_sql-0.4.53-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
            weft-wheel-sha256: db01c4cf6357d674f1591609a2b9c83a9322ad8f8937c345e5950cc1582b83d2
            python-version: '3.14'
          - os: macos-14
            cell-id: macos-arm64-py311
            architecture: arm64
            mini-racer-platform: macos-11+-arm64
            core-wheel-filename: umf_core-0.10.1-cp311-abi3-macosx_11_0_arm64.whl
            core-wheel-url: https://github.com/DocumentDrivenDX/umf/releases/download/umf-v0.5.6/umf_core-0.10.1-cp311-abi3-macosx_11_0_arm64.whl
            core-wheel-sha256: 49459bb2dbc37ac9b62b269e9664bac1483439c7d4c79f0b07855e9c8546c823
            weft-wheel-filename: weft_sql-0.4.53-cp39-abi3-macosx_11_0_arm64.whl
            weft-wheel-url: https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.53/weft_sql-0.4.53-cp39-abi3-macosx_11_0_arm64.whl
            weft-wheel-sha256: 4c8281945b852af02cae8602747fb7b1b652ab3a1369d7650efce62ae6d35c6c
            python-version: '3.11'
          - os: macos-14
            cell-id: macos-arm64-py314
            architecture: arm64
            mini-racer-platform: macos-11+-arm64
            core-wheel-filename: umf_core-0.10.1-cp311-abi3-macosx_11_0_arm64.whl
            core-wheel-url: https://github.com/DocumentDrivenDX/umf/releases/download/umf-v0.5.6/umf_core-0.10.1-cp311-abi3-macosx_11_0_arm64.whl
            core-wheel-sha256: 49459bb2dbc37ac9b62b269e9664bac1483439c7d4c79f0b07855e9c8546c823
            weft-wheel-filename: weft_sql-0.4.53-cp39-abi3-macosx_11_0_arm64.whl
            weft-wheel-url: https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.53/weft_sql-0.4.53-cp39-abi3-macosx_11_0_arm64.whl
            weft-wheel-sha256: 4c8281945b852af02cae8602747fb7b1b652ab3a1369d7650efce62ae6d35c6c
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - run: bun install --frozen-lockfile
      - run: bun test tests/compilation/codegen-gzip.test.ts
      - run: bun scripts/build-codegen.ts --check
      - run: python scripts/check-codegen-boundaries.py
      - name: Run codegen unit tests against the checked-out source package
        env:
          PYTHONPATH: python/umf_codegen/src
        run: python -m unittest discover -s python/umf_codegen/tests -v
      - run: python -m pip install build==1.3.0 hatchling==1.27.0
      - run: python tests/codegen/build_probe.py
      - run: bun scripts/row-scope-codegen-corpus.ts /tmp/umf-row-scope-codegen-corpus.json
      - name: Build wheel through the self-contained source distribution
        run: python -m build python/umf_codegen --outdir /tmp/umf-codegen-wheels
      - run: bun scripts/codegen-corpus.ts /tmp/umf-codegen-corpus.json
      - run: bun scripts/table-deployment-corpus.ts /tmp/umf-deployment-corpus.json
      - run: bun scripts/table-migration-corpus.ts /tmp/umf-migration-corpus.json
      - run: bun scripts/table-reviewed-changes-corpus.ts /tmp/umf-reviewed-changes-corpus.json
      - name: Acquire and verify the exact mini-racer platform wheel
        run: |
          python -m pip download --no-deps --only-binary=:all: --dest /tmp/mini-racer-wheelhouse mini-racer==0.14.1
          python -I tests/codegen/verify_mini_racer_wheel.py \
            --wheelhouse /tmp/mini-racer-wheelhouse \
            --pins docs/helix/04-build/evidence/praxis-embedder/mini-racer-wheel-pins.json \
            --expected-platform '${{ matrix.mini-racer-platform }}'
      - name: Install exact local wheels into a clean environment
        run: |
          python -m venv /tmp/umf-codegen-installed
          /tmp/umf-codegen-installed/bin/python -m pip --isolated install \
            --disable-pip-version-check --no-cache-dir --no-index --no-deps \
            /tmp/mini-racer-wheelhouse/*.whl /tmp/umf-codegen-wheels/*.whl
          /tmp/umf-codegen-installed/bin/python -I -m pip check
      - name: Installed row_scope normalizer parity
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/row_scope_probe.py
          --corpus /tmp/umf-row-scope-codegen-corpus.json > /tmp/umf-row-scope-report.json
      - name: Installed generator parity without external JavaScript processes
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/installed_probe.py
          --corpus /tmp/umf-codegen-corpus.json --report /tmp/umf-codegen-report.json
      - name: Installed original deployment compiler and tamper controls
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/deployment_probe.py
          --corpus /tmp/umf-deployment-corpus.json --report /tmp/umf-deployment-python.json
      - name: Installed original migration compiler and rehashed tamper controls
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/migration_probe.py
          --corpus /tmp/umf-migration-corpus.json --report /tmp/umf-migration-python.json
      - name: Installed reviewed-change discovery parity and source-forgery refusals
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/reviewed_changes_probe.py
          --corpus /tmp/umf-reviewed-changes-corpus.json > /tmp/umf-reviewed-changes-python.json
      - name: Verify matrix cell and write immutable receipt
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/matrix_receipt.py
          --wheelhouse /tmp/mini-racer-wheelhouse
          --pins docs/helix/04-build/evidence/praxis-embedder/mini-racer-wheel-pins.json
          --corpus /tmp/umf-codegen-corpus.json
          --generator-report /tmp/umf-codegen-report.json
          --row-scope-report /tmp/umf-row-scope-report.json
          --deployment-report /tmp/umf-deployment-python.json
          --migration-report /tmp/umf-migration-python.json
          --reviewed-report /tmp/umf-reviewed-changes-python.json
          --expected-os '${{ matrix.os }}'
          --expected-arch '${{ matrix.architecture }}'
          --expected-python '${{ matrix.python-version }}'
          --source-commit '${{ github.sha }}'
          --report /tmp/umf-codegen-matrix-receipt.json
      - name: Verify the lock-driven offline mirror and refusal controls
        run: python tests/codegen/test_package_mirror.py
      - name: Run reviewed exact Core selector controls
        run: |
          python -m unittest discover -s tests/codegen -p test_cohort_selector.py -v
          python -m unittest discover -s tests/codegen -p test_aggregate_cohort.py -v
      - name: Acquire and freeze the exact declared installed cohort for this cell
        run: >-
          python tests/codegen/acquire_offline_cohort.py
          --output-dir /tmp/umf-full-cohort
          --source-commit '${{ github.sha }}'
          --expected-os '${{ matrix.os }}'
          --expected-architecture '${{ matrix.architecture }}'
          --expected-python '${{ matrix.python-version }}'
          --core-wheel-url '${{ matrix.core-wheel-url }}'
          --core-wheel-filename '${{ matrix.core-wheel-filename }}'
          --core-wheel-sha256 '${{ matrix.core-wheel-sha256 }}'
          --core-version '0.10.1'
          --core-release-tag 'umf-v0.5.6'
          --core-source-commit '259bf1ed91466ff7e9782d7517c14f2112282026'
          --core-repository-url 'https://github.com/DocumentDrivenDX/umf'
          --core-sdist-url 'https://github.com/DocumentDrivenDX/umf/releases/download/umf-v0.5.6/umf_core-0.10.1.tar.gz'
          --core-sdist-sha256 'f0bc596a38de03d861212dd30d9d1d2844af215c4572dea7d7186e1f8cda0bb5'
          --weft-wheel-url '${{ matrix.weft-wheel-url }}'
          --weft-wheel-filename '${{ matrix.weft-wheel-filename }}'
          --weft-wheel-sha256 '${{ matrix.weft-wheel-sha256 }}'
          --mini-racer-wheel /tmp/mini-racer-wheelhouse/*.whl
      - name: Install and exercise this producer cell's frozen mirror with OS network denial
        run: >-
          python -I tests/codegen/offline_mirror_probe.py
          --wheelhouse /tmp/umf-full-cohort/wheelhouse
          --lock /tmp/umf-full-cohort/cohort.lock.json
          --mirror /tmp/umf-full-cohort/mirror
          --generator-corpus /tmp/umf-codegen-corpus.json
          --report /tmp/umf-full-cohort/offline-mirror-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegen-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            /tmp/umf-codegen-matrix-receipt.json
            /tmp/umf-codegen-report.json
            /tmp/umf-codegen-corpus.json
            /tmp/umf-row-scope-report.json
            /tmp/umf-deployment-python.json
            /tmp/umf-migration-python.json
            /tmp/umf-reviewed-changes-python.json
            /tmp/umf-full-cohort/cohort.lock.json
            /tmp/umf-full-cohort/cohort-template.json
            /tmp/umf-full-cohort/mirror/manifest.json
            /tmp/umf-full-cohort/offline-mirror-receipt.json
            /tmp/umf-full-cohort/wheelhouse/*.whl
            /tmp/umf-full-cohort/release-inputs/*


  aggregate-python-cohort:
    name: assemble closed four-cell Python wheel union
    runs-on: ubuntu-24.04
    needs: python-codegen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: codegen-*
          path: /tmp/codegen-cell-artifacts
      - name: Bind all four producer locks and release inputs to the cell IDs
        run: |
          set -euo pipefail
          input=/tmp/aggregate-input
          mkdir -p "$input"
          declare -A ids=(
            [codegen-ubuntu-24.04-py3.11]=linux-x86_64-py311
            [codegen-ubuntu-24.04-py3.14]=linux-x86_64-py314
            [codegen-macos-14-py3.11]=macos-arm64-py311
            [codegen-macos-14-py3.14]=macos-arm64-py314
          )
          for artifact in "${!ids[@]}"; do
            root="/tmp/codegen-cell-artifacts/$artifact"
            lock=$(find "$root" -name cohort.lock.json -type f -print -quit)
            test -n "$lock"
            cohort=$(dirname "$lock")
            cell="$input/${ids[$artifact]}"
            mkdir -p "$cell/wheelhouse"
            cp "$lock" "$cell/cohort.lock.json"
            cp "$cohort/offline-mirror-receipt.json" "$cell/offline-mirror-receipt.json"
            cp "$cohort"/wheelhouse/*.whl "$cell/wheelhouse/"
          done
          python - <<'PY'
          import hashlib, pathlib, shutil
          root=pathlib.Path('/tmp/codegen-cell-artifacts')
          target=pathlib.Path('/tmp/aggregate-generator-corpus.json')
          matches=sorted(root.rglob('umf-codegen-corpus.json'))
          assert len(matches)==4, len(matches)
          digests={hashlib.sha256(path.read_bytes()).hexdigest() for path in matches}
          assert len(digests)==1, 'producer source corpora differ'
          shutil.copyfile(matches[0], target)
          PY
      - name: Assemble and verify the one closed aggregate mirror
        run: >-
          python -I tests/codegen/aggregate_cohort.py assemble
          --input-root /tmp/aggregate-input
          --output /tmp/umf-aggregate-cohort
          --source-commit '${{ github.sha }}'
      - name: Bind the identical compiler corpus into the aggregate artifact
        run: cp /tmp/aggregate-generator-corpus.json /tmp/umf-aggregate-cohort/generator-corpus.json
      - uses: actions/upload-artifact@v4
        with:
          name: umf-aggregate-cohort-${{ github.sha }}
          path: /tmp/umf-aggregate-cohort/**


  python-union-replay:
    name: aggregate-union replay (${{ matrix.cell-id }})
    runs-on: ${{ matrix.os }}
    needs: aggregate-python-cohort
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell-id: linux-x86_64-py311
            os: ubuntu-24.04
            python-version: '3.11'
          - cell-id: linux-x86_64-py314
            os: ubuntu-24.04
            python-version: '3.14'
          - cell-id: macos-arm64-py311
            os: macos-14
            python-version: '3.11'
          - cell-id: macos-arm64-py314
            os: macos-14
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: umf-aggregate-cohort-${{ github.sha }}
          path: /tmp/umf-aggregate-cohort
      - name: Replay the selected lock from the shared union under network denial
        run: >-
          python -I tests/codegen/offline_mirror_probe.py
          --aggregate-index /tmp/umf-aggregate-cohort/aggregate.json
          --selected-cell '${{ matrix.cell-id }}'
          --expected-source-commit '${{ github.sha }}'
          --mirror /tmp/umf-aggregate-cohort/mirror
          --generator-corpus /tmp/umf-aggregate-cohort/generator-corpus.json
          --report /tmp/umf-union-replay-${{ matrix.cell-id }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: union-replay-${{ matrix.cell-id }}-${{ github.sha }}
          path: /tmp/umf-union-replay-${{ matrix.cell-id }}.json


  native-sessions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        weft-cohort: [published044, source-dbapi]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bun install --frozen-lockfile
      - run: python -m pip install build==1.3.0
      - run: python -m build --wheel --outdir /tmp/umf-session-wheels python/umf_access
      - name: Install the host and pinned native drivers
        run: >-
          python -m pip install /tmp/umf-session-wheels/*.whl
          pydantic==2.13.5 'psycopg[binary]==3.2.13' psycopg-pool==3.3.3
          psycopg2-binary==2.9.11 sqlalchemy==2.0.44 greenlet==3.2.4
      - name: Install immutable Weft compiler cohort
        if: matrix.weft-cohort == 'published044'
        run: >-
          python -m pip install --no-deps
          'https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.44/weft_sql-0.4.44-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=eeb8fd0a89a9aa15dbe3fb1e71fa8613baa879d4c7193e084926aaf243dcdcbb'
      - uses: actions/checkout@v4
        if: matrix.weft-cohort == 'source-dbapi'
        with:
          repository: DocumentDrivenDX/weft
          ref: db1e0dc5b1ec6aec0f12646421cefc314989d974
          path: .ci-weft
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.weft-cohort == 'source-dbapi'
        with:
          toolchain: 1.90.0
      - name: Build and install exact DBAPI compiler source
        if: matrix.weft-cohort == 'source-dbapi'
        run: |
          python -m pip install maturin==1.9.6
          maturin build --manifest-path .ci-weft/crates/weft-python/Cargo.toml --locked --out /tmp/weft-native-wheels
          sha256sum /tmp/weft-native-wheels/*.whl > /tmp/umf-weft-wheel-sha256.txt
          python -m pip install --no-deps /tmp/weft-native-wheels/*.whl
      - name: Verify required prepared table operation API
        if: matrix.weft-cohort == 'source-dbapi'
        run: python -I -c "from weft import prepare_table_operation_module_json; assert callable(prepare_table_operation_module_json)"
      - run: >-
          bun scripts/umf-client-generate.ts generate --schema tests/unified/commerce.json
          --package shop --output /tmp/umf-session-client
      - name: Verify generated reads and native session ownership
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          DBAPI_FLAG: ${{ matrix.weft-cohort == 'source-dbapi' && '--dbapi' || '' }}
        run: >-
          python -I tests/unified/session_native_e2e.py
          --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres"
          --generated /tmp/umf-session-client --report /tmp/umf-session-native.json
          --psycopg2 --sqlalchemy
          $DBAPI_FLAG
      - name: Source-derived deployment catalog and role scope fixtures
        if: matrix.weft-cohort == 'source-dbapi'
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          python -m build --wheel --outdir /tmp/umf-deployment-wheels python/umf_codegen
          python -m pip install /tmp/umf-deployment-wheels/*.whl
          bun scripts/generate-legal-lifecycle.ts --check
          python -I tests/lifecycle/owner_via_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-owner-via-native.json
          bun tests/unified/table-deployment-fixture.ts /tmp/umf-table-deployment.json
          python -I tests/unified/table_deployment_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --bundle /tmp/umf-table-deployment.json --report /tmp/umf-table-deployment-native.json
          python -I tests/unified/table_role_scope_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --bundle /tmp/umf-table-deployment.json --report /tmp/umf-table-role-native.json
          python -I tests/unified/table_privileges_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --bundle /tmp/umf-table-deployment.json --report /tmp/umf-table-privileges-native.json
          bun tests/unified/table-ledger-fixture.ts /tmp/umf-table-ledger-plans.json
          python -I tests/unified/table_ledger_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --plans /tmp/umf-table-ledger-plans.json --report /tmp/umf-table-ledger-native.json
          bun tests/unified/table-ledger-fixture.ts /tmp/umf-operation-ledger-plans.json --typed-operations
          python -I tests/unified/table_ledger_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --plans /tmp/umf-operation-ledger-plans.json --report /tmp/umf-operation-ledger-native.json
          bun tests/unified/table-ledger-fixture.ts /tmp/umf-head-adapter-plans.json --typed-operations --quoted-schema
          python -I tests/unified/head_session_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --plans /tmp/umf-head-adapter-plans.json --report /tmp/umf-head-adapter-native.json
          python -I tests/unified/head_session_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --plans /tmp/umf-head-adapter-plans.json --correspondence --report /tmp/umf-correspondence-adapter-native.json
          python -I tests/unified/table_reads_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-table-reads-native.json
          bun tests/unified/table-domain-fixture.ts /tmp/umf-domain-model.json
          python -I tests/unified/table_reads_native.py --domains --source /tmp/umf-domain-model.json --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-table-domain-native.json
          bun tests/unified/table-temporal-fixture.ts /tmp/umf-temporal-model.json
          python -I tests/unified/table_reads_native.py --temporal --source /tmp/umf-temporal-model.json --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-table-temporal-native.json
          python -I tests/unified/table_reads_native.py --mutations --generated --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-table-generated-native.json
          python -I tests/unified/table_reads_native.py --mutations --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-table-writes-native.json
      - name: Prepare published v0.5.3 lifecycle oracle and run mixed migration acceptance
        if: matrix.weft-cohort == 'source-dbapi'
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          REVIEW_NATIVE_PREFIX: reviewed_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          createdb -h 127.0.0.1 -p "$POSTGRES_PORT" -U postgres umf_mixed_acceptance
          python -I tests/lifecycle/prepare-legacy-oracle.py --directory /tmp/umf-legacy-v053 --report /tmp/umf-legacy-v053.json
          python -I tests/lifecycle/mixed-native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=umf_mixed_acceptance user=postgres" --report /tmp/umf-mixed-native.json --legacy-python /tmp/umf-legacy-v053/venv/bin/python --legacy-provenance /tmp/umf-legacy-v053.json
          createdb -h 127.0.0.1 -p "$POSTGRES_PORT" -U postgres umf_reviewed_acceptance
          bun tests/lifecycle/reviewed-native-fixture.ts /tmp/umf-reviewed-native-fixture.json
          python -I tests/lifecycle/reviewed_native.py --fixture /tmp/umf-reviewed-native-fixture.json --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=umf_reviewed_acceptance user=postgres" --report /tmp/umf-reviewed-native-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-session-postgresql18-${{ matrix.weft-cohort }}
          path: |
            /tmp/umf-session-native.json
            /tmp/umf-weft-wheel-sha256.txt
            /tmp/umf-table-deployment-native.json
            /tmp/umf-table-role-native.json
            /tmp/umf-table-privileges-native.json
            /tmp/umf-table-ledger-native.json
            /tmp/umf-operation-ledger-native.json
            /tmp/umf-head-adapter-native.json
            /tmp/umf-correspondence-adapter-native.json
            /tmp/umf-table-reads-native.json
            /tmp/umf-table-writes-native.json
            /tmp/umf-table-generated-native.json
            /tmp/umf-table-temporal-native.json
            /tmp/umf-table-domain-native.json
            /tmp/umf-legacy-v053.json
            /tmp/umf-mixed-native.json
            /tmp/umf-reviewed-native-fixture.json
            /tmp/umf-reviewed-native-report.json

  rust-stage-one-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        id: runtime-python
        with:
          python-version: '3.11.17'
      - name: Isolate Rust toolchain from the runner image
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/umf-rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt
      - run: bun install --frozen-lockfile
      - run: python -m pip install build==1.3.0
      - run: python -m build --wheel --outdir /tmp/r3-access-runtime python/umf_access
      - run: python -m pip install /tmp/r3-access-runtime/*.whl pydantic==2.14.1
      - name: Build the shared Rust compiler binding
        run: |
          cargo build --locked --release -p umf-core-node
          cp target/release/libumf_core_node.so bindings/core/node/umf_core_node.node
      - name: Exercise generated Python creation and codecs with the installed runtime
        env:
          R3_RUNTIME_PYTHON: ${{ steps.runtime-python.outputs.python-path }}
        run: >-
          bun scripts/access-e2e.ts
          --python "$R3_RUNTIME_PYTHON"
          --wheel /tmp/r3-access-runtime/*.whl
          --report /tmp/r3-stage-runtime.json
          --rust-node-entry "$GITHUB_WORKSPACE/bindings/core/node/index.js"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-stage-one-runtime
          path: /tmp/r3-stage-runtime.json
