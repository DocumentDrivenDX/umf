# SPDX-License-Identifier: MIT OR Apache-2.0
name: Typed access boundaries

# Historical manual qualification recipe; current qualification runs locally.
# Preserve upstream native/cohort controls; codegen builds the Rust pair.
on:
  workflow_dispatch:

# Supersede PR revisions without cancelling explicit qualification snapshots.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: bun run test:access-boundaries
      - run: bun run check:access-boundaries

  portable-adoption:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - run: bun install --frozen-lockfile
      - name: Run isolated portable adoption checks
        env:
          UMF_UNIFIED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: bun test tests/access-adoption.test.ts

  table-declarations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun scripts/check-table-lifecycle-boundaries.ts
      - run: bun scripts/check-table-deployment-boundaries.ts
      - run: >-
          bun test tests/table-authoring/row-scope.test.ts tests/binding/tables.test.ts tests/binding/table-operations.test.ts tests/binding/table-temporal.test.ts tests/binding/table-domains.test.ts tests/binding/table-deployment.test.ts tests/binding/table-migration.test.ts
          tests/compilation/table-lifecycle-boundaries.test.ts tests/compilation/table-deployment-boundaries.test.ts
          tests/lifecycle/g02-derived-fill.test.ts tests/lifecycle/g02-temporal-native-fixture.test.ts
      - run: bunx playwright install --with-deps chromium
      - name: Actual browser metadata parity and preservation
        env:
          UMF_TABLE_BROWSER_EVIDENCE: /tmp/umf-table-browser.json
        run: bun scripts/table-lifecycle-browser.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-declaration-browser
          path: /tmp/umf-table-browser.json

  p1-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pydantic: ['2.13.5', '2.14.1']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - run: bun install --frozen-lockfile
      - run: python -m pip install build==1.3.0
      - run: python -m build --wheel --outdir /tmp/umf-p1-core-wheels python
      - run: python -m build --wheel --outdir /tmp/umf-p1-wheels python/umf_access
      - name: Install the built wheel with the platform Pydantic version
        env:
          PYDANTIC_VERSION: ${{ matrix.pydantic }}
        run: python -m pip install /tmp/umf-p1-core-wheels/*.whl /tmp/umf-p1-wheels/*.whl "pydantic==$PYDANTIC_VERSION"
      - name: Replay generated models and installed runtime checks
        env:
          PYDANTIC_VERSION: ${{ matrix.pydantic }}
        run: >-
          bun scripts/praxis-p1-compatibility.ts
          --python "$(command -v python)"
          --pydantic "$PYDANTIC_VERSION"
          --wheel /tmp/umf-p1-wheels/*.whl
          --report /tmp/umf-p1-compatibility.json
      - name: Check installed session scheduling and lease fault handling
        run: |
          python -I -m unittest discover -s python/umf_access/tests -p 'test_*session*.py' -v
          python -I -m unittest discover -s python/umf_access/tests -p 'test_table_read_values.py' -v
          python -I -m unittest discover -s python/umf_access/tests -p 'test_table_outcomes.py' -v
          python -I -m unittest discover -s python/umf_access/tests -p 'test_native_binding.py' -v
      - name: Check installed Rust access value bridges and codec consumers
        run: |
          python -I -m unittest discover -s python/umf_access/tests -p 'test_access_temporal_codec.py' -v
          python -I -m unittest discover -s python/umf_access/tests -p 'test_rust_exact_values.py' -v
          python -I -m unittest discover -s python/umf_access/tests -p 'test_rust_numeric_range.py' -v
          python -I -m unittest discover -s python/umf_access/tests -p 'test_rust_float32.py' -v
          python -I -m unittest discover -s python/umf_access/tests -p 'test_rust_access_constraints.py' -v
          python -I -m unittest discover -s python/umf_access/tests -p 'test_values_red.py' -v
          python -I -m unittest discover -s python/umf_access/tests -p 'test_runtime_driven_codecs.py' -v
      - name: Check portable sync and async clients
        run: >-
          bun test tests/access-native-table.test.ts tests/access-native-domains.test.ts tests/access-unified.test.ts tests/access-unified-sync.test.ts
          tests/access-unified-generation.test.ts tests/compilation/access-generator.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-compatibility-pydantic-${{ matrix.pydantic }}
          path: /tmp/umf-p1-compatibility.json


  python-codegen:
    name: python-codegen (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cell-id: linux-x86_64-py311
            architecture: x86_64
            python-version: '3.11'
          - os: ubuntu-24.04
            cell-id: linux-x86_64-py314
            architecture: x86_64
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - run: bun install --frozen-lockfile
      - run: cargo test --locked -p umf-cli -p umf-codegen
      - name: Test the native binary closure gate
        run: python scripts/rust-migration/r4/test_binary_closure.py
      - name: Build native core and codegen wheels through extracted sdists
        run: |
          CORE_VERSION="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("python/pyproject.toml").read_text())["project"]["version"])')"
          CODEGEN_VERSION="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("python/umf_codegen/pyproject.toml").read_text())["project"]["version"])')"
          python -m pip install build==1.3.0 hatchling==1.27.0
          cargo fetch --locked
          python -m build --sdist --outdir /tmp/umf-core-codegen-sdists python
          mkdir -p /tmp/umf-core-codegen-extracted
          tar -xzf "/tmp/umf-core-codegen-sdists/umf_core-${CORE_VERSION}.tar.gz" \
            -C /tmp/umf-core-codegen-extracted
          test -d "/tmp/umf-core-codegen-extracted/umf_core-${CORE_VERSION}"
          CARGO_TARGET_DIR=/tmp/umf-r4-sdist-cargo-target CARGO_NET_OFFLINE=true \
            python -m build --no-isolation --wheel \
            "/tmp/umf-core-codegen-extracted/umf_core-${CORE_VERSION}" \
            --outdir /tmp/umf-core-codegen-wheels
          python -m build --sdist --outdir /tmp/umf-codegen-sdists python/umf_codegen
          mkdir -p /tmp/umf-codegen-extracted
          tar -xzf "/tmp/umf-codegen-sdists/umf_codegen-${CODEGEN_VERSION}.tar.gz" \
            -C /tmp/umf-codegen-extracted
          test -d "/tmp/umf-codegen-extracted/umf_codegen-${CODEGEN_VERSION}"
          python -m build --no-isolation --wheel \
            "/tmp/umf-codegen-extracted/umf_codegen-${CODEGEN_VERSION}" \
            --outdir /tmp/umf-codegen-wheels
          python -m pip install /tmp/umf-core-codegen-wheels/*.whl
          CORE_VERSION="$CORE_VERSION" python -I -c 'import os; from importlib.metadata import version; from umf._rust import _rust_core; assert version("umf-core") == os.environ["CORE_VERSION"]; assert _rust_core.codegen_protocol_version() == "umf-codegen-r3-seven-ops-nine-resources/1"'
      - run: python scripts/check-codegen-boundaries.py
      - run: python tests/codegen/build_probe.py
      - run: bun scripts/row-scope-codegen-corpus.ts /tmp/umf-row-scope-codegen-corpus.json
      - run: bun scripts/codegen-corpus.ts /tmp/umf-codegen-corpus.json
      - run: bun scripts/table-deployment-corpus.ts /tmp/umf-deployment-corpus.json
      - run: bun scripts/table-migration-corpus.ts /tmp/umf-migration-corpus.json
      - run: bun scripts/table-reviewed-changes-corpus.ts /tmp/umf-reviewed-changes-corpus.json
      - name: Install the sdist-built native packages into a clean environment
        run: |
          python -m venv /tmp/umf-codegen-installed
          /tmp/umf-codegen-installed/bin/python -m pip --isolated install \
            --disable-pip-version-check --no-cache-dir 'pydantic==2.14.1'
          /tmp/umf-codegen-installed/bin/python -m pip --isolated install \
            --disable-pip-version-check --no-cache-dir --no-index --no-deps \
            /tmp/umf-core-codegen-wheels/umf_core-*.whl \
            /tmp/umf-codegen-wheels/umf_codegen-*.whl
          /tmp/umf-codegen-installed/bin/python -I -m pip check
          /tmp/umf-codegen-installed/bin/python -I -c 'import tomllib; from importlib.metadata import distributions, requires, version; from pathlib import Path; core = tomllib.loads(Path("python/pyproject.toml").read_text())["project"]["version"]; codegen = tomllib.loads(Path("python/umf_codegen/pyproject.toml").read_text())["project"]["version"]; assert version("umf-core") == core; assert version("umf-codegen") == codegen; metadata = (requires("umf-core") or []) + (requires("umf-codegen") or []); names = [distribution.metadata.get("Name", "").lower() for distribution in distributions()]; assert not any("mini-racer" in item.lower() or "v8" in item.lower() for item in metadata); assert not any("mini-racer" in name or "v8" in name for name in names)'
          /tmp/umf-codegen-installed/bin/python -I - <<'PY' > /tmp/umf-binary-closure.json
          import subprocess
          import sys
          import sysconfig
          from pathlib import Path
          root = Path(sysconfig.get_paths()["purelib"])
          script = Path("scripts/rust-migration/r4/check_binary_closure.py").resolve()
          binaries = [root / "umf/_rust_core.abi3.so", root / "umf/_bin/umf"]
          subprocess.run([sys.executable, "-I", str(script), "--package-root", str(root), "--cli-binary", str(binaries[1]), *(str(path) for path in binaries)], check=True)
          PY
          rm -rf /tmp/umf-r4-sdist-cargo-target
          env -i PATH='' /tmp/umf-codegen-installed/lib/python*/site-packages/umf/_bin/umf codegen --capabilities > /tmp/umf-cli-capabilities.json
          env -i PATH='' /tmp/umf-codegen-installed/bin/python -I -c 'from umf._rust import _rust_core; assert _rust_core.codegen_protocol_version() == "umf-codegen-r3-seven-ops-nine-resources/1"'
      - name: Run codegen unit tests against the installed native packages
        run: /tmp/umf-codegen-installed/bin/python -I -m unittest discover -s python/umf_codegen/tests -v
      - name: Installed row_scope normalizer parity
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/row_scope_probe.py
          --corpus /tmp/umf-row-scope-codegen-corpus.json > /tmp/umf-row-scope-report.json
      - name: Installed generator parity and writer controls
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/installed_probe.py
          --corpus /tmp/umf-codegen-corpus.json --report /tmp/umf-codegen-report.json
      - name: Installed deployment compiler and tamper controls
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/deployment_probe.py
          --corpus /tmp/umf-deployment-corpus.json --report /tmp/umf-deployment-python.json
      - name: Installed migration compiler and rehashed tamper controls
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/migration_probe.py
          --corpus /tmp/umf-migration-corpus.json --report /tmp/umf-migration-python.json
      - name: Installed reviewed-change discovery parity and source-forgery refusals
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/reviewed_changes_probe.py
          --corpus /tmp/umf-reviewed-changes-corpus.json > /tmp/umf-reviewed-changes-python.json
      - name: Check lock-driven wheel mirror refusal controls
        run: python tests/codegen/test_package_mirror.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegen-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            /tmp/umf-codegen-report.json
            /tmp/umf-codegen-corpus.json
            /tmp/umf-row-scope-report.json
            /tmp/umf-deployment-python.json
            /tmp/umf-migration-python.json
            /tmp/umf-reviewed-changes-python.json
            /tmp/umf-binary-closure.json
            /tmp/umf-cli-capabilities.json
            /tmp/umf-core-codegen-sdists/*
            /tmp/umf-core-codegen-wheels/*
            /tmp/umf-codegen-sdists/*
            /tmp/umf-codegen-wheels/*


  native-sessions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        weft-cohort: [source-dbapi]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - run: bun install --frozen-lockfile
      - run: python -m pip install build==1.3.0
      - run: python -m build --wheel --outdir /tmp/umf-session-core-wheels python
      - run: python -m build --wheel --outdir /tmp/umf-session-wheels python/umf_access
      - name: Install the host and pinned native drivers
        run: >-
          python -m pip install /tmp/umf-session-core-wheels/*.whl /tmp/umf-session-wheels/*.whl
          pydantic==2.13.5 'psycopg[binary]==3.2.13' psycopg-pool==3.3.3
          psycopg2-binary==2.9.11 sqlalchemy==2.0.44 greenlet==3.2.4
      - uses: actions/checkout@v4
        if: matrix.weft-cohort == 'source-dbapi'
        with:
          repository: DocumentDrivenDX/weft
          ref: db1e0dc5b1ec6aec0f12646421cefc314989d974
          path: .ci-weft
      - name: Isolate source DBAPI Rust toolchain from the runner image
        if: matrix.weft-cohort == 'source-dbapi'
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/umf-native-sessions-rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.weft-cohort == 'source-dbapi'
        with:
          toolchain: 1.90.0
          components: rustfmt
      - name: Build and install exact DBAPI compiler source
        if: matrix.weft-cohort == 'source-dbapi'
        run: |
          python -m pip install maturin==1.9.6
          maturin build --manifest-path .ci-weft/crates/weft-python/Cargo.toml --locked --out /tmp/weft-native-wheels
          sha256sum /tmp/weft-native-wheels/*.whl > /tmp/umf-weft-wheel-sha256.txt
          python -m pip install --no-deps /tmp/weft-native-wheels/*.whl
      - name: Verify required prepared table operation API
        if: matrix.weft-cohort == 'source-dbapi'
        run: python -I -c "from weft import prepare_table_operation_module_json; assert callable(prepare_table_operation_module_json)"
      - run: >-
          bun scripts/umf-client-generate.ts generate --schema tests/unified/commerce.json
          --package shop --output /tmp/umf-session-client
      - name: Verify generated reads and native session ownership
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          DBAPI_FLAG: ${{ matrix.weft-cohort == 'source-dbapi' && '--dbapi' || '' }}
        run: >-
          python -I tests/unified/session_native_e2e.py
          --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres"
          --generated /tmp/umf-session-client --report /tmp/umf-session-native.json
          --psycopg2 --sqlalchemy
          $DBAPI_FLAG
      - name: Source-derived deployment catalog and role scope fixtures
        if: matrix.weft-cohort == 'source-dbapi'
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          python -m build --wheel --outdir /tmp/umf-deployment-wheels python/umf_codegen
          python -m pip install /tmp/umf-deployment-wheels/*.whl
          bun scripts/generate-legal-lifecycle.ts --check
          python -I tests/lifecycle/owner_via_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-owner-via-native.json
          bun tests/unified/table-deployment-fixture.ts /tmp/umf-table-deployment.json
          python -I tests/unified/table_deployment_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --bundle /tmp/umf-table-deployment.json --report /tmp/umf-table-deployment-native.json
          python -I tests/unified/table_role_scope_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --bundle /tmp/umf-table-deployment.json --report /tmp/umf-table-role-native.json
          python -I tests/unified/table_privileges_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --bundle /tmp/umf-table-deployment.json --report /tmp/umf-table-privileges-native.json
          bun tests/unified/table-ledger-fixture.ts /tmp/umf-table-ledger-plans.json
          python -I tests/unified/table_ledger_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --plans /tmp/umf-table-ledger-plans.json --report /tmp/umf-table-ledger-native.json
          bun tests/unified/table-ledger-fixture.ts /tmp/umf-operation-ledger-plans.json --typed-operations
          python -I tests/unified/table_ledger_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --plans /tmp/umf-operation-ledger-plans.json --report /tmp/umf-operation-ledger-native.json
          bun tests/unified/table-ledger-fixture.ts /tmp/umf-head-adapter-plans.json --typed-operations --quoted-schema
          python -I tests/unified/head_session_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --plans /tmp/umf-head-adapter-plans.json --report /tmp/umf-head-adapter-native.json
          python -I tests/unified/head_session_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --plans /tmp/umf-head-adapter-plans.json --correspondence --report /tmp/umf-correspondence-adapter-native.json
          python -I tests/unified/table_reads_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-table-reads-native.json
          bun tests/unified/table-domain-fixture.ts /tmp/umf-domain-model.json
          python -I tests/unified/table_reads_native.py --domains --source /tmp/umf-domain-model.json --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-table-domain-native.json
          bun tests/unified/table-temporal-fixture.ts /tmp/umf-temporal-model.json
          python -I tests/unified/table_reads_native.py --temporal --source /tmp/umf-temporal-model.json --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-table-temporal-native.json
          python -I tests/unified/table_reads_native.py --mutations --generated --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-table-generated-native.json
          python -I tests/unified/table_reads_native.py --mutations --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-table-writes-native.json
      - name: Run current reviewed-change lifecycle acceptance
        if: matrix.weft-cohort == 'source-dbapi'
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          REVIEW_NATIVE_PREFIX: reviewed_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          createdb -h 127.0.0.1 -p "$POSTGRES_PORT" -U postgres umf_reviewed_acceptance
          bun tests/lifecycle/reviewed-native-fixture.ts /tmp/umf-reviewed-native-fixture.json
          python -I tests/lifecycle/reviewed_native.py --fixture /tmp/umf-reviewed-native-fixture.json --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=umf_reviewed_acceptance user=postgres" --report /tmp/umf-reviewed-native-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-session-postgresql18-${{ matrix.weft-cohort }}
          path: |
            /tmp/umf-session-native.json
            /tmp/umf-weft-wheel-sha256.txt
            /tmp/umf-table-deployment-native.json
            /tmp/umf-table-role-native.json
            /tmp/umf-table-privileges-native.json
            /tmp/umf-table-ledger-native.json
            /tmp/umf-operation-ledger-native.json
            /tmp/umf-head-adapter-native.json
            /tmp/umf-correspondence-adapter-native.json
            /tmp/umf-table-reads-native.json
            /tmp/umf-table-writes-native.json
            /tmp/umf-table-generated-native.json
            /tmp/umf-table-temporal-native.json
            /tmp/umf-table-domain-native.json
            /tmp/umf-reviewed-native-fixture.json
            /tmp/umf-reviewed-native-report.json

  rust-stage-one-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        id: runtime-python
        with:
          python-version: '3.11.17'
      - name: Isolate Rust toolchain from the runner image
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/umf-rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt
      - run: bun install --frozen-lockfile
      - run: python -m pip install build==1.3.0
      - run: python -m build --wheel --outdir /tmp/r3-core-runtime python
      - run: python -m build --wheel --outdir /tmp/r3-access-runtime python/umf_access
      - run: python -m pip install /tmp/r3-core-runtime/*.whl /tmp/r3-access-runtime/*.whl pydantic==2.14.1
      - name: Build the shared Rust compiler binding
        run: |
          cargo build --locked --release -p umf-core-node
          cp target/release/libumf_core_node.so bindings/core/node/umf_core_node.node
      - name: Exercise generated Python creation and codecs with the installed runtime
        env:
          R3_RUNTIME_PYTHON: ${{ steps.runtime-python.outputs.python-path }}
        run: >-
          bun scripts/access-e2e.ts
          --python "$R3_RUNTIME_PYTHON"
          --wheel /tmp/r3-access-runtime/*.whl
          --report /tmp/r3-stage-runtime.json
          --rust-node-entry "$GITHUB_WORKSPACE/bindings/core/node/index.js"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-stage-one-runtime
          path: /tmp/r3-stage-runtime.json
