# SPDX-License-Identifier: MIT OR Apache-2.0
name: Typed access boundaries

on:
  push:
    branches-ignore:
      - codex/migration-portable-qualification
      - codex/migration-integrated-qualification
      - codex/migration-metering-qualification
      - codex/migration-main-metering-generation
      - codex/migration-merged-generation
      - codex/g04-python-unit-qualification
      - codex/migration-g02-g03-native-qualification
      - codex/core-0102-inventory-generation
      - codex/mig-g02-typed-backfills
      - codex/core-python314-generation
      - codex/core-python314-public-install-proof
    tags:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: bun run test:access-boundaries
      - run: bun run check:access-boundaries

  portable-adoption:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - run: bun install --frozen-lockfile
      - name: Run isolated portable adoption checks
        env:
          UMF_UNIFIED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: bun test tests/access-adoption.test.ts

  table-declarations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun scripts/check-table-lifecycle-boundaries.ts
      - run: bun scripts/check-table-deployment-boundaries.ts
      - run: >-
          bun test tests/table-authoring/row-scope.test.ts tests/binding/tables.test.ts tests/binding/table-operations.test.ts tests/binding/table-temporal.test.ts tests/binding/table-domains.test.ts tests/binding/table-deployment.test.ts tests/binding/table-migration.test.ts
          tests/compilation/table-lifecycle-boundaries.test.ts tests/compilation/table-deployment-boundaries.test.ts
          tests/lifecycle/g02-derived-fill.test.ts tests/lifecycle/g02-temporal-native-fixture.test.ts
      - run: bunx playwright install --with-deps chromium
      - name: Actual browser metadata parity and preservation
        env:
          UMF_TABLE_BROWSER_EVIDENCE: /tmp/umf-table-browser.json
        run: bun scripts/table-lifecycle-browser.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-declaration-browser
          path: /tmp/umf-table-browser.json

  p1-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pydantic: ['2.13.5', '2.14.1']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bun install --frozen-lockfile
      - run: python -m pip install build==1.3.0
      - run: python -m build --wheel --outdir /tmp/umf-p1-wheels python/umf_access
      - name: Install the built wheel with the platform Pydantic version
        env:
          PYDANTIC_VERSION: ${{ matrix.pydantic }}
        run: python -m pip install /tmp/umf-p1-wheels/*.whl "pydantic==$PYDANTIC_VERSION"
      - name: Replay generated models and installed runtime checks
        env:
          PYDANTIC_VERSION: ${{ matrix.pydantic }}
        run: >-
          bun scripts/praxis-p1-compatibility.ts
          --python "$(command -v python)"
          --pydantic "$PYDANTIC_VERSION"
          --wheel /tmp/umf-p1-wheels/*.whl
          --report /tmp/umf-p1-compatibility.json
      - name: Check installed session scheduling and lease fault handling
        run: python -I -m unittest discover -s python/umf_access/tests -p 'test_*session*.py' -v
      - name: Check installed table read values
        run: python -I -m unittest discover -s python/umf_access/tests -p 'test_table_read_values.py' -v
      - name: Check installed table outcomes
        run: python -I -m unittest discover -s python/umf_access/tests -p 'test_table_outcomes.py' -v
      - name: Check installed native binding
        run: python -I -m unittest discover -s python/umf_access/tests -p 'test_native_binding.py' -v
      - name: Check portable sync and async clients
        run: >-
          bun test tests/access-native-table.test.ts tests/access-native-domains.test.ts tests/access-unified.test.ts tests/access-unified-sync.test.ts
          tests/access-unified-generation.test.ts tests/compilation/access-generator.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-compatibility-pydantic-${{ matrix.pydantic }}
          path: /tmp/umf-p1-compatibility.json


  native-client-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolate Rust toolchain from the runner image
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/umf-rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt
      - run: bun install --frozen-lockfile
      - run: python -m venv /tmp/native-client-checkers
      - run: /tmp/native-client-checkers/bin/pip install mypy==2.4.0 pyright==1.1.414 ty==0.0.88
      - name: Produce clients with the shared Rust engine
        run: |
          cargo build --locked --release -p umf-codegen --example r3_replay
          python scripts/rust-migration/r3/native-replay.py --binary target/release/examples/r3_replay --fixture docs/helix/04-build/evidence/rust-migration/r3/baseline/operations.json --report /tmp/r3-native-types-replay.json
          python scripts/rust-migration/r3/extract-native-clients.py --actual /tmp/r3-native-types-replay.actual.json --output /tmp/r3-native-generated > /tmp/r3-native-types-files.json
      - run: python scripts/verify-native-client-types.py --environment /tmp/native-client-checkers --work-dir /tmp/native-client-types --generated-dir /tmp/r3-native-generated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-client-types
          path: |
            /tmp/native-client-types/*-*.log
            /tmp/r3-native-types-*.json

  g02-native-postgresql:
    name: G02 native PostgreSQL (Python 3.11)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bun install --frozen-lockfile
      - name: Check checked-in embedded generator assets without rebuilding them
        run: bun scripts/build-codegen.ts --check
      - name: Install pinned Python package builders
        run: python -m pip install --disable-pip-version-check build==1.3.0 hatchling==1.27.0
      - name: Build current-source compiler corpus
        run: bun scripts/codegen-corpus.ts /tmp/g02-codegen-corpus.json
      - name: Acquire and verify the platform mini-racer wheel
        run: |
          python -m pip download --no-deps --only-binary=:all: --dest /tmp/g02-mini-racer-wheelhouse mini-racer==0.14.1
          python -I tests/codegen/verify_mini_racer_wheel.py \
            --wheelhouse /tmp/g02-mini-racer-wheelhouse \
            --pins docs/helix/04-build/evidence/praxis-embedder/mini-racer-wheel-pins.json \
            --expected-platform linux-x86_64-glibc-2.27+
      - name: Acquire current UMF wheels and the immutable released core and Weft wheels
        run: |
          python tests/codegen/acquire_offline_cohort.py \
            --output-dir /tmp/umf-g02-cohort \
            --source-commit '${{ github.sha }}' \
            --expected-os ubuntu-24.04 \
            --expected-architecture x86_64 \
            --expected-python 3.11 \
            --core-wheel-url 'https://github.com/DocumentDrivenDX/umf/releases/download/python-v0.10.2/umf_core-0.10.2-cp311-abi3-manylinux_2_34_x86_64.whl' \
            --core-wheel-filename 'umf_core-0.10.2-cp311-abi3-manylinux_2_34_x86_64.whl' \
            --core-wheel-sha256 '708f967747b0539b9ca7b6a5f39d1017eea8ddb1d07cd62f4f46592e088f6f39' \
            --core-version '0.10.2' \
            --core-release-tag 'python-v0.10.2' \
            --core-source-commit '6337b4b5f65144387ce5c0bbf9cbad955a921c8f' \
            --core-repository-url 'https://github.com/DocumentDrivenDX/umf' \
            --core-sdist-url 'https://github.com/DocumentDrivenDX/umf/releases/download/python-v0.10.2/umf_core-0.10.2.tar.gz' \
            --core-sdist-sha256 '90a107aaa507930e1d71c0cf208b77182d06c0bf2a1b13681fd5f7b6ed74cb9d' \
            --weft-wheel-url "https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.53/weft_sql-0.4.53-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" \
            --weft-wheel-filename 'weft_sql-0.4.53-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl' \
            --weft-wheel-sha256 "db01c4cf6357d674f1591609a2b9c83a9322ad8f8937c345e5950cc1582b83d2" \
            --mini-racer-wheel /tmp/g02-mini-racer-wheelhouse/*.whl
      - name: Qualify the hash-locked declared wheel mirror with missing, tampered and network-denial controls
        run: >-
          python -I tests/codegen/offline_mirror_probe.py
          --wheelhouse /tmp/umf-g02-cohort/wheelhouse
          --lock /tmp/umf-g02-cohort/cohort.lock.json
          --mirror /tmp/umf-g02-cohort/mirror
          --generator-corpus /tmp/g02-codegen-corpus.json
          --report /tmp/g02-offline-mirror.json
      - name: Install the exact locked cohort offline into an isolated environment
        run: |
          python -m venv /tmp/g02-native-installed
          /tmp/g02-native-installed/bin/python -I -m pip --isolated install \
            --disable-pip-version-check --no-cache-dir --no-index --only-binary=:all: \
            --find-links /tmp/umf-g02-cohort/wheelhouse --require-hashes \
            -r /tmp/umf-g02-cohort/mirror/requirements.lock
          /tmp/g02-native-installed/bin/python -I -m pip --isolated check
          /tmp/g02-native-installed/bin/python -I -c \
            "from importlib.metadata import version; assert version('weft-sql')=='0.4.53'; assert version('umf-access')=='0.1.0.dev8'; assert version('umf-codegen')=='0.1.0a5'; assert version('umf-core')=='0.10.2'"
          /tmp/g02-native-installed/bin/python -I - <<'PY'
          import psycopg
          with psycopg.connect('host=127.0.0.1 port=5432 dbname=postgres user=postgres') as connection:
              version, version_num=connection.execute("select current_setting('server_version'), current_setting('server_version_num')").fetchone()
          assert version_num=='180006', {'serverVersion':version, 'serverVersionNum':version_num}
          print({'postgresqlServerVersion':version, 'postgresqlServerVersionNum':version_num})
          PY
      - name: Generate and validate the exact native fixture corpus sizes
        run: |
          bun tests/lifecycle/g02-derived-fill-native-fixture.ts /tmp/g02-base-fixture.json
          bun tests/lifecycle/g02-null-semantics-native-fixture.ts /tmp/g02-null-fixture.json
          bun tests/lifecycle/g02-no-default-native-fixture.ts /tmp/g02-no-default-fixture.json
          bun tests/lifecycle/g02-temporal-native-fixture.ts /tmp/g02-temporal-fixture.json
          python - <<'PY'
          import json
          base=json.load(open('/tmp/g02-base-fixture.json'))
          nulls=json.load(open('/tmp/g02-null-fixture.json'))
          no_default=json.load(open('/tmp/g02-no-default-fixture.json'))
          temporal=json.load(open('/tmp/g02-temporal-fixture.json'))
          assert len(base['cases'])==2, len(base['cases'])
          assert len(nulls['cases'])==18, len(nulls['cases'])
          assert temporal['version']=='umf.g02-temporal-native-fixture/1'
          assert len(temporal['cases'])==5, len(temporal['cases'])
          assert temporal['provenance']['domain']=='SD-007 Person optional birthday example'
          for case in temporal['cases']:
            old=json.loads(case['initialSource']['utf8'])['modules'][0]['extensions']['umf.tables']['commands']
            new=json.loads(case['source']['utf8'])['modules'][0]['extensions']['umf.tables']['commands']
            assert len(old)==1 and old==new[:1] and old[0]['id']=='create_person'
            assert len(new)==2 and new[1]['version']=='umf.table-operation/0.2'
          assert no_default['version']=='umf.praxis.g02-no-default-native-fixture/1'
          assert json.loads(no_default['initialSource']['utf8'])['modules'][0]['extensions']['umf.tables']['commands']==[]
          assert [command['id'] for command in json.loads(no_default['source']['utf8'])['modules'][0]['extensions']['umf.tables']['commands']]==['derive_total']
          assert 'default' not in next(column for column in json.loads(no_default['source']['utf8'])['modules'][0]['extensions']['umf.tables']['tables'][0]['columns'] if column['name']=='total')
          PY
      - name: Verify G02 temporal observer controls
        env:
          UMF_G02_TEMPORAL_FIXTURE: /tmp/g02-temporal-fixture.json
        run: /tmp/g02-native-installed/bin/python -I tests/lifecycle/g02-temporal-native-observer.test.py
      - name: Run the base two-case PostgreSQL 18.6 qualification
        run: >-
          /tmp/g02-native-installed/bin/python -I tests/lifecycle/derived-fill-native.py
          --dsn 'host=127.0.0.1 port=5432 dbname=postgres user=postgres'
          --fixture /tmp/g02-base-fixture.json
          --report /tmp/g02-base-native.json
      - name: Run all 18 intrinsic-NULL and conditional PostgreSQL cases
        run: >-
          /tmp/g02-native-installed/bin/python -I tests/lifecycle/derived-fill-native.py
          --dsn 'host=127.0.0.1 port=5432 dbname=postgres user=postgres'
          --fixture /tmp/g02-null-fixture.json
          --report /tmp/g02-null-native.json
      - name: Qualify appended required target with no declared future default
        run: >-
          /tmp/g02-native-installed/bin/python -I tests/lifecycle/g02-no-default-native.py
          --dsn 'host=127.0.0.1 port=5432 dbname=postgres user=postgres'
          --fixture /tmp/g02-no-default-fixture.json
          --report /tmp/g02-no-default-native.json
      - name: Qualify native date, instant, UUID and boolean G02 carriers
        run: >-
          /tmp/g02-native-installed/bin/python -I tests/lifecycle/g02-temporal-native.py
          --dsn 'host=127.0.0.1 port=5432 dbname=postgres user=postgres'
          --fixture /tmp/g02-temporal-fixture.json
          --report /tmp/g02-temporal-native.json
      - name: Bind three recovery fault scenarios to the complete immutable inputs
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          root=pathlib.Path('/tmp/umf-g02-cohort')
          wheels={p.name:{'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size} for p in sorted((root/'wheelhouse').glob('*.whl'))}
          locked=json.loads((root/'cohort.lock.json').read_text())['wheels']
          assert set(wheels)=={item['filename'] for item in locked}, (len(wheels),len(locked))
          manifest={
            'candidate':'G02-native-${{ github.sha }}',
            'sourceCommit':'${{ github.sha }}',
            'weftReleasePin':{'version':'0.4.53','url':'https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.53/weft_sql-0.4.53-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl','sha256':'db01c4cf6357d674f1591609a2b9c83a9322ad8f8937c345e5950cc1582b83d2'},
            'cohortLockSha256':hashlib.sha256((root/'cohort.lock.json').read_bytes()).hexdigest(),
            'embeddedGeneratorManifestSha256':hashlib.sha256(pathlib.Path('python/umf_codegen/src/umf_codegen/_assets/manifest.json').read_bytes()).hexdigest(),
            'embeddedGeneratorInputHashes':json.loads(pathlib.Path('python/umf_codegen/src/umf_codegen/_assets/manifest.json').read_text())['inputs'],
            'codegenCorpusSha256':hashlib.sha256(pathlib.Path('/tmp/g02-codegen-corpus.json').read_bytes()).hexdigest(),
            'fixtureHashes':{name:hashlib.sha256(pathlib.Path('/tmp/'+name).read_bytes()).hexdigest() for name in ('g02-base-fixture.json','g02-null-fixture.json','g02-no-default-fixture.json','g02-temporal-fixture.json')},
            'nativeRunnerHashes':{name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in ('tests/lifecycle/derived-fill-native.py','tests/lifecycle/g02-faults-native.py','tests/lifecycle/g02-derived-fill-native-fixture.ts','tests/lifecycle/g02-null-semantics-native-fixture.ts','tests/lifecycle/g02-no-default-native.py','tests/lifecycle/g02-no-default-native-fixture.ts','tests/lifecycle/g02-temporal-native.py','tests/lifecycle/g02-temporal-native-fixture.ts')},
            'artifacts':wheels,
          }
          pathlib.Path('/tmp/g02-candidate-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY
          for scenario in fenced-resume backfill-commit-lost existing-target-commit-lost; do
            /tmp/g02-native-installed/bin/python -I tests/lifecycle/g02-faults-native.py \
              --dsn 'host=127.0.0.1 port=5432 dbname=postgres user=postgres' \
              --fixture /tmp/g02-base-fixture.json \
              --manifest /tmp/g02-candidate-manifest.json \
              --scenario "$scenario" --report "/tmp/g02-${scenario}.json"
          done

      - name: Initialize the reviewer-owned G02-D5 replay receipt
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/mig-g02-typed-backfills'
        timeout-minutes: 1
        env:
          D5_ROOT: ${{ runner.temp }}/g02-d5-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test ! -e "$D5_ROOT"
          now_ms="$(awk '{printf "%d", $1 * 1000}' /proc/uptime)"
          mkdir -p "$D5_ROOT/evidence/logs" "$D5_ROOT/evidence/reports" "$D5_ROOT/evidence/replay" "$D5_ROOT/upload"
          printf '%s\n' "$now_ms" > "$D5_ROOT/monotonic-start-ms"
          printf '%s\n' "$((now_ms + 1800000))" > "$D5_ROOT/monotonic-deadline-ms"
          python -I - "$D5_ROOT/upload/d5-receipt.json" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REF" <<'PY'
          import json, pathlib, sys
          path, source, run_id, attempt, ref = sys.argv[1:]
          pathlib.Path(path).write_text(json.dumps({
              "status": "FAIL_OR_UNKNOWN", "scope": "G02-D5 independent native replay",
              "sourceCommit": source, "runId": run_id, "runAttempt": attempt,
              "ref": ref, "reason": "finalizer has not validated the fixed report and cleanup roster"
          }, sort_keys=True) + "\n")
          PY

      - name: Replay the frozen independent G02-D5 matrix on the current 18-wheel cohort
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/mig-g02-typed-backfills'
        timeout-minutes: 30
        env:
          D5_ROOT: ${{ runner.temp }}/g02-d5-${{ github.run_id }}-${{ github.run_attempt }}
          PG_DSN: host=127.0.0.1 port=5432 dbname=postgres user=postgres application_name=umf_g02_d5 connect_timeout=5 options='-c statement_timeout=120000 -c lock_timeout=5000'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          START_MS="$(cat "$D5_ROOT/monotonic-start-ms")"
          DEADLINE_MS="$(cat "$D5_ROOT/monotonic-deadline-ms")"
          NOW_MS="$(awk '{printf "%d", $1 * 1000}' /proc/uptime)"
          REMAINING_SECONDS="$(((DEADLINE_MS - NOW_MS - 70000) / 1000))"
          if (( REMAINING_SECONDS <= 0 )); then
            echo "Original 30-minute D5 budget exhausted before replay work." >&2
            exit 124
          fi
          timeout --signal=TERM --kill-after=10s "${REMAINING_SECONDS}s" bash -euo pipefail <<'BOUNDED_D5_WORK'
          EVIDENCE="$D5_ROOT/evidence"
          WORK="$D5_ROOT/work"
          VENV_PARENT="$D5_ROOT/venv-parent"
          VENV="$VENV_PARENT/venv"
          mkdir -p "$WORK" "$VENV_PARENT" "$EVIDENCE/logs" "$EVIDENCE/reports" "$EVIDENCE/replay"
          : > "$EVIDENCE/command-records.jsonl"

          run_bounded() {
            local name="$1" maximum="$2" now_ms deadline_ms remaining limit status capture_status log started_ms ended_ms prior_log_bytes available_log_bytes
            local -a pipeline_status
            shift 2
            now_ms="$(awk '{printf "%d", $1 * 1000}' /proc/uptime)"
            deadline_ms="$(cat "$D5_ROOT/monotonic-deadline-ms")"
            remaining="$(((deadline_ms - now_ms - 70000) / 1000))"
            if (( remaining <= 0 )); then
              echo "Original D5 aggregate work deadline exhausted before $name" >&2
              return 124
            fi
            limit="$maximum"
            if (( remaining < limit )); then limit="$remaining"; fi
            log="$EVIDENCE/logs/$name.log"
            prior_log_bytes="$(find "$EVIDENCE/logs" -type f -name '*.log' -exec wc -c {} + | awk 'END {print $1+0}')"
            available_log_bytes=$((1048576 - prior_log_bytes))
            if (( available_log_bytes < 0 )); then available_log_bytes=0; fi
            started_ms="$now_ms"
            : > "$log"
            set +e
            timeout --signal=TERM --kill-after=10s "${limit}s" "$@" 2>&1 | python -I -c '
          import sys
          path, cap = sys.argv[1], int(sys.argv[2])
          marker = b"\n[LOG TRUNCATED: output exceeded aggregate capture cap]\n"
          failed = False
          truncated = False
          stored = 0
          try:
              output = open(path, "wb", buffering=0)
          except OSError:
              output = None
              failed = True
          while True:
              chunk = sys.stdin.buffer.read(65536)
              if not chunk:
                  break
              if output is None:
                  continue
              available = max(0, cap - stored)
              piece = chunk[:available]
              if piece:
                  try:
                      output.write(piece)
                      stored += len(piece)
                  except OSError:
                      failed = True
                      try: output.close()
                      except OSError: pass
                      output = None
              if len(chunk) > available:
                  truncated = True
          if output is not None:
              try:
