  python-codegen:
    name: python-codegen (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cell-id: linux-x86_64-py311
            architecture: x86_64
            mini-racer-platform: linux-x86_64-glibc-2.27+
            core-wheel-filename: umf_core-0.10.2-cp311-abi3-manylinux_2_34_x86_64.whl
            core-wheel-url: https://github.com/DocumentDrivenDX/umf/releases/download/python-v0.10.2/umf_core-0.10.2-cp311-abi3-manylinux_2_34_x86_64.whl
            core-wheel-sha256: 708f967747b0539b9ca7b6a5f39d1017eea8ddb1d07cd62f4f46592e088f6f39
            weft-wheel-filename: weft_sql-0.4.53-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
            weft-wheel-url: https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.53/weft_sql-0.4.53-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
            weft-wheel-sha256: db01c4cf6357d674f1591609a2b9c83a9322ad8f8937c345e5950cc1582b83d2
            python-version: '3.11'
          - os: ubuntu-24.04
            cell-id: linux-x86_64-py314
            architecture: x86_64
            mini-racer-platform: linux-x86_64-glibc-2.27+
            core-wheel-filename: umf_core-0.10.2-cp311-abi3-manylinux_2_34_x86_64.whl
            core-wheel-url: https://github.com/DocumentDrivenDX/umf/releases/download/python-v0.10.2/umf_core-0.10.2-cp311-abi3-manylinux_2_34_x86_64.whl
            core-wheel-sha256: 708f967747b0539b9ca7b6a5f39d1017eea8ddb1d07cd62f4f46592e088f6f39
            weft-wheel-filename: weft_sql-0.4.53-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
            weft-wheel-url: https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.53/weft_sql-0.4.53-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
            weft-wheel-sha256: db01c4cf6357d674f1591609a2b9c83a9322ad8f8937c345e5950cc1582b83d2
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - run: bun install --frozen-lockfile
      - run: bun test tests/compilation/codegen-gzip.test.ts
      - run: bun scripts/build-codegen.ts --check
      - run: python scripts/check-codegen-boundaries.py
      - name: Run codegen unit tests against the checked-out source package
        env:
          PYTHONPATH: python/umf_codegen/src
        run: python -m unittest discover -s python/umf_codegen/tests -v
      - run: python -m pip install build==1.3.0 hatchling==1.27.0
      - run: python tests/codegen/build_probe.py
      - run: bun scripts/row-scope-codegen-corpus.ts /tmp/umf-row-scope-codegen-corpus.json
      - name: Build wheel through the self-contained source distribution
        run: python -m build python/umf_codegen --outdir /tmp/umf-codegen-wheels
      - run: bun scripts/codegen-corpus.ts /tmp/umf-codegen-corpus.json
      - run: bun scripts/table-deployment-corpus.ts /tmp/umf-deployment-corpus.json
      - run: bun scripts/table-migration-corpus.ts /tmp/umf-migration-corpus.json
      - run: bun scripts/table-reviewed-changes-corpus.ts /tmp/umf-reviewed-changes-corpus.json
      - name: Acquire and verify the exact mini-racer platform wheel
        run: |
          python -m pip download --no-deps --only-binary=:all: --dest /tmp/mini-racer-wheelhouse mini-racer==0.14.1
          python -I tests/codegen/verify_mini_racer_wheel.py \
            --wheelhouse /tmp/mini-racer-wheelhouse \
            --pins docs/helix/04-build/evidence/praxis-embedder/mini-racer-wheel-pins.json \
            --expected-platform '${{ matrix.mini-racer-platform }}'
      - name: Install exact local wheels into a clean environment
        run: |
          python -m venv /tmp/umf-codegen-installed
          /tmp/umf-codegen-installed/bin/python -m pip --isolated install \
            --disable-pip-version-check --no-cache-dir --no-index --no-deps \
            /tmp/mini-racer-wheelhouse/*.whl /tmp/umf-codegen-wheels/*.whl
          /tmp/umf-codegen-installed/bin/python -I -m pip check
      - name: Installed row_scope normalizer parity
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/row_scope_probe.py
          --corpus /tmp/umf-row-scope-codegen-corpus.json > /tmp/umf-row-scope-report.json
      - name: Installed generator parity without external JavaScript processes
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/installed_probe.py
          --corpus /tmp/umf-codegen-corpus.json --report /tmp/umf-codegen-report.json
      - name: Installed original deployment compiler and tamper controls
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/deployment_probe.py
          --corpus /tmp/umf-deployment-corpus.json --report /tmp/umf-deployment-python.json
      - name: Installed original migration compiler and rehashed tamper controls
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/migration_probe.py
          --corpus /tmp/umf-migration-corpus.json --report /tmp/umf-migration-python.json
      - name: Installed reviewed-change discovery parity and source-forgery refusals
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/reviewed_changes_probe.py
          --corpus /tmp/umf-reviewed-changes-corpus.json > /tmp/umf-reviewed-changes-python.json
      - name: Verify matrix cell and write immutable receipt
        run: >-
          /tmp/umf-codegen-installed/bin/python -I tests/codegen/matrix_receipt.py
          --wheelhouse /tmp/mini-racer-wheelhouse
          --pins docs/helix/04-build/evidence/praxis-embedder/mini-racer-wheel-pins.json
          --corpus /tmp/umf-codegen-corpus.json
          --generator-report /tmp/umf-codegen-report.json
          --row-scope-report /tmp/umf-row-scope-report.json
          --deployment-report /tmp/umf-deployment-python.json
          --migration-report /tmp/umf-migration-python.json
          --reviewed-report /tmp/umf-reviewed-changes-python.json
          --expected-os '${{ matrix.os }}'
          --expected-arch '${{ matrix.architecture }}'
          --expected-python '${{ matrix.python-version }}'
          --source-commit '${{ github.sha }}'
          --report /tmp/umf-codegen-matrix-receipt.json
      - name: Verify the lock-driven offline mirror and refusal controls
        run: python tests/codegen/test_package_mirror.py
      - name: Run reviewed exact Core selector controls
        run: python -m unittest discover -s tests/codegen -p test_cohort_selector.py -v
      - name: Run reviewed aggregate cohort controls
        run: python -m unittest discover -s tests/codegen -p test_aggregate_cohort.py -v
      - name: Acquire and freeze the exact declared installed cohort for this cell
        run: >-
          python tests/codegen/acquire_offline_cohort.py
          --output-dir /tmp/umf-full-cohort
          --source-commit '${{ github.sha }}'
          --expected-os '${{ matrix.os }}'
          --expected-architecture '${{ matrix.architecture }}'
          --expected-python '${{ matrix.python-version }}'
          --core-wheel-url '${{ matrix.core-wheel-url }}'
          --core-wheel-filename '${{ matrix.core-wheel-filename }}'
          --core-wheel-sha256 '${{ matrix.core-wheel-sha256 }}'
          --core-version '0.10.2'
          --core-release-tag 'python-v0.10.2'
          --core-source-commit '6337b4b5f65144387ce5c0bbf9cbad955a921c8f'
          --core-repository-url 'https://github.com/DocumentDrivenDX/umf'
          --core-sdist-url 'https://github.com/DocumentDrivenDX/umf/releases/download/python-v0.10.2/umf_core-0.10.2.tar.gz'
          --core-sdist-sha256 '90a107aaa507930e1d71c0cf208b77182d06c0bf2a1b13681fd5f7b6ed74cb9d'
          --weft-wheel-url '${{ matrix.weft-wheel-url }}'
          --weft-wheel-filename '${{ matrix.weft-wheel-filename }}'
          --weft-wheel-sha256 '${{ matrix.weft-wheel-sha256 }}'
          --mini-racer-wheel /tmp/mini-racer-wheelhouse/*.whl
      - name: Install and exercise this producer cell's frozen mirror with OS network denial
        run: >-
          python -I tests/codegen/offline_mirror_probe.py
          --wheelhouse /tmp/umf-full-cohort/wheelhouse
          --lock /tmp/umf-full-cohort/cohort.lock.json
          --mirror /tmp/umf-full-cohort/mirror
          --generator-corpus /tmp/umf-codegen-corpus.json
          --report /tmp/umf-full-cohort/offline-mirror-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegen-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            /tmp/umf-codegen-matrix-receipt.json
            /tmp/umf-codegen-report.json
            /tmp/umf-codegen-corpus.json
            /tmp/umf-row-scope-report.json
            /tmp/umf-deployment-python.json
            /tmp/umf-migration-python.json
            /tmp/umf-reviewed-changes-python.json
            /tmp/umf-full-cohort/cohort.lock.json
            /tmp/umf-full-cohort/cohort-template.json
            /tmp/umf-full-cohort/mirror/manifest.json
            /tmp/umf-full-cohort/offline-mirror-receipt.json
            /tmp/umf-full-cohort/wheelhouse/*.whl
            /tmp/umf-full-cohort/release-inputs/*


  aggregate-python-cohort:
    name: assemble closed four-cell Python wheel union
    runs-on: ubuntu-24.04
    needs: python-codegen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: codegen-*
          path: /tmp/codegen-cell-artifacts
      - name: Bind all four producer locks and release inputs to the cell IDs
        run: |
          set -euo pipefail
          input=/tmp/aggregate-input
          mkdir -p "$input"
          declare -A ids=(
            [codegen-ubuntu-24.04-py3.11]=linux-x86_64-py311
            [codegen-ubuntu-24.04-py3.14]=linux-x86_64-py314
            [codegen-macos-14-py3.11]=macos-arm64-py311
            [codegen-macos-14-py3.14]=macos-arm64-py314
          )
          for artifact in "${!ids[@]}"; do
            root="/tmp/codegen-cell-artifacts/$artifact"
            lock=$(find "$root" -name cohort.lock.json -type f -print -quit)
            test -n "$lock"
            cohort=$(dirname "$lock")
            cell="$input/${ids[$artifact]}"
            mkdir -p "$cell/wheelhouse"
            cp "$lock" "$cell/cohort.lock.json"
            cp "$cohort/offline-mirror-receipt.json" "$cell/offline-mirror-receipt.json"
            cp "$cohort"/wheelhouse/*.whl "$cell/wheelhouse/"
          done
          python - <<'PY'
          import hashlib, pathlib, shutil
          root=pathlib.Path('/tmp/codegen-cell-artifacts')
          target=pathlib.Path('/tmp/aggregate-generator-corpus.json')
          matches=sorted(root.rglob('umf-codegen-corpus.json'))
          assert len(matches)==4, len(matches)
          digests={hashlib.sha256(path.read_bytes()).hexdigest() for path in matches}
          assert len(digests)==1, 'producer source corpora differ'
          shutil.copyfile(matches[0], target)
          PY
      - name: Assemble and verify the one closed aggregate mirror
        run: >-
          python -I tests/codegen/aggregate_cohort.py assemble
          --input-root /tmp/aggregate-input
          --output /tmp/umf-aggregate-cohort
          --source-commit '${{ github.sha }}'
      - name: Bind the identical compiler corpus into the aggregate artifact
        run: cp /tmp/aggregate-generator-corpus.json /tmp/umf-aggregate-cohort/generator-corpus.json
      - uses: actions/upload-artifact@v4
        with:
          name: umf-aggregate-cohort-${{ github.sha }}
          path: /tmp/umf-aggregate-cohort/**


  python-union-replay:
    name: aggregate-union replay (${{ matrix.cell-id }})
    runs-on: ${{ matrix.os }}
    needs: aggregate-python-cohort
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell-id: linux-x86_64-py311
            os: ubuntu-24.04
            python-version: '3.11'
          - cell-id: linux-x86_64-py314
            os: ubuntu-24.04
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: umf-aggregate-cohort-${{ github.sha }}
          path: /tmp/umf-aggregate-cohort
      - name: Replay the selected lock from the shared union under network denial
        run: >-
          python -I tests/codegen/offline_mirror_probe.py
          --aggregate-index /tmp/umf-aggregate-cohort/aggregate.json
          --selected-cell '${{ matrix.cell-id }}'
          --expected-source-commit '${{ github.sha }}'
          --mirror /tmp/umf-aggregate-cohort/mirror
          --generator-corpus /tmp/umf-aggregate-cohort/generator-corpus.json
          --report /tmp/umf-union-replay-${{ matrix.cell-id }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: union-replay-${{ matrix.cell-id }}-${{ github.sha }}
          path: /tmp/umf-union-replay-${{ matrix.cell-id }}.json


  native-sessions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        weft-cohort: [published044, source-dbapi]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bun install --frozen-lockfile
      - run: python -m pip install build==1.3.0
      - run: python -m build --wheel --outdir /tmp/umf-session-wheels python/umf_access
      - name: Install the host and pinned native drivers
        run: >-
          python -m pip install /tmp/umf-session-wheels/*.whl
          pydantic==2.13.5 'psycopg[binary]==3.2.13' psycopg-pool==3.3.3
          psycopg2-binary==2.9.11 sqlalchemy==2.0.44 greenlet==3.2.4
      - name: Install immutable Weft compiler cohort
        if: matrix.weft-cohort == 'published044'
        run: >-
          python -m pip install --no-deps
          'https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.44/weft_sql-0.4.44-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=eeb8fd0a89a9aa15dbe3fb1e71fa8613baa879d4c7193e084926aaf243dcdcbb'
      - uses: actions/checkout@v4
        if: matrix.weft-cohort == 'source-dbapi'
        with:
          repository: DocumentDrivenDX/weft
          ref: db1e0dc5b1ec6aec0f12646421cefc314989d974
          path: .ci-weft
      - name: Isolate source DBAPI Rust toolchain from the runner image
        if: matrix.weft-cohort == 'source-dbapi'
        run: echo "RUSTUP_HOME=$RUNNER_TEMP/umf-native-sessions-rustup" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.weft-cohort == 'source-dbapi'
        with:
          toolchain: 1.90.0
          components: rustfmt
      - name: Build and install exact DBAPI compiler source
        if: matrix.weft-cohort == 'source-dbapi'
        run: |
          python -m pip install maturin==1.9.6
          maturin build --manifest-path .ci-weft/crates/weft-python/Cargo.toml --locked --out /tmp/weft-native-wheels
          sha256sum /tmp/weft-native-wheels/*.whl > /tmp/umf-weft-wheel-sha256.txt
          python -m pip install --no-deps /tmp/weft-native-wheels/*.whl
      - name: Verify required prepared table operation API
        if: matrix.weft-cohort == 'source-dbapi'
        run: python -I -c "from weft import prepare_table_operation_module_json; assert callable(prepare_table_operation_module_json)"
      - run: >-
          bun scripts/umf-client-generate.ts generate --schema tests/unified/commerce.json
          --package shop --output /tmp/umf-session-client
      - name: Verify generated reads and native session ownership
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          DBAPI_FLAG: ${{ matrix.weft-cohort == 'source-dbapi' && '--dbapi' || '' }}
        run: >-
          python -I tests/unified/session_native_e2e.py
          --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres"
          --generated /tmp/umf-session-client --report /tmp/umf-session-native.json
          --psycopg2 --sqlalchemy
          $DBAPI_FLAG
      - name: Source-derived deployment catalog and role scope fixtures
        if: matrix.weft-cohort == 'source-dbapi'
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          python -m build --wheel --outdir /tmp/umf-deployment-wheels python/umf_codegen
          python -m pip install /tmp/umf-deployment-wheels/*.whl
          bun scripts/generate-legal-lifecycle.ts --check
          python -I tests/lifecycle/owner_via_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-owner-via-native.json
          bun tests/unified/table-deployment-fixture.ts /tmp/umf-table-deployment.json
          python -I tests/unified/table_deployment_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --bundle /tmp/umf-table-deployment.json --report /tmp/umf-table-deployment-native.json
          python -I tests/unified/table_role_scope_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --bundle /tmp/umf-table-deployment.json --report /tmp/umf-table-role-native.json
          python -I tests/unified/table_privileges_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --bundle /tmp/umf-table-deployment.json --report /tmp/umf-table-privileges-native.json
          bun tests/unified/table-ledger-fixture.ts /tmp/umf-table-ledger-plans.json
          python -I tests/unified/table_ledger_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --plans /tmp/umf-table-ledger-plans.json --report /tmp/umf-table-ledger-native.json
          bun tests/unified/table-ledger-fixture.ts /tmp/umf-operation-ledger-plans.json --typed-operations
          python -I tests/unified/table_ledger_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --plans /tmp/umf-operation-ledger-plans.json --report /tmp/umf-operation-ledger-native.json
          bun tests/unified/table-ledger-fixture.ts /tmp/umf-head-adapter-plans.json --typed-operations --quoted-schema
          python -I tests/unified/head_session_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --plans /tmp/umf-head-adapter-plans.json --report /tmp/umf-head-adapter-native.json
          python -I tests/unified/head_session_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --plans /tmp/umf-head-adapter-plans.json --correspondence --report /tmp/umf-correspondence-adapter-native.json
          python -I tests/unified/table_reads_native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-table-reads-native.json
          bun tests/unified/table-domain-fixture.ts /tmp/umf-domain-model.json
          python -I tests/unified/table_reads_native.py --domains --source /tmp/umf-domain-model.json --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-table-domain-native.json
          bun tests/unified/table-temporal-fixture.ts /tmp/umf-temporal-model.json
          python -I tests/unified/table_reads_native.py --temporal --source /tmp/umf-temporal-model.json --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-table-temporal-native.json
          python -I tests/unified/table_reads_native.py --mutations --generated --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-table-generated-native.json
          python -I tests/unified/table_reads_native.py --mutations --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres" --report /tmp/umf-table-writes-native.json
      - name: Prepare published v0.5.3 lifecycle oracle and run mixed migration acceptance
        if: matrix.weft-cohort == 'source-dbapi'
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          REVIEW_NATIVE_PREFIX: reviewed_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          createdb -h 127.0.0.1 -p "$POSTGRES_PORT" -U postgres umf_mixed_acceptance
          python -I tests/lifecycle/prepare-legacy-oracle.py --directory /tmp/umf-legacy-v053 --report /tmp/umf-legacy-v053.json
          python -I tests/lifecycle/mixed-native.py --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=umf_mixed_acceptance user=postgres" --report /tmp/umf-mixed-native.json --legacy-python /tmp/umf-legacy-v053/venv/bin/python --legacy-provenance /tmp/umf-legacy-v053.json
          createdb -h 127.0.0.1 -p "$POSTGRES_PORT" -U postgres umf_reviewed_acceptance
          bun tests/lifecycle/reviewed-native-fixture.ts /tmp/umf-reviewed-native-fixture.json
          python -I tests/lifecycle/reviewed_native.py --fixture /tmp/umf-reviewed-native-fixture.json --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=umf_reviewed_acceptance user=postgres" --report /tmp/umf-reviewed-native-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-session-postgresql18-${{ matrix.weft-cohort }}
          path: |
