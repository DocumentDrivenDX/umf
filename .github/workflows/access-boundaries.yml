# SPDX-License-Identifier: MIT OR Apache-2.0
name: Typed access boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: bun run test:access-boundaries
      - run: bun run check:access-boundaries

  p1-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pydantic: ['2.13.5', '2.14.1']
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bun install --frozen-lockfile
      - run: python -m pip install build==1.3.0
      - run: python -m build --wheel --outdir /tmp/umf-p1-wheels python/umf_access
      - name: Install the built wheel with the platform Pydantic version
        env:
          PYDANTIC_VERSION: ${{ matrix.pydantic }}
        run: python -m pip install /tmp/umf-p1-wheels/*.whl "pydantic==$PYDANTIC_VERSION"
      - name: Replay generated models and installed runtime checks
        env:
          PYDANTIC_VERSION: ${{ matrix.pydantic }}
        run: >-
          bun scripts/praxis-p1-compatibility.ts
          --python "$(command -v python)"
          --pydantic "$PYDANTIC_VERSION"
          --wheel /tmp/umf-p1-wheels/*.whl
          --report /tmp/umf-p1-compatibility.json
      - name: Check installed session scheduling and lease fault handling
        run: python -I -m unittest discover -s python/umf_access/tests -p 'test_*session*.py' -v
      - name: Check portable sync and async clients
        run: >-
          bun test tests/access-unified.test.ts tests/access-unified-sync.test.ts
          tests/access-unified-generation.test.ts tests/compilation/access-generator.test.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-compatibility-pydantic-${{ matrix.pydantic }}
          path: /tmp/umf-p1-compatibility.json


  python-codegen:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-codegen.ts --check
      - run: python scripts/check-codegen-boundaries.py
      - run: python -m unittest discover -s python/umf_codegen/tests -v
      - run: python -m pip install build==1.3.0 hatchling==1.27.0
      - run: python tests/codegen/build_probe.py
      - name: Build wheel through the self-contained source distribution
        run: python -m build python/umf_codegen --outdir /tmp/umf-codegen-wheels
      - run: python -m pip install /tmp/umf-codegen-wheels/*.whl
      - run: bun scripts/codegen-corpus.ts /tmp/umf-codegen-corpus.json
      - name: Installed generator parity without external JavaScript processes
        run: >-
          python -I tests/codegen/installed_probe.py
          --corpus /tmp/umf-codegen-corpus.json --report /tmp/umf-codegen-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegen-${{ matrix.os }}
          path: /tmp/umf-codegen-report.json


  native-sessions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bun install --frozen-lockfile
      - run: python -m pip install build==1.3.0
      - run: python -m build --wheel --outdir /tmp/umf-session-wheels python/umf_access
      - name: Install the host and pinned native drivers
        run: >-
          python -m pip install /tmp/umf-session-wheels/*.whl
          pydantic==2.13.5 'psycopg[binary]==3.2.13' psycopg-pool==3.3.3
      - name: Install immutable Weft compiler cohort
        run: >-
          python -m pip install --no-deps
          'https://github.com/DocumentDrivenDX/weft/releases/download/v0.4.44/weft_sql-0.4.44-cp39-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl#sha256=eeb8fd0a89a9aa15dbe3fb1e71fa8613baa879d4c7193e084926aaf243dcdcbb'
      - run: >-
          bun scripts/umf-client-generate.ts generate --schema tests/unified/commerce.json
          --package shop --output /tmp/umf-session-client
      - name: Verify generated reads and native session ownership
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        run: >-
          python -I tests/unified/session_native_e2e.py
          --dsn "host=127.0.0.1 port=$POSTGRES_PORT dbname=postgres user=postgres"
          --generated /tmp/umf-session-client --report /tmp/umf-session-native.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-session-postgresql18
          path: /tmp/umf-session-native.json
