name: Publish locally qualified UMF registry archives

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Publish only the selected locally checked package set
        type: choice
        required: true
        options:
          - npm
          - crates.io
      candidate_release_id:
        description: Numeric ID of the registry candidate draft release
        type: string
        required: true
      version:
        description: UMF version with committed registry archive digests
        type: string
        default: '0.10.11'

# GitHub requires push access to read a draft release. The ephemeral token is
# passed only to the draft-download step. Checkout does not retain credentials.
permissions:
  contents: write

concurrency:
  group: umf-registry-${{ inputs.version }}-${{ inputs.registry }}
  cancel-in-progress: false

jobs:
  npm:
    if: github.repository == 'DocumentDrivenDX/umf' && github.ref == 'refs/heads/main' && inputs.registry == 'npm'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: npm-core
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download and check the admitted npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.candidate_release_id }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/registry/publish_01011.py stage npm --release-id "$RELEASE_ID" --version "$VERSION"
      - name: Publish the exact npm tarball and verify public bytes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/registry/publish_01011.py publish npm --version "$VERSION"

  crates-io:
    if: github.repository == 'DocumentDrivenDX/umf' && github.ref == 'refs/heads/main' && inputs.registry == 'crates.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download and check the admitted crate archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.candidate_release_id }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/registry/publish_01011.py stage crates --release-id "$RELEASE_ID" --version "$VERSION"
      - name: Authenticate to crates.io with Trusted Publishing
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the exact crate archives and verify public bytes
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/registry/publish_01011.py publish crates --version "$VERSION"
