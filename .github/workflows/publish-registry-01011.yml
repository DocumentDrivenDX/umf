name: Publish UMF registry archives

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish
        type: choice
        required: true
        options:
          - npm
          - crates.io
      candidate_release_id:
        description: Draft release ID for npm or legacy crate archives. Leave blank to package the seven workspace crates.
        type: string
        required: false
      dry_run:
        description: Package and check the seven workspace crates without requesting a publishing token or uploading
        type: boolean
        default: true
      version:
        description: UMF release version. The matching umf-core must already be on crates.io for the seven workspace crates.
        type: string
        required: true

# GitHub requires push access to read a draft release. The ephemeral token is
# passed only to the draft-download step. Checkout does not retain credentials.
permissions:
  contents: write

concurrency:
  group: umf-registry-${{ inputs.version }}-${{ inputs.registry }}
  cancel-in-progress: false

jobs:
  npm:
    if: github.repository == 'DocumentDrivenDX/umf' && github.ref == 'refs/heads/main' && inputs.registry == 'npm' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: npm-core
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download and check the admitted npm tarball
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.candidate_release_id }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/registry/publish_01011.py stage npm --release-id "$RELEASE_ID" --version "$VERSION"
      - name: Publish the exact npm tarball and verify public bytes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/registry/publish_01011.py publish npm --version "$VERSION"

  crates-io:
    if: github.repository == 'DocumentDrivenDX/umf' && github.ref == 'refs/heads/main' && inputs.registry == 'crates.io'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Rust for workspace crate qualification
        if: inputs.candidate_release_id == ''
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Package and qualify the seven workspace crates
        if: inputs.candidate_release_id == ''
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUSTUP_TOOLCHAIN: '1.90.0'
        run: |
          source_dir="$GITHUB_WORKSPACE"
          if [[ "$DRY_RUN" != true ]]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            source_commit=$(git rev-parse --verify "refs/tags/umf-v${VERSION}^{commit}")
            git merge-base --is-ancestor "$source_commit" "$GITHUB_SHA"
            source_dir="$RUNNER_TEMP/umf-release-source"
            git worktree add --detach "$source_dir" "$source_commit"
          fi
          python3 scripts/registry/workspace-crates.py prepare --source "$source_dir" \
            --version "$VERSION" --directory "$RUNNER_TEMP/workspace-crates"
      - name: Verify the workspace release plan without uploading
        if: inputs.dry_run && inputs.candidate_release_id == ''
        run: python3 scripts/registry/workspace-crates.py dry-run --directory "$RUNNER_TEMP/workspace-crates"
      - name: Reject incompatible dry-run inputs
        if: inputs.dry_run && inputs.candidate_release_id != ''
        run: |
          echo "::error::Leave candidate_release_id blank to dry-run the workspace crates."
          exit 1
      - name: Download and check the admitted crate archives
        if: ${{ !inputs.dry_run && inputs.candidate_release_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.candidate_release_id }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/registry/publish_01011.py stage crates --release-id "$RELEASE_ID" --version "$VERSION"
      - name: Authenticate to crates.io with Trusted Publishing
        if: ${{ !inputs.dry_run }}
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the admitted legacy crate archives and verify public bytes
        if: ${{ !inputs.dry_run && inputs.candidate_release_id != '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/registry/publish_01011.py publish crates --version "$VERSION"
      - name: Publish the seven workspace crates and verify public bytes
        if: ${{ !inputs.dry_run && inputs.candidate_release_id == '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: python3 scripts/registry/workspace-crates.py publish --directory "$RUNNER_TEMP/workspace-crates"
