name: Private retained inspector feasibility
on:
  workflow_dispatch:
    inputs:
      admitted:
        description: Sol-reviewed exact private source and payload admitted for one component run
        type: boolean
        default: false
      source_sha:
        description: Exact reviewed candidate and controller commit (not canonical artifact SourceS)
        type: string
        required: true
      resource_pins_sha256:
        description: Exact reviewed nine-resource diagnostic payload digest
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: private-inspector-retained-feasibility
  cancel-in-progress: false
jobs:
  feasibility:
    if: github.event_name == 'workflow_dispatch' && inputs.admitted == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      NUM_JOBS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
      EXPECTED_RESOURCE_PINS: ${{ inputs.resource_pins_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
          architecture: x64
      - name: Bind exact source and resource payload before compiling
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = DocumentDrivenDX/umf
          test "$GITHUB_REF_TYPE" = branch
          test "$EXPECTED_SOURCE" != e3f38ef6f05ae636d2837f9d69f8d6805222664b
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_RESOURCE_PINS" =~ ^[0-9a-f]{64}$ ]]
          test "$EXPECTED_SOURCE" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -f python/tests/test_retained_codegen_native.py
          mkdir -p "$RUNNER_TEMP/inspector-feasibility"
          printf 'CARGO_TARGET_DIR=%s/inspector-feasibility-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PYO3_PYTHON=%s\n' "$(command -v python)" >> "$GITHUB_ENV"
          python -I -B - <<'PY'
          import hashlib, importlib.util, json, os, platform
          from pathlib import Path
          root = Path.cwd()
          spec = importlib.util.spec_from_file_location('diagnostic', root/'tools/probe_inspector_retained_feasibility.py')
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          _, pins = module.resources(root, os.environ['EXPECTED_RESOURCE_PINS'])
          assert platform.python_version() == '3.11.17' and platform.system() == 'Linux' and platform.machine() == 'x86_64'
          record = {'privateFeasibilityOnly': True, 'publishable': False, 'source': os.environ['EXPECTED_SOURCE'],
                    'canonicalResourceSourceS': module.SOURCE_S, 'resourcePins': pins,
                    'cargoLockSHA256': hashlib.sha256((root/'Cargo.lock').read_bytes()).hexdigest(),
                    'recipe': 'unchanged python/hatch_build.py wheel hook; locked umf-core-python+umf-cli/native-postgresql',
                    'limits': {'construction':1000000,'perCall':1000000}, 'localSharedAdmissionUsed':False}
          Path(os.environ['RUNNER_TEMP'],'inspector-feasibility','source-and-payload.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - name: Build only the private owner wheel with the existing locked hook
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv > "$RUNNER_TEMP/inspector-feasibility/rustc.txt"
          cargo --version > "$RUNNER_TEMP/inspector-feasibility/cargo.txt"
          python -m pip install 'build==1.3.0' 'hatchling==1.27.0' 2>&1 | tee "$RUNNER_TEMP/inspector-feasibility/build-tools.log"
          python -m build --no-isolation --wheel --outdir "$RUNNER_TEMP/inspector-feasibility/wheels" python 2>&1 | tee "$RUNNER_TEMP/inspector-feasibility/build.log"
      - name: Fresh normal candidate install and existing affected control checks
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/inspector-feasibility/consumer"
          candidate_python="$RUNNER_TEMP/inspector-feasibility/consumer/bin/python"
          "$candidate_python" -m pip --isolated install --index-url https://pypi.org/simple --no-cache-dir --no-compile \
            --report "$RUNNER_TEMP/inspector-feasibility/install-report.json" \
            "$RUNNER_TEMP/inspector-feasibility/wheels/"*.whl 'pytest==8.4.2' 'pydantic==2.14.2' \
            2>&1 | tee "$RUNNER_TEMP/inspector-feasibility/install.log"
          "$candidate_python" -m pip --isolated check | tee "$RUNNER_TEMP/inspector-feasibility/pip-check.log"
          "$candidate_python" -m pip --isolated freeze > "$RUNNER_TEMP/inspector-feasibility/freeze.txt"
          "$candidate_python" -I -B -m pytest -q python/tests/test_rust_codegen.py \
            -k 'constructor_copy or host_callback_cannot or native_control_error or carrier_copy or cached_resources_are_charged' \
            2>&1 | tee "$RUNNER_TEMP/inspector-feasibility/affected-existing-controls.log"
      - name: Measure cold retained construction and unchanged public 17-case calls at 1M
        shell: bash
        run: |
          set -euo pipefail
          wheel=("$RUNNER_TEMP/inspector-feasibility/wheels/"*.whl)
          test "${#wheel[@]}" = 1
          "$RUNNER_TEMP/inspector-feasibility/consumer/bin/python" -I -B tools/probe_inspector_retained_feasibility.py \
            --root "$GITHUB_WORKSPACE" --wheel "${wheel[0]}" --source-sha "$EXPECTED_SOURCE" \
            --resource-pins-sha256 "$EXPECTED_RESOURCE_PINS" \
            --output "$RUNNER_TEMP/inspector-feasibility/measurement.json" \
            2>&1 | tee "$RUNNER_TEMP/inspector-feasibility/measurement.log"
      - name: Native retained-mode contract controls after measured cold fit
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/inspector-feasibility/consumer/bin/python" -I -B -m pytest -q \
            python/tests/test_retained_codegen_native.py \
            2>&1 | tee "$RUNNER_TEMP/inspector-feasibility/native-contract-controls.log"
      - name: Retain actual partial results and complete wheel bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-inspector-feasibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/inspector-feasibility/source-and-payload.json
            ${{ runner.temp }}/inspector-feasibility/*.json
            ${{ runner.temp }}/inspector-feasibility/*.log
            ${{ runner.temp }}/inspector-feasibility/*.txt
            ${{ runner.temp }}/inspector-feasibility/wheels/*
          if-no-files-found: error
          retention-days: 90
      - name: Dispose only this hosted component target and consumer
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/inspector-feasibility-target" "$RUNNER_TEMP/inspector-feasibility/consumer"
          test ! -e "$RUNNER_TEMP/inspector-feasibility-target"
          test ! -e "$RUNNER_TEMP/inspector-feasibility/consumer"
          python -I -B - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'],'inspector-feasibility','cleanup.json').write_text(json.dumps({
              'source':os.environ['EXPECTED_SOURCE'],'run':os.environ['GITHUB_RUN_ID'],
              'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'ownedTargetAbsent':True,'ownedConsumerAbsent':True,
              'localSharedAdmissionUsed':False,'ledgerChanged':False,'signalsSent':False},indent=2)+'\n')
          PY
      - name: Retain owned hosted cleanup observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-inspector-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inspector-feasibility/cleanup.json
          if-no-files-found: warn
          retention-days: 90
