# PROPOSAL ONLY. Do not install as an active workflow before source/owner review.
name: Combined portable migration and R2 qualification (proposed)

on:
  push:
    branches:
      - codex/migration-integrated-qualification

permissions:
  contents: read

jobs:
  combined-portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact pushed source
        id: checkout
        timeout-minutes: 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - name: Set up pinned Bun
        id: bun
        timeout-minutes: 2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3

      - name: Run one bounded public-source qualification
        id: qualification
        timeout-minutes: 28
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          UMF_R2_OUTPUT_PURPOSE: stage-b-reproduction
        run: |
          timeout --signal=TERM --kill-after=10s 1620s bash -eu -o pipefail <<'QUALIFY'
          set -u
          evidence=combined-qualification-evidence
          mkdir -p "$evidence"
          deadline=$((SECONDS + 1620))
          failed=0
          : > "$evidence/commands.log"
          {
            printf 'profile=umf.combined-portable-migration/1\n'
            printf 'event=%s\nref=%s\nexpected_sha=%s\nworkflow_ref=%s\nworkflow_sha=%s\nrun_id=%s\nattempt=%s\n' \
              "$EVENT_NAME" "$REF_NAME" "$EXPECTED_SHA" "$WORKFLOW_REF" "$WORKFLOW_SHA" "$RUN_ID" "$RUN_ATTEMPT"
            test "$EVENT_NAME" = push
            test "$REF_NAME" = refs/heads/codex/migration-integrated-qualification
            test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
            printf 'checkout_sha=%s\ncheckout_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
            printf 'runner_os=%s\nrunner_arch=%s\nimage_os=%s\nimage_version=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion"
            printf 'workflow_file_sha256=%s\npackage_json_sha256=%s\nbun_lock_sha256=%s\nbunfig_sha256=%s\n' \
              "$(sha256sum .github/workflows/combined-migration-qualification.yml | cut -d ' ' -f 1)" \
              "$(sha256sum package.json | cut -d ' ' -f 1)" "$(sha256sum bun.lock | cut -d ' ' -f 1)" "$(sha256sum bunfig.toml | cut -d ' ' -f 1)"
            bun_version=$(bun --version)
            printf 'bun_version=%s\nbun_binary=%s\nbun_binary_sha256=%s\n' "$bun_version" "$(command -v bun)" "$(sha256sum "$(command -v bun)" | cut -d ' ' -f 1)"
            test "$bun_version" = 1.4.3
            sha256sum -c qualification-inputs/expected-pins.sha256
            printf 'expected_pin_manifest_sha256=%s\n' "$(sha256sum qualification-inputs/expected-pins.sha256 | cut -d ' ' -f 1)"
          } > "$evidence/identity.txt" 2> "$evidence/preflight.log"

          if ! grep -Fq 'refs/heads/codex/migration-integrated-qualification' scripts/qualification/r2-metering-generate.ts; then
            printf 'stage=reproduction-preflight\nstatus=BLOCKED\nreason=generator-does-not-admit-integrated-qualification-ref\n' >> "$evidence/commands.log"
            exit 78
          fi

          run_stage() {
            name="$1"; limit="$2"; shift 2
            remaining=$((deadline - SECONDS - 60))
            if [ "$remaining" -le 0 ]; then
              printf 'stage=%s refused=aggregate-budget-cleanup-reserve\n' "$name" >> "$evidence/commands.log"
              return 124
            fi
            if [ "$limit" -gt "$remaining" ]; then limit="$remaining"; fi
            log="$evidence/$name.log"
            start_epoch=$(date +%s); start_utc=$(date -u +%FT%TZ)
            set +e
            timeout --signal=TERM --kill-after=10s "${limit}s" "$@" > "$log" 2>&1
            rc=$?
            set -e
            end_epoch=$(date +%s); end_utc=$(date -u +%FT%TZ)
            bytes=$(wc -c < "$log")
            truncated=no
            if [ "$bytes" -gt 1048576 ]; then
              truncated=yes
              head -c 1048576 "$log" > "$log.tmp" && mv "$log.tmp" "$log"
            fi
            printf 'stage=%s\nargv=' "$name" >> "$evidence/commands.log"
            printf '%q ' timeout --signal=TERM --kill-after=10s "${limit}s" "$@" >> "$evidence/commands.log"
            printf '\nstarted_utc=%s\nended_utc=%s\nexit=%s\nduration_seconds=%s\nlog_bytes_before_cap=%s\nlog_truncated=%s\n' \
              "$start_utc" "$end_utc" "$rc" "$((end_epoch-start_epoch))" "$bytes" "$truncated" >> "$evidence/commands.log"
            return "$rc"
          }

          # GNU timeout bounds each child; the 1620s outer deadline leaves 60s before its TERM/KILL cleanup margin.
          run_stage install 160 bun install --frozen-lockfile --ignore-scripts || failed=1
          run_stage full-typescript 180 bun node_modules/typescript/bin/tsc --noEmit || failed=1
          run_stage tools-typescript 180 bun node_modules/typescript/bin/tsc -p tsconfig.tools.json || failed=1
          run_stage r2-typescript 180 bun node_modules/typescript/bin/tsc --noEmit -p tsconfig.r2-metering-stageb.json || failed=1
          run_stage api-g02 180 bun test --timeout 15000 \
            tests/lifecycle/table-inventory-api.test.ts \
            tests/lifecycle/g02-derived-fill.test.ts \
            tests/lifecycle/g02-renderer-operation-sidecar.test.ts || failed=1
          run_stage g02-fixture-source-control 60 bun test --timeout 30000 \
            tests/lifecycle/g02-temporal-native-fixture.test.ts || failed=1
          run_stage g03-and-migration-regressions 180 bun test --timeout 15000 \
            tests/lifecycle/g03-defaults.test.ts \
            tests/lifecycle/g03-discovery-bridge.test.ts \
            tests/lifecycle/g03-renderer-compatibility.test.ts \
            tests/lifecycle/g11-field-replacement.test.ts \
            tests/lifecycle/table-deployment-operations.test.ts \
            tests/lifecycle/migration.test.ts \
            tests/lifecycle/reviewed.test.ts || failed=1
          run_stage r2-controls-and-parity 180 bun test --timeout 15000 \
            tests/metamodel/structural-accounting-source.test.ts \
            tests/lifecycle/table-inventory-r2-context.test.ts \
            tests/lifecycle/table-inventory-verified-deployment.test.ts \
            tests/lifecycle/table-deployment-r2-accounting.test.ts \
            tests/metamodel/structural-accounting-parity.test.ts || failed=1
          run_stage generate-reviewed-r2-reproduction 120 bun scripts/qualification/r2-metering-generate.ts || failed=1
          generated="$RUNNER_TEMP/r2-metering-generated-${RUN_ID}-${RUN_ATTEMPT}-reproduction/core-validators-accounted.ts"
          if [ -f "$generated" ]; then
            sha256sum "$generated" >> "$evidence/commands.log"
            cmp -- src/generated/core-validators-accounted.ts "$generated" > "$evidence/reproduction-compare.log" 2>&1 || failed=1
          else
            printf 'missing_generated_reproduction=%s\n' "$generated" > "$evidence/reproduction-compare.log"
            failed=1
          fi
          test "$(sha256sum src/generated/core-validators-accounted.ts | cut -d ' ' -f 1)" = 42218d885b7b6c2b1eba85866a9ea4ab2fd7bca6913ed34e53f60153bae5edca || failed=1
          test "$(bun -e 'console.log(JSON.parse(await Bun.file("node_modules/typescript-api/package.json").text()).version)')" = 5.9.3 || failed=1
          test "$(bun -e 'console.log(JSON.parse(await Bun.file("node_modules/typescript/package.json").text()).version)')" = 7.0.2 || failed=1
          test "$(bun -e 'console.log(JSON.parse(await Bun.file("node_modules/playwright/package.json").text()).version)')" = 1.63.0 || failed=1
          test "$(bun -e 'console.log(JSON.parse(await Bun.file("node_modules/playwright-core/package.json").text()).version)')" = 1.63.0 || failed=1
          printf '%s  %s\n' 545d52f8382c391e605562c330e9c1c534a16045898203037a49bb8bd769a946 node_modules/playwright-core/browsers.json | sha256sum -c - >> "$evidence/identity.txt" 2>&1 || failed=1
          printf 'typescript_api=5.9.3\ntypescript_cli=7.0.2\nplaywright=1.63.0\nplaywright_core=1.63.0\nchromium_revision=1243\nchromium_version=153.0.8010.12\nbrowsers_json_sha256=545d52f8382c391e605562c330e9c1c534a16045898203037a49bb8bd769a946\n' >> "$evidence/identity.txt"
          run_stage install-pinned-chromium 180 bun node_modules/playwright/cli.js install chromium || failed=1
          run_stage r2-chromium-parity 180 bun scripts/r2-metering-browser.ts || failed=1
          printf 'qualification_exit=%s\naggregate_elapsed_seconds=%s\n' "$failed" "$((SECONDS))" >> "$evidence/commands.log"
          bytes=$(du -sb "$evidence" | cut -f 1)
          printf 'artifact_public_bytes=%s\nartifact_max_bytes=16777216\n' "$bytes" >> "$evidence/commands.log"
          test "$bytes" -le 16777216 || failed=1
          exit "$failed"
          QUALIFY

      - name: Record qualification step outcome
        if: always()
        env:
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
        run: |
          mkdir -p combined-qualification-evidence
          printf 'qualification_step_outcome=%s\n' "$QUALIFICATION_OUTCOME" >> combined-qualification-evidence/commands.log

      - name: Enforce always-path public artifact bounds
        if: always()
        timeout-minutes: 1
        run: |
          set -eu
          evidence=combined-qualification-evidence
          generated="${{ runner.temp }}/r2-metering-generated-${{ github.run_id }}-${{ github.run_attempt }}-reproduction/core-validators-accounted.ts"
          upload=combined-qualification-upload
          mkdir -p "$evidence"
          rm -rf "$upload"
          mkdir -p "$upload"
          while IFS= read -r -d '' file; do
            bytes=$(wc -c < "$file")
            if [ "$bytes" -gt 1048576 ]; then
              head -c 1048576 "$file" > "$file.cap"
              mv "$file.cap" "$file"
              printf 'artifact_log_truncated=%s\n' "$file" >> "$evidence/artifact-cap.txt"
            fi
          done < <(find "$evidence" -type f -name '*.log' -print0)
          cp -a "$evidence" "$upload/"
          cap_failed=0
          if [ -f "$generated" ]; then
            cp "$generated" "$upload/core-validators-accounted.ts"
          fi
          bytes=$(du -sb "$upload" | cut -f 1)
          if [ "$bytes" -gt 16777216 ]; then
            rm -f "$upload/core-validators-accounted.ts"
            printf 'artifact_generated_companion_omitted=aggregate-cap\nartifact_aggregate_before_omission=%s\n' "$bytes" >> "$evidence/artifact-cap.txt"
            rm -rf "$upload/combined-qualification-evidence"
            cp -a "$evidence" "$upload/"
            cap_failed=1
          fi
          bytes=$(du -sb "$upload" | cut -f 1)
          printf 'artifact_public_bytes=%s\nartifact_max_bytes=16777216\n' "$bytes" >> "$upload/combined-qualification-evidence/artifact-cap.txt"
          bytes=$(du -sb "$upload" | cut -f 1)
          if [ "$bytes" -gt 16777216 ]; then
            rm -rf "$upload"
            printf 'artifact_cap_exceeded_bytes=%s\nartifact_max_bytes=16777216\n' "$bytes" >> "$evidence/artifact-cap.txt"
            exit 1
          fi
          if [ "$cap_failed" -ne 0 ]; then exit 1; fi

      - name: Upload public logs and bounded source-derived receipts
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: combined-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            combined-qualification-upload/
          if-no-files-found: warn
          retention-days: 30
