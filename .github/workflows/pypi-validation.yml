name: PyPI publisher validation
on:
  pull_request:
    paths: ['scripts/*core_pypi_release.py', '.github/workflows/*pypi*.yml']
  push:
    branches: [main]
    paths: ['scripts/*core_pypi_release.py', '.github/workflows/*pypi*.yml']
# Supersede PR revisions without cancelling explicit qualification snapshots.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  publisher-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest scripts.test_publish_core_pypi_release scripts.test_dispatch_core_pypi_release -v
