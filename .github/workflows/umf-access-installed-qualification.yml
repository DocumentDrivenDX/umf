# SPDX-License-Identifier: MIT OR Apache-2.0
name: umf_access installed artifact qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-artifact:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cohort: linux-x86_64-cpython-314
            runner: ubuntu-24.04
            expected_os: linux
            expected_arch: x86_64
          - cohort: macos-arm64-cpython-314
            runner: macos-15
            expected_os: darwin
            expected_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Set the isolated Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/umf-access-cargo-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.8'
          architecture: ${{ matrix.expected_arch == 'arm64' && 'arm64' || 'x64' }}
      - name: Verify the fixed host cohort
        env:
          EXPECTED_OS: ${{ matrix.expected_os }}
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
          EXPECTED_COHORT: ${{ matrix.cohort }}
        run: |
          python - <<'PY'
          import os, platform, sys
          cohorts = {
              'linux-x86_64-cpython-314': ('linux', 'x86_64'),
              'macos-arm64-cpython-314': ('darwin', 'arm64'),
          }
          expected = cohorts.get(os.environ['EXPECTED_COHORT'])
          if expected != (os.environ['EXPECTED_OS'], os.environ['EXPECTED_ARCH']):
              raise SystemExit('cohort metadata mismatch')
          if sys.version_info[:3] != (3, 14, 8): raise SystemExit('Python host mismatch')
          if sys.platform != os.environ['EXPECTED_OS']: raise SystemExit('OS host mismatch')
          if platform.machine().lower() != os.environ['EXPECTED_ARCH']: raise SystemExit('architecture mismatch')
          print(os.environ['EXPECTED_COHORT'], sys.version, platform.platform())
          PY
          git diff --exit-code
          rustc -Vv > "$RUNNER_TEMP/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/cargo-version.txt"
      - name: Install pinned build and runtime dependencies
        run: >-
          python -m pip install
          'build==1.3.0' 'hatchling==1.27.0' 'packaging==26.3' 'pathspec==1.1.1'
          'pluggy==1.7.0' 'pyproject-hooks==1.3.3'
          'trove-classifiers==2026.9.21.13'
          'pydantic==2.14.1' 'pydantic-core==2.50.1'
          'annotated-types==0.8.0' 'typing-extensions==4.16.0'
          'typing-inspection==0.4.4'
      - name: Test the fail-closed verifier and synthetic installed artifact controls
        run: python python/umf_access/tests/packaging/test_qualify_installed_artifact.py
      - name: Build exact local core and access wheels
        run: |
          python -m build --no-isolation --wheel --outdir "$RUNNER_TEMP/access-wheels" python
          python -m build --no-isolation --wheel --outdir "$RUNNER_TEMP/access-wheels" python/umf_access
          python - <<'PY' >> "$GITHUB_ENV"
          import glob, hashlib, os
          path, = glob.glob(os.path.join(os.environ['RUNNER_TEMP'], 'access-wheels', 'umf_core-0.11.0-*.whl'))
          print('UMF_CORE_WHEEL_SHA256=' + hashlib.sha256(open(path, 'rb').read()).hexdigest())
          PY
      - name: Install wheels and qualify the access artifact
        id: qualify
        continue-on-error: true
        env:
          COHORT: ${{ matrix.cohort }}
        run: |
          python -m pip install --no-deps "$RUNNER_TEMP"/access-wheels/umf_core-0.11.0-*.whl
          python -m pip install --no-deps "$RUNNER_TEMP"/access-wheels/umf_access-0.1.0.dev7-*.whl
          python -I python/umf_access/tests/packaging/qualify_installed_artifact.py \
            --wheel "$RUNNER_TEMP"/access-wheels/umf_access-0.1.0.dev7-*.whl \
            --core-wheel "$RUNNER_TEMP"/access-wheels/umf_core-0.11.0-*.whl \
            --expected-core-sha256 "$UMF_CORE_WHEEL_SHA256" \
            --profile python/umf_access/compatibility-profile-dev7-local-candidate.json \
            --source-root python/umf_access \
            --cohort "$COHORT" \
            --receipt "$RUNNER_TEMP/umf-access-installed-receipt.json"
      - name: Bind host and source provenance to the receipt
        if: always()
        env:
          COHORT: ${{ matrix.cohort }}
        run: |
          python - "$RUNNER_TEMP/umf-access-installed-receipt.json" "$RUNNER_TEMP/rustc-version.txt" "$RUNNER_TEMP/cargo-version.txt" <<'PY'
          import hashlib, json, os, platform, sys, sysconfig
          from pathlib import Path
          receipt, rustc, cargo = map(Path, sys.argv[1:])
          value = json.loads(receipt.read_text()) if receipt.exists() else {
              'schema': 'umf.access-installed-artifact-qualification/1',
              'status': 'refused', 'publishing': False, 'releaseEligible': False,
              'reason': 'qualification stopped before receipt creation'
          }
          value['sourceRevision'] = os.environ['GITHUB_SHA']
          value['cohort'] = os.environ['COHORT']
          value['host'] = {
              'python': sys.version,
              'platform': platform.platform(),
              'machine': platform.machine(),
              'sysconfigPlatform': sysconfig.get_platform(),
          }
          if rustc.exists():
              value['rustcVersion'] = rustc.read_text().strip()
              value['rustcVersionSha256'] = hashlib.sha256(rustc.read_bytes()).hexdigest()
          if cargo.exists():
              value['cargoVersion'] = cargo.read_text().strip()
              value['cargoVersionSha256'] = hashlib.sha256(cargo.read_bytes()).hexdigest()
          value['publishing'] = False
          value['releaseEligible'] = False
          receipt.write_text(json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n')
          PY
      - name: Require a passing access artifact receipt
        if: always()
        env:
          QUALIFY_OUTCOME: ${{ steps.qualify.outcome }}
        run: |
          python - "$RUNNER_TEMP/umf-access-installed-receipt.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_text())
          if os.environ['QUALIFY_OUTCOME'] != 'success' or value.get('status') != 'passed':
              raise SystemExit('umf_access qualification did not pass')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: umf-access-installed-${{ matrix.cohort }}
          path: |
            ${{ runner.temp }}/access-wheels/*.whl
            ${{ runner.temp }}/umf-access-installed-receipt.json
          if-no-files-found: error
