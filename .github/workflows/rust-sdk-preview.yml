# SPDX-License-Identifier: MIT OR Apache-2.0
name: Rust SDK preview archive qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cohort: linux-x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - run: cargo install wasm-bindgen-cli --locked --version 0.2.100
      - name: Build browser WASM bindings for typecheck
        run: |
          cargo build --release --locked --manifest-path bindings/core/wasm/Cargo.toml --target wasm32-unknown-unknown
          mkdir -p bindings/core/wasm/pkg
          wasm-bindgen --target web --out-dir bindings/core/wasm/pkg --out-name umf_core_wasm target/wasm32-unknown-unknown/release/umf_core_wasm.wasm
      - run: bun run typecheck
      - run: bun scripts/package-sdk-rust-preview.ts
      - run: bunx playwright install --with-deps chromium
      - run: bun scripts/test-sdk-rust-preview.ts target/rust-sdk-preview/*.tgz
      - name: Preserve preview archive and receipt
        uses: actions/upload-artifact@v4
        with:
          name: umf-rust-sdk-preview-${{ matrix.cohort }}
          path: target/rust-sdk-preview/
          if-no-files-found: error
