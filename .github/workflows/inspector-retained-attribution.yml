name: Private retained constructor and work attribution
on:
  workflow_dispatch:
    inputs:
      admitted:
        description: Sol-reviewed exact changed source and complete batch admitted once
        type: boolean
        default: false
      source_sha:
        description: Exact reviewed candidate/controller commit; never canonical SourceS
        type: string
        required: true
      resource_pins_sha256:
        description: Exact original nine-resource payload digest
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: private-inspector-retained-feasibility
  cancel-in-progress: false
jobs:
  feasibility:
    if: github.event_name == 'workflow_dispatch' && inputs.admitted == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      NUM_JOBS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
      EXPECTED_RESOURCE_PINS: ${{ inputs.resource_pins_sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
          architecture: x64
      - name: Bind source resources and approved source case census before building
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = DocumentDrivenDX/umf
          test "$GITHUB_REF_TYPE" = branch
          test "$EXPECTED_SOURCE" = "$GITHUB_SHA"
          test "$EXPECTED_RESOURCE_PINS" = 72102654e5b8daf70d713abe986e0ecdc046f984094fa7fd36923d5cd6ceb290
          out="$RUNNER_TEMP/inspector-feasibility"
          printf 'BATCH_OUT=%s\n' "$out" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/inspector-feasibility-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PYO3_PYTHON=%s\n' "$(command -v python)" >> "$GITHUB_ENV"
          python -I -B tools/qualify_inspector_construction_batch.py --root "$GITHUB_WORKSPACE" --out "$out" --source "$EXPECTED_SOURCE" bind
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - name: One genuine changed-source wheel producer with unchanged locked hook
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv > "$BATCH_OUT/rustc.txt"
          cargo --version > "$BATCH_OUT/cargo.txt"
          python -m pip --isolated install --index-url https://pypi.org/simple 'build==1.3.0' 'hatchling==1.27.0' 2>&1 | tee "$BATCH_OUT/build-tools.log"
          python -m build --no-isolation --wheel --outdir "$BATCH_OUT/wheels" python 2>&1 | tee "$BATCH_OUT/build.log"
          python -I -B tools/qualify_inspector_construction_batch.py --root "$GITHUB_WORKSPACE" --out "$BATCH_OUT" --source "$EXPECTED_SOURCE" producer
          wheel=("$BATCH_OUT/wheels/"*.whl)
          test "${#wheel[@]}" = 1
          printf 'BATCH_WHEEL=%s\n' "${wheel[0]}" >> "$GITHUB_ENV"
      - name: Compile selected affected Rust targets once without executing tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$BATCH_OUT/cargo-tests"
          cargo metadata --locked --format-version 1 > "$BATCH_OUT/cargo-metadata.json"
          cargo tree --locked -p umf-core-python -p umf-cli --features umf-core-python/native-postgresql,umf-cli/native-postgresql -e features > "$BATCH_OUT/producer-cargo-features.txt"
          cargo test --locked --release -p umf-core --features native-postgresql --lib --test consumer_schema --test schema_python_recursive_resource_scope --test resource_cache --test sol_generation_schema_order_review --no-run --message-format=json > "$BATCH_OUT/cargo-tests/core.jsonl" 2> "$BATCH_OUT/cargo-tests/core.log"
          cargo test --locked --release -p umf-core-wire --features native-postgresql --lib --test codegen_context --test access_inspection_public --no-run --message-format=json > "$BATCH_OUT/cargo-tests/wire.jsonl" 2> "$BATCH_OUT/cargo-tests/wire.log"
          cargo test --locked --release -p umf-codegen --features umf-core/native-postgresql --lib --test access_binding_schema_override --test single_set --no-run --message-format=json > "$BATCH_OUT/cargo-tests/codegen.jsonl" 2> "$BATCH_OUT/cargo-tests/codegen.log"
      - name: Fresh normal resolver install pipcheck and actual loaded ownership
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$BATCH_OUT/consumer"
          candidate_python="$BATCH_OUT/consumer/bin/python"
          "$candidate_python" -m pip --isolated install --index-url https://pypi.org/simple --no-cache-dir --no-compile --constraint "$BATCH_OUT/dependency-constraints.txt" --report "$BATCH_OUT/install-report.json" "$BATCH_WHEEL" 'pytest==8.4.2' 'pydantic==2.14.2' 2>&1 | tee "$BATCH_OUT/install.log"
          "$candidate_python" -m pip --isolated check | tee "$BATCH_OUT/pip-check.log"
          "$candidate_python" -m pip --isolated freeze > "$BATCH_OUT/freeze.txt"
          "$candidate_python" -I -B tools/run_inspector_attribution_lanes.py --controller "$GITHUB_WORKSPACE" --owner "$GITHUB_WORKSPACE" --wheel "$BATCH_WHEEL" --out "$BATCH_OUT" --controller-sha "$EXPECTED_SOURCE" --producer-pins "$BATCH_OUT/producer.json" --mode identity
      - name: Authenticate compiled census before executing exactly the Rust161 selection
        shell: bash
        run: |
          set -euo pipefail
          python -I -B tools/qualify_inspector_construction_batch.py --root "$GITHUB_WORKSPACE" --out "$BATCH_OUT" --source "$EXPECTED_SOURCE" rust
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Existing installed-wheel public Saga19 only without SDK browser or CLI producers
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          UMF_SAGA_PYTHON="$BATCH_OUT/consumer/bin/python" UMF_SAGA_PYTHON_WHEEL="$BATCH_WHEEL" UMF_SAGA_HOST_ID=python UMF_SAGA_RESULT_PATH="$BATCH_OUT/public-saga19.json" bun scripts/saga-portable/other-hosts.ts python 2>&1 | tee "$BATCH_OUT/public-saga19.log"
      - name: Fresh legacy8 boundary21 strict cold before independent diagnostic and required aggregation
        shell: bash
        run: |
          set -euo pipefail
          "$BATCH_OUT/consumer/bin/python" -I -B tools/run_inspector_attribution_lanes.py --controller "$GITHUB_WORKSPACE" --owner "$GITHUB_WORKSPACE" --wheel "$BATCH_WHEEL" --out "$BATCH_OUT" --controller-sha "$EXPECTED_SOURCE" --producer-pins "$BATCH_OUT/producer.json" 2>&1 | tee "$BATCH_OUT/lanes-driver.log"
      - name: Retain all actual partial proofs original identities and genuine wheel bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-inspector-construction-batch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/inspector-feasibility/*.json
            ${{ runner.temp }}/inspector-feasibility/*.tar
            ${{ runner.temp }}/inspector-feasibility/*.xml
            ${{ runner.temp }}/inspector-feasibility/*.log
            ${{ runner.temp }}/inspector-feasibility/*.txt
            ${{ runner.temp }}/inspector-feasibility/cargo-tests/*
            ${{ runner.temp }}/inspector-feasibility/rust-cases/*
            ${{ runner.temp }}/inspector-feasibility/wheels/*
          if-no-files-found: error
          retention-days: 90
      - name: Dispose only this hosted component target and consumer
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/inspector-feasibility-target" "$RUNNER_TEMP/inspector-feasibility/consumer"
          test ! -e "$RUNNER_TEMP/inspector-feasibility-target"
          test ! -e "$RUNNER_TEMP/inspector-feasibility/consumer"
          mkdir -p "$RUNNER_TEMP/inspector-feasibility"
          python -I -B - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'],'inspector-feasibility','cleanup.json').write_text(json.dumps({'source':os.environ['EXPECTED_SOURCE'],'run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'ownedTargetAbsent':True,'ownedConsumerAbsent':True,'localSharedAdmissionUsed':False,'ledgerChanged':False,'signalsSent':False},indent=2)+'\n')
          PY
      - name: Retain owned cleanup observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-inspector-construction-batch-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inspector-feasibility/cleanup.json
          if-no-files-found: error
          retention-days: 90
