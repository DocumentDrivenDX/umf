name: Private retained constructor and work attribution
on:
  workflow_dispatch:
    inputs:
      admitted:
        description: Sol-reviewed exact installed factory source/census/live binding; pending owner controls REFUSE
        type: boolean
        default: false
      source_sha:
        description: Exact reviewed candidate/controller commit; never canonical SourceS
        type: string
        required: true
      resource_pins_sha256:
        description: Exact original nine-resource payload digest
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: private-inspector-retained-feasibility
  cancel-in-progress: false
jobs:
  feasibility:
    if: github.event_name == 'workflow_dispatch' && inputs.admitted == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      NUM_JOBS: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      INSPECTOR_INPUT_PROFILE: installed-canonical/1
      EXPECTED_SOURCE: ${{ inputs.source_sha }}
      EXPECTED_RESOURCE_PINS: ${{ inputs.resource_pins_sha256 }}
    steps:
      - name: Record one job clock before setup without native work
        shell: bash
        run: |
          set -euo pipefail
          printf 'INSPECTOR_JOB_MONOTONIC_START=%s\n' "$(python3 -I -B -c 'import time; print(time.monotonic())')" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
          architecture: x64
      - name: Bind source resources and approved source case census before building
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = DocumentDrivenDX/umf
          test "$GITHUB_REF_TYPE" = branch
          test "$EXPECTED_SOURCE" = "$GITHUB_SHA"
          test "$EXPECTED_RESOURCE_PINS" = 1b39d7593535cfa088a0f4643a44d8815b40f6bc1b114c7e66c0698804227767
          out="$RUNNER_TEMP/inspector-feasibility"
          printf 'BATCH_OUT=%s\n' "$out" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/inspector-feasibility-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'PYO3_PYTHON=%s\n' "$(command -v python)" >> "$GITHUB_ENV"
          python -I -B tools/qualify_inspector_construction_batch.py --root "$GITHUB_WORKSPACE" --out "$out" --source "$EXPECTED_SOURCE" bind
          python -I -B tests/qualification/test_inspector_construction_batch.py 2>&1 | tee "$out/census-pure.log"
          python -I -B tests/qualification/test_inspector_admission_precharge.py 2>&1 | tee "$out/admission-precharge-pure.log"
          python -I -B tests/qualification/test_inspector_owner_cursors.py 2>&1 | tee "$out/owner-cursors-pure.log"
          python -I -B tests/qualification/test_inspector_owned_plan_controller.py 2>&1 | tee "$out/owned-plan-pure.log"
          python -I -B tests/qualification/test_inspector_combined_budget.py 2>&1 | tee "$out/combined-pure.log"
          python -I -B tests/qualification/test_inspector_attribution_lanes.py 2>&1 | tee "$out/lanes-pure.log"
          python -I -B tests/qualification/test_inspector_installed_factory.py 2>&1 | tee "$out/factory-controller-pure.log"
          python -I -B tools/tests/test_codegen_resource_literals.py 2>&1 | tee "$out/factory-data-pure.log"
          python -I -B tools/tests/test_operation_schema_utf16_encoding.py 2>&1 | tee "$out/operation-data-pure.log"
          python -I -B tools/tests/test_schema_metas_utf16_encoding.py 2>&1 | tee "$out/metaschema-data-pure.log"
          python -I -B python/tests/test_installed_codegen_facade_source.py 2>&1 | tee "$out/factory-facade-pure.log"
          python -I -B python/tests/test_installed_codegen_factory_boundary.py 2>&1 | tee "$out/factory-boundary-pure.log"
          python -I -B tests/qualification/test_inspector_cost_gate.py 2>&1 | tee "$out/cost-census-pure.log"
          python -I -B tests/qualification/test_inspector_attribution_controls.py 2>&1 | tee "$out/control-pure.log"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - name: Bind producer to remaining original job work deadline
        id: budget-producer
        shell: bash
        run: python -I -B tools/inspector_stage_budget.py --stage producer
      - name: One genuine changed-source wheel producer with unchanged locked hook
        timeout-minutes: ${{ fromJSON(steps.budget-producer.outputs.minutes) }}
        shell: bash
        run: |
          set -euo pipefail
          python -I -B tools/generate_codegen_resource_literals.py --check
          python -I -B tools/generate_operation_schema_utf16.py --check
          python -I -B tools/generate_schema_metas_utf16.py --check
          rustc -Vv > "$BATCH_OUT/rustc.txt"
          cargo --version > "$BATCH_OUT/cargo.txt"
          python -m pip --isolated install --index-url https://pypi.org/simple 'build==1.3.0' 'hatchling==1.27.0' 2>&1 | tee "$BATCH_OUT/build-tools.log"
          python -m build --no-isolation --wheel --outdir "$BATCH_OUT/wheels" python 2>&1 | tee "$BATCH_OUT/build.log"
          cargo metadata --locked --format-version 1 > "$BATCH_OUT/cargo-metadata.json"
          cargo tree --locked -p umf-core-python -p umf-cli --features umf-core-python/native-postgresql,umf-cli/native-postgresql -e features > "$BATCH_OUT/producer-cargo-features.txt"
          python -I -B tools/qualify_inspector_construction_batch.py --root "$GITHUB_WORKSPACE" --out "$BATCH_OUT" --source "$EXPECTED_SOURCE" producer
          wheel=("$BATCH_OUT/wheels/"*.whl)
          test "${#wheel[@]}" = 1
          printf 'BATCH_WHEEL=%s\n' "${wheel[0]}" >> "$GITHUB_ENV"
      - name: Retain genuine wheel and source BEFORE target compilation
        uses: actions/upload-artifact@v4
        with:
          name: private-inspector-early-producer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/inspector-feasibility/wheels/*
            ${{ runner.temp }}/inspector-feasibility/producer.json
            ${{ runner.temp }}/inspector-feasibility/source-inputs.tar
            ${{ runner.temp }}/inspector-feasibility/source-and-payload.json
            ${{ runner.temp }}/inspector-feasibility/build.log
            ${{ runner.temp }}/inspector-feasibility/rustc.txt
            ${{ runner.temp }}/inspector-feasibility/cargo.txt
            ${{ runner.temp }}/inspector-feasibility/cargo-metadata.json
            ${{ runner.temp }}/inspector-feasibility/producer-cargo-features.txt
          if-no-files-found: error
          retention-days: 90
      - name: Bind install to remaining original job work deadline
        id: budget-install
        shell: bash
        run: python -I -B tools/inspector_stage_budget.py --stage install
      - name: Fresh normal resolver install pipcheck and actual loaded ownership
        timeout-minutes: ${{ fromJSON(steps.budget-install.outputs.minutes) }}
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$BATCH_OUT/consumer"
          candidate_python="$BATCH_OUT/consumer/bin/python"
          "$candidate_python" -m pip --isolated install --index-url https://pypi.org/simple --no-cache-dir --no-compile --constraint "$BATCH_OUT/dependency-constraints.txt" --report "$BATCH_OUT/install-report.json" "$BATCH_WHEEL" 'pytest==8.4.2' 'pydantic==2.14.2' 2>&1 | tee "$BATCH_OUT/install.log"
          "$candidate_python" -m pip --isolated check | tee "$BATCH_OUT/pip-check.log"
          "$candidate_python" -m pip --isolated freeze > "$BATCH_OUT/freeze.txt"
          "$candidate_python" -I -B tools/run_inspector_attribution_lanes.py --controller "$GITHUB_WORKSPACE" --owner "$GITHUB_WORKSPACE" --wheel "$BATCH_WHEEL" --out "$BATCH_OUT" --controller-sha "$EXPECTED_SOURCE" --producer-pins "$BATCH_OUT/producer.json" --mode identity
      - name: Bind cost to remaining original job work deadline
        id: budget-cost
        shell: bash
        run: python -I -B tools/inspector_stage_budget.py --stage cost
      - name: Strict cold constructor and complete public51 COST gate before any test-target compilation
        id: cost-gate
        timeout-minutes: ${{ fromJSON(steps.budget-cost.outputs.minutes) }}
        shell: bash
        run: |
          set -euo pipefail
          "$BATCH_OUT/consumer/bin/python" -I -B tools/run_inspector_attribution_lanes.py --controller "$GITHUB_WORKSPACE" --owner "$GITHUB_WORKSPACE" --wheel "$BATCH_WHEEL" --out "$BATCH_OUT" --controller-sha "$EXPECTED_SOURCE" --producer-pins "$BATCH_OUT/producer.json" --mode cost 2>&1 | tee "$BATCH_OUT/cost-driver.log"
          printf 'passed=true\n' >> "$GITHUB_OUTPUT"
      - name: Bind compile to remaining original job work deadline
        id: budget-compile
        shell: bash
        run: python -I -B tools/inspector_stage_budget.py --stage compile
      - name: Compile selected affected Rust targets once without executing tests
        if: success() && steps.cost-gate.outputs.passed == 'true'
        timeout-minutes: ${{ fromJSON(steps.budget-compile.outputs.minutes) }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$BATCH_OUT/cargo-tests"
          cargo test --locked --release -p umf-core --features native-postgresql --lib --test consumer_schema --test schema_python_recursive_resource_scope --test resource_cache --test sol_generation_schema_order_review --no-run --message-format=json > "$BATCH_OUT/cargo-tests/core.jsonl" 2> "$BATCH_OUT/cargo-tests/core.log"
          cargo test --locked --release -p umf-core-wire --features native-postgresql --lib --test codegen_context --test access_inspection_public --no-run --message-format=json > "$BATCH_OUT/cargo-tests/wire.jsonl" 2> "$BATCH_OUT/cargo-tests/wire.log"
          cargo test --locked --release -p umf-codegen --features umf-core/native-postgresql --lib --test access_binding_schema_override --test single_set --no-run --message-format=json > "$BATCH_OUT/cargo-tests/codegen.jsonl" 2> "$BATCH_OUT/cargo-tests/codegen.log"
          # PyO3 extension-module deliberately omits libpython linkage. Only
          # the binding TEST executable needs the selected interpreter library.
          python -I -B tools/qualify_inspector_combined_budget.py --root "$GITHUB_WORKSPACE" --out "$BATCH_OUT" binding-compile
      - name: Bind rust to remaining original job work deadline
        id: budget-rust
        shell: bash
        run: python -I -B tools/inspector_stage_budget.py --stage rust
      - name: Authenticate compiled census before executing exactly the reviewed named Rust selection
        timeout-minutes: ${{ fromJSON(steps.budget-rust.outputs.minutes) }}
        shell: bash
        run: |
          set -euo pipefail
          python -I -B tools/qualify_inspector_construction_batch.py --root "$GITHUB_WORKSPACE" --out "$BATCH_OUT" --source "$EXPECTED_SOURCE" rust
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Bind saga to remaining original job work deadline
        id: budget-saga
        shell: bash
        run: python -I -B tools/inspector_stage_budget.py --stage saga
      - name: Existing installed-wheel public Saga19 only without SDK browser or CLI producers
        timeout-minutes: ${{ fromJSON(steps.budget-saga.outputs.minutes) }}
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          UMF_SAGA_PYTHON="$BATCH_OUT/consumer/bin/python" UMF_SAGA_PYTHON_WHEEL="$BATCH_WHEEL" UMF_SAGA_HOST_ID=python UMF_SAGA_RESULT_PATH="$BATCH_OUT/public-saga19.json" bun scripts/saga-portable/other-hosts.ts python 2>&1 | tee "$BATCH_OUT/public-saga19.log"
      - name: Bind lanes to remaining original job work deadline
        id: budget-lanes
        shell: bash
        run: python -I -B tools/inspector_stage_budget.py --stage lanes
      - name: Fresh named legacy and factory semantic groups with required aggregation; explicit history separate
        timeout-minutes: ${{ fromJSON(steps.budget-lanes.outputs.minutes) }}
        shell: bash
        run: |
          set -euo pipefail
          "$BATCH_OUT/consumer/bin/python" -I -B tools/run_inspector_attribution_lanes.py --controller "$GITHUB_WORKSPACE" --owner "$GITHUB_WORKSPACE" --wheel "$BATCH_WHEEL" --out "$BATCH_OUT" --controller-sha "$EXPECTED_SOURCE" --producer-pins "$BATCH_OUT/producer.json" --cost-gate "$BATCH_OUT/cost-gate.json" 2>&1 | tee "$BATCH_OUT/lanes-driver.log"
      - name: Retain all actual partial proofs original identities and genuine wheel bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-inspector-construction-batch-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/inspector-feasibility/*.json
            ${{ runner.temp }}/inspector-feasibility/*.tar
            ${{ runner.temp }}/inspector-feasibility/*.xml
            ${{ runner.temp }}/inspector-feasibility/*.log
            ${{ runner.temp }}/inspector-feasibility/*.txt
            ${{ runner.temp }}/inspector-feasibility/cargo-tests/*
            ${{ runner.temp }}/inspector-feasibility/rust-cases/*
            ${{ runner.temp }}/inspector-feasibility/wheels/*
          if-no-files-found: error
          retention-days: 90
      - name: Dispose only this hosted component target and consumer
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/inspector-feasibility-target" "$RUNNER_TEMP/inspector-feasibility/consumer"
          test ! -e "$RUNNER_TEMP/inspector-feasibility-target"
          test ! -e "$RUNNER_TEMP/inspector-feasibility/consumer"
          mkdir -p "$RUNNER_TEMP/inspector-feasibility"
          python -I -B - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'],'inspector-feasibility','cleanup.json').write_text(json.dumps({'source':os.environ['EXPECTED_SOURCE'],'run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'ownedTargetAbsent':True,'ownedConsumerAbsent':True,'localSharedAdmissionUsed':False,'ledgerChanged':False,'signalsSent':False},indent=2)+'\n')
          PY
      - name: Retain owned cleanup observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-inspector-construction-batch-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inspector-feasibility/cleanup.json
          if-no-files-found: error
          retention-days: 90
