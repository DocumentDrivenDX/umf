name: Publish released UMF core to PyPI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing qualified release tag
        required: true
        type: string
      source_sha:
        description: Exact commit targeted by the immutable release tag
        required: true
        type: string
      expected_sums_sha256:
        description: SHA-256 of the public release SHA256SUMS file
        required: true
        type: string
      locally_qualified:
        description: Skip only the publisher unit test and installed-consumer qualification steps
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: pypi-publish-core-${{ inputs.source_sha || github.run_id }}
  cancel-in-progress: false
jobs:
  verify-release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test the release publisher validator
        if: ${{ inputs.locally_qualified != true }}
        run: python -m unittest scripts.test_publish_core_pypi_release -v
      - name: Bind exact tag, source and optional backfill pins
        id: identity
        env:
          TARGET_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MANUAL_SUMS_SHA256: ${{ inputs.expected_sums_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_TAG" =~ ^(umf|python)-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MANUAL_SUMS_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf 'tag=%s\nsource_sha=%s\nsums_sha256=%s\n' \
            "$TARGET_TAG" "$SOURCE_SHA" "$MANUAL_SUMS_SHA256" >> "$GITHUB_OUTPUT"
      - name: Read the immutable public release and tag objects
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > incoming/release.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > incoming/tag-ref.json
          if [[ "$(jq -r .object.type incoming/tag-ref.json)" == tag ]]; then
            OBJECT_SHA="$(jq -r .object.sha incoming/tag-ref.json)"
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$OBJECT_SHA" > incoming/tag-object.json
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir incoming/assets
      - name: Verify complete 0.10.8 source archive against exact production Git objects
        if: inputs.tag == 'umf-v0.10.8' || inputs.tag == 'python-v0.10.8'
        env:
          TARGET_TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          LOCALLY_QUALIFIED: ${{ inputs.locally_qualified }}
        run: |
          set -euo pipefail
          test "$TARGET_TAG" = umf-v0.10.8
          test "$SOURCE_SHA" = e3f38ef6f05ae636d2837f9d69f8d6805222664b
          test "$LOCALLY_QUALIFIED" != true
          git fetch --no-tags --depth=1 --filter=blob:none origin "$SOURCE_SHA"
          python -I -B scripts/verify_core_release_source_archive.py --repo . \
            --archive incoming/assets/umf-v0.10.8-source.tar.gz --receipt incoming/source-archive.json
      - name: Verify tag source, checksum manifest, pins and package metadata
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          EXPECTED_SUMS_SHA256: ${{ steps.identity.outputs.sums_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          ARGS=(prepare --repository "$GITHUB_REPOSITORY" --tag "$TAG" --source-sha "$SOURCE_SHA"
            --expected-sums-sha256 "$EXPECTED_SUMS_SHA256" --distribution umf-core
            --wheel-prefix "umf_core-" --require-sdist
            --release-json incoming/release.json --tag-ref-json incoming/tag-ref.json
            --assets-dir incoming/assets --output-dir dist --receipt dist/source-receipt.json)
          if [[ -f incoming/tag-object.json ]]; then ARGS+=(--tag-object-json incoming/tag-object.json); fi
          python scripts/publish_core_pypi_release.py "${ARGS[@]}"
          if [ "$TAG" = umf-v0.10.8 ]; then cp incoming/source-archive.json dist/source-archive.json; fi
          printf 'version=%s\n' "$(jq -r .version dist/source-receipt.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: umf-core-pypi-release-${{ steps.source.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: umf-core-pypi-release-${{ needs.verify-release.outputs.version }}
          path: dist
      - name: Refuse PyPI collisions and require exact archive bytes
        id: preflight
        run: python scripts/publish_core_pypi_release.py check-pypi --receipt dist/source-receipt.json --dist-dir dist
      - name: Publish only the verified archives through PyPI OIDC
        if: steps.preflight.outputs.status == 'absent'
        run: |
          mkdir .verified-pypi-packages
          cp dist/umf_core-*.whl dist/umf_core-*.tar.gz .verified-pypi-packages/
      - uses: pypa/gh-action-pypi-publish@release/v1
        id: pypi-upload
        if: steps.preflight.outputs.status == 'absent'
        with:
          packages-dir: .verified-pypi-packages/
      - name: Verify PyPI-served bytes after publication
        id: postflight
        run: python scripts/publish_core_pypi_release.py check-pypi --receipt dist/source-receipt.json --dist-dir dist --wait --timeout 300
      - name: Record exact PyPI publication result
        env:
          UPLOAD_OUTCOME: ${{ steps.pypi-upload.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = json.loads(Path("dist/source-receipt.json").read_text(encoding="utf-8"))
          record = {
              "schema": "pypi-publication-receipt.v1",
              "status": "passed",
              "registry": "pypi",
              "tag": source["tag"],
              "source_sha": source["source_sha"],
              "distribution": source["distribution"],
              "version": source["version"],
              "files": source["files"],
              "publication_mode": "oidc_upload" if os.environ["UPLOAD_OUTCOME"] == "success" else "existing_exact_bytes",
              "oidc_trusted_publisher": os.environ["UPLOAD_OUTCOME"] == "success",
              "registry_bytes_verified": True,
          }
          Path("dist/publication-receipt.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: umf-core-pypi-publication-${{ needs.verify-release.outputs.version }}
          path: dist/*receipt.json
          if-no-files-found: error
          retention-days: 365

  installed-consumer:
    needs: [verify-release, publish]
    if: ${{ inputs.locally_qualified != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.tag == 'umf-v0.10.8' && '3.11.17' || '3.11' }}
      - uses: actions/checkout@v6
        if: inputs.tag == 'umf-v0.10.8'
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/probe_public_core_release.py
            /tools/verify_python_artifacts.py
            /tools/temporal_resume.py
            /python/_native_platform.py
            /tests/rust-core/fixtures/access-inspection/cases.json
      - uses: actions/download-artifact@v4
        if: inputs.tag == 'umf-v0.10.8'
        with:
          name: umf-core-pypi-release-${{ needs.verify-release.outputs.version }}
          path: ${{ runner.temp }}/public-source-artifacts
      - name: Install released UMF core from public PyPI in a clean environment
        env:
          VERSION: ${{ needs.verify-release.outputs.version }}
          PIP_CONFIG_FILE: /dev/null
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pypi-consumer"
          INSTALL_ARGS=()
          if [ "$VERSION" = 0.10.8 ]; then
            INSTALL_ARGS+=(--no-compile --report "$RUNNER_TEMP/public-core-install-report.json")
          fi
          "$RUNNER_TEMP/pypi-consumer/bin/python" -m pip --isolated install --disable-pip-version-check --no-cache-dir --only-binary=umf-core "${INSTALL_ARGS[@]}" \
            --index-url https://pypi.org/simple "umf-core==$VERSION"
          "$RUNNER_TEMP/pypi-consumer/bin/python" -m pip --isolated check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pypi-consumer/bin/python" -I -B - <<'PYTHON'
          import importlib.metadata, json, os, pathlib, sysconfig
          import umf
          dist = importlib.metadata.distribution("umf-core")
          assert dist.version == os.environ["VERSION"]
          assert pathlib.Path(umf.__file__).is_relative_to(sysconfig.get_path("purelib"))
          assert dist.read_text("direct_url.json") is None
          record = {"schema": "pypi-consumer-receipt.v1", "status": "passed",
                    "index": "https://pypi.org/simple", "umf_core_version": dist.version}
          pathlib.Path("consumer-receipt.json").write_text(json.dumps(record, indent=2) + "\n")
          PYTHON
      - name: Verify additional fresh-public native resources and inspection correspondence
        if: inputs.tag == 'umf-v0.10.8'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/pypi-consumer/bin/python" -I -B scripts/probe_public_core_release.py \
            --root "$GITHUB_WORKSPACE" \
            --wheel "$RUNNER_TEMP/public-source-artifacts/umf_core-0.10.8-cp311-abi3-manylinux_2_34_x86_64.whl" \
            --install-report "$RUNNER_TEMP/public-core-install-report.json" \
            --receipt "$RUNNER_TEMP/public-native-correspondence.json" \
            2>&1 | tee "$RUNNER_TEMP/public-native-correspondence.log"
      - name: Retain actual public consumer identity and read-only installed RECORD evidence
        if: always() && inputs.tag == 'umf-v0.10.8'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -x "$RUNNER_TEMP/pypi-consumer/bin/python" ]; then
            "$RUNNER_TEMP/pypi-consumer/bin/python" -I -B tools/temporal_resume.py inventory \
              --source "$GITHUB_WORKSPACE" --controller "$GITHUB_WORKSPACE" \
              --output "$RUNNER_TEMP/public-installed-inventory.json"
          fi
          python -I -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          paths = [Path("scripts/probe_public_core_release.py"), Path("tools/verify_python_artifacts.py"), Path("tools/temporal_resume.py")]
          value = {"sourceS": os.environ["SOURCE_SHA"], "controller": os.environ["CONTROL_SHA"],
                   "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                   "workflowRef": os.environ["GITHUB_WORKFLOW_REF"],
                   "controlFiles": {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths if p.is_file()},
                   "scope": "Post-publication Actions proof; never an immutable GitHub release asset"}
          Path(os.environ["RUNNER_TEMP"], "public-control-identity.json").write_text(json.dumps(value, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always() && inputs.tag == 'umf-v0.10.8'
        with:
          name: umf-core-public-correspondence-0.10.8-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/public-core-install-report.json
            ${{ runner.temp }}/public-native-correspondence.json
            ${{ runner.temp }}/public-native-correspondence.log
            ${{ runner.temp }}/public-installed-inventory.json
            ${{ runner.temp }}/public-control-identity.json
          if-no-files-found: warn
          retention-days: 365
      - uses: actions/upload-artifact@v4
        with:
          name: umf-core-pypi-consumer-${{ needs.verify-release.outputs.version }}
          path: ${{ runner.temp }}/consumer-receipt.json
          if-no-files-found: error
          retention-days: 365
