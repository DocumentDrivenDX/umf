name: Coordinated Python release validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'python/**'
      - 'bindings/core/python/**'
      - 'crates/**'
      - 'spec/**'
      - 'fixtures/actions-binding/source.json'
      - 'tools/_python_sdist.py'
      - 'tools/verify_python_artifacts.py'
      - 'tools/verify_python_release_pair.py'
      - 'tools/verify_python_release_matrix.py'
      - 'scripts/rust-migration/r4/check_binary_closure.py'
      - 'scripts/rust-migration/r4/test_binary_closure.py'
      - 'python/tests/test_coordinated_python_release.py'
      - 'python/tests/test_python_release_matrix.py'
      - '.github/workflows/python-coordinated-release.yml'
      - '.github/workflows/pypi.yml'

permissions:
  contents: read

jobs:
  build-verify-pair:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cohort: linux-x86_64-cpython-311
            runs-on: ubuntu-24.04
            python-architecture: x64
            python-version: '3.11.17'
            expected-platform: linux_x86_64
          - cohort: linux-x86_64-cpython-312
            runs-on: ubuntu-24.04
            python-architecture: x64
            python-version: '3.12.15'
            expected-platform: linux_x86_64
          - cohort: linux-x86_64-cpython-313
            runs-on: ubuntu-24.04
            python-architecture: x64
            python-version: '3.13.16'
            expected-platform: linux_x86_64
          - cohort: macos-arm64-cpython-311
            runs-on: macos-15
            python-architecture: arm64
            python-version: '3.11.17'
            expected-platform: macos_arm64
          - cohort: macos-arm64-cpython-312
            runs-on: macos-15
            python-architecture: arm64
            python-version: '3.12.15'
            expected-platform: macos_arm64
          - cohort: macos-arm64-cpython-313
            runs-on: macos-15
            python-architecture: arm64
            python-version: '3.13.16'
            expected-platform: macos_arm64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Require a fresh workflow run for artifact custody
        if: ${{ github.run_attempt != 1 }}
        run: exit 1
      - uses: actions/checkout@v4
      - name: Isolate Rust build state
        run: |
          printf 'CARGO_TARGET_DIR=%s/umf-coordinated-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        if: ${{ startsWith(matrix.cohort, 'linux-') }}
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.python-architecture }}
      - uses: astral-sh/setup-uv@v6
        if: ${{ startsWith(matrix.cohort, 'macos-') }}
        with:
          version: '0.13.3'
      - name: Provision exact managed macOS CPython
        if: ${{ startsWith(matrix.cohort, 'macos-') }}
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          uv python install --managed-python "$EXPECTED_PYTHON"
          python_path="$(uv python find --managed-python "$EXPECTED_PYTHON")"
          test -x "$python_path"
          printf 'UMF_PYTHON=%s\n' "$python_path" >> "$GITHUB_ENV"
          printf 'PYO3_PYTHON=%s\n' "$python_path" >> "$GITHUB_ENV"
      - name: Select setup-python interpreter on Linux
        if: ${{ startsWith(matrix.cohort, 'linux-') }}
        run: |
          python_path="$(command -v python)"
          printf 'UMF_PYTHON=%s\n' "$python_path" >> "$GITHUB_ENV"
          printf 'PYO3_PYTHON=%s\n' "$python_path" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - name: Check runner and capture toolchain provenance
        env:
          EXPECTED_COHORT: ${{ matrix.cohort }}
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          "$UMF_PYTHON" - <<'PY'
          import os, platform, sys, sysconfig
          cohort = os.environ['EXPECTED_COHORT']
          machine = platform.machine().lower()
          expected_hosts = {
              'linux-x86_64-cpython-311': ('Linux', 'x86_64'),
              'linux-x86_64-cpython-312': ('Linux', 'x86_64'),
              'linux-x86_64-cpython-313': ('Linux', 'x86_64'),
              'macos-arm64-cpython-311': ('Darwin', 'arm64'),
              'macos-arm64-cpython-312': ('Darwin', 'arm64'),
              'macos-arm64-cpython-313': ('Darwin', 'arm64'),
          }
          if cohort not in expected_hosts:
              raise SystemExit(f'Unexpected cohort: {cohort}')
          expected_system, expected = expected_hosts[cohort]
          if sys.implementation.name != 'cpython':
              raise SystemExit(f'Expected CPython, found {sys.implementation.name}')
          if machine != expected:
              raise SystemExit(f'Expected {expected}, found {machine}')
          if expected_system == 'Linux' and sys.platform != 'linux':
              raise SystemExit('Unexpected Linux cohort')
          if expected_system == 'Darwin' and sys.platform != 'darwin':
              raise SystemExit('Unexpected macOS cohort')
          if platform.python_version() != os.environ['EXPECTED_PYTHON']:
              raise SystemExit(f"Expected Python {os.environ['EXPECTED_PYTHON']}; found {platform.python_version()}")
          print(f'python={sys.version} platform={sysconfig.get_platform()} machine={machine}')
          PY
          rustc -Vv > "$RUNNER_TEMP/rustc-version.txt"
          cargo --version > "$RUNNER_TEMP/cargo-version.txt"
      - name: Install pinned build tools
        run: |
          "$UMF_PYTHON" -m pip install 'build==1.3.0' 'hatchling==1.27.0' 'twine==6.2.0'
      - name: Build both distributions for this host
        run: |
          "$UMF_PYTHON" -m build --no-isolation --wheel --sdist python
          "$UMF_PYTHON" -m build --no-isolation --wheel --sdist python/umf_codegen
          "$UMF_PYTHON" -m twine check python/dist/* python/umf_codegen/dist/*
          mkdir -p "$RUNNER_TEMP/umf-coordinated-artifacts"
          cp python/dist/* python/umf_codegen/dist/* "$RUNNER_TEMP/umf-coordinated-artifacts/"
      - name: Verify core wheel payload and offline extracted-sdist rebuild
        env:
          EXPECTED_PLATFORM: ${{ matrix.expected-platform }}
          CARGO_NET_OFFLINE: 'true'
        run: |
          "$UMF_PYTHON" tools/verify_python_artifacts.py \
            --wheel python/dist/*.whl \
            --sdist python/dist/*.tar.gz \
            --rebuilt-wheel-directory "$RUNNER_TEMP/umf-core-sdist-rebuilt" \
            --repository . \
            --expected-platform "$EXPECTED_PLATFORM" \
            --receipt "$RUNNER_TEMP/umf-core-artifact-receipt.json"
      - name: Verify the installed coordinated pair and codegen sdist rebuild
        run: |
          "$UMF_PYTHON" tools/verify_python_release_pair.py \
            --repository . \
            --artifacts "$RUNNER_TEMP/umf-coordinated-artifacts" \
            --core-receipt "$RUNNER_TEMP/umf-core-artifact-receipt.json" \
            --receipt "$RUNNER_TEMP/umf-coordinated-release-receipt.json"
      - name: Run source tests against the installed pair
        run: |
          "$UMF_PYTHON" -m venv "$RUNNER_TEMP/umf-pair-tests"
          "$RUNNER_TEMP/umf-pair-tests/bin/python" -m pip install 'pydantic==2.11.9' 'pytest==8.4.2'
          "$RUNNER_TEMP/umf-pair-tests/bin/python" -m pip install --no-index --no-deps \
            "$RUNNER_TEMP/umf-coordinated-artifacts"/umf_core-*.whl \
            "$RUNNER_TEMP/umf-coordinated-artifacts"/umf_codegen-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/umf-pair-tests/bin/python" -I -B -m pytest -q \
            "$GITHUB_WORKSPACE/python/umf_codegen/tests" \
            "$GITHUB_WORKSPACE/python/tests/test_core.py" \
            "$GITHUB_WORKSPACE/python/tests/test_rust_core.py"
      - name: Run separate SEC projection candidate validation
        run: |
          pair_python="$RUNNER_TEMP/umf-pair-tests/bin/python"
          result="$RUNNER_TEMP/umf-sec-projection-result.json"
          receipt="$RUNNER_TEMP/umf-sec-projection-candidate-receipt.json"
          set +e
          "$pair_python" -I -B "$GITHUB_WORKSPACE/python/tests/installed_sec_projection.py" > "$result" 2> "$RUNNER_TEMP/umf-sec-projection-stderr.txt"
          candidate_status=$?
          set -e
          "$UMF_PYTHON" - "$result" "$receipt" "$candidate_status" "$RUNNER_TEMP/umf-coordinated-artifacts" "$GITHUB_WORKSPACE/python/tests/installed_sec_projection.py" <<'PY'
          import hashlib, json, os, platform, sys
          from pathlib import Path
          result_path, receipt_path = map(Path, sys.argv[1:3])
          return_code = int(sys.argv[3])
          artifact_dir, harness_path = map(Path, sys.argv[4:6])
          try:
              result = json.loads(result_path.read_text())
          except Exception as error:
              result = {"status": "failed", "error": str(error)}
          core_wheels = list(artifact_dir.glob("umf_core-*.whl"))
          package_root = Path(result.get("installedPackage", "."))
          cli_binary = package_root / "_bin" / ("umf.exe" if os.name == "nt" else "umf")
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
          hashes = {
              "coreWheelSha256": digest(core_wheels[0]) if len(core_wheels) == 1 else None,
              "installedCliSha256": digest(cli_binary),
              "harnessSha256": digest(harness_path),
          }
          status = "passed" if return_code == 0 and result.get("status") == "passed" and all(hashes.values()) else "failed"
          receipt = {
              "schema": "umf.sec-projection-installed-candidate/1",
              "status": status,
              "publishing": False,
              "cohort": os.environ["COHORT"],
              "sourceRevision": os.environ["SOURCE_REVISION"],
              "artifacts": hashes,
              "host": {"python": platform.python_version(), "platform": platform.platform(), "machine": platform.machine()},
              "result": result,
          }
          receipt_path.write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n")
          PY
        env:
          COHORT: ${{ matrix.cohort }}
          SOURCE_REVISION: ${{ github.sha }}
      - name: Check installed R4 binary dependency closure
        run: |
          pair_python="$RUNNER_TEMP/umf-pair-tests/bin/python"
          package_root="$("$pair_python" -I -c 'import pathlib, umf; print(pathlib.Path(umf.__file__).resolve().parent)')"
          extension="$(find "$package_root" -maxdepth 1 -type f -name '_rust_core*.so' -print -quit)"
          cli_binary="$package_root/_bin/umf"
          test -n "$extension"
          test -f "$cli_binary"
          "$UMF_PYTHON" scripts/rust-migration/r4/check_binary_closure.py \
            --package-root "$package_root" --cli-binary "$cli_binary" \
            "$extension" "$cli_binary" > "$RUNNER_TEMP/umf-r4-binary-closure.json"
      - name: Attach toolchain provenance to the receipt
        run: |
          "$UMF_PYTHON" - "$RUNNER_TEMP/umf-core-artifact-receipt.json" \
            "$RUNNER_TEMP/umf-coordinated-release-receipt.json" \
            "$RUNNER_TEMP/rustc-version.txt" "$RUNNER_TEMP/cargo-version.txt" \
            "$RUNNER_TEMP/umf-r4-binary-closure.json" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          core, pair, rustc, cargo, binary_closure = map(Path, sys.argv[1:])
          result = json.loads(pair.read_text())
          closure = json.loads(binary_closure.read_text())
          if closure.get('status') != 'passed' or len(closure.get('binaries', [])) != 2:
              raise SystemExit('R4 binary closure report is incomplete or failed')
          if any(item.get('errors') or item.get('format') not in {'ELF', 'Mach-O'} for item in closure['binaries']):
              raise SystemExit('R4 binary closure report contains errors or an unknown format')
          result['cohort'] = os.environ['COHORT']
          result['sourceRevision'] = os.environ['SOURCE_REVISION']
          result['runId'] = os.environ['RUN_ID']
          result['rustcVersionSha256'] = hashlib.sha256(rustc.read_bytes()).hexdigest()
          result['cargoVersionSha256'] = hashlib.sha256(cargo.read_bytes()).hexdigest()
          result['corePayloadReceiptSha256'] = hashlib.sha256(core.read_bytes()).hexdigest()
          result['binaryClosure'] = {
              'status': 'passed',
              'reportSha256': hashlib.sha256((json.dumps(closure, sort_keys=True, indent=2) + '\n').encode()).hexdigest(),
              'report': closure,
          }
          result['host']['pythonExecutableSha256'] = hashlib.sha256(Path(sys.executable).resolve().read_bytes()).hexdigest()
          result['host']['pythonProvisioner'] = os.environ['PYTHON_PROVISIONER']
          pair.write_text(json.dumps(result, sort_keys=True, separators=(',', ':')) + '\n')
          PY
        env:
          COHORT: ${{ matrix.cohort }}
          SOURCE_REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          PYTHON_PROVISIONER: ${{ startsWith(matrix.cohort, 'macos-') && 'uv 0.13.3 managed CPython (python-build-standalone)' || 'actions/setup-python@v5' }}
      - uses: actions/upload-artifact@v4
        with:
          name: python-release-${{ matrix.cohort }}
          path: |
            ${{ runner.temp }}/umf-coordinated-artifacts/*
            ${{ runner.temp }}/umf-core-sdist-rebuilt/*
            ${{ runner.temp }}/umf-core-artifact-receipt.json
            ${{ runner.temp }}/umf-coordinated-release-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec-projection-candidate-${{ matrix.cohort }}
          path: ${{ runner.temp }}/umf-sec-projection-candidate-receipt.json
          if-no-files-found: warn

  aggregate-release-cohorts:
    needs: build-verify-pair
    runs-on: ubuntu-24.04
    steps:
      - name: Require a fresh workflow run for artifact custody
        if: ${{ github.run_attempt != 1 }}
        run: exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - name: Test the release receipt verifiers
        run: |
          python -m pip install 'pytest==8.4.2'
          python -m pytest -q \
            python/tests/test_coordinated_python_release.py \
            python/tests/test_python_release_matrix.py \
            python/tests/test_rust_pair_custody.py
          PYTHONPATH=scripts/rust-migration/r4 python -m unittest discover \
            -s scripts/rust-migration/r4 -p 'test_binary_closure.py'
      - uses: actions/download-artifact@v4
        with:
          pattern: python-release-*
          path: ${{ runner.temp }}/umf-release-cohorts
          merge-multiple: false
      - name: Require all six receipts from this source revision and workflow run
        run: |
          python tools/verify_python_release_matrix.py \
            --artifacts "$RUNNER_TEMP/umf-release-cohorts" \
            --source-revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --cohort-set six-cohort \
            --receipt "$RUNNER_TEMP/umf-python-release-matrix.json"
      - name: Prepare Rust-pair artifact custody manifest
        run: |
          python tools/prepare_rust_pair_release.py \
            --artifacts "$RUNNER_TEMP/umf-release-cohorts" \
            --aggregate-receipt "$RUNNER_TEMP/umf-python-release-matrix.json" \
            --repository . \
            --source-revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --repository-slug "$GITHUB_REPOSITORY" \
            --manifest "$RUNNER_TEMP/umf-rust-pair-custody.json"
      - uses: actions/upload-artifact@v4
        with:
          name: python-release-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/umf-python-release-matrix.json
            ${{ runner.temp }}/umf-rust-pair-custody.json
          if-no-files-found: error
