# SPDX-License-Identifier: MIT OR Apache-2.0
name: Rust migration inventory and boundaries

on:
  push:
    branches-ignore:
      - codex/migration-portable-qualification
      - codex/migration-integrated-qualification
      - codex/g04-python-unit-qualification
    tags:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  inventory-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt
          targets: wasm32-unknown-unknown
      - run: bun install --frozen-lockfile
      - run: cargo fetch --locked
      - name: Check the migration inventory and module boundaries
        run: bun run check:rust-boundaries
