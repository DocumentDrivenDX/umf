# SPDX-License-Identifier: MIT OR Apache-2.0
name: Optional PostgreSQL SQL containment

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installed-parser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build==1.3.0
      - run: python -m build --wheel --outdir wheelhouse python/umf_access
      - name: Install immutable candidate wheel and optional parser using binary dependencies
        run: |
          python -m pip install --only-binary=:all: wheelhouse/*.whl pglast==7.20
      - name: Real parser supported and adversarial corpus against installed runtime
        run: python -m unittest discover -s tests/lifecycle -p test_sql_containment.py
      - name: Default administrative imports do not load the optional parser
        run: python -c "import sys; from umf_access.lifecycle.sql_containment import check_sql_containment; assert 'pglast' not in sys.modules"
