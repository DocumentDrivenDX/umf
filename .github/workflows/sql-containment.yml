# SPDX-License-Identifier: MIT OR Apache-2.0
name: Optional PostgreSQL SQL containment

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  installed-parser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build==1.3.0
      - run: python -m build --wheel --outdir wheelhouse python/umf_access
      - name: Download the optional parser wheel
        run: |
          python -m pip download --only-binary=:all: --no-deps --dest parser-wheelhouse pglast==7.20
      - name: Verify the exact platform wheel against the optional lock before installation
        run: |
          python tests/lifecycle/sql_containment_ci_receipt.py \
            --lock docs/helix/04-build/evidence/praxis-embedder/pglast-optional-wheel-lock.json \
            --wheel-dir parser-wheelhouse --verify-only
      - name: Install only the candidate access wheel and verified parser wheel
        run: |
          python -m pip install --only-binary=:all: wheelhouse/*.whl parser-wheelhouse/*.whl
      - name: Run parser checks and retain qualification receipt
        if: always()
        run: |
          python tests/lifecycle/sql_containment_ci_receipt.py \
            --lock docs/helix/04-build/evidence/praxis-embedder/pglast-optional-wheel-lock.json \
            --wheel-dir parser-wheelhouse --receipt parser-qualification/receipt.json
      - name: Upload exact parser qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-containment-${{ runner.os }}-py${{ matrix.python }}
          path: parser-qualification/receipt.json
          if-no-files-found: error
