name: Python support

# Full qualification is explicit; routine PR checks live in pr-fast.yml.
on:
  workflow_dispatch:

# Supersede PR revisions without cancelling explicit qualification snapshots.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Isolate Rust toolchain state
        run: printf 'RUSTUP_HOME=%s/umf-rustup\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt
      - run: python -m pip install ./python pytest ruff==0.17.1 build 'hatchling>=1.27,<2'
      - run: python -m pytest python/tests -q
      - run: ruff check python
      - run: python -m build python
      - uses: actions/upload-artifact@v4
        with:
          name: umf-python-distributions
          path: python/dist/*
