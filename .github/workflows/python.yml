name: Python support

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./python pytest ruff build
      - run: python -m pytest python/tests -q
      - run: ruff check python
      - run: python -m build python
      - uses: actions/upload-artifact@v4
        with:
          name: umf-python-distributions
          path: python/dist/*
