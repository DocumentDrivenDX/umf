name: Fast PR checks
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'python/**'
      - 'crates/**'
      - 'bindings/**'
      - 'scripts/**'
      - 'tests/**'
      - 'spec/**'
      - 'docs/helix/02-design/contracts/**'
      - 'package.json'
      - 'bun.lock'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tsconfig*.json'
permissions:
  contents: read
concurrency:
  group: fast-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  portable-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Keep historical evidence and native corpora out of this portable job.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /spec/
            /docs/helix/02-design/contracts/
            /tests/core/
            /tests/release/
            /python/
            /scripts/
            /patches/
            /Cargo.toml
            /crates/umf-core/Cargo.toml
            /crates/umf-core-wire/Cargo.toml
            /crates/umf-tagged-wire/Cargo.toml
            /crates/umf-metamodel-cli/Cargo.toml
            /crates/umf-codegen/Cargo.toml
            /bindings/core/python/Cargo.toml
            /bindings/core/node/Cargo.toml
            /bindings/core/wasm/Cargo.toml
            /bindings/pack-tools/wasm/Cargo.toml
            /crates/umf-metamodel/Cargo.toml
            /crates/umf-cli/Cargo.toml
            /crates/umf-graphql/Cargo.toml
            /bindings/core/node/*.js
            /bindings/core/node/src/
            /bindings/core/node/package.json
            /bindings/core/wasm/*.js
            /bindings/core/wasm/src/
            /bindings/core/wasm/package.json
            /package.json
            /bun.lock
            /tsconfig*.json
            /.npmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Check generated saga package
        run: python3 scripts/build-saga-package.py --check
      - name: Check coupled UMF release versions
        run: |
          python3 scripts/check-release-versions.py
          python3 -m unittest discover -s tests/release -v
      - name: Install the pinned Node and browser bindings
        run: |
          archive="$RUNNER_TEMP/umf-sdk-0.10.11-linux-x86_64.tgz"
          curl --fail --silent --show-error --location \
            https://github.com/DocumentDrivenDX/umf/releases/download/umf-v0.10.11/umf-sdk-0.10.11-linux-x86_64.tgz \
            --output "$archive"
          printf '%s  %s\n' 52145cff0ebf9323d5c29defd7da31cfe30445e74e6b60c7c099b9a17832d7c2 "$archive" | sha256sum --check
          tar -xOzf "$archive" package/dist/umf_core_node.node > bindings/core/node/umf_core_node.node
          mkdir -p bindings/core/wasm/pkg
          for member in umf_core_wasm.js umf_core_wasm_bg.wasm; do
            tar -xOzf "$archive" "package/dist/$member" > "bindings/core/wasm/pkg/$member"
          done
      - name: Portable core unit tests
        run: >-
          bun test
          tests/core/cardinality-ideals.test.ts
          tests/core/nullability-ideals.test.ts
          tests/core/field-ideals.test.ts
      - name: Browser-targeted core module bundle
        run: >-
          bun build src/model/document.ts src/validation/document.ts
          --target=browser --outdir "$RUNNER_TEMP/umf-pr-fast"
      - name: Python syntax checks
        run: python -m compileall -q python scripts
