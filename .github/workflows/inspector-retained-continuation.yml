name: Private retained inspector missing-gates continuation
on:
  workflow_dispatch:
    inputs:
      admitted:
        description: Reviewed retained-wheel continuation admitted; no native rebuild
        type: boolean
        default: false
      controller_sha:
        description: Exact reviewed continuation controller/test source
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: private-inspector-retained-feasibility
  cancel-in-progress: false
jobs:
  continuation:
    if: github.event_name == 'workflow_dispatch' && inputs.admitted == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_CONTROLLER: ${{ inputs.controller_sha }}
      ORIGINAL_OWNER: 3c0bb910c68712880459d76834f7beb8eb547104
      CORRECTED_TEST_SHA256: b4b39385da8b2ba0ba0376f369de9b5a7022a103cdb05d7e095a8031ae8fe3a6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
          architecture: x64
      - name: Authenticate original run and retained materials before install
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = DocumentDrivenDX/umf
          test "$GITHUB_REF_TYPE" = branch
          test "$EXPECTED_CONTROLLER" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CONTROLLER"
          python -I -B -c 'import platform; assert platform.python_version()=="3.11.17" and platform.system()=="Linux" and platform.machine()=="x86_64"'
          out="$RUNNER_TEMP/retained-continuation"
          mkdir -p "$out/materials"
          printf 'CONTINUATION_OUT=%s\n' "$out" >> "$GITHUB_ENV"
          printf 'OWNER_CHECKOUT=%s/retained-owner-source\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/retained-owner-source" "$ORIGINAL_OWNER"
          gh api repos/DocumentDrivenDX/umf/actions/runs/41736469787 > "$out/materials/run.json"
          gh api repos/DocumentDrivenDX/umf/actions/runs/41736469787/jobs > "$out/materials/jobs.json"
          gh api repos/DocumentDrivenDX/umf/actions/runs/41736469787/artifacts > "$out/materials/artifacts.json"
          gh api repos/DocumentDrivenDX/umf/actions/artifacts/13279059278/zip > "$out/materials/partial.zip"
          gh api repos/DocumentDrivenDX/umf/actions/artifacts/13278819470/zip > "$out/materials/cleanup.zip"
          gh api repos/DocumentDrivenDX/umf/actions/runs/41736469787/logs > "$out/materials/original-logs.zip"
          python -I -B tools/intake_inspector_retained_continuation.py \
            --controller "$GITHUB_WORKSPACE" --owner "$RUNNER_TEMP/retained-owner-source" \
            --evidence "$out/materials" --controller-sha "$EXPECTED_CONTROLLER" \
            --corrected-test-sha256 "$CORRECTED_TEST_SHA256" --output "$out/intake.json"
      - name: Fresh normal resolver install of authenticated unchanged wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$CONTINUATION_OUT/consumer"
          candidate_python="$CONTINUATION_OUT/consumer/bin/python"
          "$candidate_python" -m pip --isolated install --index-url https://pypi.org/simple --no-cache-dir --no-compile \
            --report "$CONTINUATION_OUT/install-report.json" --constraint "$CONTINUATION_OUT/dependency-constraints.txt" \
            "$CONTINUATION_OUT/materials/partial/wheels/umf_core-0.10.8-cp311-abi3-linux_x86_64.whl" \
            'pytest==8.4.2' 'pydantic==2.14.2' 2>&1 | tee "$CONTINUATION_OUT/install.log"
          "$candidate_python" -m pip --isolated check | tee "$CONTINUATION_OUT/pip-check.log"
          "$candidate_python" -m pip --isolated freeze > "$CONTINUATION_OUT/freeze.txt"
      - name: Retain installed wheel and loaded module correspondence before controls
        shell: bash
        run: |
          set -euo pipefail
          "$CONTINUATION_OUT/consumer/bin/python" -I -B - <<'PYPROOF'
          import hashlib, importlib.metadata, importlib.util, json, os
          from pathlib import Path
          owner = Path(os.environ['OWNER_CHECKOUT'])
          out = Path(os.environ['CONTINUATION_OUT'])
          spec = importlib.util.spec_from_file_location('original_probe', owner/'tools/probe_inspector_retained_feasibility.py')
          probe = importlib.util.module_from_spec(spec); spec.loader.exec_module(probe)
          import umf, umf._rust_core as native, umf.rust_codegen as compiler
          dist = importlib.metadata.distribution('umf-core')
          wheel = out/'materials/partial/wheels/umf_core-0.10.8-cp311-abi3-linux_x86_64.whl'
          pins = json.loads((Path.cwd()/'tests/qualification/fixtures/inspector-retained-continuation.json').read_text())
          for name, version in pins['dependencies'].items():
              assert importlib.metadata.version(name) == version, 'Resolved dependency differs: '+name
          members = probe.installed_wheel(wheel, dist)
          package = Path(umf.__file__).parent
          files = [Path(umf.__file__), Path(compiler.__file__), package/'_rust.py', Path(native.__file__)]
          assert dist.version == '0.10.8' and hasattr(native, 'create_codegen_resources')
          assert Path(native.__file__).parent == package and Path(compiler.__file__) == package/'rust_codegen.py'
          record = {'artifactSource':os.environ['ORIGINAL_OWNER'], 'controllerSource':os.environ['EXPECTED_CONTROLLER'],
                    'privateFeasibilityOnly':True, 'publishable':False, 'readyForEnrollment':False,
                    'wheelSHA256':hashlib.sha256(wheel.read_bytes()).hexdigest(), 'wheelMembers':members,
                    'loadedModules':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files},
                    'engineVersion':native.engine_version(), 'codegenProtocol':native.codegen_protocol_version()}
          (out/'installed-correspondence.json').write_text(json.dumps(record,indent=2)+'\n')
          PYPROOF
      - name: Corrected cold envelope method plus new independent warm diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          "$CONTINUATION_OUT/consumer/bin/python" -I -B -m pytest -q -s \
            python/tests/test_retained_codegen_native.py::PrivateNativeControlTests::test_private_native_envelope_exact_quota_and_one_below_refuse_before_publication \
            python/tests/test_retained_codegen_native.py::PrivateNativeControlTests::test_private_same_handle_warm_replay_is_diagnostic_not_cold_feasibility \
            2>&1 | tee "$CONTINUATION_OUT/corrected-private-controls.log"
      - name: Previously unexecuted cold construction and public 17-case calls at 1M
        shell: bash
        run: |
          set -euo pipefail
          "$CONTINUATION_OUT/consumer/bin/python" -I -B "$OWNER_CHECKOUT/tools/probe_inspector_retained_feasibility.py" \
            --root "$OWNER_CHECKOUT" --wheel "$CONTINUATION_OUT/materials/partial/wheels/umf_core-0.10.8-cp311-abi3-linux_x86_64.whl" \
            --source-sha "$ORIGINAL_OWNER" \
            --resource-pins-sha256 72102654e5b8daf70d713abe986e0ecdc046f984094fa7fd36923d5cd6ceb290 \
            --output "$CONTINUATION_OUT/measurement.json" \
            2>&1 | tee "$CONTINUATION_OUT/measurement.log"
      - name: Previously unexecuted unchanged strict public retained-mode controls
        shell: bash
        run: |
          set -euo pipefail
          "$CONTINUATION_OUT/consumer/bin/python" -I -B -m pytest -q -s \
            python/tests/test_retained_codegen_native.py::PublicRetainedFeasibilityTests \
            2>&1 | tee "$CONTINUATION_OUT/public-controls.log"
      - name: Retain actual partial results original identities and wheel bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-inspector-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/retained-continuation/*.json
            ${{ runner.temp }}/retained-continuation/*.log
            ${{ runner.temp }}/retained-continuation/*.txt
            ${{ runner.temp }}/retained-continuation/materials/*.json
            ${{ runner.temp }}/retained-continuation/materials/original-logs.zip
            ${{ runner.temp }}/retained-continuation/materials/partial/*.json
            ${{ runner.temp }}/retained-continuation/materials/partial/*.log
            ${{ runner.temp }}/retained-continuation/materials/partial/wheels/*
            ${{ runner.temp }}/retained-continuation/materials/cleanup/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Dispose only owned continuation consumer and source worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/retained-continuation/consumer"
          if test -e "$RUNNER_TEMP/retained-owner-source"; then
            git worktree remove --force "$RUNNER_TEMP/retained-owner-source"
          fi
          test ! -e "$RUNNER_TEMP/retained-continuation/consumer"
          test ! -e "$RUNNER_TEMP/retained-owner-source"
          mkdir -p "$RUNNER_TEMP/retained-continuation"
          python -I -B - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'],'retained-continuation','cleanup.json').write_text(json.dumps({
              'controllerSource':os.environ['EXPECTED_CONTROLLER'], 'artifactSource':os.environ['ORIGINAL_OWNER'],
              'run':os.environ['GITHUB_RUN_ID'], 'attempt':os.environ['GITHUB_RUN_ATTEMPT'],
              'ownedConsumerAbsent':True, 'ownedSourceWorktreeAbsent':True,
              'localHeavyWork':False, 'ledgerChanged':False, 'signalsSent':False},indent=2)+'\n')
          PY
      - name: Retain cleanup observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-inspector-continuation-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-continuation/cleanup.json
          if-no-files-found: error
          retention-days: 90
