# SPDX-License-Identifier: MIT OR Apache-2.0
name: Rust production core
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
      - name: Rust library and CLI tests
        run: >-
          cargo test --locked
          -p umf-core
          -p umf-core-wire
          -p umf-tagged-wire
          -p umf-codegen
          -p umf-metamodel
          -p umf-metamodel-cli
          -p umf-cli
          -p umf-graphql
      - name: Rust source boundaries
        run: python3 scripts/check-rust-boundaries.py
