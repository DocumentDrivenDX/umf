name: Publish admitted coupled Codegen archives to PyPI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact admitted release tag: umf-v0.10.8, umf-v0.10.9, or umf-v0.10.10"
        type: string
        required: true
      source_sha:
        description: Exact source commit locked by the selected tag admission
        type: string
        required: true
      expected_sums_sha256:
        description: Reviewed coupled public SHA256SUMS digest
        type: string
        required: true
      expected_admission_sha256:
        description: Reviewed main Codegen admission digest
        type: string
        required: true
      publish:
        description: Enable only the selected, locally qualified Codegen PyPI upload
        type: boolean
        default: false
      locally_qualified:
        description: Confirm the tracked local qualification admission for the 0.10.9 route
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.tag == 'umf-v0.10.8' && 'codegen-pypi-0108' || inputs.tag == 'umf-v0.10.9' && 'codegen-pypi-0109' || inputs.tag == 'umf-v0.10.10' && 'codegen-pypi-0110-candidate' || 'codegen-pypi-unsupported' }}
  cancel-in-progress: false
env:
  TAG: ${{ inputs.tag }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  SUMS_SHA: ${{ inputs.expected_sums_sha256 }}
  ADMISSION_SHA: ${{ inputs.expected_admission_sha256 }}
  LOCALLY_QUALIFIED: ${{ inputs.locally_qualified }}
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && github.repository == 'DocumentDrivenDX/umf' && (inputs.tag == 'umf-v0.10.8' || inputs.tag == 'umf-v0.10.10')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test pure Codegen publisher controls
        run: python -m unittest scripts.test_publish_codegen_pypi_release -v
      - name: Validate dispatch and reviewed download roster before public lookup
        run: |
          python - <<'PY'
          import os, pathlib, re, subprocess, sys
          sys.path.insert(0, 'scripts')
          import publish_codegen_pypi_release as p
          if os.environ['TAG'] == 'umf-v0.10.10':
              value = p.core.load_candidate01010_profile(pathlib.Path('.'), 'umf-codegen',
                  os.environ['SOURCE_SHA'], os.environ['TAG'], os.environ['ADMISSION_SHA'])
              names = p.core.candidate01010_release_download_roster(value, 'umf-codegen')
              pathlib.Path('download-roster.txt').write_text(''.join(p.core._candidate_path(n) + '\n' for n in sorted(names)))
              raise SystemExit(0)
          p.require(os.environ['TAG'] == p.TAG and os.environ['SOURCE_SHA'] == p.SOURCE, 'exact coupled source required')
          p.require(all(re.fullmatch('[0-9a-f]{64}', os.environ[n]) for n in ('SUMS_SHA', 'ADMISSION_SHA')), 'digest pins required')
          raw = subprocess.check_output(['git', 'show', 'HEAD:' + p.ADMISSION_PATH])
          p.require(p.digest(raw) == os.environ['ADMISSION_SHA'], 'tracked admission differs')
          value = p.decode(raw)
          references = [value['qualification'], *value['gates'].values()]
          if value['publisher']['proof'] is not None: references.append(value['publisher']['proof'])
          names = {'SHA256SUMS', 'release-pins.json', *p.FILES}
          for ref in references:
              p.safe_name(ref['file'])
              p.require(type(ref['sha256']) is str and p.core.SHA.fullmatch(ref['sha256']), 'proof hash required')
              names.add(ref['file'])
          pathlib.Path('download-roster.txt').write_text(''.join(p.safe_name(n) + '\n' for n in sorted(names)))
          PY
      - name: Fetch later original Core publication and consumer Actions receipts independently
        run: |
          python scripts/publish_codegen_pypi_release.py fetch-core-proofs --assets-dir incoming/assets \
            --tag "$TAG" --source-sha "$SOURCE_SHA" --expected-sums-sha256 "$SUMS_SHA" \
            --expected-admission-sha256 "$ADMISSION_SHA"
      - name: Download selected unchanged archives and raw proof assets from coupled release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p incoming/assets
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > incoming/release.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > incoming/tag-ref.json
          if [[ "$(jq -r .object.type incoming/tag-ref.json)" == tag ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha incoming/tag-ref.json)" > incoming/tag-object.json
          fi
          while IFS= read -r name; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern="$name" --dir incoming/assets
          done < download-roster.txt
      - name: Verify coupled release, mandatory deep Core correspondence, original receipts and Codegen bytes
        run: |
          set -euo pipefail
          ARGS=(prepare --assets-dir incoming/assets --tag "$TAG" --source-sha "$SOURCE_SHA"
            --expected-sums-sha256 "$SUMS_SHA" --expected-admission-sha256 "$ADMISSION_SHA"
            --release-json incoming/release.json --tag-ref-json incoming/tag-ref.json --output-dir dist)
          if [[ -f incoming/tag-object.json ]]; then ARGS+=(--tag-object-json incoming/tag-object.json); fi
          python scripts/publish_codegen_pypi_release.py "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-codegen-${{ inputs.tag == 'umf-v0.10.10' && '01010' || '0108' }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: verify
    if: inputs.publish == true && github.ref == 'refs/heads/main' && (inputs.tag == 'umf-v0.10.8' || inputs.tag == 'umf-v0.10.10')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: admitted-codegen-${{ inputs.tag == 'umf-v0.10.10' && '01010' || '0108' }}
          path: dist
      - name: Revalidate original bytes and public Core; refuse PyPI collisions
        id: preflight
        run: |
          python scripts/publish_codegen_pypi_release.py check-pypi --assets-dir dist --tag "$TAG" --source-sha "$SOURCE_SHA" \
            --expected-sums-sha256 "$SUMS_SHA" --expected-admission-sha256 "$ADMISSION_SHA"
      - name: Select exactly the two original Codegen archives
        if: steps.preflight.outputs.status == 'absent'
        run: |
          mkdir .verified-codegen-packages
          if [[ "$TAG" == umf-v0.10.10 ]]; then
            cp dist/umf_codegen-0.10.10-py3-none-any.whl dist/umf_codegen-0.10.10.tar.gz .verified-codegen-packages/
          else
            cp dist/umf_codegen-0.10.8-py3-none-any.whl dist/umf_codegen-0.10.8.tar.gz .verified-codegen-packages/
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.preflight.outputs.status == 'absent'
        with:
          packages-dir: .verified-codegen-packages/
      - name: Download and verify exact public Codegen inventory and bytes
        run: |
          python scripts/publish_codegen_pypi_release.py check-pypi --assets-dir dist --tag "$TAG" --source-sha "$SOURCE_SHA" \
            --expected-sums-sha256 "$SUMS_SHA" --expected-admission-sha256 "$ADMISSION_SHA" --wait > dist/public-bytes-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: codegen-${{ inputs.tag == 'umf-v0.10.10' && '01010' || '0108' }}-public-bytes
          path: dist/*receipt.json
          retention-days: 365
  public-consumer:
    needs: [verify, publish]
    if: inputs.tag == 'umf-v0.10.8'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: admitted-codegen-0108
          path: ${{ runner.temp }}/qualified-codegen-inputs
      - name: Fresh normal public resolver and actual installed Codegen generation
        working-directory: ${{ runner.temp }}
        env:
          PIP_CONFIG_FILE: /dev/null
        run: |
          set -euo pipefail
          python -m venv codegen-public-consumer
          codegen-public-consumer/bin/python -m pip --isolated install --disable-pip-version-check --no-cache-dir \
            --only-binary=umf-core,umf-codegen --index-url https://pypi.org/simple \
            --report "$RUNNER_TEMP/codegen-public-install-report.json" 'umf-codegen==0.10.8'
          codegen-public-consumer/bin/python -m pip --isolated check
          codegen-public-consumer/bin/python -I - <<'PY'
          import hashlib, importlib.metadata as m, json, os, pathlib, re, sysconfig, urllib.parse, urllib.request
          import umf, umf_codegen
          from umf_codegen import _native, _release
          inputs = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qualified-codegen-inputs'
          source_receipt = json.loads((inputs / 'source-receipt.json').read_text())
          core_ref = source_receipt['core']['publication']
          core_raw = (inputs / core_ref['file']).read_bytes()
          assert hashlib.sha256(core_raw).hexdigest() == core_ref['sha256']
          expected_files = {'umf-core': json.loads(core_raw)['files'], 'umf-codegen': source_receipt['files']}
          selected_hashes = {}
          install = json.loads(pathlib.Path('codegen-public-install-report.json').read_text())
          for row in install['install']:
              name = re.sub('[-_.]+', '-', row['metadata']['name']).lower()
              if name not in expected_files: continue
              url = urllib.parse.urlsplit(row['download_info']['url'])
              assert url.scheme == 'https' and url.hostname == 'files.pythonhosted.org' and not url.username and not url.password
              filename = urllib.parse.unquote(url.path.rsplit('/', 1)[1])
              sha = row['download_info']['archive_info']['hashes']['sha256']
              assert expected_files[name][filename] == sha and row['metadata']['version'] == '0.10.8'
              assert name not in selected_hashes
              selected_hashes[name] = sha
          assert set(selected_hashes) == {'umf-core', 'umf-codegen'}
          for name, module in [('umf-core', umf), ('umf-codegen', umf_codegen)]:
              dist = m.distribution(name)
              assert dist.version == '0.10.8' and dist.read_text('direct_url.json') is None
              assert pathlib.Path(module.__file__).is_relative_to(sysconfig.get_path('purelib'))
          assert m.requires('umf-codegen') == ['umf-core==0.10.8']
          assert umf.current_core_version() == '0.10.0'
          assert _release.UMF_CORE_ENGINE_VERSION == 'umf-core-r2'
          assert _release.CODEGEN_PROTOCOL_VERSION == 'umf-codegen-r3-seven-ops-nine-resources/1'
          assert _release.CODEGEN_CLI_PROTOCOL_VERSION == 'umf.codegen-cli/1'
          assert _release.RESOURCE_MANIFEST_SHA256 == '5ebd51f10967ba1a92ed82784cef017ece06633ab158155c26247732f641837e'
          _native._verify_native()
          manifest = _native._load_resource_manifest()
          assert manifest['profile'] == 'umf.codegen-resources/1' and len(manifest['files']) == 10
          url = 'https://raw.githubusercontent.com/DocumentDrivenDX/umf/e3f38ef6f05ae636d2837f9d69f8d6805222664b/fixtures/actions-binding/source.json'
          with urllib.request.urlopen(url, timeout=30) as response: source = response.read(65537)
          assert hashlib.sha256(source).hexdigest() == '5b79b3dba5ebc52ac9452f85a75411dab5edaa34154adda76f872a53c21d0818'
          generated = umf_codegen.generate_python_client(source.decode(), package='public_codegen_check')
          assert generated['files']
          pathlib.Path('codegen-consumer-receipt.json').write_text(json.dumps({
              'schema': 'umf.codegen-public-consumer/1', 'status': 'passed', 'index': 'https://pypi.org/simple',
              'codegen': '0.10.8', 'core': '0.10.8', 'resourceManifest': _release.RESOURCE_MANIFEST_SHA256,
              'normalPublicResolverArchiveHashes': selected_hashes,
              'generatedFileCount': len(generated['files']), 'scope': 'Ubuntu CPython3.11 public normal resolver/native-resource/generation consumer only'
          }, indent=2) + '\n')
          PY
          codegen-public-consumer/bin/umf-codegen --help > codegen-cli-help.txt
      - uses: actions/upload-artifact@v4
        with:
          name: codegen-0108-public-consumer
          path: |
            ${{ runner.temp }}/codegen-consumer-receipt.json
            ${{ runner.temp }}/codegen-cli-help.txt
          if-no-files-found: error
          retention-days: 365
  public-consumer-01010:
    needs: [verify, publish]
    if: inputs.tag == 'umf-v0.10.10'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: admitted-codegen-01010
          path: ${{ runner.temp }}/qualified-codegen-inputs
      - name: Fresh normal public resolver and exact candidate archive consumer
        working-directory: ${{ runner.temp }}
        env:
          PIP_CONFIG_FILE: /dev/null
        run: |
          set -euo pipefail
          python -m venv codegen-public-consumer
          codegen-public-consumer/bin/python -m pip --isolated install --disable-pip-version-check --no-cache-dir \
            --only-binary=umf-core,umf-codegen --index-url https://pypi.org/simple \
            --report "$RUNNER_TEMP/codegen-public-install-report.json" 'umf-codegen==0.10.10'
          codegen-public-consumer/bin/python -m pip --isolated check
          codegen-public-consumer/bin/python -I - <<'PY'
          import hashlib, importlib.metadata as m, json, os, pathlib, re, sysconfig
          import umf, umf_codegen
          from umf_codegen import _native, _release
          inputs = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qualified-codegen-inputs'
          source = json.loads((inputs / 'source-receipt.json').read_text())
          publications = []
          for path in inputs.glob('*.json'):
              try: value = json.loads(path.read_text())
              except (OSError, ValueError): continue
              if value.get('schema') == 'pypi-publication-receipt.v1' and value.get('distribution') == 'umf-core':
                  publications.append(value)
          assert len(publications) == 1 and publications[0]['version'] == '0.10.10'
          expected = {'umf-core': publications[0]['files'], 'umf-codegen': source['files']}
          install = json.loads(pathlib.Path('codegen-public-install-report.json').read_text())
          selected = {}
          for row in install['install']:
              name = re.sub('[-_.]+', '-', row['metadata']['name']).lower()
              if name not in expected: continue
              url = row['download_info']['url']
              assert url.startswith('https://files.pythonhosted.org/')
              filename = url.rsplit('/', 1)[1].split('#', 1)[0]
              digest = row['download_info']['archive_info']['hashes']['sha256']
              assert expected[name][filename] == digest and row['metadata']['version'] == '0.10.10'
              assert name not in selected
              selected[name] = digest
          assert set(selected) == {'umf-core', 'umf-codegen'}
          for name, module in [('umf-core', umf), ('umf-codegen', umf_codegen)]:
              dist = m.distribution(name)
              assert dist.version == '0.10.10' and dist.read_text('direct_url.json') is None
              assert pathlib.Path(module.__file__).is_relative_to(sysconfig.get_path('purelib'))
          assert m.requires('umf-codegen') == ['umf-core==0.10.10']
          assert umf.current_core_version() == '0.10.0'
          assert _release.UMF_CORE_ENGINE_VERSION == 'umf-core-r2'
          assert _release.CODEGEN_PROTOCOL_VERSION == 'umf-codegen-r3-seven-ops-nine-resources/1'
          _native._verify_native()
          pathlib.Path('codegen-consumer-receipt.json').write_text(json.dumps({
              'schema': 'umf.codegen-public-consumer/1', 'status': 'passed', 'index': 'https://pypi.org/simple',
              'codegen': '0.10.10', 'core': '0.10.10', 'normalPublicResolverArchiveHashes': selected,
              'scope': 'fresh public resolver and installed package identity; not qualification evidence'
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: codegen-01010-public-consumer
          path: ${{ runner.temp }}/codegen-consumer-receipt.json
          if-no-files-found: error
          retention-days: 365
  verify-0109:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && github.repository == 'DocumentDrivenDX/umf' && inputs.tag == 'umf-v0.10.9'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate the tracked 0.10.9 admission and exact download roster
        run: |
          test "$LOCALLY_QUALIFIED" = true
          python scripts/publish_codegen_pypi_0109.py roster --assets-dir incoming/assets --tag "$TAG" --source-sha "$SOURCE_SHA" --expected-sums-sha256 "$SUMS_SHA" --expected-admission-sha256 "$ADMISSION_SHA" > download-roster.txt
      - name: Download immutable release metadata and admitted files
        run: |
          set -euo pipefail
          mkdir -p incoming/assets
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > incoming/release.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > incoming/tag-ref.json
          if [[ "$(jq -r .object.type incoming/tag-ref.json)" == tag ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha incoming/tag-ref.json)" > incoming/tag-object.json
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_SHA" > incoming/commit.json
          while IFS= read -r name; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern="$name" --dir incoming/assets
          done < download-roster.txt
      - name: Verify release, source tree, Core PyPI bytes, local qualification and Codegen archives
        run: |
          set -euo pipefail
          ARGS=(verify --assets-dir incoming/assets --tag "$TAG" --source-sha "$SOURCE_SHA"
            --expected-sums-sha256 "$SUMS_SHA" --expected-admission-sha256 "$ADMISSION_SHA"
            --release-json incoming/release.json --tag-ref-json incoming/tag-ref.json --commit-json incoming/commit.json
            --output-dir dist)
          if [[ -f incoming/tag-object.json ]]; then ARGS+=(--tag-object-json incoming/tag-object.json); fi
          python scripts/publish_codegen_pypi_0109.py "${ARGS[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: admitted-codegen-0109
          path: dist/*
          if-no-files-found: error
          retention-days: 90
  publish-0109:
    needs: verify-0109
    if: inputs.publish == true && inputs.locally_qualified == true && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main' && github.repository == 'DocumentDrivenDX/umf' && inputs.tag == 'umf-v0.10.9'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    env:
      GH_TOKEN: ${{ github.token }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: admitted-codegen-0109
          path: dist
      - name: Revalidate admitted Codegen bytes and public Core; refuse PyPI collisions
        id: preflight
        run: |
          python scripts/publish_codegen_pypi_0109.py check-pypi --assets-dir dist --tag "$TAG" --source-sha "$SOURCE_SHA" \
            --expected-sums-sha256 "$SUMS_SHA" --expected-admission-sha256 "$ADMISSION_SHA"
      - name: Select exactly the two admitted Codegen archives
        if: steps.preflight.outputs.status == 'absent'
        run: |
          mkdir .verified-codegen-packages
          cp dist/umf_codegen-0.10.9-py3-none-any.whl dist/umf_codegen-0.10.9.tar.gz .verified-codegen-packages/
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.preflight.outputs.status == 'absent'
        with:
          packages-dir: .verified-codegen-packages/
      - name: Download and verify exact public Codegen inventory and bytes
        run: |
          python scripts/publish_codegen_pypi_0109.py check-pypi --assets-dir dist --tag "$TAG" --source-sha "$SOURCE_SHA" \
            --expected-sums-sha256 "$SUMS_SHA" --expected-admission-sha256 "$ADMISSION_SHA" --wait > dist/public-bytes-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: codegen-0109-public-bytes
          path: dist/public-bytes-receipt.json
          if-no-files-found: error
          retention-days: 365
