name: ci

# Tests the software, nothing else. Every run is one job capped at 20 minutes, so a run never uses more
# than 20 job-minutes:
#   - one cargo invocation builds the Rust test binaries, the Node addon, the Python extension and the CLI
#     with one profile and one feature set, so each crate compiles once;
#   - scripts/ci/plan.ts fills the time the build leaves with test units: the ones that failed last time,
#     the ones this change touches, then the least recently run. Repeated runs cover the whole inventory.
#     The run summary lists every unit not run and the age of its last run.
# Pushes and pull requests take the fast inventory (Rust, Python, Bun files not in scripts/slow-tests.txt);
# the nightly lane takes the slow Bun files. Run output is uploaded as workflow artifacts, never committed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      lane:
        description: 'push (fast inventory) or nightly (slow Bun files)'
        type: choice
        options: [push, nightly]
        default: push
  workflow_call:

concurrency:
  # One group per trigger, so a nightly/manual run is not cancelled by a push to the same branch.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  # Every Rust consumer is built by this one command; scripts that build again must use the same packages
  # and features, or cargo recompiles the shared crates.
  RUST_PACKAGES: >-
    -p umf-core -p umf-core-wire -p umf-tagged-wire -p umf-codegen -p umf-metamodel -p umf-metamodel-cli
    -p umf-cli -p umf-graphql -p umf-core-node -p umf-core-python
  RUST_FEATURES: umf-core/native-postgresql,umf-core-wire/native-postgresql,umf-cli/native-postgresql,umf-core-node/native-postgresql,umf-core-python/native-postgresql
  LANE: ${{ github.event_name == 'schedule' && 'nightly' || inputs.lane || 'push' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Tests stop starting at CI_DEADLINE. The margin covers job setup before this step and the post steps;
      # on main the Rust cache is saved, which takes longer.
      - name: Start the clock
        run: |
          margin=90
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$LANE" = push ]; then margin=240; fi
          echo "CI_DEADLINE=$(( $(date +%s) + 20*60 - margin ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: python3 scripts/check-repo-size.py

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      # Workspace crates are cached too: a change that touches no Rust source rebuilds nothing.
      # Only main saves, so pull requests cannot evict it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' && env.LANE == 'push' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            native/rdf/oracle-requirements.txt
            python/pyproject.toml
      - name: Restore the test ledger
        uses: actions/cache/restore@v4
        with:
          path: .ci-ledger
          key: ci-ledger-${{ env.LANE }}-${{ github.run_id }}
          restore-keys: ci-ledger-${{ env.LANE }}-

      - name: Build (Rust tests, Node addon, Python extension, CLI)
        run: |
          cargo build --locked --profile test --lib --bins --tests $RUST_PACKAGES --features $RUST_FEATURES
          cp target/debug/libumf_core_node.so bindings/core/node/umf_core_node.node
          cargo nextest list --locked $RUST_PACKAGES --features $RUST_FEATURES --message-format json > nextest-list.json
          python3 - <<'EOF'
          import json, os
          data = json.load(open('nextest-list.json'))
          root = os.getcwd() + '/'
          with open('rust-binaries.txt', 'w') as out:
              for b in data['rust-suites'].values():
                  if b['testcases']:
                      out.write(f"{b['binary-id']}\t{b['cwd'].removeprefix(root)}\n")
          EOF
      - run: bun install --frozen-lockfile
      - name: Coupled release versions
        if: env.LANE == 'push'
        run: |
          python3 scripts/check-release-versions.py
          python3 -m unittest discover -s tests/release
      - name: Choose the tests for this run
        run: |
          git diff --name-only HEAD^1 HEAD > changed.txt || true
          bun scripts/ci/plan.ts --lane "$LANE" --budget-seconds $(( CI_DEADLINE - $(date +%s) - 120 )) \
            --ledger .ci-ledger/ledger.json --changed changed.txt --rust-binaries rust-binaries.txt --out plan
          cat plan/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Rust tests
        if: ${{ !cancelled() }}
        run: |
          [ -s plan/rust.txt ] || exit 0
          filter=$(sed 's/.*/binary_id(=&)/' plan/rust.txt | paste -sd'|')
          timeout --signal=INT $(( CI_DEADLINE - $(date +%s) )) \
            cargo nextest run --locked --profile ci $RUST_PACKAGES --features $RUST_FEATURES -E "$filter"

      - name: Python tests
        if: ${{ !cancelled() }}
        run: |
          [ -s plan/py.txt ] || exit 0
          python -m pip install pytest pytest-xdist 'ruff==0.17.1' packaging 'hatchling>=1.27,<2' 'psycopg[binary]' 'cryptography==50.0.2'
          UMF_NATIVE_PREBUILT_DIR="$PWD/target/debug" python -m pip install --no-build-isolation ./python ./python/umf_codegen ./python/umf_access
          python -m pip install --no-deps --no-build-isolation ./python/umf_access_generated_executor
          ruff check --select E9,F63,F7,F82 python  # real errors only (syntax, undefined names); style rules are not gated
          (cd "$RUNNER_TEMP" && python "$GITHUB_WORKSPACE/scripts/smoke_quickstart.py")
          (cd python/umf_access_generated_executor && PYTHONPATH=src python -m unittest discover -s tests)
          timeout --signal=INT $(( CI_DEADLINE - $(date +%s) )) \
            python -m pytest -q -p no:cacheprovider -n 4 --dist loadfile -o junit_family=xunit1 --junitxml=py-junit.xml $(cat plan/py.txt)

      - name: Bun tests
        if: ${{ !cancelled() }}
        run: |
          [ -s plan/bun.txt ] || exit 0
          # Some tests spawn python3.11 with the pinned oracles, or protoc.
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v36.2/protoc-36.2-linux-x86_64.zip
          sudo unzip -qo "$RUNNER_TEMP/protoc.zip" -d /usr/local bin/protoc 'include/*'
          python3 -m venv .venv
          .venv/bin/python -m pip install -q protobuf==7.36.2 jsonschema==4.26.0 -r native/rdf/oracle-requirements.txt
          if grep -q 'browser' plan/bun.txt; then bunx playwright install --with-deps chromium; fi
          bun scripts/run-tests.ts --jobs 4 --keep-going --list plan/bun.txt \
            --deadline $(( (CI_DEADLINE - 15) * 1000 )) --results bun-results.tsv

      - name: Record results in the ledger
        if: always()
        run: |
          bun scripts/ci/ledger.ts --ledger .ci-ledger/ledger.json --bun bun-results.tsv \
            --py py-junit.xml --py-list plan/py.txt --rust target/nextest/ci/junit.xml
      - name: Save the test ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ci-ledger
          key: ci-ledger-${{ env.LANE }}-${{ github.run_id }}
