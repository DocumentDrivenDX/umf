name: Deploy locally qualified microsite

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microsite-${{ github.ref }}
  cancel-in-progress: false

# Build, compilation and behavioral tests happen locally before this revision
# is committed. This workflow only signs and deploys the committed static tree.
jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact locally qualified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Assemble the exact locked schema-browser release artifact
        run: bun scripts/pack-tools/install-renderer.ts
      - name: Get the existing pinned Innsigle verifier
        uses: actions/checkout@v4
        with:
          repository: DocumentDrivenDX/innsigle
          ref: 4185eb56beb7b52beaa4a00c2fc897f93d44b939
          path: .tools/innsigle
          persist-credentials: false
      - name: Verify the locally built workbench artifact hashes
        run: python3 scripts/pack-tools/verify_site.py --without-installed-dependencies
      - name: Check complete committed HTML inventory
        run: bun scripts/generated-page-seals.ts --inventory
      - name: Seal the exact locally built site with the registered build signer
        env:
          INNSIGLE_BUILD_KEY: ${{ secrets.INNSIGLE_BUILD_KEY }}
        run: bun scripts/generated-page-seals.ts --seal
      - name: Verify signatures and publish public attestations
        run: |
          bun scripts/generated-page-seals.ts --check
          node .tools/innsigle/src/cli.mjs verify --all
          node .tools/innsigle/src/cli.mjs publish docs/helix/05-deploy/microsite/dist
      - uses: actions/configure-pages@v5
      - name: Upload the signed static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/helix/05-deploy/microsite/dist
          retention-days: 1
      - name: Deploy the signed static site
        id: deployment
        uses: actions/deploy-pages@v4
