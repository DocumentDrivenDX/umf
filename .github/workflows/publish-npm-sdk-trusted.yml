name: Publish the UMF SDK with npm Trusted Publishing

on:
  workflow_dispatch:
    inputs:
      version:
        description: UMF version with an admitted npm archive
        type: string
        required: true
      candidate_release_id:
        description: Optional draft release ID for the admitted registry archive
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: umf-sdk-trusted-npm
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'DocumentDrivenDX/umf' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: npm-core
    permissions:
      # GitHub requires write access to read a draft release. The token is
      # passed to the archive download step only.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download the exact admitted archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ inputs.candidate_release_id }}
        run: python3 scripts/registry/publish_npm_sdk_trusted.py stage "$VERSION" --candidate-release-id "$RELEASE_ID"
      - name: Publish with the short-lived npm identity
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ inputs.candidate_release_id }}
        run: python3 scripts/registry/publish_npm_sdk_trusted.py publish "$VERSION" --candidate-release-id "$RELEASE_ID"
