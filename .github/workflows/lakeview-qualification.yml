# SPDX-License-Identifier: MIT OR Apache-2.0
name: Lakeview current runtime qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lakeview-qualification.yml'
      - 'crates/umf-core/src/lakeview.rs'
      - 'crates/umf-core/src/avro*.rs'
      - 'crates/umf-core/src/native_json.rs'
      - 'crates/umf-core/src/serialization.rs'
      - 'crates/umf-core-wire/src/lib.rs'
      - 'bindings/core/**'
      - 'src/adapters/lakeview/**'
      - 'src/registry/**'
      - 'spec/extensions/lakeview/**'
      - 'tests/lakeview/**'
      - 'scripts/lakeview*'
permissions:
  contents: read
concurrency:
  group: lakeview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  native-installed-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Clear historical host receipts before qualification
        run: rm -f docs/helix/04-build/evidence/lakeview/browser.json docs/helix/04-build/evidence/lakeview/installed.json
      - run: bun install --frozen-lockfile
      - name: Build the exact native binding and CLI
        run: |
          cargo build --locked --release -p umf-core-node -p umf-cli
          cp target/release/libumf_core_node.so bindings/core/node/umf_core_node.node
      - name: Core and Lakeview assertions
        run: cargo test --locked --release -p umf-core --lib --test lakeview --test resource_cache
      - name: Wire and frozen-vector regressions
        run: cargo test --locked --release -p umf-core-wire --lib
      - name: Binding and registry regressions
        run: bun scripts/run-tests.ts tests/lakeview tests/extension-kinds tests/registry/extension-rust-owned-registries.test.ts
      - name: Qualify installed Node, Bun and independent CLI transport
        run: |
          mkdir "$RUNNER_TEMP/lakeview-pack" "$RUNNER_TEMP/lakeview-consumer"
          npm pack ./bindings/core/node --pack-destination "$RUNNER_TEMP/lakeview-pack"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/lakeview-consumer" "$RUNNER_TEMP/lakeview-pack/umf-core-rust-native-0.1.0.tgz"
          UMF_KIND_NODE_PACKAGE="$RUNNER_TEMP/lakeview-consumer/node_modules/@umf/core-rust-native" UMF_KIND_CLI="$GITHUB_WORKSPACE/target/release/umf" bun scripts/lakeview-native-conformance.ts
      - name: Build the same Rust source for Chromium
        run: |
          cargo build --locked --release -p umf-core-wasm --target wasm32-unknown-unknown
          cargo install --locked --version 0.2.100 wasm-bindgen-cli
          wasm-bindgen --target web --out-dir bindings/core/wasm/pkg --out-name umf_core_wasm target/wasm32-unknown-unknown/release/umf_core_wasm.wasm
          bun run typecheck
          bun scripts/rust-migration/r8/v4-default-facade.mjs --check
          bunx playwright install --with-deps chromium
          bun scripts/lakeview-browser.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lakeview-current-runtime-receipts
          path: |
            docs/helix/04-build/evidence/lakeview/browser.json
            docs/helix/04-build/evidence/lakeview/installed.json
          retention-days: 30
