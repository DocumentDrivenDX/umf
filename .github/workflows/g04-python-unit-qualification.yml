name: G04 Python source-unit qualification

on:
  push:
    branches:
      - codex/g04-python-unit-qualification
    paths:
      - '.github/workflows/g04-python-unit-qualification.yml'
      - 'python/umf_access/pyproject.toml'
      - 'python/umf_access/src/umf_access/**'
      - 'python/umf_access/tests/owner_bootstrap_setup_fixture.py'
      - 'python/umf_access/tests/test_g04_conversion_policy.py'
      - 'python/umf_access/tests/test_original_supervisor_birth_integration.py'
      - 'python/umf_access/tests/test_original_store_pending_restart.py'
      - 'python/umf_access/tests/test_supervisor_journal_codec.py'
      - 'python/umf_access/tests/test_generation_root_registry.py'
      - 'python/umf_access/tests/test_generation_enrollment_authority.py'
      - 'python/umf_access/tests/test_ingress_local_postgres.py'
      - 'python/umf_access/tests/test_ingress_custody.py'
      - 'python/umf_access/tests/test_row_originals_creation.py'
      - 'python/umf_access/tests/test_row_originals_profile.py'
      - 'python/umf_access/qualification-requirements.lock'
      - 'python/umf_access/qualification-source-pins.sha256'

permissions:
  contents: read

jobs:
  g04-python-source-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pushed source
        id: checkout
        timeout-minutes: 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # immutable checkout action
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - name: Initialize bounded work and evidence paths
        if: always()
        id: initialize
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/g04-python-unit"
          mkdir -p "$root/work/logs" "$root/evidence" "$root/tools"
          mono=$(awk '{print $1}' /proc/uptime)
          awk -v n="$mono" 'BEGIN {printf "%.2f\n", n+360}' > "$root/internal-deadline"
          {
            printf 'G04_ROOT=%s\n' "$root"
            printf 'G04_INTERNAL_DEADLINE_FILE=%s\n' "$root/internal-deadline"
          } >> "$GITHUB_ENV"

      - name: Set up exact CPython 3.12.15
        id: python
        timeout-minutes: 1
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # immutable setup-python action
        with:
          python-version: '3.12.15'
          check-latest: false

      - name: Fail-closed checkout, lock, and source-pin verification
        id: preflight
        timeout-minutes: 1
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = push
          test "$REF_NAME" = refs/heads/codex/g04-python-unit-qualification
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(python --version 2>&1)" = 'Python 3.12.15'
          timeout --signal=TERM --kill-after=5s 30s sha256sum -c python/umf_access/qualification-source-pins.sha256 > "$G04_ROOT/evidence/source-check.txt"
          printf '%s  %s\n' '5d7e5c591fddb14515f8fbf76b125245fc2b2fac337e7b8025edd17524aef5ab' 'python/umf_access/qualification-requirements.lock' | timeout --signal=TERM --kill-after=5s 30s sha256sum -c - >> "$G04_ROOT/evidence/source-check.txt"
          timeout --signal=TERM --kill-after=5s 30s bash -c 'printf "python=%s\n" "$(python --version 2>&1)"; printf "python_path=%s\n" "$(command -v python)"; sha256sum "$(command -v python)"' > "$G04_ROOT/evidence/python-identity.txt"
          cat > "$G04_ROOT/tools/run-bounded" <<'RUNNER'
          #!/usr/bin/env bash
          set -uo pipefail
          name="$1"; stage_cap="$2"; shift 2
          root="$G04_ROOT/work"; deadline="$(cat "$G04_INTERNAL_DEADLINE_FILE")"
          now="$(awk '{print $1}' /proc/uptime)"
          remain=$(awk -v d="$deadline" -v n="$now" 'BEGIN {x=int(d-n-70); if(x<0)x=0; print x}')
          limit="$stage_cap"; (( remain < limit )) && limit="$remain"
          begin="$(awk '{print $1}' /proc/uptime)"; start_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; log="$root/logs/$name.log"
          if (( limit <= 0 )); then printf 'command\t%s\tlimit_s=0\traw_exit=not-started\tgate_exit=124\n' "$name" >> "$root/commands.tsv"; exit 124; fi
          printf 'argv\t%s' "$name" >> "$root/commands.tsv"; printf '\t%q' "$@" >> "$root/commands.tsv"; printf '\n' >> "$root/commands.tsv"
          timeout --signal=TERM --kill-after=10s "${limit}s" "$@" > "$log" 2>&1
          raw=$?; end_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"; endmono="$(awk '{print $1}' /proc/uptime)"
          elapsed=$(awk -v a="$begin" -v b="$endmono" 'BEGIN {printf "%.2f",b-a}')
          original=$(wc -c < "$log"); truncated=no
          if (( original > 1048576 )); then tail -c 1048576 "$log" > "$log.tmp" && mv "$log.tmp" "$log"; truncated=yes; fi
          printf 'command\t%s\tstart_utc=%s\tend_utc=%s\tduration_monotonic_s=%s\tlimit_s=%s\traw_exit=%s\tlog_original_bytes=%s\tlog_truncated=%s\tlog_sha256=%s\n' "$name" "$start_utc" "$end_utc" "$elapsed" "$limit" "$raw" "$original" "$truncated" "$(sha256sum "$log" | cut -d' ' -f1)" >> "$root/commands.tsv"
          cat "$log"; exit "$raw"
          RUNNER
          chmod 700 "$G04_ROOT/tools/run-bounded"
          {
            printf 'profile=umf.g04-python-source-unit/1\n'
            printf 'event=%s\nref=%s\nexpected_sha=%s\ncheckout_sha=%s\ncheckout_tree=%s\n' "$EVENT_NAME" "$REF_NAME" "$EXPECTED_SHA" "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"
            printf 'python=%s\n' "$(python --version 2>&1)"
            printf 'requirements_sha256=%s\n' '5d7e5c591fddb14515f8fbf76b125245fc2b2fac337e7b8025edd17524aef5ab'
            printf 'source_pin_sha256=%s\n' "$(sha256sum python/umf_access/qualification-source-pins.sha256 | cut -d' ' -f1)"
          } > "$G04_ROOT/evidence/identity.txt"

      - name: Run isolated source-only G04 unit roster
        id: tests
        timeout-minutes: 4
        env:
          SOURCE_PYTHONPATH: python/umf_access/src:python/umf_access/tests
        shell: bash
        run: |
          set -u
          bounded="$G04_ROOT/tools/run-bounded"
          venv="$RUNNER_TEMP/g04-python-venv"
          venv_rc=0; install_rc=125; test_rc=125
          "$bounded" create-venv 30 python -m venv "$venv"; venv_rc=$?
          if (( venv_rc == 0 )); then
            "$bounded" install-locked-wheels 150 "$venv/bin/python" -m pip install --require-hashes --only-binary=:all: --no-deps -r python/umf_access/qualification-requirements.lock
            install_rc=$?
          fi
          if (( venv_rc == 0 && install_rc == 0 )); then
            "$bounded" unittest-source-roster 180 env "PYTHONPATH=$SOURCE_PYTHONPATH" "$venv/bin/python" -m unittest -v \
              test_g04_conversion_policy \
              test_original_supervisor_birth_integration \
              test_supervisor_journal_codec \
              test_ingress_custody \
              test_ingress_local_postgres \
              test_row_originals_creation \
              test_row_originals_profile \
              test_original_store_pending_restart
            test_rc=$?
          fi
          printf 'venv_exit=%s\ninstall_exit=%s\ntest_exit=%s\n' "$venv_rc" "$install_rc" "$test_rc" > "$G04_ROOT/evidence/result.txt"
          if (( venv_rc != 0 )); then exit "$venv_rc"; fi
          if (( install_rc != 0 )); then exit "$install_rc"; fi
          exit "$test_rc"

      - name: Always create fresh bounded public evidence assembly
        id: evidence
        if: always()
        timeout-minutes: 1
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/g04-python-unit"
          evidence="$root/evidence"
          upload="$root/upload"
          mkdir -p "$evidence" "$root/work/logs"
          rm -rf "$upload"
          mkdir -p "$upload/logs"
          if [ ! -f "$evidence/identity.txt" ]; then printf 'failure_receipt=preflight_or_setup_did_not_complete\n' > "$evidence/identity.txt"; fi
          if [ ! -f "$root/work/commands.tsv" ]; then printf 'commands=none-recorded\n' > "$root/work/commands.tsv"; fi
          if [ ! -f "$evidence/result.txt" ]; then printf 'venv_exit=not-run\ninstall_exit=not-run\ntest_exit=not-run\n' > "$evidence/result.txt"; fi
          printf 'checkout=%s\npython_setup=%s\npreflight=%s\ntests=%s\n' "$CHECKOUT_OUTCOME" "$PYTHON_OUTCOME" "$PREFLIGHT_OUTCOME" "$TEST_OUTCOME" > "$evidence/outcome.txt"
          cp "$evidence/identity.txt" "$upload/identity.txt"
          cp "$evidence/result.txt" "$upload/result.txt"
          cp "$evidence/outcome.txt" "$upload/outcome.txt"
          cp "$root/work/commands.tsv" "$upload/commands.tsv"
          if [ -f "$evidence/source-check.txt" ]; then cp "$evidence/source-check.txt" "$upload/source-check.txt"; fi
          if [ -f "$evidence/python-identity.txt" ]; then cp "$evidence/python-identity.txt" "$upload/python-identity.txt"; fi
          find "$root/work/logs" -maxdepth 1 -type f -print0 | while IFS= read -r -d '' file; do cp "$file" "$upload/logs/${file##*/}"; done
          printf 'log_cap_bytes=1048576\nartifact_cap_bytes=8388608\n' > "$upload/limits.txt"
          log_remaining=1048576
          while IFS= read -r -d '' file; do
            bytes=$(wc -c < "$file")
            if (( bytes > log_remaining )); then
              if (( log_remaining > 0 )); then tail -c "$log_remaining" "$file" > "$file.cap"; mv "$file.cap" "$file"; else rm -f "$file"; fi
              printf 'aggregate_log_cap_truncation\t%s\toriginal_bytes=%s\n' "${file##*/}" "$bytes" >> "$upload/limits.txt"
              bytes=$log_remaining
            fi
            log_remaining=$((log_remaining - bytes))
          done < <(find "$upload/logs" -type f -print0)
          while IFS= read -r -d '' file; do
            bytes=$(wc -c < "$file")
            if (( bytes > 1048576 )); then tail -c 1048576 "$file" > "$file.cap"; mv "$file.cap" "$file"; printf 'per_file_cap_truncation\t%s\toriginal_bytes=%s\n' "${file##*/}" "$bytes" >> "$upload/limits.txt"; fi
          done < <(find "$upload" -type f -print0)
          total=$(du -sb "$upload" | awk '{print $1}')
          if (( total > 8388608 )); then
            rm -rf "$upload"
            echo "evidence assembly withheld: $total bytes exceeds 8388608" >&2
            exit 1
          fi
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

      - name: Upload bounded source-unit evidence
        if: always() && steps.evidence.outputs.ready == 'true'
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # immutable upload-artifact action
        with:
          name: g04-python-unit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g04-python-unit/upload/
          if-no-files-found: error
          retention-days: 14
