name: Generated access executor
on:
  pull_request:
    paths:
      - python/umf_access_generated_executor/**
      - .github/workflows/generated-access-executor.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - working-directory: python/umf_access_generated_executor
        run: PYTHONPATH=src python -m unittest discover -s tests
