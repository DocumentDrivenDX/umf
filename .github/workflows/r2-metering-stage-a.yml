name: R2 metering accounted-companion generation

on:
  push:
    branches:
      - codex/migration-metering-qualification
      - codex/migration-main-metering-generation

permissions:
  contents: read

jobs:
  generate-accounted-companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Start monotonic aggregate budget and bounded log capture
        timeout-minutes: 1
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/umf-r2-stage-a-evidence"
          mkdir -p "$evidence"
          python3 - "$RUNNER_TEMP/umf-r2-stage-a-capture.py" "$RUNNER_TEMP/umf-r2-stage-a-deadline.txt" <<'PY'
          import pathlib, sys, time
          capture = pathlib.Path(sys.argv[1])
          deadline = pathlib.Path(sys.argv[2])
          capture.write_text(r'''import os, pathlib, selectors, subprocess, sys, time
          log = pathlib.Path(sys.argv[1])
          deadline_file = pathlib.Path(sys.argv[2])
          command_timeout = float(sys.argv[3])
          argv = sys.argv[4:]
          deadline_ns = int(deadline_file.read_text().strip())
          now = time.monotonic_ns()
          aggregate_remaining = (deadline_ns - now) / 1_000_000_000 - 72
          prior = sum(p.stat().st_size for p in log.parent.glob("*.log"))
          remaining_log = max(0, 1_000_000 - prior)
          allowance = min(command_timeout, aggregate_remaining)
          if allowance <= 0:
              print("aggregate deadline reserve reached", file=sys.stderr)
              sys.exit(124)
          proc = subprocess.Popen(
              ["timeout", "--signal=TERM", "--kill-after=10s", f"{allowance:.3f}s", *argv],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          selector = selectors.DefaultSelector()
          selector.register(proc.stdout, selectors.EVENT_READ)
          written = 0
          overflow = False
          timed_out = False
          end = time.monotonic() + allowance + 12
          with log.open("wb") as output:
              while selector.get_map() or proc.poll() is None:
                  if time.monotonic() >= end:
                      timed_out = True
                      break
                  events = selector.select(min(0.2, max(0, end-time.monotonic()))) if selector.get_map() else ()
                  for key, _ in events:
                      chunk = os.read(key.fd, 65536)
                      if not chunk:
                          selector.unregister(key.fileobj)
                          continue
                      room = remaining_log - written
                      if room > 0:
                          kept = chunk[:room]
                          output.write(kept)
                          written += len(kept)
                      if len(chunk) > max(0, room):
                          overflow = True
              output.flush()
          selector.close()
          proc.stdout.close()
          status = proc.poll()
          timed_out = timed_out or status in (124, 137)
          print(f"exit={status} bytes_written={written} aggregate_log_overflow={str(overflow).lower()} timed_out={str(timed_out).lower()}")
          if overflow:
              sys.exit(125)
          if timed_out:
              sys.exit(124)
          sys.exit(status)
          ''')
          deadline.write_text(str(time.monotonic_ns() + 900_000_000_000))
          PY

      - name: Check out exact pushed source
        timeout-minutes: 2
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false

      - name: Set up pinned Bun
        timeout-minutes: 2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3

      - name: Verify the closed generation source cohort
        timeout-minutes: 1
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/umf-r2-stage-a-evidence"
          mkdir -p "$evidence"
          test "$EVENT_NAME" = push
          case "$REF_NAME" in
            refs/heads/codex/migration-metering-qualification|refs/heads/codex/migration-main-metering-generation) ;;
            *) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          pin_sha="$(sha256sum qualification-inputs/r2-metering-stage-a.sha256 | cut -d ' ' -f 1)"
          test "$pin_sha" = 2c3071baeb289c5bc41ce903dbb4597f14cb471e316259baac252887bdfc454c
          sha256sum -c qualification-inputs/r2-metering-stage-a.sha256
          bun_version="$(bun --version)"
          test "$bun_version" = 1.4.3
          bun_path="$(command -v bun)"
          {
            printf 'profile=umf.r2-metering-stage-a/1\n'
            printf 'event=%s\nref=%s\ncommit=%s\nworkflow_ref=%s\nworkflow_sha=%s\nrun_id=%s\nattempt=%s\n' \
              "$EVENT_NAME" "$REF_NAME" "$EXPECTED_SHA" "$WORKFLOW_REF" "$WORKFLOW_SHA" "$RUN_ID" "$RUN_ATTEMPT"
            printf 'runner=ubuntu-24.04\nbun_version=%s\nbun_path=%s\nbun_binary_sha256=%s\n' \
              "$bun_version" "$bun_path" "$(sha256sum "$bun_path" | cut -d ' ' -f 1)"
            printf 'pin_manifest=qualification-inputs/r2-metering-stage-a.sha256\npin_manifest_sha256=%s\n' "$pin_sha"
          } > "$evidence/identity.txt"
          cp qualification-inputs/r2-metering-stage-a.sha256 "$evidence/source-pins.sha256"

      - name: Install locked generator dependency without lifecycle scripts
        id: install
        timeout-minutes: 4
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/umf-r2-stage-a-evidence"
          set +e
          python3 "$RUNNER_TEMP/umf-r2-stage-a-capture.py" "$evidence/install.log" "$RUNNER_TEMP/umf-r2-stage-a-deadline.txt" 160 bun install --frozen-lockfile --ignore-scripts > "$RUNNER_TEMP/umf-r2-stage-a-capture-status.txt" 2>&1
          result="$?"
          set -e
          printf 'install_exit=%s\nargv=python3 bounded-capture timeout=160 bun install --frozen-lockfile --ignore-scripts\n' "$result" >> "$evidence/identity.txt"
          cat "$RUNNER_TEMP/umf-r2-stage-a-capture-status.txt" >> "$evidence/identity.txt"
          rm -f "$RUNNER_TEMP/umf-r2-stage-a-capture-status.txt"
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          grep -Fq '"version": "5.9.3"' node_modules/typescript-api/package.json
          printf 'typescript_api_version=5.9.3\n' >> "$evidence/identity.txt"

      - name: Generate one artifact-only accounted companion
        id: generate
        timeout-minutes: 3
        env:
          UMF_R2_OUTPUT_PURPOSE: stage-a
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/umf-r2-stage-a-evidence"
          output="$RUNNER_TEMP/r2-metering-generated-${RUN_ID}-${RUN_ATTEMPT}"
          set +e
          python3 "$RUNNER_TEMP/umf-r2-stage-a-capture.py" "$evidence/generator.log" "$RUNNER_TEMP/umf-r2-stage-a-deadline.txt" 90 bun scripts/qualification/r2-metering-generate.ts > "$RUNNER_TEMP/umf-r2-stage-a-capture-status.txt" 2>&1
          result="$?"
          set -e
          printf 'generator_exit=%s\nargv=python3 bounded-capture timeout=90 bun scripts/qualification/r2-metering-generate.ts\n' "$result" >> "$evidence/identity.txt"
          cat "$RUNNER_TEMP/umf-r2-stage-a-capture-status.txt" >> "$evidence/identity.txt"
          rm -f "$RUNNER_TEMP/umf-r2-stage-a-capture-status.txt"
          if [ "$result" -ne 0 ]; then exit "$result"; fi
          test -d "$output"
          test "$(find "$output" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
          test -f "$output/core-validators-accounted.ts"
          test -f "$output/manifest.json"
          companion_bytes="$(stat -c %s "$output/core-validators-accounted.ts")"
          manifest_bytes="$(stat -c %s "$output/manifest.json")"
          test "$companion_bytes" -le 4000000
          test "$manifest_bytes" -le 16384
          printf 'companion_sha256=%s\ncompanion_bytes=%s\nmanifest_sha256=%s\nmanifest_bytes=%s\n' \
            "$(sha256sum "$output/core-validators-accounted.ts" | cut -d ' ' -f 1)" "$companion_bytes" \
            "$(sha256sum "$output/manifest.json" | cut -d ' ' -f 1)" "$manifest_bytes" >> "$evidence/identity.txt"
          cp "$output/core-validators-accounted.ts" "$evidence/core-validators-accounted.ts"
          cp "$output/manifest.json" "$evidence/manifest.json"

      - name: Finalize bounded public-only artifact roster
        if: always()
        id: finalize
        timeout-minutes: 1
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/umf-r2-stage-a-evidence"
          upload="$RUNNER_TEMP/umf-r2-stage-a-upload"
          candidate="$RUNNER_TEMP/umf-r2-stage-a-upload-candidate"
          rm -rf "$upload" "$candidate"
          mkdir -p "$candidate"
          fail() {
            printf 'stage-a artifact finalization failed: %s\n' "$1" > "$candidate/failure.txt"
            mv "$candidate" "$upload"
            printf 'ready=true\n' >> "$GITHUB_OUTPUT"
            exit 1
          }
          test -d "$evidence"
          if [ -f "$evidence/install.log" ] && [ "$(stat -c %s "$evidence/install.log")" -gt 1000000 ]; then
            fail overflow-install-log
          fi
          if [ -f "$evidence/generator.log" ] && [ "$(stat -c %s "$evidence/generator.log")" -gt 1000000 ]; then
            fail overflow-generator-log
          fi
          if [ -f "$evidence/install.log" ] && [ -f "$evidence/generator.log" ]; then
            combined_logs=$(( $(stat -c %s "$evidence/install.log") + $(stat -c %s "$evidence/generator.log") ))
            if [ "$combined_logs" -gt 1000000 ]; then
              fail overflow-aggregate-logs
            fi
          fi
          if find "$evidence" -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            fail unexpected-non-file-artifact
          fi
          mapfile -t files < <(find "$evidence" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          total_bytes=0
          for file in "${files[@]}"; do
            case "$file" in
              identity.txt|source-pins.sha256|install.log|generator.log|core-validators-accounted.ts|manifest.json) ;;
              *) fail unexpected-artifact-file ;;
            esac
            size="$(stat -c %s "$evidence/$file")"
            if [ "$file" = generator.log ] || [ "$file" = install.log ]; then test "$size" -le 1000000; fi
            total_bytes=$((total_bytes + size))
          done
          if [ "$total_bytes" -gt 16000000 ]; then fail aggregate-artifact-cap; fi
          for file in "${files[@]}"; do cp "$evidence/$file" "$candidate/$file"; done
          mv "$candidate" "$upload"
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

      - name: Upload bounded source and artifact receipts
        if: always() && steps.finalize.outputs.ready == 'true'
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: umf-r2-metering-stage-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/umf-r2-stage-a-upload/*
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
