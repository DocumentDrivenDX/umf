# SPDX-License-Identifier: MIT OR Apache-2.0
name: Access package identity
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'python/umf_access/**'
      - 'scripts/check-access-python-boundaries.py'
      - 'scripts/access-runtime-fix-fixture.ts'
      - '.github/workflows/access-package-identity.yml'
permissions:
  contents: read
concurrency:
  group: access-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  installed-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
      - uses: astral-sh/setup-uv@v6
      - name: Check Access module ownership
        run: python scripts/check-access-python-boundaries.py
      - name: Build and install the actual Access wheel
        run: |
          uv build --python 3.11 --wheel --sdist --out-dir "$RUNNER_TEMP/access-dist" python/umf_access
          uv venv --python 3.11 "$RUNNER_TEMP/access-consumer"
          uv pip install --python "$RUNNER_TEMP/access-consumer/bin/python" --find-links https://github.com/DocumentDrivenDX/umf/releases/expanded_assets/umf-v0.10.10 "$RUNNER_TEMP/access-dist/"*.whl pydantic==2.14.2 pytest==8.4.2 packaging==26.3 umf-weft==0.4.56
      - name: Verify exact installed bytes and source-selected runtime identity
        run: |
          "$RUNNER_TEMP/access-consumer/bin/python" -I -B - <<'PYTHON'
          import hashlib, importlib.metadata as metadata, json, os, platform, subprocess, sys, sysconfig, tomllib
          from pathlib import Path
          import umf_access
          from umf_access.types import RUNTIME_IDENTITY
          package = Path('python/umf_access').resolve()
          sys.path.insert(0, str(package / 'tests/packaging'))
          from build_wheel import resolve_source_version
          from replay_installed import check_public_runtime_abi, inspect_wheel, verify_installed_files
          version = resolve_source_version(package, tomllib.loads((package / 'pyproject.toml').read_text()))
          pin = {'distribution': 'umf_access', 'version': version, 'abi': 'umf-access-runtime/0.1'}
          assert metadata.version('umf_access') == version
          assert RUNTIME_IDENTITY == ('umf_access', version, pin['abi'])
          site = Path(sysconfig.get_paths()['purelib'])
          assert Path(umf_access.__file__).is_relative_to(site)
          wheels = list((Path(os.environ['RUNNER_TEMP']) / 'access-dist').glob('*.whl'))
          assert len(wheels) == 1
          members = inspect_wheel(wheels[0], pin)
          verify_installed_files(members, site)
          check_public_runtime_abi(umf_access, pin)
          receipt = {'scope': 'installed packaging and inert catalog identity; no database or native target acceptance', 'source': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'python': platform.python_version(), 'platform': platform.platform(), 'runtimeIdentity': list(RUNTIME_IDENTITY), 'wheelSha256': hashlib.sha256(wheels[0].read_bytes()).hexdigest(), 'wheelMembers': len(members), 'dependencies': {name: metadata.version(name) for name in ('umf-core', 'umf-weft', 'pydantic', 'pydantic-core')}}
          (Path(os.environ['RUNNER_TEMP']) / 'access-dist/installed-identity.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PYTHON
      - name: Installed packaging and read-admission controls
        run: |
          "$RUNNER_TEMP/access-consumer/bin/python" -I -B -c 'import umf_access,pytest; raise SystemExit(pytest.main(["-p","no:cacheprovider","-c","/dev/null","--noconftest","--import-mode=importlib","python/umf_access/tests/test_wheel_contract.py","python/umf_access/tests/test_reviewed_reads.py","-q"]))'
      - name: Verify receipt recovery with installed Access
        run: |
          "$RUNNER_TEMP/access-consumer/bin/python" -I -B -m pytest -q -p no:cacheprovider -c /dev/null --noconftest python/umf_access/tests/test_table_outcomes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-package-identity-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/access-dist/
          retention-days: 30
