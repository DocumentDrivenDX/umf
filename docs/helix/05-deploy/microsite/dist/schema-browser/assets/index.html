<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>UMF schema browser</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="explorer.css"></head><body><main class="explorer-main"><section class="page-top"><div class="eyebrow">Schema explorer</div><h1>Explore the shape<br><em>and the meaning.</em></h1><p class="intro">Browse domain packs, follow their references, and inspect the details that travel with each schema.</p></section>
<div class="explorer-toolbar"><label class="search-label">Find a schema or definition<input id="search" type="search" placeholder="Search names, descriptions, or IDs…"></label><label>Catalog<select id="category"><option value="all">All schemas</option><option value="domain">Domain packs</option><option value="example">Examples</option></select></label><label class="button secondary file-button">Open local schema<input id="file" type="file" accept=".json,.yaml,.yml" disabled hidden></label></div>
<p id="status" role="status" aria-live="polite">Loading schema catalog…</p>
<div class="explorer-layout"><aside aria-label="Schema catalog"><div class="catalog-heading"><h2>Catalog</h2><span id="count" class="tag"></span></div><div id="catalog"></div><p class="quiet">Local files stay in this browser. Inspection preserves the original content.</p></aside><section id="inspector" aria-label="Schema details"><p>Select a schema to explore.</p></section></div></main><script type="module" src="explorer.js"></script></body></html>
