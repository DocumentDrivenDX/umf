umf: 0.10.0
id: urn:umf:metamodel
title: UMF for UMF
vocabularies:
  umf.metamodel:
    version: 0.1.0
extensions:
  umf.metamodel:
    source:
      path: spec/core/semantic-types-document.schema.json
      pointer: ""
    schema:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: urn:umf:core:0.10.0
      title: UMF 0.10.0 semantic references over exact 128-bit and UUID values
      type: object
      required:
        - umf
        - id
        - vocabularies
        - modules
      properties:
        umf:
          const: 0.10.0
        id:
          $ref: "#/$defs/id"
        vocabularies:
          type: object
          propertyNames:
            $ref: "#/$defs/id"
          additionalProperties:
            type: object
            required:
              - version
            properties:
              version:
                $ref: "#/$defs/version"
        modules:
          type: array
          items:
            $ref: "#/$defs/module"
        extensions:
          $ref: "#/$defs/extensions"
        title:
          type: string
        aliases:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
      $defs:
        id:
          type: string
          minLength: 1
        version:
          type: string
          pattern: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$
        knownScalarType:
          enum:
            - boolean
            - integer
            - decimal
            - float
            - string
            - binary
            - date
            - time
            - timestamp
            - bits128
            - uuid
          description: Version-qualified value families; bits128 and uuid have intrinsic16-byte domains under umf-128/1; native refinements remain attached.
        scalarType:
          anyOf:
            - $ref: "#/$defs/knownScalarType"
            - type: string
              minLength: 1
              not:
                $ref: "#/$defs/knownScalarType"
              description: Unknown family retained with incomplete semantic validation.
        extensions:
          type: object
          propertyNames:
            $ref: "#/$defs/id"
          additionalProperties: true
        reference:
          type: object
          required:
            - role
            - module
            - element
          properties:
            role:
              $ref: "#/$defs/id"
            module:
              $ref: "#/$defs/id"
            element:
              $ref: "#/$defs/id"
        element:
          type: object
          required:
            - id
            - extensions
          properties:
            id:
              $ref: "#/$defs/id"
            name:
              type: string
            description:
              type: string
            scalarType:
              $ref: "#/$defs/scalarType"
            extensions:
              $ref: "#/$defs/extensions"
            references:
              type: array
              items:
                $ref: "#/$defs/reference"
            kind:
              type: string
              minLength: 1
              description: UMF role; unknown labels remain uninterpreted. Missing is unspecified, never inferred from scalarType.
            nullability:
              type: string
              minLength: 1
              description: Ideal value availability. Unknown labels remain uninterpreted. Missing and unspecified assert no availability constraint. Native absence carriers require explicit bindings.
            cardinality:
              type: string
              minLength: 1
              description: One ideal value, finite ordered sequence with duplicates allowed, finite exact string-key mapping with unique keys, or no assertion. Unknown labels remain uninterpreted.
            itemType:
              $ref: "#/$defs/itemType"
            facets:
              $ref: "#/$defs/facets"
            members:
              type: array
              uniqueItems: true
              items:
                $ref: "#/$defs/keyFieldReference"
            keys:
              type: array
              minItems: 1
              items:
                $ref: "#/$defs/key"
            title:
              type: string
            aliases:
              type: array
              uniqueItems: true
              items:
                type: string
                minLength: 1
            examples:
              type: array
              items:
                $ref: "#/$defs/literal"
            allowedValues:
              type: array
              minItems: 1
              items:
                $ref: "#/$defs/literal"
            default:
              type: object
              required:
                - value
                - on
              properties:
                value:
                  $ref: "#/$defs/literal"
                on:
                  enum:
                    - missing
                    - "null"
                    - missing-or-null
              additionalProperties: true
            semanticTypes:
              type: array
              minItems: 1
              items:
                $ref: urn:umf:core:semantic-type-reference:1.0.0
          allOf:
            - if:
                required:
                  - kind
                properties:
                  kind:
                    enum:
                      - record
                      - group
              then:
                properties:
                  scalarType: false
            - if:
                required:
                  - nullability
                properties:
                  nullability: {}
              then:
                required:
                  - kind
                properties:
                  kind:
                    const: field
            - if:
                required:
                  - cardinality
                properties:
                  cardinality: {}
              then:
                required:
                  - kind
                properties:
                  kind:
                    const: field
            - if:
                required:
                  - cardinality
                properties:
                  cardinality:
                    enum:
                      - array
                      - map
              then:
                not:
                  required:
                    - scalarType
            - if:
                required:
                  - itemType
                properties:
                  itemType: {}
              then:
                required:
                  - kind
                  - cardinality
                properties:
                  kind:
                    const: field
                  cardinality:
                    enum:
                      - array
                      - map
            - if:
                required:
                  - facets
                properties:
                  facets: {}
              then:
                required:
                  - kind
                properties:
                  kind:
                    const: field
                  references:
                    type: array
                    not:
                      contains:
                        type: object
                        required:
                          - role
                        properties:
                          role:
                            const: record-type
            - if:
                required:
                  - facets
                properties:
                  facets:
                    type: object
                    required:
                      - length
                    properties:
                      length: {}
              then:
                required:
                  - scalarType
                properties:
                  scalarType:
                    enum:
                      - string
                      - binary
            - if:
                required:
                  - facets
                properties:
                  facets:
                    type: object
                    required:
                      - length
                    properties:
                      length:
                        type: object
                        required:
                          - unit
                        properties:
                          unit:
                            const: unicode-scalar
              then:
                required:
                  - scalarType
                properties:
                  scalarType:
                    const: string
            - if:
                required:
                  - facets
                properties:
                  facets:
                    type: object
                    required:
                      - length
                    properties:
                      length:
                        type: object
                        required:
                          - unit
                        properties:
                          unit:
                            const: byte
              then:
                required:
                  - scalarType
                properties:
                  scalarType:
                    const: binary
            - if:
                required:
                  - facets
                properties:
                  facets:
                    type: object
                    required:
                      - precision
                    properties:
                      precision: {}
              then:
                required:
                  - scalarType
                properties:
                  scalarType:
                    const: decimal
            - if:
                required:
                  - facets
                properties:
                  facets:
                    type: object
                    required:
                      - integerWidth
                    properties:
                      integerWidth: {}
              then:
                required:
                  - scalarType
                properties:
                  scalarType:
                    const: integer
            - if:
                properties:
                  members: {}
                required:
                  - members
              then:
                required:
                  - kind
                properties:
                  kind:
                    const: record
            - if:
                properties:
                  keys: {}
                required:
                  - keys
              then:
                required:
                  - kind
                  - members
                properties:
                  kind:
                    const: record
                  members: {}
            - if:
                required:
                  - examples
                properties:
                  examples: {}
              then:
                required:
                  - kind
                properties:
                  kind:
                    const: field
            - if:
                required:
                  - allowedValues
                properties:
                  allowedValues: {}
              then:
                required:
                  - kind
                properties:
                  kind:
                    const: field
            - if:
                required:
                  - default
                properties:
                  default: {}
              then:
                required:
                  - kind
                properties:
                  kind:
                    const: field
        module:
          type: object
          required:
            - id
            - namespace
            - elements
          properties:
            id:
              $ref: "#/$defs/id"
            namespace:
              type: string
            elements:
              type: array
              items:
                $ref: "#/$defs/element"
            extensions:
              $ref: "#/$defs/extensions"
            relationships:
              type: array
              items:
                $ref: "#/$defs/relationship"
            title:
              type: string
            aliases:
              type: array
              uniqueItems: true
              items:
                type: string
                minLength: 1
        knownElementKind:
          enum:
            - field
            - record
            - group
        knownNullability:
          enum:
            - required
            - absent-allowed
            - unspecified
        knownCardinality:
          enum:
            - one
            - array
            - map
            - unspecified
        itemType:
          type: object
          required:
            - module
            - element
          properties:
            module:
              $ref: "#/$defs/id"
            element:
              $ref: "#/$defs/id"
        facets:
          type: object
          description: Missing members impose no bound. Unknown members and qualifiers are retained without interpretation.
          properties:
            length:
              type: object
              required:
                - unit
              anyOf:
                - required:
                    - min
                  properties:
                    min: {}
                - required:
                    - max
                  properties:
                    max: {}
              properties:
                min:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                max:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                unit:
                  type: string
                  minLength: 1
              additionalProperties: true
            precision:
              type: integer
              minimum: 1
              maximum: 9007199254740991
              description: Decimal coefficient digit bound; requires scale. Absolute coefficient is less than 10^precision. No implicit rounding.
            scale:
              type: integer
              minimum: 0
              maximum: 9007199254740991
              description: Fixed fractional digit count; requires precision. Semantic validation requires scale <= precision. Value equals integer coefficient times 10^-scale.
            integerWidth:
              type: object
              required:
                - bits
                - signed
              properties:
                bits:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
                signed:
                  type: boolean
              description: Signed [-2^(bits-1),2^(bits-1)-1] or unsigned [0,2^bits-1]; mathematical domain, not a physical storage-width assertion.
            collectionSize:
              type: object
              anyOf:
                - required:
                    - min
                  properties:
                    min: {}
                - required:
                    - max
                  properties:
                    max: {}
              properties:
                min:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                max:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
              additionalProperties: true
            range:
              type: object
              anyOf:
                - required:
                    - min
                  properties:
                    min: {}
                - required:
                    - max
                  properties:
                    max: {}
              properties:
                min:
                  $ref: "#/$defs/literal"
                max:
                  $ref: "#/$defs/literal"
                minInclusive:
                  type: boolean
                maxInclusive:
                  type: boolean
              additionalProperties: true
          dependentRequired:
            precision:
              - scale
            scale:
              - precision
        keyFieldReference:
          type: object
          required:
            - module
            - element
          properties:
            module:
              $ref: "#/$defs/id"
            element:
              $ref: "#/$defs/id"
          additionalProperties: true
        key:
          type: object
          required:
            - id
            - name
            - fields
          properties:
            id:
              $ref: "#/$defs/id"
            name:
              $ref: "#/$defs/id"
            fields:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                $ref: "#/$defs/keyFieldReference"
            primary:
              type: boolean
          additionalProperties: true
        relationshipEndpoint:
          type: object
          required:
            - module
            - element
          properties:
            module:
              $ref: "#/$defs/id"
            element:
              $ref: "#/$defs/id"
          additionalProperties: true
        relationshipTarget:
          type: object
          required:
            - module
            - element
            - key
          properties:
            module:
              $ref: "#/$defs/id"
            element:
              $ref: "#/$defs/id"
            key:
              $ref: "#/$defs/id"
          additionalProperties: true
        relationshipMultiplicity:
          type: object
          required:
            - min
            - max
          properties:
            min:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            max:
              anyOf:
                - type: integer
                  minimum: 1
                  maximum: 9007199254740991
                - const: "*"
          additionalProperties: true
        relationship:
          type: object
          required:
            - id
            - name
            - source
            - target
            - sourceMultiplicity
            - targetMultiplicity
            - targetLifecycle
            - directed
          properties:
            id:
              $ref: "#/$defs/id"
            name:
              $ref: "#/$defs/id"
            source:
              type: array
              minItems: 1
              items:
                $ref: "#/$defs/relationshipEndpoint"
            target:
              type: array
              minItems: 1
              items:
                $ref: "#/$defs/relationshipTarget"
            sourceMultiplicity:
              $ref: "#/$defs/relationshipMultiplicity"
            targetMultiplicity:
              $ref: "#/$defs/relationshipMultiplicity"
            targetLifecycle:
              type: string
              minLength: 1
            directed:
              type: boolean
            inverse:
              $ref: "#/$defs/id"
            associationRecord:
              $ref: "#/$defs/relationshipEndpoint"
          additionalProperties: true
        literal:
          oneOf:
            - type: "null"
            - type: object
              required:
                - boolean
              properties:
                boolean:
                  type: boolean
              additionalProperties: false
            - type: object
              required:
                - integerToken
              properties:
                integerToken:
                  type: string
                  pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?([eE][+-]?[0-9]+)?$(?![\s\S])
              additionalProperties: false
            - type: object
              required:
                - decimalToken
              properties:
                decimalToken:
                  type: string
                  pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?([eE][+-]?[0-9]+)?$(?![\s\S])
              additionalProperties: false
            - type: object
              required:
                - string
              properties:
                string:
                  type: string
              additionalProperties: false
            - type: object
              required:
                - binaryHex
              properties:
                binaryHex:
                  type: string
                  pattern: ^([0-9a-fA-F]{2})*$(?![\s\S])
              additionalProperties: false
            - type: object
              required:
                - floatToken
              properties:
                floatToken:
                  type: string
                  pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?([eE][+-]?[0-9]+)?$(?![\s\S])
              additionalProperties: false
            - type: object
              required:
                - date
              properties:
                date:
                  type: string
              additionalProperties: false
            - type: object
              required:
                - time
              properties:
                time:
                  type: string
              additionalProperties: false
            - type: object
              required:
                - timestamp
              properties:
                timestamp:
                  type: string
              additionalProperties: false
            - type: object
              required:
                - array
              properties:
                array:
                  type: array
                  items:
                    $ref: "#/$defs/literal"
              additionalProperties: false
            - type: object
              required:
                - map
              properties:
                map:
                  type: object
                  additionalProperties:
                    $ref: "#/$defs/literal"
              additionalProperties: false
            - type: object
              required:
                - bits128Hex
              properties:
                bits128Hex:
                  type: string
                  minLength: 32
                  maxLength: 32
                  pattern: ^[0-9a-fA-F]{32}$(?![\s\S])
              additionalProperties: false
            - type: object
              required:
                - uuid
              properties:
                uuid:
                  type: string
                  minLength: 36
                  maxLength: 36
                  pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$(?![\s\S])
              additionalProperties: false
      description: Explicit semantic references compose with unchanged core0.9 UUID/128-bit domains; no external term or native enforcement inferred.
      $comment: Exact endpoint/key resolution, unique IDs/names, inverse collisions, multiplicity bounds and lifecycle coherence require portable semantic validation.
    coverage: Current core language objects, properties and conceptual references. Bootstrap JSON Schema and semantic validators remain authoritative; no native enforcement or complete instance validator is generated from this model.
