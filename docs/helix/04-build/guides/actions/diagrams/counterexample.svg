<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="-412.035 -281.5 824.07 533" width="824.07" height="533" class="lini lini-scope-bd9a2b03"><title id="title">V8 · A complete reservation intent</title><desc id="desc">Incomplete property: post.stock = pre.stock − quantity is insufficient by itself. This is a handler example, not the approve recipe. Counterexample · quantity zero: Stock can remain unchanged and the equation still holds. A promised reservation might also be absent. Corrected obligations: Require positive quantity, exact stock relation, nonnegative stock, reservation existence and the correct entity identities. Scope of the evidence: Model bounds and assumptions are explicit. Actual native refinement and implementation mutants are separate witnesses; none proves every deployment.</desc>
