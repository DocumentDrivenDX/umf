<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="title desc"><title id="title">V2 · Two responsibilities</title><desc id="desc">Library · browser-compatible: Read a document. Register vocabulary. Inspect and compare declarations. No authentication or business writes. Explicit interpretation: Compile supported rules/selectors. Evaluate rules only with supplied state. This is separate from inspection. Consumer · host-only: Authenticate principal and service. Authorize. Freeze identities. Execute and verify under the native transaction boundary. Qualification boundary: Declared compatibility is not execution verification. Inspection does not invoke the consumer or access storage.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#203c35"/></marker></defs><rect width="720" height="760" rx="16" fill="#e9edde"/><g fill="#203c35" font-family="Arial, sans-serif"><text x="20" y="58" font-size="26">Two responsibilities</text><text x="20" y="24" font-size="13">V2 · LANES</text><rect x="20" y="115" width="325" height="475" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="142" font-size="18" font-weight="700">LIBRARY · portable</text><text x="32" y="173" font-size="17">Read the declaration.</text><rect x="375" y="115" width="325" height="475" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="387" y="142" font-size="18" font-weight="700">CONSUMER · host-only</text><text x="387" y="173" font-size="17">Receive a business request.</text><rect x="40" y="235" width="285" height="95" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="52" y="262" font-size="18" font-weight="700">Inspect / assess</text><text x="52" y="293" font-size="17">No business write.</text><rect x="40" y="370" width="285" height="155" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="52" y="397" font-size="18" font-weight="700">Explicit interpretation</text><text x="52" y="428" font-size="17">Compile supported profiles.</text><text x="52" y="450" font-size="17">Evaluate supplied state</text><text x="52" y="472" font-size="17">separately.</text><rect x="395" y="235" width="285" height="95" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="407" y="262" font-size="18" font-weight="700">Trusted authorization</text><text x="407" y="293" font-size="17">Authenticate actor /</text><text x="407" y="315" font-size="17">service.</text><path d="M535 330 L535 370" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><rect x="395" y="370" width="285" height="155" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="407" y="397" font-size="18" font-weight="700">Native transaction</text><text x="407" y="428" font-size="17">Freeze, execute, verify.</text><text x="407" y="450" font-size="17">Commit outcome atomically.</text><text x="50" y="640" font-size="18">No arrow from inspection to execution. Compatibility is not</text><text x="50" y="663" font-size="18">verified execution.</text></g></svg>
