<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="title desc"><title id="title">V3 · Approval, no-op and replay</title><desc id="desc">First request token · business change: Before: pending. Required SET: approved. Commit retains the outcome and one business-change fact. Fresh request token · business no-op: Before: approved. SET verifies no-op. A new outcome persists; business version and event count do not advance. Original request token · replay: Return the exact retained first outcome under current authorization. Do not execute again or substitute the fresh no-op.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#203c35"/></marker></defs><rect width="720" height="760" rx="16" fill="#e9edde"/><g fill="#203c35" font-family="Arial, sans-serif"><text x="20" y="58" font-size="26">Approval, no-op and replay</text><text x="20" y="24" font-size="13">V3 · STATES</text><rect x="20" y="110" width="680" height="166" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="137" font-size="18" font-weight="700">1 · First request token</text><text x="38" y="180" font-size="18" font-weight="700">pending</text><text x="570" y="180" font-size="18" font-weight="700">approved</text><path d="M255 202 L560 202" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><text x="38" y="245" font-size="17">Changed: outcome + fact; version V_A.</text><rect x="20" y="300" width="680" height="166" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="327" font-size="18" font-weight="700">2 · Fresh request token</text><text x="38" y="370" font-size="18" font-weight="700">approved</text><text x="570" y="370" font-size="18" font-weight="700">approved</text><path d="M255 392 L560 392" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><text x="38" y="435" font-size="17">No-op: new outcome; same V_A, no new fact.</text><rect x="20" y="490" width="680" height="166" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="517" font-size="18" font-weight="700">3 · Original-token replay</text><text x="38" y="560" font-size="18" font-weight="700">retained</text><text x="570" y="560" font-size="18" font-weight="700">original</text><text x="570" y="583" font-size="18" font-weight="700">result</text><path d="M255 582 L560 582" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><text x="38" y="625" font-size="17">No execution. Current authorization still required.</text><text x="20" y="692" font-size="16">V_A is an illustrative opaque version, not a sortable clock.</text></g></svg>
