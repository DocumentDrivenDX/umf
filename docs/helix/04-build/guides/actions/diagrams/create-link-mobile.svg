<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="-238.7825 -465 460.275 900" width="460.275" height="900" class="lini lini-scope-bd9a2b03"><title id="title">V4 · Create before linking</title><desc id="desc">1 · create: Create the order at an explicit Key. Save the effect identity create; no computed or allocated identifier. 2 · link-customer: Source is created:create. Target is the existing customer parameter, using the authored relationship orientation. 3 · link-product: Source is created:create. Target is the existing product parameter. Forward references would refuse. Permissions are separate: The frozen write frame must permit create and these relationships. Effects require the actual operations; permission alone does not.</desc>
