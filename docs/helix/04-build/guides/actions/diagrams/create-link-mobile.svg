<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 900" role="img" aria-labelledby="title desc"><title id="title">V4 · Create before linking</title><desc id="desc">1 · create: Create the order at an explicit Key. Save the effect identity create; no computed or allocated identifier. 2 · link-customer: Source is created:create. Target is the existing customer parameter, using the authored relationship orientation. 3 · link-product: Source is created:create. Target is the existing product parameter. Forward references would refuse. Permissions are separate: The frozen write frame must permit create and these relationships. Effects require the actual operations; permission alone does not.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#203c35"/></marker></defs><rect width="360" height="900" rx="16" fill="#e9edde"/><g fill="#203c35" font-family="Arial, sans-serif"><text x="20" y="58" font-size="26">Create before linking</text><text x="20" y="24" font-size="13">V4 · RECIPE</text><rect x="75.0" y="110" width="210" height="140" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="87.0" y="137" font-size="18" font-weight="700">1 · create order</text><text x="87.0" y="168" font-size="17">Explicit Key.</text><text x="87.0" y="190" font-size="17">Effect ID: create.</text><rect x="20" y="390" width="150.0" height="140" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="417" font-size="18" font-weight="700">Customer</text><text x="32" y="448" font-size="17">existing</text><text x="32" y="470" font-size="17">input</text><rect x="190.0" y="390" width="150.0" height="140" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="202.0" y="417" font-size="18" font-weight="700">Product</text><text x="202.0" y="448" font-size="17">existing</text><text x="202.0" y="470" font-size="17">input</text><path d="M150.0 250 L90 390" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><text x="98" y="312.0" font-size="16">2 · link</text><path d="M210.0 250 L270 390" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><text x="218.0" y="312.0" font-size="16">3 · link</text><text x="25" y="555" font-size="17">Both sources bind</text><text x="25" y="577" font-size="17">created:create.</text><rect x="20" y="590" width="320" height="160" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="617" font-size="18" font-weight="700">Frozen permission frame</text><text x="32" y="648" font-size="17">Permit create + these links.</text><text x="32" y="670" font-size="17">Required effects are distinct</text><text x="32" y="692" font-size="17">from permission. No forward</text><text x="32" y="714" font-size="17">reference or allocated Key.</text></g></svg>
