<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 900" role="img" aria-labelledby="title desc"><title id="title">V1 · Model and instance</title><desc id="desc">UMF document · metadata: sales.id and sales.status are required string Fields. Record and ordered Key: sales.order contains both Fields. Its primary Key pk contains sales.id. Module extension: sales.extensions → umf.actions → approve declares the permitted status assignment. Separate business data: An example stored order has id order-1 and status pending. It is not a row inside the UMF document.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#203c35"/></marker></defs><rect width="360" height="900" rx="16" fill="#e9edde"/><g fill="#203c35" font-family="Arial, sans-serif"><text x="20" y="58" font-size="26">Model and instance</text><text x="20" y="24" font-size="13">V1 · MODEL</text><rect x="20" y="110" width="320" height="140" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="137" font-size="18" font-weight="700">UMF metadata · sales</text><text x="32" y="168" font-size="17">Field id: required string.</text><text x="32" y="190" font-size="17">Field status: required string.</text><path d="M180 250 L180 290" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="290" width="320" height="130" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="317" font-size="18" font-weight="700">Record: order</text><text x="32" y="348" font-size="17">members → id, status. Key pk →</text><text x="32" y="370" font-size="17">[id].</text><rect x="20" y="450" width="320" height="120" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="477" font-size="18" font-weight="700">Module extension</text><text x="32" y="508" font-size="17">umf.actions → approve. Required</text><text x="32" y="530" font-size="17">SET of status.</text><path d="M20 600 H340" stroke="#738972" stroke-dasharray="4 4"/><text x="25" y="628" font-size="17">Outside the UMF document</text><rect x="20" y="660" width="320" height="110" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="687" font-size="18" font-weight="700">Stored order · example</text><text x="32" y="718" font-size="17">id: order-1; status: pending</text></g></svg>
