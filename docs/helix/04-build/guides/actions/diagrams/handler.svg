<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="-416.1075 -271 832.215 512" width="832.215" height="512" class="lini lini-scope-86135603"><title id="title">V7 · Bounded handler access</title><desc id="desc">Isolated handler: No raw SQL connection, database credentials, ambient network or broad host mount. Only declared transaction capabilities. Controlled gateway: Freeze canonical identities. Check every attempted read/write before storage access. Returning state to its old value cannot hide an attempt. Consumer-owned transaction: Authorization, native invariant checks, replay ledger and outbox are control responsibilities. Their reads are not handler permissions. Commit or rollback: Verify outputs, constraints, frame and postconditions. Failure aborts the whole attempted transaction; no partial business outcome.</desc>
