<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="-220 -595 440 1160" width="440" height="1160" class="lini lini-scope-63f7adc6"><title id="title">V5 · When a response is lost</title><desc id="desc">Client → consumer: Send original token, revision, typed inputs and expected versions. Trusted context supplies actor identity. Consumer → native store: Commit business changes, verification and terminal outcome atomically. Then the acknowledgement is lost. Client knowledge · indeterminate: Unknown whether commit occurred. Timeout does not prove rollback. Keep the original request; do not mint a fresh token. Client → protected lookup: Current discovery and original-result authorization gate lookup. Return the retained original outcome; lookup never executes. Missing or expired: Missing after uncertainty is not permission to reexecute. No-key requests lack keyed recovery guarantees.</desc>
