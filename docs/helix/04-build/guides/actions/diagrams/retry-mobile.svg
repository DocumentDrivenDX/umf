<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 870" role="img" aria-labelledby="title desc"><title id="title">V5 · When a response is lost</title><desc id="desc">Client → consumer: Send original token, revision, typed inputs and expected versions. Trusted context supplies actor identity. Consumer → native store: Commit business changes, verification and terminal outcome atomically. Then the acknowledgement is lost. Client knowledge · indeterminate: Unknown whether commit occurred. Timeout does not prove rollback. Keep the original request; do not mint a fresh token. Client → protected lookup: Current discovery and original-result authorization gate lookup. Return the retained original outcome; lookup never executes. Missing or expired: Missing after uncertainty is not permission to reexecute. No-key requests lack keyed recovery guarantees.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#203c35"/></marker></defs><rect width="360" height="870" rx="16" fill="#e9edde"/><g fill="#203c35" font-family="Arial, sans-serif"><text x="20" y="58" font-size="26">When a response is</text><text x="20" y="89" font-size="26">lost</text><text x="20" y="24" font-size="13">V5 · SEQUENCE</text><text x="20" y="125" font-size="16" font-weight="700">Client</text><path d="M60 165 V440 M60 525 V650" stroke="#738972" stroke-dasharray="4 5"/><text x="255" y="125" font-size="16" font-weight="700">Consumer /</text><text x="255" y="146" font-size="16" font-weight="700">store</text><path d="M295 165 V440 M295 525 V650" stroke="#738972" stroke-dasharray="4 5"/><path d="M60 205 L295 205" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><text x="25" y="185" font-size="17">1 · Original request + token</text><rect x="130" y="250" width="210" height="105" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="142" y="277" font-size="18" font-weight="700">2 · Commit</text><text x="142" y="308" font-size="17">Business + outcome</text><text x="142" y="330" font-size="17">retained.</text><path d="M295 405 H177.5" stroke="#203c35" stroke-width="2" stroke-dasharray="5 4"/><path d="M170.5 398 L184.5 412 M184.5 398 L170.5 412" stroke="#8b3d35" stroke-width="2"/><text x="25" y="385" font-size="17">3 · Response lost ×</text><text x="25" y="460" font-size="17">Client knowledge: indeterminate.</text><text x="25" y="482" font-size="17">A timeout does not prove</text><text x="25" y="504" font-size="17">rollback.</text><path d="M60 550 L295 550" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><text x="25" y="530" font-size="17">4 · Original-token lookup</text><path d="M295 630 L60 630" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><text x="25" y="610" font-size="17">5 · Authorized original result</text><rect x="20" y="700" width="320" height="130" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="727" font-size="18" font-weight="700">Lookup never executes</text><text x="32" y="758" font-size="17">Current permission gates the</text><text x="32" y="780" font-size="17">original result. Missing after</text><text x="32" y="802" font-size="17">uncertainty is not</text><text x="32" y="824" font-size="17">authorization to retry fresh.</text></g></svg>
