<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="title desc"><title id="title">V1 · Model and instance</title><desc id="desc">UMF document · metadata: sales.id and sales.status are required string Fields. Record and ordered Key: sales.order contains both Fields. Its primary Key pk contains sales.id. Module extension: sales.extensions → umf.actions → approve declares the permitted status assignment. Separate business data: An example stored order has id order-1 and status pending. It is not a row inside the UMF document.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#203c35"/></marker></defs><rect width="720" height="760" rx="16" fill="#e9edde"/><g fill="#203c35" font-family="Arial, sans-serif"><text x="20" y="58" font-size="26">Model and instance</text><text x="20" y="24" font-size="13">V1 · MODEL</text><rect x="20" y="110" width="260" height="170" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="137" font-size="18" font-weight="700">Fields · sales</text><text x="32" y="168" font-size="17">id: string, required.</text><text x="32" y="190" font-size="17">status: string,</text><text x="32" y="212" font-size="17">required.</text><rect x="430" y="110" width="270" height="170" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="442" y="137" font-size="18" font-weight="700">Record · sales.order</text><text x="442" y="168" font-size="17">members: id, status.</text><text x="442" y="190" font-size="17">primary Key pk: [id]</text><path d="M430 190 L280 190" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><text x="288" y="182.0" font-size="16">references</text><rect x="170" y="335" width="380" height="120" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="182" y="362" font-size="18" font-weight="700">Module extension</text><text x="182" y="393" font-size="17">sales → umf.actions → approve</text><path d="M20 500 H700" stroke="#738972" stroke-dasharray="4 4"/><text x="25" y="528" font-size="17">Model definitions above; stored business data below</text><rect x="170" y="575" width="380" height="115" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="182" y="602" font-size="18" font-weight="700">Example stored instance</text><text x="182" y="633" font-size="17">order-1: status pending</text></g></svg>
