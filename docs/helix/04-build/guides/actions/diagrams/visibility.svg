<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="-420.7425 -428 841.485 826" width="841.485" height="826" class="lini lini-scope-86135603"><title id="title">V6 · Commit is not query visibility</title><desc id="desc">Write transaction · commit: Business change + terminal outcome + outbox fact commit together. Receipt carries store, epoch and opaque version. Delivery · position 2 arrives first: Position 1 is missing. Complete applied prefix stays 0. A larger received position proves no visibility. Projection · position 1 then 2: Apply exact facts in order. Update read content and contiguous prefix atomically. Repeated delivery is deduplicated. Read at least the receipt: Check current reader authorization first: denied readers receive no content. A receipt grants no access. Authorized freshness is visible only for the matching store/epoch and qualified content through the complete prefix; otherwise pending or unsupported. Restore boundary: Rotate visibility epoch and fence uncertain restored state. Epoch rotation does not erase old replay identity or authorize retry.</desc>
