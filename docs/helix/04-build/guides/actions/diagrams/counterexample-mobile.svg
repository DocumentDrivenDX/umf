<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 900" role="img" aria-labelledby="title desc"><title id="title">V8 · A complete reservation intent</title><desc id="desc">Incomplete property: post.stock = pre.stock − quantity is insufficient by itself. This is a handler example, not the approve recipe. Counterexample · quantity zero: Stock can remain unchanged and the equation still holds. A promised reservation might also be absent. Corrected obligations: Require positive quantity, exact stock relation, nonnegative stock, reservation existence and the correct entity identities. Scope of the evidence: Model bounds and assumptions are explicit. Actual native refinement and implementation mutants are separate witnesses; none proves every deployment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#203c35"/></marker></defs><rect width="360" height="900" rx="16" fill="#e9edde"/><g fill="#203c35" font-family="Arial, sans-serif"><text x="20" y="58" font-size="26">A complete</text><text x="20" y="89" font-size="26">reservation intent</text><text x="20" y="24" font-size="13">V8 · COUNTEREXAMPLE</text><rect x="20" y="110" width="320" height="130" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="137" font-size="18" font-weight="700">Incomplete equation</text><text x="32" y="168" font-size="17">post.stock = pre.stock −</text><text x="32" y="190" font-size="17">quantity</text><path d="M180.0 240 L180.0 285" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="285" width="320" height="170" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="312" font-size="18" font-weight="700">Counterexample · passes</text><text x="32" y="335" font-size="18" font-weight="700">equation</text><text x="32" y="366" font-size="17">pre.stock = 2; quantity = 0.</text><text x="32" y="388" font-size="17">post.stock = 2; reservation</text><text x="32" y="410" font-size="17">absent. 2 = 2 − 0 is true.</text><text x="35" y="485" font-size="18" font-weight="700">Business promise failed: no</text><text x="35" y="508" font-size="18" font-weight="700">positive request and no</text><text x="35" y="531" font-size="18" font-weight="700">reservation.</text><path d="M20 550 H340" stroke="#738972" stroke-dasharray="4 4"/><text x="25" y="578" font-size="17">Correct the intent, not just the</text><text x="25" y="600" font-size="17">arithmetic</text><rect x="20" y="610" width="320" height="160" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="637" font-size="18" font-weight="700">Require all obligations</text><text x="32" y="668" font-size="17">quantity &gt; 0; correct</text><text x="32" y="690" font-size="17">reservation exists; exact stock</text><text x="32" y="712" font-size="17">relation; stock ≥ 0. The zero-</text><text x="32" y="734" font-size="17">quantity case now refuses.</text><text x="25" y="810" font-size="17">Bounded model example; native</text><text x="25" y="832" font-size="17">implementation evidence is</text><text x="25" y="854" font-size="17">separate.</text></g></svg>
