<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1200" role="img" aria-labelledby="title desc"><title id="title">V6 · Commit is not query visibility</title><desc id="desc">Write transaction · commit: Business change + terminal outcome + outbox fact commit together. Receipt carries store, epoch and opaque version. Delivery · position 2 arrives first: Position 1 is missing. Complete applied prefix stays 0. A larger received position proves no visibility. Projection · position 1 then 2: Apply exact facts in order. Update read content and contiguous prefix atomically. Repeated delivery is deduplicated. Read at least the receipt: Check current reader authorization first: denied readers receive no content. A receipt grants no access. Authorized freshness is visible only for the matching store/epoch and qualified content through the complete prefix; otherwise pending or unsupported. Restore boundary: Rotate visibility epoch and fence uncertain restored state. Epoch rotation does not erase old replay identity or authorize retry.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#203c35"/></marker></defs><rect width="360" height="1200" rx="16" fill="#e9edde"/><g fill="#203c35" font-family="Arial, sans-serif"><text x="20" y="58" font-size="26">Commit is not query</text><text x="20" y="89" font-size="26">visibility</text><text x="20" y="24" font-size="13">V6 · TIMELINE</text><rect x="20" y="110" width="320" height="225" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="137" font-size="18" font-weight="700">Committed write</text><text x="35" y="165" font-size="16">Business + outcome + outbox</text><rect x="35.0" y="200" width="145.0" height="70" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="47.0" y="227" font-size="18" font-weight="700">Position 1</text><text x="47.0" y="258" font-size="17">queued</text><rect x="195.0" y="200" width="145.0" height="70" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="207.0" y="227" font-size="18" font-weight="700">Position 2</text><text x="207.0" y="258" font-size="17">queued</text><text x="35" y="315" font-size="16" font-weight="700">Receipt issued</text><path d="M180.0 335 L180.0 368" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="370" width="320" height="225" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="397" font-size="18" font-weight="700">Delivery out of order</text><text x="35" y="425" font-size="16">2 arrived; 1 is missing</text><rect x="35.0" y="460" width="145.0" height="70" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="47.0" y="487" font-size="18" font-weight="700">Position 1</text><text x="47.0" y="518" font-size="17">missing</text><rect x="195.0" y="460" width="145.0" height="70" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="207.0" y="487" font-size="18" font-weight="700">Position 2</text><text x="207.0" y="518" font-size="17">waiting</text><text x="35" y="575" font-size="16" font-weight="700">Applied prefix = 0 · pending</text><path d="M180.0 595 L180.0 628" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="630" width="320" height="225" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="657" font-size="18" font-weight="700">Projection application</text><text x="35" y="685" font-size="16">Apply 1 then 2; content + prefix</text><text x="35" y="706" font-size="16">atomic</text><rect x="35.0" y="720" width="145.0" height="70" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="47.0" y="747" font-size="18" font-weight="700">Position 1</text><text x="47.0" y="778" font-size="17">applied</text><rect x="195.0" y="720" width="145.0" height="70" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="207.0" y="747" font-size="18" font-weight="700">Position 2</text><text x="207.0" y="778" font-size="17">applied</text><text x="35" y="835" font-size="16" font-weight="700">Applied prefix = 2 · visible</text><rect x="20" y="905" width="320" height="260" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="932" font-size="18" font-weight="700">Authorization + freshness</text><text x="32" y="963" font-size="17">Check reader authorization</text><text x="32" y="985" font-size="17">first; denial returns no</text><text x="32" y="1007" font-size="17">content. A receipt grants no</text><text x="32" y="1029" font-size="17">access. Authorized readers</text><text x="32" y="1051" font-size="17">still need matching store,</text><text x="32" y="1073" font-size="17">epoch, opaque version and</text><text x="32" y="1095" font-size="17">qualified content. Positions</text><text x="32" y="1117" font-size="17">are internal.</text></g></svg>
