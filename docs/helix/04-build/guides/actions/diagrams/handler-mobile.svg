<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 980" role="img" aria-labelledby="title desc"><title id="title">V7 · Bounded handler access</title><desc id="desc">Isolated handler: No raw SQL connection, database credentials, ambient network or broad host mount. Only declared transaction capabilities. Controlled gateway: Freeze canonical identities. Check every attempted read/write before storage access. Returning state to its old value cannot hide an attempt. Consumer-owned transaction: Authorization, native invariant checks, replay ledger and outbox are control responsibilities. Their reads are not handler permissions. Commit or rollback: Verify outputs, constraints, frame and postconditions. Failure aborts the whole attempted transaction; no partial business outcome.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#203c35"/></marker></defs><rect width="360" height="980" rx="16" fill="#e9edde"/><g fill="#203c35" font-family="Arial, sans-serif"><text x="20" y="58" font-size="26">Bounded handler</text><text x="20" y="89" font-size="26">access</text><text x="20" y="24" font-size="13">V7 · BOUNDARY</text><rect x="20" y="110" width="320" height="165" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="137" font-size="18" font-weight="700">ISOLATED HANDLER</text><text x="32" y="168" font-size="17">Only transaction capability</text><text x="32" y="190" font-size="17">messages. No raw SQL, database</text><text x="32" y="212" font-size="17">secrets or ambient network.</text><path d="M325 275 L325 340" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><text x="25" y="310" font-size="17">Bounded authenticated RPC</text><rect x="15" y="340" width="330" height="450" rx="12" fill="#dce7d5" stroke="#53732e" stroke-width="2"/><text x="30" y="375" font-size="17" font-weight="700">TRUSTED CONSUMER HOST</text><rect x="35" y="405" width="290" height="125" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="47" y="432" font-size="18" font-weight="700">Capability gateway</text><text x="47" y="463" font-size="17">Freeze aliases. Refuse</text><text x="47" y="485" font-size="17">outside-frame attempts</text><text x="47" y="507" font-size="17">before access.</text><path d="M180.0 530 L180.0 565" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><rect x="35" y="565" width="290" height="180" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="47" y="592" font-size="18" font-weight="700">Native transaction</text><text x="47" y="615" font-size="18" font-weight="700">boundary</text><text x="47" y="646" font-size="17">Invariants + current policy</text><text x="47" y="668" font-size="17">+ replay + outbox. Control</text><text x="47" y="690" font-size="17">reads are not handler</text><text x="47" y="712" font-size="17">grants.</text><text x="25" y="840" font-size="17">Verify before commit; failures</text><text x="25" y="862" font-size="17">roll back the attempted</text><text x="25" y="884" font-size="17">transaction.</text></g></svg>
