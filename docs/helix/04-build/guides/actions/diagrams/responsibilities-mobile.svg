<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 900" role="img" aria-labelledby="title desc"><title id="title">V2 · Two responsibilities</title><desc id="desc">Library · browser-compatible: Read a document. Register vocabulary. Inspect and compare declarations. No authentication or business writes. Explicit interpretation: Compile supported rules/selectors. Evaluate rules only with supplied state. This is separate from inspection. Consumer · host-only: Authenticate principal and service. Authorize. Freeze identities. Execute and verify under the native transaction boundary. Qualification boundary: Declared compatibility is not execution verification. Inspection does not invoke the consumer or access storage.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#203c35"/></marker></defs><rect width="360" height="900" rx="16" fill="#e9edde"/><g fill="#203c35" font-family="Arial, sans-serif"><text x="20" y="58" font-size="26">Two responsibilities</text><text x="20" y="24" font-size="13">V2 · LANES</text><rect x="20" y="110" width="320" height="280" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="137" font-size="18" font-weight="700">LIBRARY · portable</text><text x="32" y="168" font-size="17">Document → inspection →</text><text x="32" y="190" font-size="17">declared assessment. No store</text><text x="32" y="212" font-size="17">access or business writes.</text><rect x="40" y="250" width="280" height="110" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="52" y="277" font-size="18" font-weight="700">Explicit interpretation</text><text x="52" y="308" font-size="17">Compile; evaluate supplied</text><text x="52" y="330" font-size="17">state. Separate from</text><text x="52" y="352" font-size="17">inspection.</text><path d="M20 425 H340" stroke="#738972" stroke-dasharray="4 4"/><text x="25" y="453" font-size="17">No execution arrow between lanes</text><rect x="20" y="480" width="320" height="280" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="507" font-size="18" font-weight="700">CONSUMER · host-only</text><text x="32" y="538" font-size="17">Trusted actor → authorization →</text><text x="32" y="560" font-size="17">native transaction → durable</text><text x="32" y="582" font-size="17">outcome.</text><text x="38" y="690" font-size="17">Owns selected state,</text><text x="38" y="712" font-size="17">verification and commit.</text></g></svg>
