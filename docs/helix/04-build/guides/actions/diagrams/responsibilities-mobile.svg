<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="-225.1975 -483 450.395 936" width="450.395" height="936" class="lini lini-scope-3e27a859"><title id="title">V2 · Two responsibilities</title><desc id="desc">Library · browser-compatible: Read a document. Register vocabulary. Inspect and compare declarations. No authentication or business writes. Explicit interpretation: Compile supported rules/selectors. Evaluate rules only with supplied state. This is separate from inspection. Consumer · host-only: Authenticate principal and service. Authorize. Freeze identities. Execute and verify under the native transaction boundary. Qualification boundary: Declared compatibility is not execution verification. Inspection does not invoke the consumer or access storage.</desc>
