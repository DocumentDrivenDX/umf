<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 900" role="img" aria-labelledby="title desc"><title id="title">V3 · Approval, no-op and replay</title><desc id="desc">First request token · business change: Before: pending. Required SET: approved. Commit retains the outcome and one business-change fact. Fresh request token · business no-op: Before: approved. SET verifies no-op. A new outcome persists; business version and event count do not advance. Original request token · replay: Return the exact retained first outcome under current authorization. Do not execute again or substitute the fresh no-op.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#203c35"/></marker></defs><rect width="360" height="900" rx="16" fill="#e9edde"/><g fill="#203c35" font-family="Arial, sans-serif"><text x="20" y="58" font-size="26">Approval, no-op and</text><text x="20" y="89" font-size="26">replay</text><text x="20" y="24" font-size="13">V3 · STATES</text><rect x="20" y="110" width="320" height="206" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="137" font-size="18" font-weight="700">1 · First request token</text><text x="38" y="180" font-size="18" font-weight="700">pending</text><text x="210" y="180" font-size="18" font-weight="700">approved</text><path d="M155 202 L200 202" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><text x="38" y="245" font-size="17">Changed: outcome + fact;</text><text x="38" y="267" font-size="17">version V_A.</text><rect x="20" y="340" width="320" height="206" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="367" font-size="18" font-weight="700">2 · Fresh request token</text><text x="38" y="410" font-size="18" font-weight="700">approved</text><text x="210" y="410" font-size="18" font-weight="700">approved</text><path d="M155 432 L200 432" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><text x="38" y="475" font-size="17">No-op: new outcome; same V_A,</text><text x="38" y="497" font-size="17">no new fact.</text><rect x="20" y="570" width="320" height="206" rx="10" fill="#fffdf7" stroke="#738972" stroke-width="1.5"/><text x="32" y="597" font-size="18" font-weight="700">3 · Original-token replay</text><text x="38" y="640" font-size="18" font-weight="700">retained</text><text x="210" y="640" font-size="18" font-weight="700">original</text><text x="210" y="663" font-size="18" font-weight="700">result</text><path d="M155 662 L200 662" fill="none" stroke="#203c35" stroke-width="2" marker-end="url(#arrow)"/><text x="38" y="705" font-size="17">No execution. Current</text><text x="38" y="727" font-size="17">authorization still required.</text><text x="20" y="812" font-size="16">V_A is an illustrative opaque</text><text x="20" y="833" font-size="16">version, not a sortable clock.</text></g></svg>
