[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "umf-codegen"
version = "0.2.0"
description = "UMF typed Python client generation backed by the native Rust compiler"
requires-python = ">=3.11,<3.15"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE.md", "LICENSE-MIT", "LICENSE-APACHE"]
dependencies = ["umf-core==0.10.4"]
readme = "README.md"

[project.scripts]
umf-codegen = "umf_codegen.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/umf_codegen"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/README.md", "/LICENSE.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/hatch_build.py"]

[tool.hatch.build.hooks.custom]
