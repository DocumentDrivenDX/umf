[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE.md", "LICENSE-MIT", "LICENSE-APACHE"]
name = "umf-core"
version = "0.10.4"
description = "Official Python document models and extension machinery for UMF"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["pydantic>=2.11,<3"]

[project.urls]
Repository = "https://github.com/DocumentDrivenDX/umf"

[tool.hatch.build.targets.wheel]
packages = ["src/umf"]

[tool.hatch.build.targets.sdist.force-include]
