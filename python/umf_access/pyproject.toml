[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
license = "MIT OR Apache-2.0"
license-files = ["LICENSE.md", "LICENSE-MIT", "LICENSE-APACHE"]
name = "umf_access"
version = "0.1.0.dev2"
description = "Local prerelease typed access runtime; target qualification pending"
requires-python = ">=3.11,<3.15"
dependencies = ["pydantic==2.14.1", "typing-extensions==4.16.0"]

[project.scripts]
umf-access = "umf_access.build.catalog:main"

[tool.hatch.build.targets.wheel]
packages = ["src/umf_access"]

[tool.hatch.build.targets.sdist]
include = ["/src/umf_access", "/pyproject.toml", "/LICENSE.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
